<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Sky background -->
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#5BC0FF"/>
      <stop offset="0.55" stop-color="#2F7FE6"/>
      <stop offset="1"   stop-color="#1B3FA8"/>
    </linearGradient>

    <!-- Sun body -->
    <radialGradient id="sun" cx="0.38" cy="0.35" r="0.75">
      <stop offset="0"   stop-color="#FFF3A3"/>
      <stop offset="0.45" stop-color="#FFD23F"/>
      <stop offset="1"   stop-color="#FF9F1C"/>
    </radialGradient>

    <!-- Sun glow -->
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#FFE27A" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#FFD23F" stop-opacity="0.15"/>
      <stop offset="1"   stop-color="#FFD23F" stop-opacity="0"/>
    </radialGradient>

    <!-- Cloud shading -->
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#FFFFFF"/>
      <stop offset="0.7" stop-color="#F1F6FD"/>
      <stop offset="1"   stop-color="#D6E4F7"/>
    </linearGradient>

    <!-- Soft cloud shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="28"
                    flood-color="#0A2A72" flood-opacity="0.38"/>
    </filter>

    <!-- Subtle top light sheen -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background: full square, no rounded corners -->
  <rect width="1024" height="1024" fill="url(#sky)"/>
  <rect width="1024" height="1024" fill="url(#sheen)"/>

  <!-- Sun -->
  <circle cx="650" cy="400" r="300" fill="url(#glow)"/>
  <circle cx="650" cy="400" r="185" fill="url(#sun)"/>

  <!-- Cloud (circles + pill merged by a shared fill) -->
  <g filter="url(#shadow)" fill="url(#cloud)">
    <circle cx="370" cy="620" r="125"/>
    <circle cx="565" cy="550" r="180"/>
    <circle cx="725" cy="660" r="100"/>
    <rect x="215" y="620" width="610" height="180" rx="90"/>
  </g>
</svg>