<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <!-- hand-sketched wobble -->
    <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="wobble2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="G" yChannelSelector="R"/>
    </filter>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fb4ff"/>
      <stop offset="0.75" stop-color="#bfe3ff"/>
      <stop offset="1" stop-color="#e8f6ff"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a7fd4"/>
      <stop offset="1" stop-color="#0b4fa0"/>
    </linearGradient>
  </defs>

  <!-- SKY -->
  <rect width="600" height="800" fill="url(#sky)"/>

  <g filter="url(#wobble)" stroke="#1b1b2f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- sun -->
    <circle cx="110" cy="120" r="48" fill="#ffd600"/>
    <path d="M110 50 L110 34 M110 190 L110 206 M40 120 L24 120 M180 120 L196 120 M60 70 L49 59 M160 170 L171 181 M160 70 L171 59 M60 170 L49 181" fill="none"/>
    <!-- clouds -->
    <path d="M330 110 C330 90 360 80 375 95 C385 75 420 75 428 98 C450 95 462 115 448 128 L335 130 C318 128 318 112 330 110 Z" fill="#fff"/>
    <path d="M40 270 C40 255 62 248 72 260 C80 245 105 246 110 263 C126 262 132 278 120 285 L45 286 C32 284 32 272 40 270 Z" fill="#fff"/>
    <!-- gulls -->
    <path d="M230 190 Q242 178 252 190 Q262 178 274 190" fill="none"/>
    <path d="M470 220 Q478 212 485 220 Q492 212 500 220" fill="none"/>
  </g>

  <!-- SEA (low horizon for low viewpoint) -->
  <g filter="url(#wobble2)" stroke="#1b1b2f" stroke-width="3" stroke-linecap="round">
    <rect x="-10" y="608" width="620" height="200" fill="url(#sea)" stroke="none"/>
    <path d="M-10 610 L610 606" fill="none"/>
    <path d="M30 630 q10 -6 20 0 t20 0 M140 645 q10 -6 20 0 t20 0 M480 628 q10 -6 20 0 t20 0 M380 650 q10 -6 20 0 t20 0 M240 660 q10 -6 20 0 t20 0" fill="none" stroke="#bfe3ff" stroke-width="2.5"/>
  </g>

  <!-- PIER: lamp post (tall, converging = looking up) -->
  <g filter="url(#wobble)" stroke="#1b1b2f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <path d="M532 692 L548 692 L543 190 L537 190 Z" fill="#1d3fbf"/>
    <path d="M520 192 L560 192 L552 160 L528 160 Z" fill="#1d3fbf"/>
    <path d="M526 160 Q540 120 554 160 Z" fill="#1d3fbf"/>
    <rect x="530" y="164" width="20" height="24" fill="#fff59d"/>
    <path d="M524 692 L556 692 L552 676 L528 676 Z" fill="#1d3fbf"/>
  </g>

  <!-- PIER: railing behind the rider -->
  <g filter="url(#wobble2)" stroke="#1b1b2f" stroke-width="3" stroke-linejoin="round">
    <path d="M-10 552 L610 548 L610 562 L-10 566 Z" fill="#c98a4b"/>
    <path d="M-10 602 L610 598 L610 610 L-10 614 Z" fill="#c98a4b"/>
    <g fill="#a86b33">
      <path d="M18 544 L32 543 L33 694 L19 694 Z"/>
      <path d="M128 543 L142 542 L143 694 L129 694 Z"/>
      <path d="M238 542 L252 542 L253 694 L239 694 Z"/>
      <path d="M348 541 L362 541 L363 694 L349 694 Z"/>
      <path d="M458 540 L472 540 L473 694 L459 694 Z"/>
      <path d="M568 540 L582 540 L583 694 L569 694 Z"/>
    </g>
  </g>

  <!-- PIER: deck, fascia, pilings -->
  <g filter="url(#wobble)" stroke="#1b1b2f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <path d="M-10 690 L610 688 L610 746 L-10 748 Z" fill="#d9a066"/>
    <path d="M3 690 L-200 746 M63 690 L-100 746 M122 690 L0 746 M181 690 L100 746 M241 690 L200 746 M300 690 L300 746 M359 690 L400 746 M419 690 L500 746 M478 690 L600 746 M537 690 L700 746 M596 690 L800 746" fill="none" stroke-width="2"/>
    <path d="M-10 746 L610 744 L610 768 L-10 770 Z" fill="#8b5527"/>
    <path d="M40 768 L72 768 L70 810 L42 810 Z M210 768 L242 768 L241 810 L211 810 Z M380 768 L412 768 L411 810 L381 810 Z M540 768 L572 768 L571 810 L541 810 Z" fill="#6e3f1a"/>
    <path d="M30 790 q12 -6 24 0 t24 0 M200 790 q12 -6 24 0 t24 0 M370 790 q12 -6 24 0 t24 0 M530 790 q12 -6 24 0 t24 0" fill="none" stroke="#bfe3ff" stroke-width="2.5"/>
  </g>

  <!-- shadow under the bike -->
  <ellipse cx="310" cy="702" rx="230" ry="9" fill="#1b1b2f" opacity="0.25"/>

  <!-- BICYCLE -->
  <g filter="url(#wobble)" stroke="#1b1b2f" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- tyres -->
    <circle cx="190" cy="610" r="85" stroke="#1d3fbf" stroke-width="12"/>
    <circle cx="430" cy="610" r="85" stroke="#1d3fbf" stroke-width="12"/>
    <circle cx="190" cy="610" r="92" stroke-width="2.5"/>
    <circle cx="190" cy="610" r="78" stroke-width="2.5"/>
    <circle cx="430" cy="610" r="92" stroke-width="2.5"/>
    <circle cx="430" cy="610" r="78" stroke-width="2.5"/>
    <!-- spokes -->
    <path d="M110 610 L270 610 M121 570 L259 650 M150 541 L230 679 M190 530 L190 690 M230 541 L150 679 M259 570 L121 650" stroke-width="1.6"/>
    <path d="M350 610 L510 610 M361 570 L499 650 M390 541 L470 679 M430 530 L430 690 M470 541 L390 679 M499 570 L361 650" stroke-width="1.6"/>
    <circle cx="190" cy="610" r="7" fill="#ffd600" stroke-width="2.5"/>
    <circle cx="430" cy="610" r="7" fill="#ffd600" stroke-width="2.5"/>

    <!-- red frame -->
    <g stroke="#e31b23" stroke-width="11">
      <path d="M190 610 L300 622"/>
      <path d="M190 610 L262 488"/>
      <path d="M300 622 L258 470"/>
      <path d="M262 492 L402 486"/>
      <path d="M300 622 L398 518"/>
      <path d="M402 476 L430 610"/>
    </g>
    <g stroke-width="2.5">
      <path d="M190 603 L300 615 M190 617 L300 629"/>
      <path d="M184 606 L256 484 M196 614 L268 492"/>
      <path d="M294 623 L252 471 M306 621 L264 469"/>
      <path d="M262 486 L402 480 M262 498 L402 492"/>
      <path d="M296 618 L394 514 M304 626 L402 522"/>
      <path d="M396 477 L424 611 M408 475 L436 609"/>
    </g>
    <!-- head tube / stem / bars -->
    <path d="M400 482 L396 446" stroke="#1b1b2f" stroke-width="7"/>
    <path d="M396 446 C380 438 366 440 356 450" stroke="#1b1b2f" stroke-width="7"/>
    <path d="M356 450 L350 456" stroke="#ffd600" stroke-width="10"/>
    <!-- seat post + yellow saddle -->
    <path d="M258 470 L255 452" stroke="#1b1b2f" stroke-width="7"/>
    <path d="M220 446 C240 438 275 438 292 446 C280 456 236 458 220 446 Z" fill="#ffd600" stroke-width="3"/>
    <!-- chainring + crank + chain -->
    <circle cx="300" cy="622" r="22" fill="#ffd600" stroke-width="3"/>
    <path d="M190 602 L300 600 M190 618 L300 644" stroke-width="2"/>
    <path d="M300 622 L338 640" stroke-width="7"/>
    <path d="M300 622 L264 604" stroke-width="7"/>
    <path d="M326 640 L350 640" stroke="#1d3fbf" stroke-width="7"/>
    <path d="M252 604 L276 604" stroke="#1d3fbf" stroke-width="7"/>
  </g>

  <!-- PELICAN: leaning back, wings folded, no-hands -->
  <g filter="url(#wobble2)" stroke="#1b1b2f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- far leg (behind) to back pedal -->
    <path d="M250 470 L232 540 L262 600" fill="none" stroke="#e31b23" stroke-width="8"/>
    <path d="M246 604 L278 600 L270 612 Z" fill="#e31b23"/>

    <!-- tail -->
    <path d="M172 430 L118 462 L128 470 L112 484 L178 458 Z" fill="#ffd600"/>

    <!-- body, tilted back -->
    <path d="M168 432 C146 362 206 318 268 326 C332 336 352 398 324 448 C298 492 196 492 168 432 Z" fill="#ffd600"/>
    <path d="M200 470 C230 482 280 484 312 462" fill="none" stroke-width="2"/>

    <!-- folded blue wing -->
    <path d="M188 378 C228 346 302 356 316 408 C302 452 232 462 172 440 C188 420 182 400 188 378 Z" fill="#1d3fbf"/>
    <path d="M200 418 C232 424 270 420 300 408 M196 438 C228 444 262 440 292 430 M178 440 L150 452 L176 448" fill="none" stroke-width="2.5"/>

    <!-- neck S-curve leaning back -->
    <path d="M296 348 C272 304 278 268 318 250" fill="none" stroke="#1b1b2f" stroke-width="40"/>
    <path d="M296 348 C272 304 278 268 318 250" fill="none" stroke="#ffd600" stroke-width="33"/>

    <!-- head -->
    <circle cx="330" cy="240" r="33" fill="#ffd600"/>
    <path d="M308 214 C302 196 316 190 322 206 C324 190 340 192 336 210" fill="#ffd600" stroke-width="2.5"/>

    <!-- red pouch (seen from below) + bill -->
    <path d="M352 252 C388 312 452 314 484 284 L362 246 Z" fill="#c4121a"/>
    <path d="M356 228 C400 236 450 254 488 278 L482 286 C440 270 396 258 354 252 Z" fill="#e31b23"/>
    <path d="M488 278 L496 292 L482 286" fill="#e31b23"/>
    <path d="M362 242 C410 252 448 266 482 282" fill="none" stroke-width="2"/>

    <!-- sleepy, contented eye -->
    <circle cx="338" cy="233" r="9" fill="#fff"/>
    <path d="M328 232 C333 226 344 226 348 232 C344 240 332 240 328 232 Z" fill="#ffd600" stroke-width="2.5"/>
    <path d="M330 236 Q338 241 346 236" fill="none" stroke-width="2.5"/>
    <circle cx="320" cy="252" r="6" fill="#ff8a80" stroke="none" opacity="0.7"/>

    <!-- near leg to front pedal -->
    <path d="M290 466 L344 540 L338 636" fill="none" stroke="#e31b23" stroke-width="9"/>
    <path d="M318 642 C328 632 350 632 362 644 L352 646 L344 640 L336 648 L326 642 Z" fill="#e31b23"/>
  </g>

  <!-- extra sketchy double-line for hand-drawn feel -->
  <g filter="url(#wobble)" stroke="#1b1b2f" stroke-width="1.5" fill="none" opacity="0.55" stroke-linecap="round">
    <path d="M171 428 C150 366 208 322 266 330 C328 340 348 400 321 446"/>
    <path d="M300 344 C276 302 282 270 320 254"/>
    <path d="M358 232 C402 240 452 258 486 282"/>
    <circle cx="192" cy="612" r="86"/>
    <circle cx="428" cy="612" r="86"/>
  </g>
</svg>