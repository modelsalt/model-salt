  <g transform="translate(390,420)" fill="#6f767c">
    <circle r="29"/>
    <rect x="-2.5" y="-33" width="5" height="66" transform="rotate(0)"/>
    <rect x="-2.5" y="-33" width="5" height="66" transform="rotate(22.5)"/>
    <rect x="-2.5" y="-33" width="5" height="66" transform="rotate(45)"/>
    <rect x="-2.5" y="-33" width="5" height="66" transform="rotate(67.5)"/>
    <rect x="-2.5" y="-33" width="5" height="66" transform="rotate(90)"/>
    <rect x="-2.5" y="-33" width="5" height="66" transform="rotate(112.5)"/>
    <rect x="-2.5" y="-33" width="5" height="66" transform="rotate(135)"/>
    <rect x="-2.5" y="-33" width="5" height="66" transform="rotate(157.5)"/>
