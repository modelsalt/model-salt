      <path fill="#a9b0b6" fill-rule="evenodd"
            d="M-98,0a98,98 0 1,0 196,0a98,98 0 1,0 -196,0Z
               M-91,0a91,91 0 1,0 182,0a91,91 0 1,0 -182,0Z"/>
      <g fill="#c9ced2">
        <rect x="-0.9" y="-92" width="1.8" height="184" transform="rotate(0)"/>
        <rect x="-0.9" y="-92" width="1.8" height="184" transform="rotate(20)"/>
        <rect x="-0.9" y="-92" width="1.8" height="184" transform="rotate(40)"/>
        <rect x="-0.9" y="-92" width="1.8" height="184" transform="rotate(60)"/>
        <rect x="-0.9" y="-92" width="1.8" height="184" transform="rotate(80)"/>
