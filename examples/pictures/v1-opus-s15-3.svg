  <ellipse cx="428" cy="82" rx="27" ry="20" fill="#f7f4ec"/>
  <path fill="#f3e3a6" d="M404,72 Q418,56 440,62 Q424,64 410,78 Z"/>
  <!-- Bill: upper mandible -->
