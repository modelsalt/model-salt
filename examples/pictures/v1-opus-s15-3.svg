  <circle cx="680" cy="95" r="45" fill="#f7e3a1"/>
  <ellipse cx="160" cy="110" rx="70" ry="18" fill="#e9f4f7"/>
  <ellipse cx="215" cy="98" rx="45" ry="15" fill="#e9f4f7"/>
  <rect y="520" width="800" height="80" fill="#c8b98d"/>
  <rect y="520" width="800" height="6" fill="#b3a479"/>
  <ellipse cx="400" cy="524" rx="260" ry="7" fill="#a89a70"/>

  <!-- Far wing (behind everything else) -->
  <path fill="#aeb3b7" d="M343,142 Q408,132 458,187 L513,220 Q518,237 503,237 L448,224 Q378,217 338,192 Z"/>
  <path fill="#2f2f33" d="M458,187 L513,220 Q518,237 503,237 L448,224 Z"/>

