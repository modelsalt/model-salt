  <path fill="#d6d8da" d="M332,150 Q400,138 452,193 L506,226 Q512,244 496,245 L440,232 Q368,226 326,200 Z"/>
  <path fill="#c3c6c9" d="M352,176 Q400,178 440,210 Q392,206 352,190 Z"/>
  <path fill="#2f2f33" d="M452,193 L506,226 Q512,244 496,245 L440,232 Z"/>
  <!-- Wingtip "fingers" wrapped around grip -->
