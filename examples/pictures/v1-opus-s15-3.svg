  <rect x="0" y="-4" width="55.6" height="8" fill="#5c6166" transform="translate(390,420) rotate(-120.3)"/>
  <rect x="348" y="368" width="30" height="6" fill="#3a3f44"/>
  <polygon fill="#d9822b" points="352,368 384,368 366,356"/>

  <!-- Wheels -->
  <use xlink:href="#wheel" href="#wheel" transform="translate(230,410)"/>
  <use xlink:href="#wheel" href="#wheel" transform="translate(570,410)"/>

  <!-- Frame (tubes as rotated rects) -->
  <g fill="#c0392b">
