    <rect x="50" y="-2.5" width="9" height="5" rx="2" fill="#8b9197"/>
    <rect x="60" y="-2.5" width="9" height="5" rx="2" fill="#4a4f54"/>
    <rect x="70" y="-2.5" width="9" height="5" rx="2" fill="#8b9197"/>
