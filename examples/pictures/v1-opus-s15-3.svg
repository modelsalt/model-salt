    <rect x="0" y="-4" width="166.2" height="8" transform="translate(230,410) rotate(-46.2)"/>
    <rect x="0" y="-6" width="147.1" height="12" transform="translate(390,420) rotate(-107.8)"/>
    <rect x="0" y="-7" width="192.1" height="14" transform="translate(390,420) rotate(-38.66)"/>
    <rect x="0" y="-6" width="187.9" height="12" transform="translate(345,290) rotate(-5.5)"/>
    <rect x="0" y="-8" width="57" height="16" transform="translate(530,260) rotate(74.7)"/>
  </g>
  <rect x="0" y="-5" width="98.2" height="10" fill="#8e9499" transform="translate(545,315) rotate(75.3)"/>
