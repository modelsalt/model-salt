    <rect x="20" y="-2.5" width="9" height="5" rx="2" fill="#8b9197"/>
    <rect x="30" y="-2.5" width="9" height="5" rx="2" fill="#4a4f54"/>
    <rect x="40" y="-2.5" width="9" height="5" rx="2" fill="#8b9197"/>
    <rect x="50" y="-2.5" width="9" height="5" rx="2" fill="#4a4f54"/>
    <rect x="60" y="-2.5" width="9" height="5" rx="2" fill="#8b9197"/>
    <rect x="70" y="-2.5" width="9" height="5" rx="2" fill="#4a4f54"/>
    <rect x="80" y="-2.5" width="9" height="5" rx="2" fill="#8b9197"/>
    <rect x="90" y="-2.5" width="9" height="5" rx="2" fill="#4a4f54"/>
    <rect x="100" y="-2.5" width="9" height="5" rx="2" fill="#8b9197"/>
    <rect x="110" y="-2.5" width="9" height="5" rx="2" fill="#4a4f54"/>
    <rect x="120" y="-2.5" width="9" height="5" rx="2" fill="#8b9197"/>
