  <!-- Scarf streaming in the breeze -->
  <path d="M431 201Q452 212 475 205L475 220Q450 229 433 216Z" fill="#d65b48"/>
  <path d="M438 213Q398 232 365 202L375 227L357 233Q408 252 448 221Z" fill="#d65b48"/>

  <!-- Motion marks -->
  <g stroke="#a7b9ae" stroke-width="5" stroke-linecap="round">
