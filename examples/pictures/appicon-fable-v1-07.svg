<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Sky: vertical gradient, lighter at the top -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BFE6FF"/>
      <stop offset="1" stop-color="#3D9BE9"/>
    </linearGradient>
  </defs>

  <!-- Upper sky band (square, hard corners) -->
  <rect x="0" y="0" width="1024" height="1024" fill="url(#sky)"/>

  <!-- Lower ground band, separated by a crisp horizon line -->
  <rect x="0" y="736" width="1024" height="288" fill="#3F8F5C"/>
  <rect x="0" y="728" width="1024" height="8" fill="#2F6F46"/>

  <!-- Sun, partly tucked behind the cloud -->
  <g fill="#FFC53D">
    <circle cx="610" cy="330" r="138"/>
    <!-- Rays -->
    <g transform="translate(610 330)">
      <rect x="-20" y="-230" width="40" height="78"/>
      <rect x="-20" y="-230" width="40" height="78" transform="rotate(45)"/>
      <rect x="-20" y="-230" width="40" height="78" transform="rotate(90)"/>
      <rect x="-20" y="-230" width="40" height="78" transform="rotate(315)"/>
      <rect x="-20" y="-230" width="40" height="78" transform="rotate(270)"/>
    </g>
  </g>

  <!-- Cloud, solid flat fill, overlapping the lower-left of the sun -->
  <g fill="#FFFFFF">
    <circle cx="380" cy="470" r="120"/>
    <circle cx="500" cy="420" r="150"/>
    <circle cx="620" cy="490" r="110"/>
    <rect x="380" y="470" width="240" height="130"/>
    <rect x="300" y="520" width="400" height="80"/>
  </g>
</svg>