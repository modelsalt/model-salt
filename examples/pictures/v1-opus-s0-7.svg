<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Plain background -->
  <rect width="400" height="300" fill="#f4f1ea"/>

  <!-- Far leg (behind the bike) -->
  <polyline points="182,146 176,184 173,222" fill="none" stroke="#d9822b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="164,224 182,224 173,217" fill="#d9822b"/>

  <!-- ===== Bicycle ===== -->
  <!-- Wheels -->
  <circle cx="110" cy="220" r="52" fill="none" stroke="#2b2d42" stroke-width="7"/>
  <circle cx="290" cy="220" r="52" fill="none" stroke="#2b2d42" stroke-width="7"/>
  <!-- Spokes -->
  <g stroke="#8d99ae" stroke-width="2">
    <line x1="110" y1="171" x2="110" y2="269"/>
    <line x1="61" y1="220" x2="159" y2="220"/>
    <line x1="75" y1="185" x2="145" y2="255"/>
    <line x1="145" y1="185" x2="75" y2="255"/>
    <line x1="290" y1="171" x2="290" y2="269"/>
    <line x1="241" y1="220" x2="339" y2="220"/>
    <line x1="255" y1="185" x2="325" y2="255"/>
    <line x1="325" y1="185" x2="255" y2="255"/>
  </g>
  <!-- Hubs -->
  <circle cx="110" cy="220" r="6" fill="#2b2d42"/>
  <circle cx="290" cy="220" r="6" fill="#2b2d42"/>

  <!-- Frame -->
  <g stroke="#e63946" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="110" y1="220" x2="195" y2="222"/> <!-- chainstay -->
    <line x1="110" y1="220" x2="182" y2="155"/> <!-- seatstay -->
    <line x1="195" y1="222" x2="180" y2="150"/> <!-- seat tube -->
    <line x1="182" y1="155" x2="272" y2="146"/> <!-- top tube -->
    <line x1="195" y1="222" x2="276" y2="160"/> <!-- down tube -->
    <line x1="270" y1="140" x2="290" y2="220"/> <!-- head tube + fork -->
  </g>
  <!-- Stem & handlebar -->
  <polyline points="270,140 266,124 248,122" fill="none" stroke="#2b2d42" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="242" y="118" width="12" height="8" rx="3" fill="#2b2d42"/>

  <!-- Seat -->
  <rect x="164" y="143" width="32" height="8" rx="4" fill="#2b2d42"/>

  <!-- Chainring & cranks (held level: static pose) -->
  <circle cx="195" cy="222" r="11" fill="none" stroke="#2b2d42" stroke-width="4"/>
  <line x1="173" y1="222" x2="217" y2="222" stroke="#2b2d42" stroke-width="5" stroke-linecap="round"/>
  <rect x="166" y="219" width="14" height="6" rx="2" fill="#2b2d42"/>
  <rect x="210" y="219" width="14" height="6" rx="2" fill="#2b2d42"/>

  <!-- ===== Pelican ===== -->
  <!-- Tail -->
  <polygon points="145,112 112,104 118,124 146,130" fill="#e9ecef"/>

  <!-- Body -->
  <ellipse cx="185" cy="120" rx="44" ry="31" fill="#ffffff"/>

  <!-- Near leg (resting on front pedal) -->
  <polyline points="192,146 207,180 217,220" fill="none" stroke="#f4a261" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="206,222 228,222 217,214" fill="#f4a261"/>

  <!-- Wing, reaching forward to the handlebar -->
  <path d="M150,108 Q185,96 222,108 L250,121 L240,127 Q200,134 158,128 Z" fill="#ced4da"/>
  <path d="M160,124 L178,118 M168,128 L190,121" stroke="#adb5bd" stroke-width="3" stroke-linecap="round"/>

  <!-- Neck -->
  <path d="M208,104 Q216,84 226,66" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round"/>

  <!-- Head -->
  <circle cx="228" cy="60" r="16" fill="#ffffff"/>
  <!-- Little crest -->
  <polygon points="214,52 206,44 220,47" fill="#ffd6a5"/>

  <!-- Pouch -->
  <path d="M238,68 L312,74 Q290,96 254,92 Q242,86 238,68 Z" fill="#f4a261"/>
  <!-- Upper beak -->
  <polygon points="238,56 318,70 312,75 238,68" fill="#f77f00"/>
  <circle cx="316" cy="72" r="3" fill="#d62828"/>

  <!-- Eye -->
  <circle cx="231" cy="56" r="4" fill="#2b2d42"/>
  <circle cx="232" cy="55" r="1.3" fill="#ffffff"/>
</svg>