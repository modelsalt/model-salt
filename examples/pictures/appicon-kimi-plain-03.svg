<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B6AD9"/>
      <stop offset="0.55" stop-color="#4E9FE8"/>
      <stop offset="1" stop-color="#B3DCF2"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF6C8" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#FFE38A" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFE38A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" cx="0.42" cy="0.38" r="0.65">
      <stop offset="0" stop-color="#FFF3B0"/>
      <stop offset="0.55" stop-color="#FFD54F"/>
      <stop offset="1" stop-color="#FF9E2C"/>
    </radialGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D9E7F3"/>
    </linearGradient>
    <filter id="cloudShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0B3D91" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Sky background (square, sharp corners) -->
  <rect width="512" height="512" fill="url(#sky)"/>

  <!-- Sun glow -->
  <circle cx="185" cy="185" r="150" fill="url(#sunGlow)"/>

  <!-- Sun rays -->
  <g stroke="#FFCE3D" stroke-width="14" stroke-linecap="round" opacity="0.95">
    <line x1="185" y1="70"  x2="185" y2="38"/>
    <line x1="266" y1="104" x2="289" y2="81"/>
    <line x1="300" y1="185" x2="332" y2="185"/>
    <line x1="266" y1="266" x2="289" y2="289"/>
    <line x1="104" y1="266" x2="81"  y2="289"/>
    <line x1="70"  y1="185" x2="38"  y2="185"/>
    <line x1="104" y1="104" x2="81"  y2="81"/>
  </g>

  <!-- Sun -->
  <circle cx="185" cy="185" r="85" fill="url(#sun)"/>
  <ellipse cx="158" cy="158" rx="30" ry="20" fill="#FFFFFF" opacity="0.35"/>

  <!-- Cloud -->
  <g fill="url(#cloud)" filter="url(#cloudShadow)">
    <ellipse cx="316" cy="352" rx="128" ry="62"/>
    <circle cx="244" cy="322" r="54"/>
    <circle cx="318" cy="296" r="70"/>
    <circle cx="396" cy="326" r="52"/>
  </g>

  <!-- Cloud highlight -->
  <ellipse cx="300" cy="292" rx="46" ry="22" fill="#FFFFFF" opacity="0.55"/>
</svg>