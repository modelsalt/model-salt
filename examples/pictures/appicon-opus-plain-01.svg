<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Sky background -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#1E3A8A"/>
      <stop offset="0.55" stop-color="#2563EB"/>
      <stop offset="1"    stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Soft atmospheric glow around the sun -->
    <radialGradient id="glow" cx="640" cy="380" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#FDE68A" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#FBBF24" stop-opacity="0.15"/>
      <stop offset="1"   stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>

    <!-- Sun body -->
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDE047"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>

    <!-- Cloud body -->
    <linearGradient id="cloud" x1="0" y1="350" x2="0" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DBEAFE"/>
    </linearGradient>

    <!-- Cloud shadow for depth -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#0B1E5B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background (square, full bleed) -->
  <rect width="1024" height="1024" fill="url(#sky)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- Sun rays -->
  <g transform="translate(640 380)" stroke="#FCD34D" stroke-width="38" stroke-linecap="round">
    <line x1="0" y1="-218" x2="0" y2="-285"/>
    <line x1="0" y1="-218" x2="0" y2="-285" transform="rotate(45)"/>
    <line x1="0" y1="-218" x2="0" y2="-285" transform="rotate(90)"/>
    <line x1="0" y1="-218" x2="0" y2="-285" transform="rotate(135)"/>
    <line x1="0" y1="-218" x2="0" y2="-285" transform="rotate(180)"/>
    <line x1="0" y1="-218" x2="0" y2="-285" transform="rotate(225)"/>
    <line x1="0" y1="-218" x2="0" y2="-285" transform="rotate(270)"/>
    <line x1="0" y1="-218" x2="0" y2="-285" transform="rotate(315)"/>
  </g>

  <!-- Sun -->
  <circle cx="640" cy="380" r="170" fill="url(#sun)"/>

  <!-- Cloud -->
  <g fill="url(#cloud)" filter="url(#shadow)">
    <rect x="190" y="600" width="644" height="200" rx="100"/>
    <circle cx="380" cy="600" r="140"/>
    <circle cx="590" cy="530" r="180"/>
  </g>
</svg>