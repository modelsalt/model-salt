<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Pelican riding a bicycle</title>
  <desc>A white pelican with an orange beak and pouch, seated upright on a bicycle saddle, wings holding the handlebars, pedaling left to right.</desc>

  <!-- sky -->
  <rect x="0" y="0" width="800" height="600" fill="#eaf4f9"/>

  <!-- clouds -->
  <g fill="#ffffff" opacity="0.75">
    <ellipse cx="170" cy="108" rx="48" ry="18"/>
    <ellipse cx="145" cy="96" rx="30" ry="14"/>
    <ellipse cx="640" cy="88" rx="42" ry="16"/>
    <ellipse cx="618" cy="78" rx="26" ry="12"/>
  </g>

  <!-- ground + shadows -->
  <line x1="110" y1="522" x2="690" y2="522" stroke="#c7ced4" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="250" cy="522" rx="70" ry="7" fill="#dde5ea"/>
  <ellipse cx="560" cy="522" rx="70" ry="7" fill="#dde5ea"/>

  <!-- ===== bicycle ===== -->
  <!-- wheels -->
  <g fill="none">
    <circle cx="250" cy="450" r="70" stroke="#3a3d42" stroke-width="9"/>
    <circle cx="250" cy="450" r="60" stroke="#9aa0a6" stroke-width="2.5"/>
    <g stroke="#b7bcc1" stroke-width="2">
      <line x1="190" y1="450" x2="310" y2="450"/>
      <line x1="250" y1="390" x2="250" y2="510"/>
      <line x1="208" y1="408" x2="292" y2="492"/>
      <line x1="292" y1="408" x2="208" y2="492"/>
    </g>
    <circle cx="560" cy="450" r="70" stroke="#3a3d42" stroke-width="9"/>
    <circle cx="560" cy="450" r="60" stroke="#9aa0a6" stroke-width="2.5"/>
    <g stroke="#b7bcc1" stroke-width="2">
      <line x1="500" y1="450" x2="620" y2="450"/>
      <line x1="560" y1="390" x2="560" y2="510"/>
      <line x1="518" y1="408" x2="602" y2="492"/>
      <line x1="602" y1="408" x2="518" y2="492"/>
    </g>
  </g>
  <circle cx="250" cy="450" r="6" fill="#6b7075"/>
  <circle cx="560" cy="450" r="6" fill="#6b7075"/>

  <!-- frame -->
  <g stroke="#494e55" stroke-width="9" stroke-linecap="round" fill="none">
    <line x1="250" y1="450" x2="390" y2="462"/>
    <line x1="250" y1="450" x2="365" y2="338"/>
    <line x1="390" y1="462" x2="365" y2="338"/>
    <line x1="390" y1="462" x2="543" y2="382"/>
    <line x1="365" y1="338" x2="522" y2="318"/>
  </g>
  <line x1="522" y1="318" x2="545" y2="384" stroke="#494e55" stroke-width="11" stroke-linecap="round"/>
  <line x1="545" y1="384" x2="560" y2="450" stroke="#494e55" stroke-width="8" stroke-linecap="round"/>

  <!-- chain -->
  <g stroke="#8a8f94" stroke-width="2" fill="none">
    <line x1="390" y1="445" x2="253" y2="447"/>
    <line x1="390" y1="479" x2="253" y2="453"/>
  </g>

  <!-- chainring, cranks, pedals -->
  <circle cx="390" cy="462" r="17" fill="none" stroke="#6b7075" stroke-width="4"/>
  <circle cx="390" cy="462" r="4" fill="#6b7075"/>
  <line x1="390" y1="462" x2="415" y2="507" stroke="#565a60" stroke-width="6" stroke-linecap="round"/>
  <line x1="390" y1="462" x2="366" y2="418" stroke="#565a60" stroke-width="6" stroke-linecap="round"/>
  <line x1="403" y1="508" x2="429" y2="508" stroke="#3f4349" stroke-width="6" stroke-linecap="round"/>
  <line x1="352" y1="418" x2="378" y2="418" stroke="#3f4349" stroke-width="6" stroke-linecap="round"/>

  <!-- seat post + saddle -->
  <line x1="365" y1="338" x2="360" y2="318" stroke="#494e55" stroke-width="7" stroke-linecap="round"/>
  <ellipse cx="352" cy="315" rx="36" ry="8" fill="#2f3338" transform="rotate(-5 352 315)"/>

  <!-- handlebar -->
  <line x1="522" y1="318" x2="515" y2="284" stroke="#494e55" stroke-width="7" stroke-linecap="round"/>
  <path d="M515 285 C503 285 496 292 498 301 C500 309 509 311 515 306" fill="none" stroke="#494e55" stroke-width="6" stroke-linecap="round"/>

  <!-- ===== pelican ===== -->
  <!-- far leg -->
  <path d="M346 336 C340 372 350 400 362 415" fill="none" stroke="#464a50" stroke-width="9" stroke-linecap="round"/>
  <ellipse cx="365" cy="417" rx="13" ry="5.5" fill="#464a50"/>
  <!-- near leg -->
  <path d="M372 334 C386 378 384 420 398 462 C404 480 409 494 414 503" fill="none" stroke="#585c63" stroke-width="10" stroke-linecap="round"/>
  <ellipse cx="415" cy="505" rx="14" ry="6" fill="#585c63"/>

  <!-- tail feathers -->
  <path d="M272 268 C250 266 231 277 223 291 C239 300 262 297 277 288 Z" fill="#e8e7df"/>
  <path d="M276 285 C257 287 243 295 237 306 C251 310 269 304 280 296 Z" fill="#e8e7df"/>

  <!-- body -->
  <ellipse cx="348" cy="272" rx="88" ry="62" fill="#f6f5ef" stroke="#dddcd3" stroke-width="2" transform="rotate(-12 348 272)"/>
  <path d="M290 312 C320 332 380 334 412 308 C398 330 340 342 300 324 Z" fill="#e8e7df" opacity="0.8"/>

  <!-- folded wing -->
  <path d="M390 232 C352 222 298 236 277 272 C295 306 342 324 384 314 C403 289 404 258 390 232 Z" fill="#ecebe3" stroke="#d6d5ca" stroke-width="1.5"/>
  <path d="M300 268 C322 257 352 255 374 262" fill="none" stroke="#cfcec2" stroke-width="2" stroke-linecap="round"/>
  <path d="M306 289 C330 281 358 281 378 289" fill="none" stroke="#cfcec2" stroke-width="2" stroke-linecap="round"/>

  <!-- neck -->
  <path d="M398 256 C422 246 429 214 439 187 C443 175 447 168 453 163" fill="none" stroke="#f6f5ef" stroke-width="25" stroke-linecap="round"/>
  <path d="M410 250 C428 236 433 210 441 188" fill="none" stroke="#e3e2d9" stroke-width="5" stroke-linecap="round" opacity="0.8"/>

  <!-- pouch (behind beak) -->
  <path d="M464 168 C505 178 535 206 556 211 C573 214 586 201 590 183 L588 182 C548 189 504 176 464 168 Z" fill="#f7b45c" stroke="#e8a13f" stroke-width="1.5"/>

  <!-- head -->
  <ellipse cx="452" cy="162" rx="24" ry="17" fill="#f6f5ef" transform="rotate(8 452 162)"/>
  <path d="M435 149 Q427 143 423 135" fill="none" stroke="#e8e7df" stroke-width="4" stroke-linecap="round"/>

  <!-- upper beak -->
  <path d="M464 150 C512 155 560 166 590 174 C597 177 595 182 588 184 C545 179 502 172 462 166 C459 159 460 154 464 150 Z" fill="#f39a2c" stroke="#e0861c" stroke-width="1.5"/>
  <path d="M470 160 C515 166 555 173 585 179" fill="none" stroke="#e0861c" stroke-width="1.5"/>

  <!-- pouch crease -->
  <path d="M470 172 C508 183 542 203 562 204" fill="none" stroke="#e8a13f" stroke-width="1.5"/>

  <!-- eye -->
  <circle cx="454" cy="154" r="4.5" fill="#22262b"/>
  <circle cx="452.5" cy="152.5" r="1.5" fill="#ffffff"/>

  <!-- near wing gripping handlebar -->
  <path d="M392 238 C440 240 482 260 510 288 C504 297 493 298 484 292 C452 272 420 262 392 262 Z" fill="#f1f0e8" stroke="#d6d5ca" stroke-width="1.5"/>
  <path d="M470 262 C484 270 496 279 506 289" fill="none" stroke="#cfcec2" stroke-width="2" stroke-linecap="round"/>
</svg>