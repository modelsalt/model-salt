<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Top-to-bottom twilight gradient that runs the full height of the square -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#2A1650"/>
      <stop offset="0.45" stop-color="#6B2C8C"/>
      <stop offset="0.8"  stop-color="#C2448F"/>
      <stop offset="1"    stop-color="#F06A9B"/>
    </linearGradient>
    <!-- Long and short ray shapes, pointing straight up from the center -->
    <rect id="rayLong"  x="-18" y="-318" width="36" height="92" rx="18"/>
    <rect id="rayShort" x="-14" y="-286" width="28" height="56" rx="14"/>
  </defs>

  <!-- Square background with sharp corners -->
  <rect width="1024" height="1024" fill="url(#sky)"/>

  <!-- Sun in the center, with plenty of space on every side -->
  <g transform="translate(512 512)">
    <!-- Rays: one flat color, alternating long and short -->
    <g fill="#FFC6A5">
      <use href="#rayLong"  transform="rotate(0)"/>
      <use href="#rayShort" transform="rotate(30)"/>
      <use href="#rayLong"  transform="rotate(60)"/>
      <use href="#rayShort" transform="rotate(90)"/>
      <use href="#rayLong"  transform="rotate(120)"/>
      <use href="#rayShort" transform="rotate(150)"/>
      <use href="#rayLong"  transform="rotate(180)"/>
      <use href="#rayShort" transform="rotate(210)"/>
      <use href="#rayLong"  transform="rotate(240)"/>
      <use href="#rayShort" transform="rotate(270)"/>
      <use href="#rayLong"  transform="rotate(300)"/>
      <use href="#rayShort" transform="rotate(330)"/>
    </g>
    <!-- Sun disc: two flat colors, no gradient -->
    <circle r="186" fill="#FFB38F"/>
    <circle r="150" fill="#FFD9BF"/>
  </g>
</svg>