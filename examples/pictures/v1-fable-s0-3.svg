<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Bicycle -->
  <g stroke="#333" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Wheels -->
    <circle cx="90" cy="220" r="50" fill="#fff"/>
    <circle cx="310" cy="220" r="50" fill="#fff"/>
    <circle cx="90" cy="220" r="6" fill="#333"/>
    <circle cx="310" cy="220" r="6" fill="#333"/>
    <!-- Spokes -->
    <line x1="90" y1="170" x2="90" y2="270"/>
    <line x1="40" y1="220" x2="140" y2="220"/>
    <line x1="55" y1="185" x2="125" y2="255"/>
    <line x1="125" y1="185" x2="55" y2="255"/>
    <line x1="310" y1="170" x2="310" y2="270"/>
    <line x1="260" y1="220" x2="360" y2="220"/>
    <line x1="275" y1="185" x2="345" y2="255"/>
    <line x1="345" y1="185" x2="275" y2="255"/>
    <!-- Frame -->
    <path d="M90 220 L170 130 L270 130 L310 220" stroke="#d9442b"/>
    <path d="M170 130 L200 220 L270 130" stroke="#d9442b"/>
    <path d="M200 220 L90 220" stroke="#d9442b"/>
    <!-- Seat post and seat -->
    <line x1="170" y1="130" x2="160" y2="105" stroke="#d9442b"/>
    <path d="M140 105 L185 105" stroke="#333" stroke-width="7"/>
    <!-- Handlebars -->
    <line x1="270" y1="130" x2="285" y2="95" stroke="#d9442b"/>
    <path d="M270 95 L305 95" stroke="#333" stroke-width="6"/>
    <!-- Pedals and cranks -->
    <circle cx="200" cy="220" r="10" fill="#333"/>
    <line x1="200" y1="220" x2="215" y2="245"/>
    <line x1="200" y1="220" x2="185" y2="195"/>
    <line x1="207" y1="245" x2="225" y2="245" stroke-width="6"/>
    <line x1="177" y1="195" x2="195" y2="195" stroke-width="6"/>
  </g>

  <!-- Pelican -->
  <g stroke="#333" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- Legs -->
    <path d="M165 125 L190 165 L215 245" fill="none" stroke="#f0a030" stroke-width="5"/>
    <path d="M160 125 L170 170 L185 195" fill="none" stroke="#f0a030" stroke-width="5"/>
    <!-- Feet -->
    <path d="M205 245 L230 245 L218 252 Z" fill="#f0a030"/>
    <path d="M175 195 L200 195 L188 202 Z" fill="#f0a030"/>
    <!-- Tail -->
    <path d="M125 100 L95 80 L120 115 Z" fill="#f5f5f5"/>
    <!-- Body -->
    <ellipse cx="165" cy="100" rx="48" ry="30" fill="#f5f5f5"/>
    <!-- Wing -->
    <path d="M150 90 Q190 85 215 110 Q180 118 150 105 Z" fill="#e0e0e0"/>
    <!-- Wing reaching to handlebars -->
    <path d="M195 95 Q250 85 285 97" fill="none" stroke="#e0e0e0" stroke-width="12"/>
    <path d="M195 95 Q250 85 285 97" fill="none" stroke="#333" stroke-width="3" stroke-dasharray="0"/>
    <!-- Neck -->
    <path d="M190 85 Q215 60 225 50" fill="none" stroke="#f5f5f5" stroke-width="22"/>
    <path d="M190 85 Q215 60 225 50" fill="none" stroke="#333" stroke-width="3" opacity="0"/>
    <!-- Head -->
    <circle cx="232" cy="45" r="22" fill="#f5f5f5"/>
    <!-- Beak (upper) -->
    <path d="M248 40 L330 52 L250 58 Z" fill="#f0a030"/>
    <!-- Pouch (lower beak) -->
    <path d="M250 58 L330 52 Q300 80 255 72 Z" fill="#e8893a"/>
    <!-- Eye -->
    <circle cx="238" cy="40" r="5" fill="#fff"/>
    <circle cx="240" cy="40" r="2.5" fill="#333" stroke="none"/>
  </g>
</svg>