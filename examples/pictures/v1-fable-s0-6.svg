<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Bicycle frame -->
  <g stroke="#2b2b2b" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Rear wheel -->
    <circle cx="90" cy="220" r="48"/>
    <!-- Front wheel -->
    <circle cx="310" cy="220" r="48"/>
    <!-- Frame triangles -->
    <polyline points="90,220 165,140 250,140 310,220"/>
    <polyline points="90,220 185,220 165,140"/>
    <polyline points="185,220 250,140"/>
    <!-- Seat post and seat -->
    <line x1="165" y1="140" x2="158" y2="118"/>
    <!-- Handlebar stem -->
    <line x1="250" y1="140" x2="262" y2="110"/>
    <line x1="250" y1="110" x2="278" y2="106"/>
  </g>
  <!-- Wheel spokes -->
  <g stroke="#2b2b2b" stroke-width="2.5" stroke-linecap="round">
    <line x1="90" y1="172" x2="90" y2="268"/>
    <line x1="42" y1="220" x2="138" y2="220"/>
    <line x1="56" y1="186" x2="124" y2="254"/>
    <line x1="124" y1="186" x2="56" y2="254"/>
    <line x1="310" y1="172" x2="310" y2="268"/>
    <line x1="262" y1="220" x2="358" y2="220"/>
    <line x1="276" y1="186" x2="344" y2="254"/>
    <line x1="344" y1="186" x2="276" y2="254"/>
  </g>
  <!-- Hubs -->
  <circle cx="90" cy="220" r="6" fill="#2b2b2b"/>
  <circle cx="310" cy="220" r="6" fill="#2b2b2b"/>
  <!-- Seat -->
  <path d="M140 118 L178 118 L170 110 L148 110 Z" fill="#2b2b2b"/>
  <!-- Crank and pedals -->
  <circle cx="185" cy="220" r="10" fill="#2b2b2b"/>
  <line x1="185" y1="220" x2="203" y2="238" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round"/>
  <line x1="185" y1="220" x2="167" y2="202" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round"/>
  <rect x="197" y="235" width="16" height="6" rx="2" fill="#2b2b2b"/>
  <rect x="157" y="199" width="16" height="6" rx="2" fill="#2b2b2b"/>

  <!-- Pelican -->
  <!-- Rear leg (back) -->
  <path d="M158 130 L150 175 L167 202" stroke="#f2a93b" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Body -->
  <ellipse cx="165" cy="100" rx="52" ry="34" fill="#ffffff" stroke="#2b2b2b" stroke-width="4"/>
  <!-- Tail feathers -->
  <path d="M118 96 L96 84 L104 100 L92 108 L116 110 Z" fill="#ffffff" stroke="#2b2b2b" stroke-width="4" stroke-linejoin="round"/>
  <!-- Wing -->
  <path d="M150 92 Q178 78 206 92 Q190 116 160 112 Z" fill="#e6e6e6" stroke="#2b2b2b" stroke-width="4" stroke-linejoin="round"/>
  <!-- Front leg -->
  <path d="M172 130 L180 180 L205 238" stroke="#f2a93b" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Webbed feet -->
  <path d="M195 238 L218 232 L216 242 Z" fill="#f2a93b" stroke="#2b2b2b" stroke-width="3" stroke-linejoin="round"/>
  <path d="M157 202 L180 196 L178 206 Z" fill="#f2a93b" stroke="#2b2b2b" stroke-width="3" stroke-linejoin="round"/>
  <!-- Neck -->
  <path d="M200 86 Q226 76 234 50" stroke="#ffffff" stroke-width="18" fill="none" stroke-linecap="round"/>
  <path d="M200 86 Q226 76 234 50" stroke="#2b2b2b" stroke-width="26" fill="none" stroke-linecap="round" opacity="0"/>
  <path d="M196 94 Q230 84 240 52" stroke="#2b2b2b" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M204 76 Q220 66 228 46" stroke="#2b2b2b" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Head -->
  <circle cx="238" cy="42" r="20" fill="#ffffff" stroke="#2b2b2b" stroke-width="4"/>
  <!-- Beak (upper) -->
  <path d="M252 38 L318 46 L254 50 Z" fill="#f2a93b" stroke="#2b2b2b" stroke-width="4" stroke-linejoin="round"/>
  <!-- Beak pouch (lower) -->
  <path d="M254 50 L316 48 Q292 76 256 60 Z" fill="#f7c66b" stroke="#2b2b2b" stroke-width="4" stroke-linejoin="round"/>
  <!-- Eye -->
  <circle cx="244" cy="38" r="4" fill="#2b2b2b"/>
  <!-- Wing tip reaching handlebar -->
  <path d="M200 100 Q240 96 270 106" stroke="#2b2b2b" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M200 100 Q240 96 270 106" stroke="#ffffff" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M200 100 Q240 96 270 106" stroke="#2b2b2b" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
</svg>