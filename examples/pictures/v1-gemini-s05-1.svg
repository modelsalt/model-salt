<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 850" width="100%" height="100%">
  <defs>
    <!-- Style definitions for consistent bold cartoon aesthetic -->
    <style>
      .outline {
        stroke: #1A1A26;
        stroke-width: 7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .outline-thin {
        stroke: #1A1A26;
        stroke-width: 4.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .spoke {
        stroke: #7A8B99;
        stroke-width: 3;
        stroke-linecap: round;
      }
      .feathers-base { fill: #FFFFFF; }
      .feathers-shadow { fill: #CFE2F3; }
      .beak-upper { fill: #FFCE3A; }
      .beak-upper-shadow { fill: #F4A31E; }
      .beak-pouch { fill: #FF7F3E; }
      .beak-pouch-shadow { fill: #D84E17; }
      .beak-highlight { fill: #FFF29C; }
      .legs { fill: #FF6B2B; }
      .legs-shadow { fill: #C9430B; }
      .bike-frame { fill: #E63946; }
      .bike-frame-shadow { fill: #9D1A25; }
      .bike-frame-highlight { fill: #FF7B85; }
      .tire { fill: #2B2D42; }
      .rim { fill: #D9E2EC; }
      .brass { fill: #FFB703; }
      .brass-shadow { fill: #CC8B00; }
      .leather { fill: #8D5524; }
    </style>

    <!-- Clip paths for cel-shading -->
    <clipPath id="body-clip">
      <path d="M 330,200 C 260,190 190,235 180,295 C 170,355 240,395 310,390 C 375,385 405,345 405,295 C 405,250 380,210 330,200 Z" />
    </clipPath>
    <clipPath id="pouch-clip">
      <path d="M 412,155 C 430,290 570,295 668,162 C 565,168 470,162 412,155 Z" />
    </clipPath>
    <clipPath id="upper-beak-clip">
      <path d="M 405,125 C 480,122 590,115 665,140 C 685,146 680,175 660,175 C 655,165 650,162 640,162 C 555,168 470,162 412,155 Z" />
    </clipPath>
  </defs>

  <!-- BACKGROUND: Vibrant sky & subtle speed clouds -->
  <rect width="800" height="850" fill="#8CD6F7" />
  <circle cx="430" cy="430" r="340" fill="#B6E6FC" />
  
  <!-- Dynamic Speed Lines in Background -->
  <g stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.7">
    <line x1="60" y1="150" x2="180" y2="150" />
    <line x1="30" y1="280" x2="110" y2="280" />
    <line x1="80" y1="450" x2="150" y2="450" />
    <line x1="660" y1="300" x2="750" y2="300" />
    <line x1="690" y1="520" x2="770" y2="520" />
  </g>

  <!-- GROUND & SHADOW -->
  <path d="M 40,775 L 760,775" class="outline" stroke-width="8" />
  <ellipse cx="400" cy="775" rx="310" ry="18" fill="#5BA8CC" />
  <ellipse cx="445" cy="775" rx="195" ry="11" fill="#2B5B75" />
  <ellipse cx="160" cy="775" rx="55" ry="8" fill="#2B5B75" />

  <!-- ==================== BACK LEG & PEDAL ==================== -->
  <g id="back-leg">
    <!-- Back Crank Arm -->
    <line x1="450" y1="565" x2="405" y2="500" class="outline" stroke="#8A9BA8" stroke-width="14" />
    <line x1="450" y1="565" x2="405" y2="500" class="outline-thin" stroke="#1A1A26" />
    <!-- Back Webbed Foot -->
    <path d="M 390,485 L 435,492 L 420,512 L 375,505 Z" class="legs-shadow outline" />
    <!-- Back Pedal -->
    <rect x="382" y="495" width="44" height="14" rx="5" class="brass-shadow outline-thin" />
    <!-- Back Pelican Leg -->
    <path d="M 315,365 L 415,425 L 400,495" fill="none" stroke="#1A1A26" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 315,365 L 415,425 L 400,495" fill="none" stroke="#C9430B" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Knee Joint Bump -->
    <circle cx="415" cy="425" r="10" class="legs-shadow outline-thin" />
  </g>

  <!-- ==================== PENNY-FARTHING BICYCLE ==================== -->
  <g id="penny-farthing">
    
    <!-- LARGE FRONT WHEEL (Center: 450, 565) -->
    <g id="front-wheel" transform="translate(450, 565)">
      <!-- Spokes -->
      <g class="spoke">
        <line x1="-185" y1="0" x2="185" y2="0" />
        <line x1="0" y1="-185" x2="0" y2="185" />
        <line x1="-131" y1="-131" x2="131" y2="131" />
        <line x1="-131" y1="131" x2="131" y2="-131" />
        <line x1="-178" y1="-48" x2="178" y2="48" />
        <line x1="-48" y1="-178" x2="48" y2="178" />
        <line x1="-178" y1="48" x2="178" y2="-48" />
        <line x1="-48" y1="178" x2="48" y2="-178" />
        <line x1="-160" y1="-92" x2="160" y2="92" />
        <line x1="-92" y1="-160" x2="92" y2="160" />
        <line x1="-160" y1="92" x2="160" y2="-92" />
        <line x1="-92" y1="160" x2="92" y2="-160" />
      </g>
      <!-- Wheel Motion Lines -->
      <path d="M -145,-60 A 155,155 0 0,1 -60,-145" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.8" />
      <path d="M 145,60 A 155,155 0 0,1 60,145" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.8" />

      <!-- Outer Tire & Inner Rim (Compound Paths) -->
      <path d="M 0,-210 A 210,210 0 1,0 0,210 A 210,210 0 1,0 0,-210 Z 
               M 0,-186 A 186,186 0 1,1 0,186 A 186,186 0 1,1 0,-186 Z" 
            fill-rule="evenodd" class="tire outline" />
      <!-- Tire Cel-Highlight -->
      <path d="M -140,-140 A 198,198 0 0,1 140,-140" fill="none" stroke="#55597A" stroke-width="6" stroke-linecap="round" />

      <path d="M 0,-186 A 186,186 0 1,0 0,186 A 186,186 0 1,0 0,-186 Z 
               M 0,-174 A 174,174 0 1,1 0,174 A 174,174 0 1,1 0,-174 Z" 
            fill-rule="evenodd" class="rim outline-thin" />
    </g>

    <!-- TINY REAR WHEEL (Center: 160, 710) -->
    <g id="rear-wheel" transform="translate(160, 710)">
      <g class="spoke">
        <line x1="-50" y1="0" x2="50" y2="0" />
        <line x1="0" y1="-50" x2="0" y2="50" />
        <line x1="-35" y1="-35" x2="35" y2="35" />
        <line x1="-35" y1="35" x2="35" y2="-35" />
      </g>
      <path d="M 0,-65 A 65,65 0 1,0 0,65 A 65,65 0 1,0 0,-65 Z 
               M 0,-48 A 48,48 0 1,1 0,48 A 48,48 0 1,1 0,-48 Z" 
            fill-rule="evenodd" class="tire outline" />
      <path d="M 0,-48 A 48,48 0 1,0 0,48 A 48,48 0 1,0 0,-48 Z 
               M 0,-40 A 40,40 0 1,1 0,40 A 40,40 0 1,1 0,-40 Z" 
            fill-rule="evenodd" class="rim outline-thin" />
      <circle cx="0" cy="0" r="12" class="brass outline-thin" />
    </g>

    <!-- BICYCLE FRAME (Spine & Forks) -->
    <!-- Sweeping Spine Tube -->
    <path d="M 418,325 C 245,325 225,535 160,710" fill="none" stroke="#1A1A26" stroke-width="26" stroke-linecap="round" />
    <path d="M 418,325 C 245,325 225,535 160,710" fill="none" stroke="#9D1A25" stroke-width="14" stroke-linecap="round" />
    <path d="M 416,321 C 245,321 225,531 158,706" fill="none" stroke="#E63946" stroke-width="8" stroke-linecap="round" />
    
    <!-- Mounting Step on Spine -->
    <path d="M 190,610 L 165,610 L 170,622 L 195,622 Z" class="brass outline-thin" />

    <!-- Saddle & Springs -->
    <path d="M 315,350 C 300,335 335,330 320,315" fill="none" stroke="#1A1A26" stroke-width="6" stroke-linecap="round" />
    <path d="M 355,345 L 355,315" fill="none" stroke="#1A1A26" stroke-width="8" stroke-linecap="round" />
    <!-- Leather Seat -->
    <path d="M 285,305 C 285,328 375,328 385,312 C 392,300 365,295 340,302 C 315,308 285,290 285,305 Z" class="leather outline" />
    <path d="M 295,307 C 315,314 355,314 375,306" fill="none" stroke="#B5763E" stroke-width="4" stroke-linecap="round" />

    <!-- Front Fork -->
    <path d="M 450,565 L 415,280" fill="none" stroke="#1A1A26" stroke-width="28" stroke-linecap="round" />
    <path d="M 450,565 L 415,280" fill="none" stroke="#9D1A25" stroke-width="16" stroke-linecap="round" />
    <path d="M 453,565 L 418,280" fill="none" stroke="#E63946" stroke-width="9" stroke-linecap="round" />
    <path d="M 455,550 L 422,290" fill="none" stroke="#FF7B85" stroke-width="3" stroke-linecap="round" />

    <!-- Head Tube Brass Fittings -->
    <rect x="403" y="310" width="28" height="16" rx="4" transform="rotate(-7 417 318)" class="brass outline-thin" />
    <rect x="400" y="275" width="28" height="14" rx="4" transform="rotate(-7 414 282)" class="brass outline-thin" />

    <!-- Handlebars (Curving back towards pelican) -->
    <path d="M 414,275 C 410,250 385,245 365,260" fill="none" stroke="#1A1A26" stroke-width="18" stroke-linecap="round" />
    <path d="M 414,275 C 410,250 385,245 365,260" fill="none" stroke="#FFB703" stroke-width="8" stroke-linecap="round" />
    <!-- Brass Bell -->
    <path d="M 395,245 A 14,14 0 0,1 420,245 Z" class="brass outline-thin" />
    <!-- Bell Ringing Lines -->
    <path d="M 400,225 C 408,220 416,220 424,225" fill="none" stroke="#1A1A26" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 395,217 C 408,210 418,210 430,217" fill="none" stroke="#1A1A26" stroke-width="3.5" stroke-linecap="round" />

    <!-- Center Hub -->
    <circle cx="450" cy="565" r="24" class="brass outline" />
    <circle cx="450" cy="565" r="12" class="brass-shadow outline-thin" />
  </g>

  <!-- ==================== PELICAN ==================== -->
  <g id="pelican">
    
    <!-- Tail Feathers -->
    <path d="M 185,275 L 125,245 L 150,285 L 115,280 L 148,310 L 128,325 L 190,325 Z" class="feathers-shadow outline" />
    <path d="M 185,275 L 135,252 L 158,285 L 130,283 L 160,305 L 190,315 Z" class="feathers-base" />

    <!-- Torso / Body -->
    <g clip-path="url(#body-clip)">
      <path d="M 330,200 C 260,190 190,235 180,295 C 170,355 240,395 310,390 C 375,385 405,345 405,295 C 405,250 380,210 330,200 Z" class="feathers-base" />
      <!-- Cel-Shaded Belly Shadow -->
      <path d="M 170,285 C 210,355 340,365 415,275 L 415,410 L 170,410 Z" class="feathers-shadow" />
    </g>
    <!-- Torso Outline -->
    <path d="M 330,200 C 260,190 190,235 180,295 C 170,355 240,395 310,390 C 375,385 405,345 405,295 C 405,250 380,210 330,200 Z" fill="none" class="outline" />

    <!-- Fluffy Rump Feather Detail -->
    <path d="M 215,335 C 200,325 195,305 205,290" fill="none" class="outline-thin" />

    <!-- ==================== FRONT LEG & PEDAL ==================== -->
    <g id="front-leg">
      <!-- Front Thigh Flair -->
      <path d="M 285,345 C 280,375 305,395 335,380" class="feathers-shadow outline" />
      
      <!-- Pelican Front Leg -->
      <path d="M 310,370 L 385,485 L 490,625" fill="none" stroke="#1A1A26" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 310,370 L 385,485 L 490,625" fill="none" stroke="#FF6B2B" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Knobby Knee -->
      <circle cx="385" cy="485" r="11" class="legs outline-thin" />
      <path d="M 382,480 A 6,6 0 0,1 390,485" fill="none" stroke="#FFA37A" stroke-width="3" stroke-linecap="round" />

      <!-- Front Webbed Foot slapping the pedal -->
      <path d="M 478,615 L 545,620 C 548,630 538,638 530,638 C 525,645 510,645 502,642 L 470,632 Z" class="legs outline" />
      <!-- Webbing Lines -->
      <line x1="490" y1="624" x2="532" y2="630" class="outline-thin" />
      <line x1="485" y1="628" x2="515" y2="637" class="outline-thin" />

      <!-- Front Crank Arm (Over hub, connected to pedal) -->
      <line x1="450" y1="565" x2="495" y2="635" class="outline" stroke="#D9E2EC" stroke-width="16" />
      <line x1="450" y1="565" x2="495" y2="635" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
      <circle cx="450" cy="565" r="7" fill="#1A1A26" />

      <!-- Front Pedal -->
      <rect x="472" y="628" width="48" height="16" rx="6" class="brass outline" />
      <rect x="478" y="632" width="36" height="5" rx="2" fill="#FFE169" />
    </g>

    <!-- ==================== NECK, HEAD & ICONIC BEAK ==================== -->
    <!-- S-Curved Neck -->
    <path d="M 325,225 C 295,180 295,120 345,95 C 375,80 415,95 415,130 C 415,155 390,165 375,165 C 350,165 355,195 385,235 Z" class="feathers-base" />
    <!-- Neck Cel-Shadow -->
    <path d="M 325,225 C 305,190 302,140 330,110 C 315,145 325,185 355,225 Z" class="feathers-shadow" />
    <!-- Neck Outline (Open at bottom to blend with chest) -->
    <path d="M 322,220 C 295,175 295,120 345,95 C 375,80 415,95 415,130 C 415,155 395,162 380,165 C 358,170 362,195 388,230" fill="none" class="outline" />

    <!-- Goofy Tuft of Feathers on Crown of Head -->
    <path d="M 345,95 L 310,70 L 335,68 L 315,48 L 352,62 L 355,45 L 372,72 L 378,88 Z" class="feathers-shadow outline" />
    <path d="M 348,90 L 322,72 L 342,70 L 328,55 L 356,67 L 368,85 Z" class="feathers-base" />

    <!-- MASSIVE PELICAN THROAT POUCH -->
    <g clip-path="url(#pouch-clip)">
      <path d="M 412,155 C 430,290 570,295 668,162 C 565,168 470,162 412,155 Z" class="beak-pouch" />
      <!-- Heavy Cel-Shadow at bottom of pouch -->
      <path d="M 405,195 C 455,270 575,275 668,162 L 675,305 L 405,305 Z" class="beak-pouch-shadow" />
      <!-- Bright Highlight in center of pouch -->
      <ellipse cx="525" cy="195" rx="55" ry="22" transform="rotate(-5 525 195)" fill="#FF9E6D" />
    </g>
    <!-- Pouch Outline -->
    <path d="M 412,155 C 430,290 570,295 668,162" fill="none" class="outline" />
    <!-- Pouch Stretch Striations -->
    <path d="M 455,205 C 495,235 555,230 605,190" fill="none" stroke="#B83B0B" stroke-width="4" stroke-linecap="round" />
    <path d="M 480,235 C 515,252 555,248 590,220" fill="none" stroke="#B83B0B" stroke-width="4" stroke-linecap="round" />

    <!-- UPPER BEAK -->
    <g clip-path="url(#upper-beak-clip)">
      <path d="M 405,125 C 480,122 590,115 665,140 C 685,146 680,175 660,175 C 655,165 650,162 640,162 C 555,168 470,162 412,155 Z" class="beak-upper" />
      <!-- Upper Beak Ridge Highlight -->
      <path d="M 405,132 C 480,130 590,123 665,148 L 665,120 L 405,120 Z" class="beak-highlight" />
      <!-- Upper Beak Lower Edge Shadow -->
      <path d="M 412,148 C 470,154 555,160 668,154 L 668,175 L 412,175 Z" class="beak-upper-shadow" />
    </g>
    <!-- Upper Beak Outline & Hooked Tip -->
    <path d="M 405,125 C 480,122 590,115 665,140 C 685,146 680,178 662,176 C 656,175 654,163 645,162 C 560,168 470,162 412,155" fill="none" class="outline" />
    <!-- Pinkish/Red Nail at tip of beak -->
    <path d="M 658,139 C 682,146 679,176 662,175 C 656,174 655,164 648,162 C 655,154 658,146 658,139 Z" fill="#FF5964" class="outline-thin" />
    <!-- Nostril -->
    <path d="M 445,137 L 462,138" class="outline-thin" />
    <!-- Cheek Smile Line -->
    <path d="M 402,145 C 412,150 416,158 410,166" fill="none" class="outline" />

    <!-- EXPRESSIVE CARTOON EYE & AVIATOR GOGGLES -->
    <!-- Goggle Strap -->
    <path d="M 322,112 L 385,95" fill="none" stroke="#1A1A26" stroke-width="14" stroke-linecap="round" />
    <path d="M 322,112 L 385,95" fill="none" stroke="#8D5524" stroke-width="6" stroke-linecap="round" />
    <!-- Pushed-up Brass Goggles on Forehead -->
    <g transform="translate(392, 92) rotate(-18)">
      <rect x="-18" y="-14" width="36" height="26" rx="10" class="brass outline-thin" />
      <ellipse cx="0" cy="-1" rx="12" ry="9" fill="#5CE1E6" class="outline-thin" />
      <path d="M -6,-5 L 4,-5" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />
    </g>

    <!-- Eye Ring (Yellow skin around pelican eye) -->
    <circle cx="386" cy="128" r="20" class="beak-upper outline-thin" />
    <!-- Eyeball -->
    <circle cx="388" cy="128" r="14" fill="#FFFFFF" class="outline-thin" />
    <!-- Pupil (Looking eagerly forward) -->
    <circle cx="393" cy="128" r="7" fill="#1A1A26" />
    <!-- Eye Catchlights -->
    <circle cx="396" cy="124" r="3" fill="#FFFFFF" />
    <circle cx="390" cy="132" r="1.5" fill="#FFFFFF" />
    <!-- Determined/Excited Eyebrow -->
    <path d="M 366,112 C 378,105 398,108 408,118" fill="none" class="outline" stroke-width="6.5" />

    <!-- ==================== WING GRIPPING HANDLEBAR ==================== -->
    <!-- Handlebar Wooden Grip (Base) -->
    <rect x="342" y="246" width="38" height="18" rx="9" transform="rotate(-15 361 255)" class="leather outline" />

    <!-- Expressive Cartoon Wing -->
    <path d="M 305,235 C 250,235 235,285 265,320 C 290,348 345,325 372,272 C 382,254 368,242 355,248 C 345,253 335,245 305,235 Z" class="feathers-base outline" />
    <!-- Wing Cel-Shadow -->
    <path d="M 256,292 C 268,332 325,332 366,278 C 330,305 285,305 256,292 Z" class="feathers-shadow" />
    <!-- Wing Dark Grey Primary Tips (Wrapping around handlebar grip) -->
    <path d="M 342,262 C 355,242 382,244 380,264 C 378,274 362,275 352,270 C 362,276 378,278 375,288 C 372,296 355,294 345,286 C 355,295 366,298 362,306 C 358,314 340,308 332,298 C 325,285 332,272 342,262 Z" fill="#4A5568" class="outline" />
    <!-- Wing Covert Feather Details -->
    <path d="M 282,270 C 295,280 315,278 325,268" fill="none" class="outline-thin" />
    <path d="M 275,292 C 292,302 315,298 328,285" fill="none" class="outline-thin" />
    
    <!-- Handlebar Grip End-Cap (Protruding out of wing feathers for depth) -->
    <circle cx="348" cy="259" r="7" class="brass outline-thin" />
  </g>

  <!-- ==================== FOREGROUND MOTION ACCENTS ==================== -->
  <!-- Little Dust Puffs behind rear wheel -->
  <g fill="#FFFFFF" class="outline-thin">
    <path d="M 95,765 C 80,765 75,750 88,742 C 85,730 105,725 112,738 C 125,735 132,750 122,760 C 125,768 108,772 95,765 Z" />
    <circle cx="62" cy="752" r="10" />
    <circle cx="42" cy="762" r="6" />
  </g>

  <!-- Swooshes around front tire -->
  <path d="M 675,520 A 230,230 0 0,1 650,670" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
  <path d="M 410,335 A 230,230 0 0,1 570,365" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
</svg>