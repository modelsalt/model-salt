<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Sky background -->
  <rect width="400" height="300" fill="#d9f0ff"/>
  <!-- Ground -->
  <rect y="245" width="400" height="55" fill="#8fbf6a"/>
  <line x1="0" y1="245" x2="400" y2="245" stroke="#6a9a4a" stroke-width="2"/>

  <!-- Bicycle -->
  <g stroke="#333" stroke-width="4" fill="none" stroke-linecap="round">
    <!-- Wheels -->
    <circle cx="110" cy="215" r="32" stroke-width="5"/>
    <circle cx="290" cy="215" r="32" stroke-width="5"/>
    <!-- Spokes -->
    <g stroke-width="1.5" stroke="#777">
      <line x1="110" y1="183" x2="110" y2="247"/>
      <line x1="78" y1="215" x2="142" y2="215"/>
      <line x1="87" y1="192" x2="133" y2="238"/>
      <line x1="133" y1="192" x2="87" y2="238"/>
      <line x1="290" y1="183" x2="290" y2="247"/>
      <line x1="258" y1="215" x2="322" y2="215"/>
      <line x1="267" y1="192" x2="313" y2="238"/>
      <line x1="313" y1="192" x2="267" y2="238"/>
    </g>
    <!-- Frame -->
    <path d="M110 215 L170 150 L250 150 L290 215"/>
    <path d="M170 150 L195 215 L250 150"/>
    <line x1="110" y1="215" x2="195" y2="215"/>
    <!-- Seat post & seat -->
    <line x1="170" y1="150" x2="165" y2="130"/>
    <path d="M150 128 L182 128" stroke-width="6"/>
    <!-- Handlebar stem & bars -->
    <line x1="250" y1="150" x2="262" y2="118"/>
    <path d="M248 116 Q262 110 276 116" stroke-width="5"/>
    <!-- Pedals & crank -->
    <circle cx="195" cy="215" r="7" fill="#333"/>
    <line x1="195" y1="215" x2="210" y2="232"/>
    <line x1="195" y1="215" x2="180" y2="198"/>
    <line x1="204" y1="232" x2="218" y2="232" stroke-width="5"/>
    <line x1="172" y1="198" x2="188" y2="198" stroke-width="5"/>
  </g>

  <!-- Pelican -->
  <!-- Legs -->
  <g stroke="#f0a030" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M172 140 L195 180 L210 230"/>
    <path d="M168 142 L178 170 L178 196"/>
  </g>
  <!-- Body -->
  <ellipse cx="165" cy="118" rx="50" ry="32" fill="#f5f5f0" stroke="#333" stroke-width="3"/>
  <!-- Tail feathers -->
  <path d="M118 112 L95 98 L105 118 L92 128 L118 126 Z" fill="#e8e8e0" stroke="#333" stroke-width="3" stroke-linejoin="round"/>
  <!-- Wing -->
  <path d="M150 112 Q190 95 215 120 Q190 135 150 128 Z" fill="#dcdcd4" stroke="#333" stroke-width="3" stroke-linejoin="round"/>
  <!-- Neck -->
  <path d="M200 100 Q215 70 230 62" stroke="#f5f5f0" stroke-width="18" fill="none" stroke-linecap="round"/>
  <path d="M200 100 Q215 70 230 62" stroke="#333" stroke-width="3" fill="none" stroke-linecap="round"
        stroke-dasharray="0" transform="translate(-9,0)"/>
  <path d="M200 100 Q215 70 230 62" stroke="#333" stroke-width="3" fill="none" stroke-linecap="round"
        transform="translate(9,0)"/>
  <!-- Head -->
  <circle cx="238" cy="58" r="18" fill="#f5f5f0" stroke="#333" stroke-width="3"/>
  <!-- Beak (upper) -->
  <path d="M252 54 L320 70 L254 66 Z" fill="#f7b733" stroke="#333" stroke-width="3" stroke-linejoin="round"/>
  <!-- Beak pouch (lower) -->
  <path d="M254 66 L318 72 Q290 95 256 78 Z" fill="#f09a2a" stroke="#333" stroke-width="3" stroke-linejoin="round"/>
  <!-- Eye -->
  <circle cx="244" cy="52" r="4" fill="#333"/>
  <circle cx="245.5" cy="50.5" r="1.3" fill="#fff"/>
  <!-- Little feather tuft -->
  <path d="M232 41 Q236 30 244 38" stroke="#333" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Motion lines -->
  <g stroke="#999" stroke-width="3" stroke-linecap="round">
    <line x1="40" y1="190" x2="65" y2="190"/>
    <line x1="30" y1="205" x2="60" y2="205"/>
    <line x1="42" y1="220" x2="62" y2="220"/>
  </g>
</svg>