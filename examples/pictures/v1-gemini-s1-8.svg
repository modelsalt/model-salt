<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 850" width="100%" height="100%">
  <defs>
    <!-- Cel-shading clip paths for clean interior shadows -->
    <clipPath id="body-clip">
      <path d="M 355,155 C 330,180 315,240 365,280 C 405,310 385,375 340,385 C 290,395 250,355 245,305 C 238,240 275,205 310,165 Z" />
    </clipPath>
    <clipPath id="pouch-clip">
      <path d="M 380,152 C 390,225 460,245 520,210 C 565,180 578,155 578,155 Z" />
    </clipPath>
    <clipPath id="wing-clip">
      <path d="M 305,235 C 350,235 415,255 445,270 C 460,278 450,295 430,292 C 445,302 435,315 415,308 C 425,318 410,328 395,318 C 355,300 295,295 285,265 C 280,250 290,235 305,235 Z" />
    </clipPath>
    <clipPath id="hat-clip">
      <path d="M 290,108 C 295,70 355,70 365,105 Z" />
    </clipPath>
  </defs>

  <!-- BACKGROUND: Soft Sky Circle & Clouds -->
  <circle cx="420" cy="430" r="360" fill="#E6F4F9" />
  
  <!-- Decorative Cartoon Clouds -->
  <g fill="#FFFFFF" stroke="#000000" stroke-width="4" stroke-linejoin="round">
    <path d="M 140,260 Q 140,230 170,230 Q 185,205 215,215 Q 240,215 245,240 Q 265,245 260,265 Q 260,270 245,270 L 145,270 Q 130,270 140,260 Z" />
    <path d="M 590,140 Q 590,115 615,115 Q 630,95 655,105 Q 680,110 675,135 L 595,135 Z" />
  </g>

  <!-- GROUND PLANE -->
  <g id="ground">
    <!-- Ground Shadow -->
    <ellipse cx="380" cy="760" rx="280" ry="14" fill="#C2DCE6" />
    <!-- Main Level Road Line -->
    <line x1="60" y1="760" x2="740" y2="760" stroke="#000000" stroke-width="6" stroke-linecap="round" />
    <line x1="90" y1="775" x2="220" y2="775" stroke="#000000" stroke-width="4" stroke-linecap="round" />
    <line x1="480" y1="775" x2="640" y2="775" stroke="#000000" stroke-width="4" stroke-linecap="round" />
    <!-- Little pebbles -->
    <circle cx="280" cy="772" r="3" fill="#000000" />
    <circle cx="670" cy="770" r="4" fill="#000000" />
  </g>

  <!-- FAR SIDE ELEMENTS (Behind the bicycle) -->
  <g id="back-side-elements">
    <!-- Back Wing (reaching toward far handlebar) -->
    <path d="M 325,225 C 365,225 420,245 450,260 C 465,268 455,285 435,282 C 390,275 330,270 315,245 Z" fill="#CBD5E1" stroke="#000000" stroke-width="5" stroke-linejoin="round" />
    
    <!-- Back Handlebar (Far side) -->
    <path d="M 420,255 C 435,255 445,265 455,265" fill="none" stroke="#94A3B8" stroke-width="10" stroke-linecap="round" />
    <path d="M 420,255 C 435,255 445,265 455,265" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" />
    <rect x="445" y="257" width="22" height="12" rx="6" transform="rotate(10 456 263)" fill="#78350F" stroke="#000000" stroke-width="4" />

    <!-- Back Leg (Pelican's Left Leg) -->
    <path d="M 335,365 L 405,415 L 415,465" fill="none" stroke="#000000" stroke-width="19" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 335,365 L 405,415 L 415,465" fill="none" stroke="#D97706" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Back Webbed Foot -->
    <path d="M 410,460 L 455,468 C 460,460 455,450 442,448 L 415,455 Z" fill="#D97706" stroke="#000000" stroke-width="4" stroke-linejoin="round" />

    <!-- Back Crank & Pedal -->
    <line x1="450" y1="530" x2="425" y2="465" stroke="#000000" stroke-width="14" stroke-linecap="round" />
    <line x1="450" y1="530" x2="425" y2="465" stroke="#64748B" stroke-width="6" stroke-linecap="round" />
    <rect x="405" y="458" width="40" height="14" rx="4" fill="#334155" stroke="#000000" stroke-width="4" />
  </g>

  <!-- PENNY-FARTHING BICYCLE -->
  <g id="penny-farthing">
    
    <!-- === REAR WHEEL (Radius 75, Center 145, 685) === -->
    <g id="rear-wheel">
      <!-- Spokes -->
      <g stroke="#000000" stroke-width="2.5">
        <line x1="145" y1="610" x2="145" y2="760" />
        <line x1="70" y1="685" x2="220" y2="685" />
        <line x1="92" y1="632" x2="198" y2="738" />
        <line x1="92" y1="738" x2="198" y2="632" />
        <line x1="116" y1="616" x2="174" y2="754" />
        <line x1="76" y1="656" x2="214" y2="714" />
        <line x1="76" y1="714" x2="214" y2="656" />
        <line x1="116" y1="754" x2="174" y2="616" />
      </g>
      <!-- Tire & Rim (Cel-shaded with layered strokes) -->
      <circle cx="145" cy="685" r="70" fill="none" stroke="#000000" stroke-width="20" />
      <circle cx="145" cy="685" r="70" fill="none" stroke="#334155" stroke-width="12" />
      <circle cx="145" cy="685" r="72" fill="none" stroke="#64748B" stroke-width="3" />
      <circle cx="145" cy="685" r="62" fill="none" stroke="#000000" stroke-width="4" />
      <circle cx="145" cy="685" r="62" fill="none" stroke="#D97706" stroke-width="3" />
      <!-- Hub -->
      <circle cx="145" cy="685" r="12" fill="#F59E0B" stroke="#000000" stroke-width="4" />
    </g>

    <!-- === FRONT WHEEL (Radius 230, Center 450, 530) === -->
    <g id="front-wheel">
      <!-- Spokes (Every 22.5 degrees) -->
      <g stroke="#000000" stroke-width="2.5">
        <line x1="450" y1="300" x2="450" y2="760" />
        <line x1="220" y1="530" x2="680" y2="530" />
        <line x1="287" y1="367" x2="613" y2="693" />
        <line x1="287" y1="693" x2="613" y2="367" />
        <line x1="362" y1="318" x2="538" y2="742" />
        <line x1="238" y1="442" x2="662" y2="618" />
        <line x1="238" y1="618" x2="662" y2="442" />
        <line x1="362" y1="742" x2="538" y2="318" />
      </g>
      <!-- Outer Rubber Tire -->
      <circle cx="450" cy="530" r="222" fill="none" stroke="#000000" stroke-width="24" />
      <circle cx="450" cy="530" r="222" fill="none" stroke="#334155" stroke-width="14" />
      <!-- Tire Highlight -->
      <circle cx="450" cy="530" r="225" fill="none" stroke="#64748B" stroke-width="4" />
      <!-- Brass Inner Rim -->
      <circle cx="450" cy="530" r="210" fill="none" stroke="#000000" stroke-width="10" />
      <circle cx="450" cy="530" r="210" fill="none" stroke="#F59E0B" stroke-width="5" />
    </g>

    <!-- === BICYCLE FRAME (Spine & Fork) === -->
    <g id="frame">
      <!-- Mounting Step above rear wheel -->
      <path d="M 160,625 L 135,625" stroke="#000000" stroke-width="10" stroke-linecap="round" />
      <path d="M 160,625 L 135,625" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" />

      <!-- Curved Spine (From steering head 420,275 sweeping over wheel to rear hub 145,685) -->
      <path d="M 420,275 C 330,270 250,350 205,490 C 180,570 165,635 145,685" fill="none" stroke="#000000" stroke-width="20" stroke-linecap="round" />
      <path d="M 420,275 C 330,270 250,350 205,490 C 180,570 165,635 145,685" fill="none" stroke="#DC2626" stroke-width="10" stroke-linecap="round" />
      <!-- Spine Highlight -->
      <path d="M 420,272 C 330,267 250,347 205,487 C 180,567 165,632 145,682" fill="none" stroke="#F87171" stroke-width="3" stroke-linecap="round" />

      <!-- Front Fork (From hub 450,530 up to head 416,250) -->
      <line x1="450" y1="530" x2="416" y2="250" stroke="#000000" stroke-width="20" stroke-linecap="round" />
      <line x1="450" y1="530" x2="416" y2="250" stroke="#DC2626" stroke-width="10" stroke-linecap="round" />
      <line x1="452" y1="530" x2="418" y2="250" stroke="#F87171" stroke-width="3" stroke-linecap="round" />

      <!-- Brass Head Tube Collar -->
      <rect x="407" y="262" width="22" height="16" rx="3" transform="rotate(-7 418 270)" fill="#F59E0B" stroke="#000000" stroke-width="4" />

      <!-- Saddle Post & Springs -->
      <line x1="325" y1="315" x2="325" y2="355" stroke="#000000" stroke-width="12" stroke-linecap="round" />
      <line x1="325" y1="315" x2="325" y2="355" stroke="#94A3B8" stroke-width="5" stroke-linecap="round" />
      <!-- Coil Spring -->
      <path d="M 310,360 C 300,345 350,345 340,360 C 330,375 300,365 325,375" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round" />
      <!-- Vintage Leather Saddle -->
      <path d="M 280,345 C 295,365 355,365 365,350 C 370,342 350,335 330,340 C 310,345 290,330 280,345 Z" fill="#78350F" stroke="#000000" stroke-width="5" stroke-linejoin="round" />
      <path d="M 288,346 C 300,355 345,355 358,347" fill="none" stroke="#B45309" stroke-width="3" stroke-linecap="round" />

      <!-- Center Hub (Over fork) -->
      <circle cx="450" cy="530" r="20" fill="#F59E0B" stroke="#000000" stroke-width="5" />
      <circle cx="450" cy="530" r="8" fill="#78350F" stroke="#000000" stroke-width="3" />
    </g>
  </g>

  <!-- PELICAN BODY, HEAD & TAIL -->
  <g id="pelican">
    <!-- Tail Feathers -->
    <path d="M 250,315 L 200,320 L 218,335 L 195,348 L 230,355 L 215,368 L 265,360 Z" fill="#F8FAFC" stroke="#000000" stroke-width="5" stroke-linejoin="round" />
    
    <!-- Main Body & Lower Neck -->
    <path d="M 355,155 C 330,180 315,240 365,280 C 405,310 385,375 340,385 C 290,395 250,355 245,305 C 238,240 275,205 310,165 Z" fill="#F8FAFC" stroke="#000000" stroke-width="5" stroke-linejoin="round" />
    <!-- Body Cel-Shadow -->
    <path d="M 240,290 C 260,355 325,365 375,335 C 390,380 330,400 280,385 C 240,365 230,320 240,290 Z" fill="#CBD5E1" clip-path="url(#body-clip)" />
    <path d="M 335,175 C 315,205 305,240 345,275 L 325,280 C 290,245 300,200 320,170 Z" fill="#CBD5E1" clip-path="url(#body-clip)" />

    <!-- Head -->
    <path d="M 305,170 C 290,145 295,105 335,105 C 370,105 380,130 385,148 C 375,165 330,175 305,170 Z" fill="#F8FAFC" stroke="#000000" stroke-width="5" stroke-linejoin="round" />
    <!-- Cheek Tuft -->
    <path d="M 302,155 L 285,160 L 298,168 L 288,175 L 310,172" fill="#CBD5E1" stroke="#000000" stroke-width="4" stroke-linejoin="round" />

    <!-- Giant Throat Pouch (Gular) -->
    <path d="M 380,152 C 390,225 460,245 520,210 C 565,180 578,155 578,155 Z" fill="#FBBF24" stroke="#000000" stroke-width="5" stroke-linejoin="round" />
    <!-- Pouch Cel-Shadow & Texture Striations -->
    <path d="M 380,185 C 420,225 480,225 550,175 L 530,225 L 380,235 Z" fill="#F59E0B" clip-path="url(#pouch-clip)" />
    <path d="M 405,162 C 415,195 455,210 505,185" fill="none" stroke="#D97706" stroke-width="3" stroke-linecap="round" />
    <path d="M 430,160 C 440,180 470,190 515,170" fill="none" stroke="#D97706" stroke-width="3" stroke-linecap="round" />

    <!-- Upper Beak -->
    <path d="M 380,132 C 435,128 525,130 578,142 C 588,145 592,158 582,164 C 575,168 572,158 568,156 C 510,158 435,156 380,152 Z" fill="#FEF08A" stroke="#000000" stroke-width="5" stroke-linejoin="round" />
    <!-- Beak Hook Tip -->
    <path d="M 565,140 C 578,142 588,145 582,164 C 575,168 572,158 568,156 Z" fill="#F97316" stroke="#000000" stroke-width="4" stroke-linejoin="round" />
    <!-- Nostril line -->
    <line x1="415" y1="140" x2="435" y2="141" stroke="#000000" stroke-width="3" stroke-linecap="round" />

    <!-- Expressive Cartoon Eye -->
    <circle cx="358" cy="135" r="15" fill="#FEF08A" stroke="#000000" stroke-width="4" />
    <circle cx="358" cy="135" r="11" fill="#FFFFFF" stroke="#000000" stroke-width="3" />
    <!-- Pupil looking cheerfully ahead -->
    <circle cx="362" cy="135" r="5.5" fill="#000000" />
    <circle cx="364" cy="133" r="2" fill="#FFFFFF" />
    <!-- Cheerful Eyebrow -->
    <path d="M 342,118 Q 358,110 372,120" fill="none" stroke="#000000" stroke-width="4.5" stroke-linecap="round" />

    <!-- Jaunty Vintage Bowler Hat -->
    <g id="hat" transform="rotate(-8 330 105)">
      <!-- Crown -->
      <path d="M 290,108 C 295,70 355,70 365,105 Z" fill="#334155" stroke="#000000" stroke-width="5" stroke-linejoin="round" />
      <!-- Crown Highlight -->
      <path d="M 305,95 C 310,78 335,78 345,85" fill="none" stroke="#64748B" stroke-width="4" stroke-linecap="round" clip-path="url(#hat-clip)" />
      <!-- Red Hat Ribbon -->
      <path d="M 291,100 C 315,104 340,104 364,98 L 365,106 L 290,108 Z" fill="#DC2626" stroke="#000000" stroke-width="3" stroke-linejoin="round" />
      <!-- Curved Brim -->
      <path d="M 272,108 C 305,116 350,116 382,103 C 387,101 385,95 378,97 C 345,108 305,108 275,102 C 268,100 267,106 272,108 Z" fill="#1E293B" stroke="#000000" stroke-width="4" stroke-linejoin="round" />
    </g>
  </g>

  <!-- NEAR SIDE INTERACTION: Front Leg, Pedal, Handlebar & Wing -->
  <g id="front-controls-and-limbs">
    <!-- Front Crank Arm (Down-forward position) -->
    <line x1="450" y1="530" x2="475" y2="595" stroke="#000000" stroke-width="14" stroke-linecap="round" />
    <line x1="450" y1="530" x2="475" y2="595" stroke="#CBD5E1" stroke-width="6" stroke-linecap="round" />

    <!-- Front Leg (Pelican's Right Leg reaching down to pedal) -->
    <!-- Feathery Thigh -->
    <path d="M 325,365 C 325,390 355,400 365,380 Z" fill="#F8FAFC" stroke="#000000" stroke-width="5" stroke-linejoin="round" />
    <!-- Orange Leg (Drumstick & Tarsus) -->
    <path d="M 345,385 L 385,480 L 460,590" fill="none" stroke="#000000" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 345,385 L 385,480 L 460,590" fill="none" stroke="#F97316" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Knee Joint Highlight -->
    <circle cx="385" cy="480" r="4" fill="#FDBA74" />

    <!-- Front Webbed Foot firmly on Pedal -->
    <path d="M 452,585 L 510,596 C 515,584 505,570 490,568 L 460,578 Z" fill="#F97316" stroke="#000000" stroke-width="5" stroke-linejoin="round" />
    <!-- Webbing Toe Lines -->
    <line x1="462" y1="582" x2="500" y2="580" stroke="#000000" stroke-width="3" stroke-linecap="round" />
    <line x1="460" y1="585" x2="505" y2="590" stroke="#000000" stroke-width="3" stroke-linecap="round" />

    <!-- Front Pedal (Platform under foot) -->
    <rect x="455" y="590" width="46" height="15" rx="5" fill="#475569" stroke="#000000" stroke-width="5" />
    <circle cx="478" cy="597.5" r="4" fill="#F59E0B" stroke="#000000" stroke-width="2" />

    <!-- Near-Side Handlebar Stem & Sweep -->
    <path d="M 416,250 C 412,240 398,255 415,280 C 422,290 432,292 435,292" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round" />
    <path d="M 416,250 C 412,240 398,255 415,280 C 422,290 432,292 435,292" fill="none" stroke="#E2E8F0" stroke-width="6" stroke-linecap="round" />
    
    <!-- Wooden Handlebar Grip (Angled towards viewer/right) -->
    <rect x="415" y="282" width="38" height="16" rx="8" transform="rotate(15 434 290)" fill="#9A3412" stroke="#000000" stroke-width="5" />
    <circle cx="450" cy="294" r="5" fill="#F59E0B" stroke="#000000" stroke-width="3" />

    <!-- Front Wing (Reaching forward, primary feathers curled around the grip) -->
    <g id="front-wing">
      <path d="M 305,235 C 350,235 415,255 445,270 C 460,278 450,295 430,292 C 445,302 435,315 415,308 C 425,318 410,328 395,318 C 355,300 295,295 285,265 C 280,250 290,235 305,235 Z" fill="#F8FAFC" stroke="#000000" stroke-width="5" stroke-linejoin="round" />
      <!-- Wing Cel-Shading -->
      <path d="M 285,265 C 305,290 365,295 415,315 L 395,328 L 280,285 Z" fill="#CBD5E1" clip-path="url(#wing-clip)" />
      <!-- Feather Details & Grip Curls -->
      <path d="M 325,258 C 345,262 365,268 380,275" fill="none" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" />
      <path d="M 315,272 C 335,276 355,282 370,288" fill="none" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" />
      <!-- Wingtip "Fingers" Curled Under the Handlebar Grip -->
      <path d="M 422,298 C 428,308 442,308 445,296" fill="#E2E8F0" stroke="#000000" stroke-width="4.5" stroke-linecap="round" />
      <path d="M 410,302 C 416,312 428,312 432,300" fill="#E2E8F0" stroke="#000000" stroke-width="4.5" stroke-linecap="round" />
    </g>
  </g>

  <!-- GENTLE CRUISING BREEZE LINES -->
  <g stroke="#94A3B8" stroke-width="3" stroke-linecap="round">
    <line x1="110" y1="340" x2="155" y2="340" />
    <line x1="130" y1="355" x2="160" y2="355" />
    <line x1="180" y1="130" x2="230" y2="130" />
  </g>
</svg>