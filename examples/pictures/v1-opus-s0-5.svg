<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <g stroke="#2b2b2b" stroke-linecap="round" stroke-linejoin="round">

    <!-- Wheels -->
    <g fill="none">
      <circle cx="110" cy="220" r="55" stroke-width="8"/>
      <circle cx="110" cy="220" r="55" stroke="#4a4a4a" stroke-width="4"/>
      <circle cx="290" cy="220" r="55" stroke-width="8"/>
      <circle cx="290" cy="220" r="55" stroke="#4a4a4a" stroke-width="4"/>
      <!-- Spokes -->
      <g stroke="#9a9a9a" stroke-width="1.5">
        <path d="M110 167 V273 M57 220 H163 M73 183 L147 257 M147 183 L73 257"/>
        <path d="M290 167 V273 M237 220 H343 M253 183 L327 257 M327 183 L253 257"/>
      </g>
    </g>
    <circle cx="110" cy="220" r="5" fill="#c9c9c9" stroke-width="2"/>
    <circle cx="290" cy="220" r="5" fill="#c9c9c9" stroke-width="2"/>

    <!-- Frame (outline + colour) -->
    <g fill="none" stroke-width="9">
      <path d="M110 220 L185 225 L168 150 Z M168 150 L270 140 M185 225 L276 162 L290 220"/>
    </g>
    <g fill="none" stroke="#e63946" stroke-width="5">
      <path d="M110 220 L185 225 L168 150 Z M168 150 L270 140 M185 225 L276 162 L290 220"/>
    </g>
    <!-- Head tube + stem + handlebar -->
    <path d="M276 162 L268 128 L258 122" fill="none" stroke-width="5"/>
    <path d="M252 120 L266 124" fill="none" stroke="#2b2b2b" stroke-width="8"/>
    <!-- Seat post + saddle -->
    <path d="M168 150 L165 140" fill="none" stroke-width="5"/>
    <path d="M146 139 Q165 132 186 139 Q165 145 146 139 Z" fill="#3a3a3a" stroke-width="2"/>

    <!-- Far leg (behind), crank -->
    <path d="M178 128 L160 170 L165 202" fill="none" stroke="#2b2b2b" stroke-width="9"/>
    <path d="M178 128 L160 170 L165 202" fill="none" stroke="#d9822b" stroke-width="5"/>
    <path d="M165 202 L185 225 L205 248" fill="none" stroke-width="5"/>
    <circle cx="185" cy="225" r="9" fill="#c9c9c9" stroke-width="2.5"/>
    <rect x="157" y="198" width="16" height="6" rx="2" fill="#555" stroke-width="1.5"/>

    <!-- Tail -->
    <path d="M140 100 L112 92 L118 104 L106 110 L138 118 Z" fill="#e8e8e8" stroke-width="3"/>

    <!-- Body -->
    <ellipse cx="175" cy="112" rx="44" ry="31" fill="#ffffff" stroke-width="3.5" transform="rotate(-12 175 112)"/>

    <!-- Neck (outline + fill) -->
    <path d="M200 100 C220 92 222 80 232 64" fill="none" stroke="#2b2b2b" stroke-width="24"/>
    <path d="M200 100 C220 92 222 80 232 64" fill="none" stroke="#ffffff" stroke-width="17"/>

    <!-- Head -->
    <circle cx="236" cy="58" r="18" fill="#ffffff" stroke-width="3.5"/>
    <!-- Crest -->
    <path d="M226 42 Q222 32 232 36 Q234 30 240 38" fill="#f4d35e" stroke-width="2.5"/>

    <!-- Pouch -->
    <path d="M248 66 Q270 104 318 86 L334 80 Q292 76 250 64 Z" fill="#f4a259" stroke-width="3"/>
    <!-- Upper beak -->
    <path d="M249 52 Q300 60 338 78 Q330 84 320 82 Q290 74 250 66 Z" fill="#f7c548" stroke-width="3"/>
    <path d="M334 78 L340 86" fill="none" stroke-width="3"/>

    <!-- Eye -->
    <circle cx="240" cy="54" r="5" fill="#ffffff" stroke-width="2"/>
    <circle cx="241.5" cy="54" r="2.5" fill="#2b2b2b" stroke="none"/>

    <!-- Wing reaching to handlebar -->
    <path d="M150 104 Q185 86 215 104 Q238 114 258 120 Q262 126 254 128 Q228 126 210 124 Q180 128 156 120 Z"
          fill="#d6d6d6" stroke-width="3"/>
    <path d="M170 110 Q190 104 208 112 M178 118 Q196 114 214 120" fill="none" stroke="#9a9a9a" stroke-width="2"/>
    <!-- Wingtip feathers wrapped on grip -->
    <path d="M252 119 L264 118 L262 124 L266 128 L254 129 Z" fill="#3a3a3a" stroke-width="2"/>

    <!-- Near leg -->
    <path d="M188 130 L216 180 L205 248" fill="none" stroke="#2b2b2b" stroke-width="10"/>
    <path d="M188 130 L216 180 L205 248" fill="none" stroke="#f4a259" stroke-width="6"/>
    <!-- Near pedal + webbed foot -->
    <rect x="196" y="245" width="18" height="6" rx="2" fill="#555" stroke-width="1.5"/>
    <path d="M200 246 L226 240 L220 246 L230 248 L203 252 Z" fill="#f4a259" stroke-width="2.5"/>
  </g>
</svg>