<svg width="660" height="660" viewBox="70 125 660 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Pelican riding a bicycle</title>
  <desc id="desc">A geometric side-profile illustration of a white pelican standing on the pedals of a coral diamond-frame bicycle, body lifted off the saddle, one wingtip on the handlebar grips and the other wing stretched back for balance.</desc>

  <rect x="0" y="0" width="800" height="800" fill="#e9eff3"/>

  <g transform="translate(0 18)">
    <!-- ground -->
    <ellipse cx="230" cy="742" rx="100" ry="9" fill="#243038" opacity="0.08"/>
    <ellipse cx="570" cy="742" rx="100" ry="9" fill="#243038" opacity="0.08"/>
    <line x1="64" y1="742" x2="736" y2="742" stroke="#243038" stroke-width="6" stroke-linecap="round" opacity="0.15"/>

    <!-- wheels: repeated circles + straight spokes -->
    <g fill="none" stroke="#243038" stroke-width="20">
      <circle cx="230" cy="600" r="130"/>
      <circle cx="570" cy="600" r="130"/>
    </g>
    <g fill="none" stroke="#9aa7ad" stroke-width="5">
      <circle cx="230" cy="600" r="112"/>
      <circle cx="570" cy="600" r="112"/>
    </g>
    <g stroke="#243038" stroke-width="4" opacity="0.4">
      <line x1="118" y1="600" x2="342" y2="600"/>
      <line x1="230" y1="488" x2="230" y2="712"/>
      <line x1="151" y1="521" x2="309" y2="679"/>
      <line x1="309" y1="521" x2="151" y2="679"/>
      <line x1="458" y1="600" x2="682" y2="600"/>
      <line x1="570" y1="488" x2="570" y2="712"/>
      <line x1="491" y1="521" x2="649" y2="679"/>
      <line x1="649" y1="521" x2="491" y2="679"/>
    </g>

    <!-- chain -->
    <g stroke="#243038" stroke-width="4" stroke-linecap="round" opacity="0.7">
      <line x1="381" y1="580" x2="232" y2="593"/>
      <line x1="381" y1="620" x2="232" y2="607"/>
    </g>

    <!-- diamond frame: aligned straight tubes -->
    <g fill="none" stroke-linecap="round">
      <g stroke="#b8412e" stroke-width="12">
        <line x1="380" y1="600" x2="230" y2="600"/>
        <line x1="332" y1="444" x2="230" y2="600"/>
        <line x1="551" y1="484" x2="570" y2="600"/>
      </g>
      <g stroke="#e0533d" stroke-width="14">
        <line x1="380" y1="600" x2="330" y2="430"/>
        <line x1="380" y1="600" x2="550" y2="484"/>
        <line x1="330" y1="430" x2="520" y2="404"/>
        <line x1="518" y1="402" x2="553" y2="482"/>
      </g>
    </g>

    <!-- hubs -->
    <circle cx="230" cy="600" r="11" fill="#243038"/>
    <circle cx="570" cy="600" r="11" fill="#243038"/>
    <circle cx="230" cy="600" r="4" fill="#c8d0d5"/>
    <circle cx="570" cy="600" r="4" fill="#c8d0d5"/>

    <!-- saddle -->
    <line x1="330" y1="432" x2="323" y2="408" stroke="#243038" stroke-width="9" stroke-linecap="round"/>
    <rect x="292" y="396" width="62" height="14" rx="7" fill="#243038"/>

    <!-- handlebar -->
    <line x1="520" y1="402" x2="512" y2="350" stroke="#243038" stroke-width="10" stroke-linecap="round"/>
    <line x1="480" y1="350" x2="548" y2="350" stroke="#243038" stroke-width="9" stroke-linecap="round"/>
    <circle cx="482" cy="350" r="9" fill="#243038"/>
    <circle cx="546" cy="350" r="9" fill="#243038"/>

    <!-- crankset + pedals -->
    <circle cx="380" cy="600" r="20" fill="none" stroke="#243038" stroke-width="6"/>
    <circle cx="380" cy="600" r="6" fill="#243038"/>
    <line x1="380" y1="600" x2="348" y2="553" stroke="#243038" stroke-width="10" stroke-linecap="round"/>
    <line x1="380" y1="600" x2="412" y2="647" stroke="#243038" stroke-width="10" stroke-linecap="round"/>
    <rect x="334" y="556" width="28" height="9" rx="4.5" fill="#243038"/>
    <rect x="398" y="650" width="30" height="9" rx="4.5" fill="#243038"/>

    <!-- pelican: far wing out for balance -->
    <line x1="330" y1="300" x2="185" y2="185" stroke="#dfe5e8" stroke-width="38" stroke-linecap="round"/>
    <circle cx="257" cy="242" r="13" fill="#cdd5d9"/>

    <!-- legs standing on pedals -->
    <line x1="368" y1="372" x2="412" y2="641" stroke="#f0a03c" stroke-width="13" stroke-linecap="round"/>
    <line x1="334" y1="374" x2="348" y2="547" stroke="#f0a03c" stroke-width="13" stroke-linecap="round"/>
    <circle cx="412" cy="641" r="12" fill="#f0a03c"/>
    <circle cx="348" cy="547" r="11" fill="#f0a03c"/>

    <!-- tail + body lifted off the saddle -->
    <circle cx="258" cy="338" r="18" fill="#ffffff"/>
    <ellipse cx="340" cy="320" rx="78" ry="62" fill="#ffffff" transform="rotate(10 340 320)"/>
    <ellipse cx="350" cy="346" rx="50" ry="30" fill="#eaeef0" transform="rotate(10 350 346)"/>

    <!-- near wing reaching to the grips -->
    <line x1="395" y1="305" x2="528" y2="352" stroke="#ffffff" stroke-width="44" stroke-linecap="round"/>
    <line x1="420" y1="316" x2="512" y2="348" stroke="#eaeef0" stroke-width="18" stroke-linecap="round"/>
    <circle cx="538" cy="351" r="14" fill="#ffffff"/>

    <!-- neck + head -->
    <line x1="362" y1="288" x2="440" y2="184" stroke="#ffffff" stroke-width="36" stroke-linecap="round"/>
    <circle cx="455" cy="165" r="38" fill="#ffffff"/>

    <!-- beak + pouch -->
    <polygon points="478,168 648,184 548,250" fill="#f9c56e" stroke="#f9c56e" stroke-width="8" stroke-linejoin="round"/>
    <polygon points="470,146 654,180 476,174" fill="#f6a53f" stroke="#f6a53f" stroke-width="6" stroke-linejoin="round"/>
    <circle cx="654" cy="181" r="6" fill="#f6a53f"/>

    <!-- eye -->
    <circle cx="460" cy="154" r="6" fill="#243038"/>
    <circle cx="462" cy="152" r="2" fill="#ffffff"/>
  </g>
</svg>