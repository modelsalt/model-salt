<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Sky background: deep blue top to lighter horizon -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E5BFF"/>
      <stop offset="1" stop-color="#5FB3FF"/>
    </linearGradient>
    <!-- Sun: warm yellow-orange -->
    <radialGradient id="sun" cx="0.4" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#FFF4B0"/>
      <stop offset="0.6" stop-color="#FFC63A"/>
      <stop offset="1" stop-color="#FF9A1F"/>
    </radialGradient>
    <!-- Cloud: white with soft underside -->
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCE9F7"/>
    </linearGradient>
    <!-- Soft shadow under cloud -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
      <feOffset dy="24"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Subtle glow around sun -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <!-- Square background, hard corners -->
  <rect width="1024" height="1024" fill="url(#sky)"/>

  <!-- Faint horizon highlight band for depth -->
  <rect y="760" width="1024" height="264" fill="#FFFFFF" opacity="0.06"/>

  <!-- Sun glow -->
  <circle cx="608" cy="392" r="190" fill="#FFD56A" opacity="0.45" filter="url(#glow)"/>

  <!-- Sun rays (8, rounded caps) -->
  <g stroke="#FFD95A" stroke-width="40" stroke-linecap="round" opacity="0.95">
    <line x1="608" y1="118" x2="608" y2="190"/>
    <line x1="608" y1="594" x2="608" y2="666"/>
    <line x1="334" y1="392" x2="406" y2="392"/>
    <line x1="810" y1="392" x2="882" y2="392"/>
    <line x1="414" y1="198" x2="465" y2="249"/>
    <line x1="751" y1="535" x2="802" y2="586"/>
    <line x1="414" y1="586" x2="465" y2="535"/>
    <line x1="751" y1="249" x2="802" y2="198"/>
  </g>

  <!-- Sun disc -->
  <circle cx="608" cy="392" r="150" fill="url(#sun)"/>

  <!-- Cloud (overlapping circles + base) -->
  <g filter="url(#shadow)">
    <path fill="url(#cloud)" d="
      M 236 720
      C 150 720 112 650 140 592
      C 160 540 220 522 262 540
      C 272 460 340 410 416 420
      C 470 426 512 460 530 508
      C 560 490 598 488 630 504
      C 690 480 760 512 772 580
      C 836 584 870 650 846 700
      C 832 730 806 744 776 748
      L 236 748 Z"/>
    <!-- Top highlight to add volume -->
    <path fill="#FFFFFF" opacity="0.7" d="
      M 280 560 C 300 480 370 440 430 452
      C 400 470 370 500 356 540
      C 330 540 300 548 280 560 Z"/>
  </g>
</svg>