<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <defs>
    <!-- Strictly two contrasting colors: Deep Navy (#0F203C) and Warm Cream (#F5E6D3) -->
    <style>
      .bg { fill: #F5E6D3; }
      .fg-fill { fill: #0F203C; }
      .bg-fill { fill: #F5E6D3; }
      .fg-stroke { stroke: #0F203C; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .bg-stroke { stroke: #F5E6D3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .pelican-part { fill: #F5E6D3; stroke: #0F203C; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
      .pelican-dark { fill: #0F203C; stroke: #0F203C; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
    </style>

    <!-- Reusable Bicycle Wheel -->
    <g id="wheel">
      <!-- Spokes -->
      <g class="fg-stroke" stroke-width="3">
        <line x1="-88" y1="0" x2="88" y2="0" />
        <line x1="0" y1="-88" x2="0" y2="88" />
        <line x1="-62" y1="-62" x2="62" y2="62" />
        <line x1="-62" y1="62" x2="62" y2="-62" />
        <line x1="-81" y1="-34" x2="81" y2="34" />
        <line x1="-34" y1="-81" x2="34" y2="81" />
        <line x1="-81" y1="34" x2="81" y2="-34" />
        <line x1="-34" y1="81" x2="34" y2="-81" />
      </g>
      <!-- Inner Rim -->
      <circle cx="0" cy="0" r="78" class="fg-stroke" stroke-width="3" />
      <!-- Outer Tire -->
      <circle cx="0" cy="0" r="86" class="fg-stroke" stroke-width="14" />
      <!-- Hub -->
      <circle cx="0" cy="0" r="12" class="fg-fill" />
      <circle cx="0" cy="0" r="5" class="bg-fill" />
    </g>

    <!-- Reusable Bicycle Saddle -->
    <g id="saddle">
      <path d="M -38 -6 C -25 -12, 15 -4, 32 -3 C 42 -2, 42 5, 25 6 C 5 7, -10 12, -32 8 C -42 6, -44 -3, -38 -6 Z" class="fg-fill" />
    </g>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" />

  <!-- Flat Horizontal Ground Plane (No motion lines) -->
  <line x1="40" y1="423" x2="860" y2="423" class="fg-stroke" stroke-width="6" />

  <!-- ==================== FAR SIDE PELICAN PARTS (Behind Bike) ==================== -->
  <g id="far-pelican-parts">
    <!-- Far Leg (Extending forward to the handlebars) -->
    <path d="M 455 215 L 555 188 L 598 168" class="fg-stroke" stroke-width="14" />
    <!-- Far Webbed Foot (Gripping handlebars) -->
    <path d="M 598 168 C 614 155, 624 166, 616 178 C 610 186, 594 180, 598 168 Z" class="fg-fill" />

    <!-- Far Wing (Reaching down to the top/back pedal at 438, 305) -->
    <path d="M 480 188 C 445 205, 422 250, 428 308 C 446 312, 458 295, 455 280 C 468 282, 472 265, 466 255 C 476 250, 485 215, 480 188 Z" class="pelican-dark" />
    <!-- Far Pedal (Underneath far wing tip) -->
    <rect x="422" y="301" width="32" height="9" rx="4" class="fg-fill" />
  </g>

  <!-- ==================== TANDEM BICYCLE ==================== -->
  <g id="tandem-bicycle">
    <!-- Rear Wheel -->
    <use href="#wheel" x="150" y="330" />
    <!-- Front Wheel -->
    <use href="#wheel" x="650" y="330" />

    <!-- Rear Fender -->
    <path d="M 50 320 A 100 100 0 0 1 245 295" class="fg-stroke" stroke-width="6" />
    <!-- Front Fender -->
    <path d="M 555 295 A 100 100 0 0 1 748 310" class="fg-stroke" stroke-width="6" />

    <!-- Chains & Sprockets (Drawn behind the main frame tubes) -->
    <g id="drivetrain">
      <!-- Timing Chain (Front crank to Rear crank) -->
      <line x1="280" y1="312" x2="460" y2="312" class="fg-stroke" stroke-width="3.5" />
      <line x1="280" y1="348" x2="460" y2="348" class="fg-stroke" stroke-width="3.5" />
      <!-- Drive Chain (Rear crank to Rear wheel hub) -->
      <line x1="150" y1="321" x2="280" y2="306" class="fg-stroke" stroke-width="3.5" />
      <line x1="150" y1="339" x2="280" y2="354" class="fg-stroke" stroke-width="3.5" />
    </g>

    <!-- Bicycle Frame Tubes -->
    <g class="fg-stroke" stroke-width="10">
      <!-- Rear Seat Tube -->
      <line x1="280" y1="330" x2="235" y2="180" />
      <!-- Front Seat Tube -->
      <line x1="460" y1="330" x2="415" y2="180" />
      <!-- Rear Top Tube -->
      <line x1="241" y1="200" x2="421" y2="200" />
      <!-- Front Top Tube -->
      <line x1="421" y1="200" x2="585" y2="200" />
      <!-- Boomerang / Bottom Tube -->
      <line x1="280" y1="330" x2="460" y2="330" />
      <!-- Main Down Tube -->
      <line x1="460" y1="330" x2="594" y2="230" />
      <!-- Stoker (Rear) Diagonal Tube -->
      <line x1="421" y1="200" x2="280" y2="330" />
      <!-- Chainstays -->
      <line x1="150" y1="330" x2="280" y2="330" />
      <!-- Seatstays -->
      <line x1="150" y1="330" x2="241" y2="200" />
      <!-- Head Tube -->
      <line x1="581" y1="188" x2="600" y2="250" stroke-width="13" />
      <!-- Front Fork -->
      <path d="M 594 230 L 632 320 Q 640 330 650 330" />
    </g>

    <!-- Seatposts & Handlebars -->
    <g class="fg-stroke" stroke-width="7">
      <!-- Rear Seatpost -->
      <line x1="235" y1="180" x2="226" y2="150" />
      <!-- Front Seatpost -->
      <line x1="415" y1="180" x2="406" y2="150" />
      <!-- Rear Stoker Handlebar Stem (Attached to front seat tube) -->
      <path d="M 412 170 L 380 155 C 370 150, 355 150, 345 158" />
      <!-- Front Captain Handlebar Stem & Swept Bars -->
      <path d="M 581 188 L 570 148 L 598 143 C 620 140, 628 168, 600 176" />
    </g>

    <!-- Rear Handlebar Grip -->
    <circle cx="345" cy="158" r="5" class="fg-fill" />

    <!-- Empty Rear Saddle -->
    <use href="#saddle" x="226" y="150" />
    <!-- Front Saddle (Pelican sits here) -->
    <use href="#saddle" x="406" y="150" />

    <!-- Cranksets -->
    <g id="cranks">
      <!-- Rear Crankset (Stoker) -->
      <circle cx="280" cy="330" r="24" class="pelican-part" stroke-width="6" />
      <circle cx="280" cy="330" r="14" class="fg-fill" />
      <!-- Rear Crank Arms & Empty Pedals -->
      <line x1="258" y1="305" x2="302" y2="355" class="fg-stroke" stroke-width="6" />
      <rect x="244" y="301" width="28" height="8" rx="3" class="fg-fill" />
      <rect x="288" y="351" width="28" height="8" rx="3" class="fg-fill" />

      <!-- Front Crankset (Captain) -->
      <circle cx="460" cy="330" r="24" class="pelican-part" stroke-width="6" />
      <circle cx="460" cy="330" r="10" class="fg-fill" />
      <!-- Far Crank Arm (Going up-left to 438, 305) -->
      <line x1="460" y1="330" x2="438" y2="305" class="fg-stroke" stroke-width="7" />
    </g>
  </g>

  <!-- ==================== PELICAN (Main Body & Near Limbs) ==================== -->
  <g id="pelican">

    <!-- Near Leg (Extending from lower torso to front handlebars) -->
    <path d="M 445 220 L 545 198 L 595 176" class="bg-stroke" stroke-width="18" />
    <path d="M 445 220 L 545 198 L 595 176" class="fg-stroke" stroke-width="10" />
    <!-- Pelvis/Knee Joint Cover -->
    <circle cx="545" cy="198" r="6" class="fg-fill" />

    <!-- Torso, Tail, Tucked Neck, and Head -->
    <path d="M 380 152 
             C 355 152, 338 135, 330 120 
             L 352 124 
             L 336 106 
             L 365 116 
             C 395 124, 425 110, 465 112 
             C 510 115, 535 138, 540 158 
             C 550 142, 560 112, 592 112 
             C 618 112, 632 128, 635 144 
             L 632 162 
             C 605 175, 565 215, 515 235 
             C 460 250, 415 235, 400 185 
             C 394 165, 390 152, 380 152 Z" class="pelican-part" />

    <!-- Tuft of Feathers on Back of Head -->
    <path d="M 578 114 L 562 98 L 574 106 L 568 92 L 586 112" class="pelican-part" />

    <!-- Deep Fold Line Where Neck Tucks Into Chest -->
    <path d="M 540 158 C 538 175, 552 188, 570 186" class="fg-stroke" stroke-width="6" />

    <!-- Giant Throat Pouch (Hanging low, jutting past the front of the bike) -->
    <path d="M 632 152 
             C 685 235, 785 215, 848 150 
             L 632 148 Z" class="pelican-dark" />
    <!-- Subtle Interior Line on Pouch for Depth -->
    <path d="M 648 162 C 695 210, 765 198, 822 154" class="bg-stroke" stroke-width="3.5" />

    <!-- Long Upper Beak (Jutting far forward past the front wheel's vertical plane at X=743) -->
    <path d="M 632 130 
             L 845 135 
             C 856 135, 862 144, 855 154 
             C 850 160, 844 156, 842 150 
             L 626 150 Z" class="pelican-part" />

    <!-- Nostril & Beak Ridge -->
    <line x1="655" y1="138" x2="835" y2="142" class="fg-stroke" stroke-width="3" />
    <line x1="655" y1="138" x2="668" y2="138" class="fg-stroke" stroke-width="5" />

    <!-- Pelican Eye (Focused forward) -->
    <circle cx="610" cy="132" r="8" class="fg-fill" />
    <circle cx="612" cy="130" r="2.5" class="bg-fill" />
    <!-- Determined Eyebrow Ridge -->
    <path d="M 598 122 L 620 127" class="fg-stroke" stroke-width="5" />

    <!-- Near Webbed Foot (Wrapping around the front handlebar grip at 600, 176) -->
    <path d="M 588 172 
             C 605 155, 632 162, 625 182 
             C 620 194, 595 192, 588 178 Z" class="pelican-part" stroke-width="6" />
    <!-- Webbed Foot Toe Lines -->
    <line x1="594" y1="174" x2="618" y2="170" class="fg-stroke" stroke-width="4" />
    <line x1="594" y1="178" x2="619" y2="180" class="fg-stroke" stroke-width="4" />
    <!-- Handlebar Bar-End Peeking Through Grip -->
    <circle cx="604" cy="176" r="5" class="fg-fill" />

    <!-- Near Crank Arm (Going down-right to 482, 355 - drawn over frame, under wing tip) -->
    <line x1="460" y1="330" x2="482" y2="355" class="fg-stroke" stroke-width="7" />

    <!-- Near Wing (Stretching down from shoulder to operate the bottom/front pedal) -->
    <path d="M 465 162 
             C 425 168, 412 230, 442 295 
             C 455 325, 465 348, 468 362 
             C 488 368, 502 350, 495 332 
             C 512 334, 516 312, 504 298 
             C 520 296, 522 272, 508 260 
             C 518 220, 500 158, 465 162 Z" class="pelican-part" />

    <!-- Wing Feather Details (Secondary Coverts & Primaries) -->
    <path d="M 434 218 C 455 228, 485 225, 508 208" class="fg-stroke" stroke-width="5" />
    <path d="M 468 362 C 464 330, 468 300, 480 275" class="fg-stroke" stroke-width="5" />
    <path d="M 495 332 C 488 308, 488 285, 496 265" class="fg-stroke" stroke-width="5" />
    <path d="M 504 298 C 498 280, 498 265, 504 250" class="fg-stroke" stroke-width="5" />

    <!-- Near Pedal (Held firmly under the primary wing feathers at 482, 355) -->
    <rect x="464" y="352" width="36" height="10" rx="4" class="fg-fill" />
    <circle cx="482" cy="357" r="2.5" class="bg-fill" />

  </g>
</svg>