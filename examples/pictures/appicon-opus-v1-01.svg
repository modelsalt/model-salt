<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Vertical background gradient: night sky down to a horizon, then a dark "ground" -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"     stop-color="#030820"/>
      <stop offset="0.45"  stop-color="#0b1a4a"/>
      <stop offset="0.77"  stop-color="#1f3a7a"/>
      <stop offset="0.781" stop-color="#0a1538"/>
      <stop offset="1"     stop-color="#040a1f"/>
    </linearGradient>

    <!-- Gold glow on the horizon -->
    <radialGradient id="glow" cx="512" cy="800" r="520" gradientUnits="userSpaceOnUse"
                    gradientTransform="translate(0,800) scale(1,0.32) translate(0,-800)">
      <stop offset="0"   stop-color="#f6c95c" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#d79a2c" stop-opacity="0.18"/>
      <stop offset="1"   stop-color="#d79a2c" stop-opacity="0"/>
    </radialGradient>

    <!-- Horizon line, fading out at both edges -->
    <linearGradient id="horizonLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#f6d27a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffe6a3" stop-opacity="1"/>
      <stop offset="1"   stop-color="#f6d27a" stop-opacity="0"/>
    </linearGradient>

    <!-- Gold for the body of each tube -->
    <linearGradient id="gold" x1="140" y1="0" x2="940" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#c8871c"/>
      <stop offset="0.35" stop-color="#f3c454"/>
      <stop offset="0.7"  stop-color="#e2a636"/>
      <stop offset="1"    stop-color="#b8761a"/>
    </linearGradient>

    <!-- Soft drop shadow under the tubes -->
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <!-- Fade mask for the reflection below the horizon -->
    <linearGradient id="fade" x1="0" y1="800" x2="0" y2="1010" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="reflectMask" maskUnits="userSpaceOnUse" x="0" y="800" width="1024" height="224">
      <rect x="0" y="800" width="1024" height="224" fill="url(#fade)"/>
    </mask>

    <!-- The wind swirl: three strokes, the upper two ending in curls -->
    <path id="windA" d="M300 560 H600 C700 560 750 510 730 460 C712 416 650 416 640 458 C632 490 660 508 684 498"/>
    <path id="windB" d="M160 650 H820 C900 650 940 600 920 560 C904 528 860 530 856 562"/>
    <path id="windC" d="M300 738 H560"/>

    <!-- One glossy 3D tube built from stacked strokes (base, body, highlight, specular) -->
    <g id="swirl" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- dark base / rim -->
      <use href="#windA" stroke="#6e430b" stroke-width="44"/>
      <use href="#windB" stroke="#6e430b" stroke-width="48"/>
      <use href="#windC" stroke="#6e430b" stroke-width="40"/>
      <!-- gold body -->
      <g transform="translate(0,-3)">
        <use href="#windA" stroke="url(#gold)" stroke-width="34"/>
        <use href="#windB" stroke="url(#gold)" stroke-width="38"/>
        <use href="#windC" stroke="url(#gold)" stroke-width="30"/>
      </g>
      <!-- glossy highlight -->
      <g transform="translate(0,-10)" stroke="#fff2c4" opacity="0.85">
        <use href="#windA" stroke-width="10"/>
        <use href="#windB" stroke-width="11"/>
        <use href="#windC" stroke-width="9"/>
      </g>
      <!-- specular glints -->
      <g stroke="#ffffff" stroke-width="5" opacity="0.9">
        <path d="M340 547 H430"/>
        <path d="M210 636 H330"/>
        <path d="M335 726 H385"/>
      </g>
    </g>
  </defs>

  <!-- Square background, no corner radius -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Faint stars -->
  <g fill="#f6dc96">
    <circle cx="180" cy="160" r="3"   opacity="0.7"/>
    <circle cx="820" cy="120" r="2.5" opacity="0.6"/>
    <circle cx="640" cy="230" r="2"   opacity="0.5"/>
    <circle cx="300" cy="300" r="2"   opacity="0.45"/>
    <circle cx="880" cy="330" r="3"   opacity="0.55"/>
    <circle cx="110" cy="420" r="2"   opacity="0.4"/>
  </g>

  <!-- Horizon glow and line -->
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <rect x="0" y="798" width="1024" height="4" fill="url(#horizonLine)"/>

  <!-- Reflection of the swirl on the "ground" -->
  <g mask="url(#reflectMask)">
    <g transform="translate(0,1600) scale(1,-1)">
      <use href="#swirl"/>
    </g>
  </g>

  <!-- Drop shadow cast down toward the horizon -->
  <g transform="translate(0,16)" filter="url(#soft)" opacity="0.5" fill="none"
     stroke="#000" stroke-linecap="round" stroke-linejoin="round">
    <use href="#windA" stroke-width="44"/>
    <use href="#windB" stroke-width="48"/>
    <use href="#windC" stroke-width="40"/>
  </g>

  <!-- The glossy gold wind swirl -->
  <use href="#swirl"/>
</svg>