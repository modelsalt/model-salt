<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Weather App Icon</title>

  <defs>
    <!-- Sky background -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1668B4"/>
      <stop offset="0.5" stop-color="#4AA3DF"/>
      <stop offset="1" stop-color="#A9DCF5"/>
    </linearGradient>

    <!-- Sun body -->
    <radialGradient id="sunGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE9A8"/>
      <stop offset="0.6" stop-color="#FFD54F"/>
      <stop offset="1" stop-color="#FFB300"/>
    </radialGradient>

    <!-- Sun glow halo -->
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#FFD54F" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FFD54F" stop-opacity="0"/>
    </radialGradient>

    <!-- Cloud -->
    <linearGradient id="cloudGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCEBF7"/>
    </linearGradient>
  </defs>

  <!-- Square background: no rounded corners -->
  <rect width="512" height="512" fill="url(#sky)"/>

  <!-- Faint background clouds for depth -->
  <g fill="#FFFFFF" opacity="0.35">
    <rect x="382" y="120" width="94" height="22" rx="11"/>
    <circle cx="400" cy="120" r="20"/>
    <circle cx="430" cy="110" r="26"/>
    <circle cx="458" cy="122" r="18"/>
  </g>
  <g fill="#FFFFFF" opacity="0.25">
    <rect x="56" y="418" width="80" height="18" rx="9"/>
    <circle cx="70" cy="420" r="16"/>
    <circle cx="95" cy="412" r="20"/>
    <circle cx="120" cy="420" r="14"/>
  </g>

  <!-- Sun glow -->
  <circle cx="230" cy="215" r="120" fill="url(#glow)"/>

  <!-- Sun rays -->
  <g stroke="#FFC93C" stroke-width="16" stroke-linecap="round">
    <line x1="230" y1="127" x2="230" y2="95"/>
    <line x1="230" y1="127" x2="230" y2="95" transform="rotate(30 230 215)"/>
    <line x1="230" y1="127" x2="230" y2="95" transform="rotate(60 230 215)"/>
    <line x1="230" y1="127" x2="230" y2="95" transform="rotate(90 230 215)"/>
    <line x1="230" y1="127" x2="230" y2="95" transform="rotate(120 230 215)"/>
    <line x1="230" y1="127" x2="230" y2="95" transform="rotate(150 230 215)"/>
    <line x1="230" y1="127" x2="230" y2="95" transform="rotate(180 230 215)"/>
    <line x1="230" y1="127" x2="230" y2="95" transform="rotate(210 230 215)"/>
    <line x1="230" y1="127" x2="230" y2="95" transform="rotate(240 230 215)"/>
    <line x1="230" y1="127" x2="230" y2="95" transform="rotate(270 230 215)"/>
    <line x1="230" y1="127" x2="230" y2="95" transform="rotate(300 230 215)"/>
    <line x1="230" y1="127" x2="230" y2="95" transform="rotate(330 230 215)"/>
  </g>

  <!-- Sun -->
  <circle cx="230" cy="215" r="70" fill="url(#sunGrad)"/>

  <!-- Main cloud -->
  <g fill="url(#cloudGrad)">
    <rect x="192" y="348" width="232" height="56" rx="28"/>
    <circle cx="246" cy="342" r="48"/>
    <circle cx="308" cy="312" r="64"/>
    <circle cx="374" cy="344" r="46"/>
  </g>
</svg>