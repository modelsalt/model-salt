<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Sky background -->
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E3A8A"/>
      <stop offset="0.55" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Sun body -->
    <linearGradient id="sun" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="0.5" stop-color="#FACC15"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Sun glow -->
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FDE047" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#FDE047" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FDE047" stop-opacity="0"/>
    </radialGradient>

    <!-- Cloud body -->
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DBEAFE"/>
    </linearGradient>

    <!-- Soft shadow beneath the cloud -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#0B1E5B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Square background, no rounded corners -->
  <rect x="0" y="0" width="1024" height="1024" fill="url(#sky)"/>

  <g transform="translate(-8, 40)">
    <!-- Sun glow + sun -->
    <circle cx="650" cy="350" r="320" fill="url(#glow)"/>
    <circle cx="650" cy="350" r="170" fill="url(#sun)"/>
    <!-- Subtle highlight on the sun -->
    <circle cx="600" cy="295" r="55" fill="#FFFFFF" opacity="0.25"/>

    <!-- Cloud -->
    <g filter="url(#shadow)" fill="url(#cloud)">
      <rect x="200" y="580" width="620" height="200" rx="100"/>
      <circle cx="360" cy="600" r="130"/>
      <circle cx="570" cy="540" r="180"/>
      <circle cx="730" cy="640" r="110"/>
    </g>
  </g>
</svg>