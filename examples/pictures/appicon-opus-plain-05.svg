<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Sky background -->
    <linearGradient id="sky" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#1B3FBF"/>
      <stop offset="0.55" stop-color="#2F7BEA"/>
      <stop offset="1" stop-color="#5FC2FF"/>
    </linearGradient>

    <!-- Sun body -->
    <linearGradient id="sun" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFE36B"/>
      <stop offset="1" stop-color="#FF9A1F"/>
    </linearGradient>

    <!-- Sun glow -->
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD84D" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#FFB13B" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#FFB13B" stop-opacity="0"/>
    </radialGradient>

    <!-- Cloud body -->
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCE9FF"/>
    </linearGradient>

    <!-- Soft cloud shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
      <feOffset dx="0" dy="24" result="blur"/>
      <feFlood flood-color="#0B2A7A" flood-opacity="0.35"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Full-bleed square background (no rounded corners) -->
  <rect width="1024" height="1024" fill="url(#sky)"/>

  <g transform="translate(-18, 12)">
    <!-- Sun glow + sun -->
    <circle cx="640" cy="400" r="320" fill="url(#glow)"/>
    <circle cx="640" cy="400" r="170" fill="url(#sun)"/>
    <!-- Sun highlight -->
    <circle cx="590" cy="330" r="55" fill="#FFFFFF" opacity="0.18"/>

    <!-- Cloud -->
    <g filter="url(#shadow)" fill="url(#cloud)">
      <rect x="250" y="620" width="540" height="150" rx="75"/>
      <circle cx="380" cy="620" r="125"/>
      <circle cx="540" cy="540" r="175"/>
      <circle cx="690" cy="640" r="105"/>
    </g>
  </g>
</svg>