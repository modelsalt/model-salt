<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Paper grain -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.55"/>
      </feComponentTransfer>
    </filter>
    <clipPath id="frame">
      <rect width="1024" height="1024"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- Sky: flat pale blue -->
    <rect width="1024" height="1024" fill="#DCEAF4"/>

    <!-- Sun halo + sun, rising from behind the cloud bank -->
    <circle cx="610" cy="600" r="300" fill="#F7EBC9"/>
    <circle cx="610" cy="600" r="225" fill="#FBDD9A"/>

    <!-- Back cloud layer (pale lavender) -->
    <g fill="#E4DEF2">
      <circle cx="790" cy="770" r="170"/>
      <circle cx="975" cy="735" r="150"/>
      <circle cx="560" cy="850" r="150"/>
      <rect x="400" y="800" width="700" height="300"/>
    </g>

    <!-- Front cloud: sits on the bottom edge and rises into the frame -->
    <g fill="#FBF8FD">
      <circle cx="150"  cy="880" r="175"/>
      <circle cx="395"  cy="775" r="215"/>
      <circle cx="660"  cy="860" r="175"/>
      <circle cx="880"  cy="925" r="150"/>
      <rect x="-20" y="900" width="1064" height="200"/>
    </g>

    <!-- Bold temperature numeral -->
    <text x="92" y="262"
          font-family="Inter, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
          font-weight="800" font-size="236" letter-spacing="-10"
          fill="#7C88B9">24°</text>

    <!-- Grain overlay -->
    <rect width="1024" height="1024" filter="url(#grain)"
          opacity="0.16" style="mix-blend-mode:multiply"/>
  </g>
</svg>