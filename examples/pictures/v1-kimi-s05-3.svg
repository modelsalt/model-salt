      <line x1="280" y1="480" x2="330.9" y2="530.9"/>
      <line x1="280" y1="480" x2="280" y2="552"/>
      <line x1="280" y1="480" x2="229.1" y2="530.9"/>
      <line x1="280" y1="480" x2="208" y2="480"/>
