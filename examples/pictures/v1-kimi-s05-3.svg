  <path d="M668 246 C712 250 760 254 798 256" fill="none" stroke="#E8940F" stroke-width="2.5"/>
  <path d="M798 249 Q810 251 806 259 Q798 261 795 256 Z" fill="#F08C00" stroke="#2B2D42" stroke-width="3"/>

  <!-- ===== NEAR LEG ===== -->
  <path d="M455 352 C480 396 488 430 479 462 C472 488 467 501 464 510"
