    <line x1="426" y1="484" x2="388" y2="349" stroke-width="11"/>
    <line x1="390" y1="350" x2="597" y2="331" stroke-width="11"/>
    <line x1="436" y1="476" x2="603" y2="341" stroke-width="11"/>
    <line x1="595" y1="316" x2="610" y2="352" stroke-width="14"/>
    <line x1="606" y1="344" x2="638" y2="475" stroke-width="11"/>
