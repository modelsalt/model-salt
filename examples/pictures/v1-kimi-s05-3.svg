      <line x1="640" y1="480" x2="690.9" y2="530.9"/>
      <line x1="640" y1="480" x2="640" y2="552"/>
      <line x1="640" y1="480" x2="589.1" y2="530.9"/>
      <line x1="640" y1="480" x2="568" y2="480"/>
      <line x1="640" y1="480" x2="589.1" y2="429.1"/>
      <line x1="640" y1="480" x2="640" y2="408"/>
