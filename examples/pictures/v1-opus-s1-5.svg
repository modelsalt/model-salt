<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <g id="wheel">
      <path fill="#1E1B3A" fill-rule="evenodd"
        d="M-120,0 a120,120 0 1,0 240,0 a120,120 0 1,0 -240,0 Z
           M-104,0 a104,104 0 1,0 208,0 a104,104 0 1,0 -208,0 Z"/>
      <path fill="#C9D1FF" fill-rule="evenodd"
        d="M-104,0 a104,104 0 1,0 208,0 a104,104 0 1,0 -208,0 Z
           M-96,0 a96,96 0 1,0 192,0 a96,96 0 1,0 -192,0 Z"/>
      <g stroke="#F2F4FF" stroke-width="3">
        <line x1="0" y1="-96" x2="0" y2="96"/>
        <line x1="-96" y1="0" x2="96" y2="0"/>
        <line x1="48" y1="-83" x2="-48" y2="83"/>
        <line x1="83" y1="-48" x2="-83" y2="48"/>
        <line x1="-48" y1="-83" x2="48" y2="83"/>
        <line x1="-83" y1="-48" x2="83" y2="48"/>
      </g>
      <circle r="14" fill="#FFD000"/>
    </g>
  </defs>

  <!-- Sky -->
  <rect width="1280" height="720" fill="#00B8FF"/>
  <circle cx="1090" cy="130" r="72" fill="#FFE14D"/>

  <!-- Clouds -->
  <g fill="#FFFFFF">
    <circle cx="300" cy="120" r="34"/><circle cx="345" cy="105" r="44"/>
    <circle cx="395" cy="122" r="32"/><rect x="290" y="118" width="120" height="36" rx="18"/>
    <circle cx="880" cy="90" r="26"/><circle cx="915" cy="78" r="34"/>
    <circle cx="952" cy="92" r="24"/><rect x="870" y="88" width="94" height="28" rx="14"/>
  </g>

  <!-- Hills and road -->
  <path fill="#3BDC6B" d="M0,560 Q200,500 420,550 Q700,600 950,540 Q1130,500 1280,550 L1280,720 L0,720 Z"/>
  <path fill="#1FB955" d="M0,600 Q300,570 600,605 Q900,640 1280,595 L1280,720 L0,720 Z"/>
  <rect x="0" y="635" width="1280" height="85" fill="#4B3F8F"/>
  <g fill="#FFD000">
    <rect x="40" y="674" width="110" height="9" rx="4.5"/>
    <rect x="260" y="674" width="110" height="9" rx="4.5"/>
    <rect x="480" y="674" width="110" height="9" rx="4.5"/>
    <rect x="700" y="674" width="110" height="9" rx="4.5"/>
    <rect x="920" y="674" width="110" height="9" rx="4.5"/>
    <rect x="1140" y="674" width="110" height="9" rx="4.5"/>
  </g>

  <!-- Motion lines -->
  <g fill="#FFFFFF" opacity="0.85">
    <rect x="90" y="245" width="230" height="14" rx="7"/>
    <rect x="170" y="300" width="170" height="12" rx="6"/>
    <rect x="50" y="410" width="210" height="14" rx="7"/>
    <rect x="130" y="465" width="150" height="12" rx="6"/>
    <rect x="30" y="545" width="230" height="14" rx="7"/>
  </g>
  <!-- Dust puffs -->
  <g fill="#FFFFFF" opacity="0.75">
    <circle cx="292" cy="625" r="18"/>
    <circle cx="252" cy="618" r="13"/>
    <circle cx="218" cy="628" r="9"/>
  </g>

  <!-- Far leg (behind bike) -->
  <polyline points="600,350 625,445 548,505" fill="none" stroke="#E06A00" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <path fill="#E06A00" d="M535,500 L580,508 L535,515 Z"/>

  <!-- Wheels -->
  <use href="#wheel" x="430" y="520"/>
  <use href="#wheel" x="830" y="520"/>

  <!-- Chain -->
  <g stroke="#1E1B3A" stroke-width="4">
    <line x1="600" y1="500" x2="430" y2="508"/>
    <line x1="600" y1="560" x2="430" y2="532"/>
  </g>
  <circle cx="430" cy="520" r="12" fill="#1E1B3A"/>

  <!-- Frame -->
  <g fill="none" stroke="#FF1E56" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <line x1="430" y1="520" x2="600" y2="530"/>
    <line x1="430" y1="520" x2="565" y2="385"/>
    <line x1="565" y1="385" x2="600" y2="530"/>
    <line x1="565" y1="385" x2="785" y2="375"/>
    <line x1="600" y1="530" x2="800" y2="425"/>
    <line x1="785" y1="375" x2="800" y2="425"/>
    <line x1="800" y1="425" x2="830" y2="520"/>
  </g>

  <!-- Seat post, saddle -->
  <line x1="565" y1="385" x2="558" y2="360" stroke="#9AA3C7" stroke-width="9"/>
  <path fill="#1E1B3A" d="M512,352 Q560,338 604,352 L598,366 Q556,360 518,366 Z"/>

  <!-- Stem and handlebar -->
  <path fill="none" stroke="#1E1B3A" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"
        d="M785,375 L775,345 L835,340 Q856,342 850,374"/>

  <!-- Chainring and cranks -->
  <circle cx="600" cy="530" r="30" fill="#FFD000"/>
  <line x1="600" y1="530" x2="548" y2="505" stroke="#1E1B3A" stroke-width="9" stroke-linecap="round"/>
  <line x1="600" y1="530" x2="655" y2="556" stroke="#1E1B3A" stroke-width="9" stroke-linecap="round"/>
  <circle cx="600" cy="530" r="8" fill="#1E1B3A"/>
  <rect x="637" y="552" width="36" height="9" rx="3" fill="#1E1B3A"/>

  <!-- Folded back wing + tail -->
  <path fill="#FFFFFF" d="M520,318 L462,332 L508,350 Z"/>

  <!-- Body, leaning forward -->
  <ellipse cx="625" cy="282" rx="122" ry="74" fill="#FFFFFF" transform="rotate(-22 625 282)"/>
  <path fill="#C9D1FF" d="M712,252 Q620,236 468,322 Q560,330 650,312 Q700,296 712,252 Z"/>
  <path fill="#2D2A6E" d="M565,300 L455,336 L545,322 Z"/>

  <!-- Neck and head -->
  <path fill="none" stroke="#FFFFFF" stroke-width="46" stroke-linecap="round" d="M712,242 Q752,175 800,186"/>
  <circle cx="805" cy="185" r="40" fill="#FFFFFF"/>
  <path fill="#FFD000" d="M792,148 Q776,122 756,138 Q780,138 788,154 Z"/>

  <!-- Bill + pouch -->
  <path fill="#FF4D8D" d="M835,198 L1022,232 Q962,302 880,264 Q845,242 835,198 Z"/>
  <path fill="#FF9F1C" d="M830,168 L1030,222 L1024,233 L835,202 Z"/>
  <circle cx="1027" cy="229" r="7" fill="#FF3D00"/>

  <!-- Eye -->
  <circle cx="820" cy="172" r="7" fill="#1E1B3A"/>
  <circle cx="822.5" cy="169.5" r="2.5" fill="#FFFFFF"/>

  <!-- Near wing reaching for the handlebar -->
  <path fill="#E4E8FF" d="M688,244 Q782,280 852,366 L838,380 Q760,322 704,296 Z"/>
  <ellipse cx="848" cy="372" rx="15" ry="10" fill="#2D2A6E" transform="rotate(35 848 372)"/>

  <!-- Near leg pushing the pedal -->
  <polyline points="642,345 702,440 658,550" fill="none" stroke="#FF8A00" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <path fill="#FF8A00" d="M640,544 L694,556 L640,566 Z"/>
</svg>