             M278 338L432 455" stroke="#bd343c" stroke-width="9"/>
    <path d="M205 455L278 338L267 307" stroke="#d44a4f" stroke-width="9"/>
    <path d="M494 338L506 309" stroke="#647078" stroke-width="7"/>
    <path d="M267 307L251 287H222
             C191 287 181 302 190 319
             C196 330 212 332 224 324" stroke="#69767d" stroke-width="7"/>
    <path d="M222 287C191 287 181 302 190 319
             C196 330 212 332 224 324" stroke="#303940" stroke-width="10"/>
    <path d="M432 440L610 445Q623 455 610 466L432 474Z" stroke="#727c80" stroke-width="3"/>
  </g>
  <path d="M480 304Q502 298 526 305L540 312Q511 323 478 314Z" fill="#303940"/>
  <circle cx="432" cy="455" r="22" fill="#f5f3ed" stroke="#68757c" stroke-width="5"/>
  <circle cx="610" cy="455" r="7" fill="#68757c"/>
  <circle cx="205" cy="455" r="7" fill="#68757c"/>
  <path d="M432 455L465 488" stroke="#657078" stroke-width="6" stroke-linecap="round"/>
  <path d="M452 490H482M435 426H459" stroke="#303940" stroke-width="7" stroke-linecap="round"/>

  <!-- Raised right wing -->
  <path d="M476 248
           C481 205 509 165 536 125
           C557 94 569 64 576 44
           C589 76 587 106 577 133
           L597 102
           C598 137 582 168 563 191
           L580 176
