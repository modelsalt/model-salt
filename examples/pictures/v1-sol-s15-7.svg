<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican riding a bicycle</title>
  <desc id="desc">A white and gray pelican faces left on a red touring bicycle, with one wing on the drop handlebars and the other raised overhead.</desc>

  <rect width="800" height="600" fill="#f5f3ed"/>
  <ellipse cx="405" cy="552" rx="302" ry="13" fill="#dddcd5"/>

  <!-- Wheels -->
  <g fill="none" stroke="#bdc3c6" stroke-width="2">
    <path d="M205 455V366M205 455V544M116 455H294
             M142 392L268 518M142 518L268 392
             M123 421L287 489M123 489L287 421
             M171 373L239 537M171 537L239 373"/>
    <path d="M610 455V366M610 455V544M521 455H699
             M547 392L673 518M547 518L673 392
             M528 421L692 489M528 489L692 421
             M576 373L644 537M576 537L644 373"/>
  </g>
  <g fill="none">
    <g stroke="#303940" stroke-width="10">
      <circle cx="205" cy="455" r="91"/>
      <circle cx="610" cy="455" r="91"/>
    </g>
    <g stroke="#fefefe" stroke-width="3">
      <circle cx="205" cy="455" r="83"/>
      <circle cx="610" cy="455" r="83"/>
    </g>
  </g>

  <!-- Far leg -->
  <path d="M493 324L482 387L453 428" fill="none" stroke="#bd762e" stroke-width="12" stroke-linecap="round"/>
  <path d="M453 421L475 433L446 435L432 429Z" fill="#dc923a"/>

