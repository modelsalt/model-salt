  <!-- Near leg and webbed foot -->
  <path d="M490 329L512 392L467 478" fill="none" stroke="#e49a42" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M466 473L489 485L480 490L453 487L442 479Z"
