<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Sky and ground -->
  <rect width="400" height="300" fill="#bfe6ff"/>
  <circle cx="345" cy="45" r="25" fill="#ffd84d"/>
  <rect y="272" width="400" height="28" fill="#8cc96b"/>
  <line x1="0" y1="275" x2="400" y2="275" stroke="#6aa84f" stroke-width="2"/>

  <!-- Back leg (behind the bike) -->
  <path d="M178 145 L182 172 L186 195" stroke="#d98a00" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M178 196 L194 194 L186 200 Z" fill="#d98a00"/>

  <!-- Wheels -->
  <g stroke="#333" fill="none">
    <circle cx="110" cy="220" r="52" stroke-width="7"/>
    <circle cx="290" cy="220" r="52" stroke-width="7"/>
    <g stroke-width="1.5" stroke="#777">
      <line x1="110" y1="170" x2="110" y2="270"/>
      <line x1="60" y1="220" x2="160" y2="220"/>
      <line x1="75" y1="185" x2="145" y2="255"/>
      <line x1="145" y1="185" x2="75" y2="255"/>
      <line x1="290" y1="170" x2="290" y2="270"/>
      <line x1="240" y1="220" x2="340" y2="220"/>
      <line x1="255" y1="185" x2="325" y2="255"/>
      <line x1="325" y1="185" x2="255" y2="255"/>
    </g>
  </g>
  <circle cx="110" cy="220" r="5" fill="#333"/>
  <circle cx="290" cy="220" r="5" fill="#333"/>

  <!-- Frame -->
  <g stroke="#d6332f" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M110 220 L200 220 L185 150 Z"/>
    <line x1="185" y1="150" x2="268" y2="146"/>
    <line x1="200" y1="220" x2="268" y2="160"/>
    <line x1="268" y1="140" x2="272" y2="165"/>
    <line x1="272" y1="165" x2="290" y2="220"/>
  </g>
  <!-- Handlebars -->
  <path d="M268 140 L265 124" stroke="#555" stroke-width="5" stroke-linecap="round"/>
  <path d="M252 124 L278 121 Q288 121 287 131" stroke="#555" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- Chainring and cranks -->
  <circle cx="200" cy="220" r="11" fill="none" stroke="#555" stroke-width="3"/>
  <line x1="200" y1="220" x2="186" y2="196" stroke="#444" stroke-width="5" stroke-linecap="round"/>
  <line x1="200" y1="220" x2="214" y2="244" stroke="#444" stroke-width="5" stroke-linecap="round"/>
  <rect x="205" y="242" width="18" height="5" rx="2" fill="#222"/>

  <!-- Saddle -->
  <path d="M166 145 L200 145 Q207 149 198 153 L172 153 Q164 150 166 145 Z" fill="#333"/>

  <!-- Pelican tail -->
  <path d="M138 110 L106 98 L118 118 L104 130 L140 130 Z" fill="#f2f2f2" stroke="#999" stroke-width="2" stroke-linejoin="round"/>

  <!-- Pelican body -->
  <ellipse cx="182" cy="120" rx="48" ry="30" fill="#ffffff" stroke="#999" stroke-width="2"/>

  <!-- Neck -->
  <path d="M202 110 C228 96, 210 70, 233 58" stroke="#999" stroke-width="22" fill="none" stroke-linecap="round"/>
  <path d="M202 110 C228 96, 210 70, 233 58" stroke="#ffffff" stroke-width="18" fill="none" stroke-linecap="round"/>

  <!-- Wing reaching to handlebars -->
  <path d="M158 106 Q200 94 236 117 Q250 126 262 125 Q236 141 196 136 Q164 132 158 106 Z" fill="#e4e4e4" stroke="#999" stroke-width="2" stroke-linejoin="round"/>
  <path d="M180 118 Q205 118 225 128 M175 126 Q200 128 215 134" stroke="#aaa" stroke-width="1.5" fill="none"/>

  <!-- Head -->
  <circle cx="239" cy="54" r="16" fill="#ffffff" stroke="#999" stroke-width="2"/>
  <path d="M232 40 Q226 30 236 33 Q238 26 243 36" fill="#f5e6a8" stroke="#c9b26a" stroke-width="1.5"/>
  <circle cx="244" cy="50" r="3" fill="#222"/>
  <circle cx="245" cy="49" r="1" fill="#fff"/>

  <!-- Beak and pouch -->
  <path d="M250 62 L332 68 Q302 98 262 80 Q250 73 250 62 Z" fill="#f7c35c" stroke="#d98a00" stroke-width="2" stroke-linejoin="round"/>
  <path d="M249 50 L334 66 L250 63 Z" fill="#f4a300" stroke="#d98a00" stroke-width="2" stroke-linejoin="round"/>

  <!-- Front leg on pedal -->
  <path d="M196 145 L206 192 L214 241" stroke="#f4a300" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M206 242 L226 240 L214 246 Z" fill="#f4a300"/>

  <!-- Motion lines -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <line x1="20" y1="150" x2="50" y2="150"/>
    <line x1="10" y1="175" x2="45" y2="175"/>
    <line x1="25" y1="200" x2="50" y2="200"/>
  </g>
</svg>