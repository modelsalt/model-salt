<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc">
  <title id="title">Pelican riding a bicycle</title>
  <desc id="desc">A cheerful white pelican with a long orange bill pedals a teal bicycle beneath a sunny sky.</desc>

  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#e6f5f4"/>
      <stop offset="1" stop-color="#fff8e9"/>
    </linearGradient>
    <linearGradient id="pouch" x2="0" y2="1">
      <stop stop-color="#ffd077"/>
      <stop offset="1" stop-color="#f29a55"/>
    </linearGradient>
    <g id="wheel" fill="none">
      <circle r="77" stroke="#253d46" stroke-width="9"/>
      <circle r="68" stroke="#fffdf5" stroke-width="3"/>
      <g stroke="#a2b9b7" stroke-width="2">
        <path d="M-68 0H68M0-68V68M-48-48L48 48M-48 48L48-48"/>
        <path d="M-63-26L63 26M-26-63L26 63M-63 26L63-26M-26 63L26-63"/>
      </g>
      <circle r="8" fill="#e8b75c" stroke="#253d46" stroke-width="3"/>
    </g>
  </defs>

  <!-- Sunshine and ground -->
  <rect width="720" height="560" rx="32" fill="url(#sky)"/>
  <circle cx="580" cy="104" r="43" fill="#f7d479"/>
  <g fill="#fff" opacity=".8">
    <path d="M76 130c-10-20 12-38 29-25 8-30 49-28 55 1 24-7 39 13 30 24Z"/>
    <path d="M462 208c-6-14 8-27 22-20 8-23 38-21 42 2 17-4 29 9 24 18Z"/>
  </g>
  <path d="M0 459Q180 429 359 458T720 451V560H0Z" fill="#d9e6c9"/>
  <ellipse cx="356" cy="499" rx="247" ry="15" fill="#6f9380" opacity=".16"/>
  <path d="M86 501H630" stroke="#829e86" stroke-width="3" stroke-linecap="round"/>

  <!-- Bicycle wheels -->
  <use href="#wheel" x="207" y="417"/>
  <use href="#wheel" x="490" y="417"/>

  <!-- Far leg and pedal -->
  <path d="M303 282L280 337 321 389" fill="none" stroke="#c98243" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M317 385l-19 7 36 5 8-8Z" fill="#e49b4e" stroke="#684b37" stroke-width="3"/>
  <path d="M305 402h34" stroke="#253d46" stroke-width="7" stroke-linecap="round"/>

  <!-- Bicycle frame -->
  <g fill="none" stroke="#258d91" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M207 417L291 305 353 417H207"/>
    <path d="M291 305H443L353 417"/>
    <path d="M443 305L490 417"/>
    <path d="M291 305L283 282"/>
    <path d="M443 305L431 268"/>
  </g>
  <path d="M207 417L353 417" fill="none" stroke="#176f77" stroke-width="4"/>
  <path d="M263 282h48" stroke="#253d46" stroke-width="13" stroke-linecap="round"/>
  <path d="M431 268l-7-19h34q18 0 18 17" fill="none" stroke="#253d46" stroke-width="8" stroke-linecap="round"/>
  <path d="M458 249h12" stroke="#bd7953" stroke-width="11" stroke-linecap="round"/>
  <circle cx="353" cy="417" r="22" fill="#e9ede0" stroke="#253d46" stroke-width="5"/>
  <circle cx="353" cy="417" r="7" fill="#258d91"/>
  <path d="M353 417l25-32" stroke="#253d46" stroke-width="6" stroke-linecap="round"/>
  <path d="M362 385h37" stroke="#253d46" stroke-width="7" stroke-linecap="round"/>

  <!-- Pelican tail and body -->
  <path d="M260 236L195 211l26 34-33-4 58 37Z" fill="#fffdf5" stroke="#344b50" stroke-width="4" stroke-linejoin="round"/>
  <path d="M250 218C218 236 223 279 264 294c43 16 91-3 109-39 14-28 7-63 20-85l-37-17c-28 22-23 56-38 65-19 11-42-15-68 0Z"
        fill="#fffdf5" stroke="#344b50" stroke-width="4"/>

  <!-- Near leg and webbed foot -->
  <path d="M319 289l43 40 14 49" fill="none" stroke="#edac58" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M372 374l-13 10 41 3-8-11Z" fill="#f2b65c" stroke="#684b37" stroke-width="3" stroke-linejoin="round"/>

  <!-- Wing reaching the handlebars -->
  <path d="M262 234c20-14 45-7 63 9l30 20 88-17c9-2 14 8 6 13l-93 27c-17 4-41-10-58-17"
        fill="#e4e9dd" stroke="#344b50" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M258 247q18 17 39 16m-37-4q13 15 29 15" fill="none" stroke="#bccfc4" stroke-width="3" stroke-linecap="round"/>

  <!-- Neck and head -->
  <path d="M352 209c-5-27-1-43 1-58-14-18-5-43 16-49 23-7 45 8 45 29 0 17-12 29-27 32l-6 57"
        fill="#fffdf5" stroke="#344b50" stroke-width="4" stroke-linecap="round"/>
  <path d="M354 112l-8-11m18 6-1-13m11 12 5-11" stroke="#344b50" stroke-width="3" stroke-linecap="round"/>

  <!-- Bill and generous throat pouch -->
  <path d="M395 143L550 159c-37 45-104 67-158 15Z"
        fill="url(#pouch)" stroke="#344b50" stroke-width="4" stroke-linejoin="round"/>
  <path d="M397 136L557 157q8 3-2 8l-159-7Z"
        fill="#f7ba57" stroke="#344b50" stroke-width="4" stroke-linejoin="round"/>
  <path d="M410 174q56 33 113-2" fill="none" stroke="#e58b4d" stroke-width="3" stroke-linecap="round"/>
  <circle cx="388" cy="125" r="5.5" fill="#253d46"/>
  <circle cx="390" cy="123" r="1.7" fill="white"/>
  <path d="M378 114q7-5 14-1" fill="none" stroke="#344b50" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="382" cy="145" rx="8" ry="5" fill="#f1b5a0" opacity=".7"/>

  <!-- A little breeze -->
  <g fill="none" stroke="#7facac" stroke-width="3" stroke-linecap="round">
    <path d="M113 279h58M91 295h65M123 311h35"/>
  </g>
  <g fill="#f6cf71">
    <path d="M594 394l3-8 3 8 8 3-8 3-3 8-3-8-8-3Z"/>
    <circle cx="117" cy="375" r="4"/>
  </g>
</svg>