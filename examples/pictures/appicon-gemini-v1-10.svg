<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Sharp-cornered square background in bright sky blue -->
  <rect width="512" height="512" fill="#29B6F6" />

  <!-- Centered Weather Emblem -->
  <g>
    <!-- Warm yellow accent backdrop/rim behind the cloud -->
    <path d="M 188 288 
             A 58 58 0 0 1 188 172 
             A 78 78 0 0 1 334 152 
             A 52 52 0 0 1 364 254 
             Z" 
          fill="#FFD54F" />

    <!-- Crisp white minimalist cloud -->
    <path d="M 176 300 
             L 336 300 
             A 48 48 0 0 0 336 204 
             A 48 48 0 0 0 326 205 
             A 72 72 0 0 0 190 185 
             A 58 58 0 0 0 176 300 
             Z" 
          fill="#FFFFFF" />

    <!-- Falling Raindrops (Angled flat minimalist pills) -->
    <!-- Left Drop (Crisp White) -->
    <rect x="180" y="330" width="22" height="64" rx="11" 
          transform="rotate(20 191 362)" fill="#FFFFFF" />

    <!-- Center Drop (Warm Yellow Accent) -->
    <rect x="245" y="346" width="22" height="64" rx="11" 
          transform="rotate(20 256 378)" fill="#FFD54F" />

    <!-- Right Drop (Crisp White) -->
    <rect x="310" y="330" width="22" height="64" rx="11" 
          transform="rotate(20 321 362)" fill="#FFFFFF" />
  </g>
</svg>