<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Sky and ground -->
  <rect width="400" height="300" fill="#bfe6ff"/>
  <rect y="240" width="400" height="60" fill="#8fcf6a"/>
  <rect y="238" width="400" height="4" fill="#5e9c3e"/>

  <!-- Rear wheel -->
  <circle cx="100" cy="210" r="42" fill="none" stroke="#222" stroke-width="6"/>
  <circle cx="100" cy="210" r="5" fill="#222"/>
  <g stroke="#222" stroke-width="2">
    <line x1="100" y1="168" x2="100" y2="252"/>
    <line x1="58" y1="210" x2="142" y2="210"/>
    <line x1="70" y1="180" x2="130" y2="240"/>
    <line x1="130" y1="180" x2="70" y2="240"/>
  </g>

  <!-- Front wheel -->
  <circle cx="300" cy="210" r="42" fill="none" stroke="#222" stroke-width="6"/>
  <circle cx="300" cy="210" r="5" fill="#222"/>
  <g stroke="#222" stroke-width="2">
    <line x1="300" y1="168" x2="300" y2="252"/>
    <line x1="258" y1="210" x2="342" y2="210"/>
    <line x1="270" y1="180" x2="330" y2="240"/>
    <line x1="330" y1="180" x2="270" y2="240"/>
  </g>

  <!-- Frame -->
  <g stroke="#e03c31" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="100" y1="210" x2="190" y2="210"/>   <!-- chainstay -->
    <line x1="100" y1="210" x2="165" y2="140"/>   <!-- seatstay -->
    <line x1="165" y1="140" x2="190" y2="210"/>   <!-- seat tube -->
    <line x1="165" y1="140" x2="265" y2="140"/>   <!-- top tube -->
    <line x1="190" y1="210" x2="275" y2="150"/>   <!-- down tube -->
    <line x1="265" y1="140" x2="300" y2="210"/>   <!-- fork -->
    <line x1="265" y1="140" x2="258" y2="118"/>   <!-- head tube / stem -->
  </g>
  <!-- Handlebar -->
  <path d="M248 118 L270 118 L278 110" stroke="#222" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- Seat post + saddle -->
  <line x1="165" y1="140" x2="160" y2="118" stroke="#222" stroke-width="6" stroke-linecap="round"/>
  <path d="M142 118 L180 118 L176 110 L148 110 Z" fill="#222"/>
  <!-- Crank and pedals -->
  <circle cx="190" cy="210" r="9" fill="#222"/>
  <line x1="190" y1="210" x2="206" y2="232" stroke="#222" stroke-width="5" stroke-linecap="round"/>
  <line x1="190" y1="210" x2="174" y2="188" stroke="#222" stroke-width="5" stroke-linecap="round"/>
  <rect x="198" y="229" width="18" height="6" fill="#222"/>
  <rect x="166" y="185" width="18" height="6" fill="#222"/>

  <!-- Pelican body (seated upright on saddle) -->
  <ellipse cx="170" cy="88" rx="40" ry="34" fill="#ffffff" stroke="#222" stroke-width="4"/>
  <!-- Tail feathers -->
  <path d="M132 92 L108 84 L116 100 L104 106 L130 110 Z" fill="#ffffff" stroke="#222" stroke-width="4" stroke-linejoin="round"/>
  <!-- Legs down to pedals -->
  <g stroke="#f5a623" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M178 118 L184 160 L206 229"/>
    <path d="M166 118 L170 158 L174 186"/>
  </g>
  <!-- Webbed feet on pedals -->
  <path d="M196 232 L220 232 L216 240 L198 240 Z" fill="#f5a623" stroke="#222" stroke-width="3" stroke-linejoin="round"/>
  <path d="M164 188 L188 188 L184 196 L166 196 Z" fill="#f5a623" stroke="#222" stroke-width="3" stroke-linejoin="round"/>
  <!-- Wing reaching forward to grip handlebars -->
  <path d="M190 80 Q230 92 252 116 L266 116 Q240 90 196 68 Z" fill="#ffffff" stroke="#222" stroke-width="4" stroke-linejoin="round"/>
  <!-- Wing-tip grip -->
  <path d="M250 112 Q258 106 268 112 Q264 122 250 120 Z" fill="#ffffff" stroke="#222" stroke-width="3" stroke-linejoin="round"/>

  <!-- Neck -->
  <path d="M186 64 Q198 36 212 30" stroke="#ffffff" stroke-width="18" stroke-linecap="round" fill="none"/>
  <path d="M186 64 Q198 36 212 30" stroke="#222" stroke-width="26" stroke-linecap="round" fill="none" opacity="0"/>
  <path d="M178 66 Q194 30 212 22" stroke="#222" stroke-width="4" fill="none"/>
  <path d="M196 70 Q206 42 220 36" stroke="#222" stroke-width="4" fill="none"/>

  <!-- Head -->
  <circle cx="218" cy="28" r="18" fill="#ffffff" stroke="#222" stroke-width="4"/>
  <!-- Eye -->
  <circle cx="226" cy="24" r="4" fill="#222"/>
  <circle cx="227" cy="23" r="1.3" fill="#ffffff"/>
  <!-- Beak (big pelican bill) -->
  <path d="M232 26 L300 36 L236 44 Z" fill="#f5a623" stroke="#222" stroke-width="4" stroke-linejoin="round"/>
  <!-- Pouch -->
  <path d="M236 44 L298 36 Q280 66 244 58 Z" fill="#ffb84d" stroke="#222" stroke-width="4" stroke-linejoin="round"/>
</svg>