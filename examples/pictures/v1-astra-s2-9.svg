    <path d="M281 258L245 366M301 259L266 362" fill="none" stroke-width="12"/>
    <path d="M281 258L245 366" fill="none" stroke="#e78d9d" stroke-width="5"/>
    <path d="M290 266L303 221L282 191L249 196M303 221L333 191L359 195" fill="none" stroke-width="10"/>
    <path d="M290 266L303 221L282 191M303 221L333 191" fill="none" stroke="#e78d9d" stroke-width="4"/>
