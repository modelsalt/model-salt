<svg xmlns="http://www.w3.org/2000/svg" width="750" height="500" viewBox="0 0 750 500" role="img" aria-labelledby="title desc">
  <title id="title">Pelican riding a BMX bicycle</title>
  <desc id="desc">A cream pelican with a coral bill hovers above a rose BMX saddle, bent legs pedaling and both wings gripping raised handlebars. Bold burgundy outlines and cel shading, viewed from the front at three quarters.</desc>
  <rect width="750" height="500" rx="28" fill="#fff4df"/>
  <ellipse cx="395" cy="441" rx="248" ry="22" fill="#eed1c8"/>

  <g stroke="#59273f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Wheels: narrow ellipses establish the three-quarter view. -->
    <g fill="#59273f">
      <ellipse cx="539" cy="352" rx="68" ry="86"/>
      <ellipse cx="245" cy="366" rx="77" ry="94"/>
    </g>
    <g fill="#fff4df" stroke="#dc8797" stroke-width="5">
