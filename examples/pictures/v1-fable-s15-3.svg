<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 809 500" width="809" height="500">
  <title>Pelican riding a bicycle — isometric monoline</title>
  <g fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">

    <!-- Ground line (isometric axis) -->
    <line x1="179" y1="470" x2="646" y2="200"/>

    <!-- Rear wheel -->
    <g transform="translate(300 330) rotate(-60)">
      <ellipse rx="86" ry="49"/>
      <ellipse rx="79" ry="45"/>
      <ellipse rx="7" ry="4"/>
    </g>
    <line x1="360.6" y1="295" x2="239.4" y2="365"/>
    <line x1="330.3" y1="251.9" x2="269.7" y2="408.1"/>
    <line x1="269.7" y1="286.9" x2="330.3" y2="373.1"/>

    <!-- Front wheel -->
    <g transform="translate(481.9 225) rotate(-60)">
      <ellipse rx="86" ry="49"/>
      <ellipse rx="79" ry="45"/>
      <ellipse rx="7" ry="4"/>
    </g>
    <line x1="542.5" y1="190" x2="421.3" y2="260"/>
    <line x1="512.2" y1="146.9" x2="451.6" y2="303.1"/>
    <line x1="451.6" y1="181.9" x2="512.2" y2="268.1"/>

    <!-- Frame -->
    <polyline points="300,330 373.6,302.5 360.6,205 300,330"/>          <!-- chain stay, seat tube, seat stay -->
    <polyline points="360.6,205 460.2,157.5 468.9,192.5 373.6,302.5"/>  <!-- top tube, head tube, down tube -->
    <line x1="468.9" y1="192.5" x2="481.9" y2="225"/>                    <!-- fork -->
    <line x1="360.6" y1="205" x2="356.3" y2="182.5"/>                    <!-- seat post -->
    <path d="M 336 192 Q 350 180 366 176"/>                              <!-- saddle -->

    <!-- Handlebar -->
    <line x1="460.2" y1="157.5" x2="455.9" y2="145"/>
    <line x1="429.9" y1="130" x2="481.9" y2="160"/>
    <line x1="429.9" y1="130" x2="424" y2="136"/>
    <line x1="481.9" y1="160" x2="486" y2="166"/>

    <!-- Drivetrain -->
    <ellipse cx="0" cy="0" rx="22" ry="12.7" transform="translate(373.6 302.5) rotate(-60)"/>
    <ellipse cx="0" cy="0" rx="9.8" ry="5.7" transform="translate(300 330) rotate(-60)"/>
    <line x1="300" y1="322" x2="373.6" y2="284.5"/>
    <line x1="300" y1="338" x2="373.6" y2="320.5"/>
    <!-- near crank + pedal -->
    <polyline points="373.6,302.5 390.9,282.5 404.8,290.5"/>
    <line x1="398.7" y1="294" x2="410.9" y2="287"/>
    <!-- far crank + pedal -->
    <polyline points="373.6,302.5 356.3,322.5 342.4,314.5"/>
    <line x1="336.4" y1="318" x2="348.5" y2="311"/>

    <!-- Pelican legs and webbed feet -->
    <polyline points="372,165 406,236 404,288"/>
    <polyline points="404,288 413,283 M404,288 412,290 M404,288 407,296"/>
    <polyline points="345,172 330,245 342,312"/>
    <polyline points="342,312 350,308 M342,312 349,315 M342,312 344,320"/>

    <!-- Pelican body -->
    <path d="M 300 160 C 325 112, 355 92, 385 94 C 414 97, 428 120, 418 143 C 408 167, 378 181, 350 177 C 328 174, 315 168, 300 160 Z"/>
    <!-- tail feathers -->
    <path d="M 300 160 L 284 168 M 303 154 L 286 148"/>

    <!-- Neck -->
    <path d="M 384 93 C 388 70, 395 50, 404 40"/>
    <path d="M 414 102 C 420 90, 418 75, 416 58"/>

    <!-- Head and beak -->
    <path d="M 404 40 C 410 32, 425 32, 432 42 C 455 38, 480 34, 500 36 C 485 52, 460 60, 436 62 C 428 64, 420 62, 416 58"/>
    <path d="M 434 52 L 496 38"/>
    <circle cx="420" cy="46" r="2.5"/>

    <!-- Near wing: resting on the handlebar -->
    <path d="M 388 108 C 420 115, 455 135, 478 156"/>
    <path d="M 392 128 C 420 135, 452 150, 474 162"/>
    <path d="M 474 162 C 480 166, 486 162, 482 157"/>
    <path d="M 430 128 L 440 140 M 445 137 L 453 148"/>

    <!-- Far wing: raised in a wave -->
    <path d="M 356 97 C 342 84, 330 65, 324 42 L 314 24 L 322 40 L 310 32 L 322 46 L 306 44 L 320 52 C 312 70, 318 90, 336 106"/>
  </g>
</svg>