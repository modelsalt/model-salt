<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" role="img" aria-labelledby="title desc">
  <title id="title">Pelican riding a bicycle</title>
  <desc id="desc">A white pelican in side profile, both wings resting on the handlebars of a coral step-through bicycle.</desc>

  <rect width="800" height="640" rx="32" fill="#F6EEDC"/>
  <ellipse cx="400" cy="559" rx="290" ry="18" fill="#E4D9BF"/>

  <!-- Equal-sized wheels -->
  <g fill="#F6EEDC" stroke="#243C43" stroke-width="13">
    <circle cx="220" cy="457" r="96"/>
    <circle cx="588" cy="457" r="96"/>
  </g>
  <g fill="none" stroke="#C8CDBF" stroke-width="3">
    <circle cx="220" cy="457" r="81"/>
    <circle cx="588" cy="457" r="81"/>
    <path d="M220 376v162m-81-81h162m-138-57 114 114m-114 0 114-114
             M588 376v162m-81-81h162m-138-57 114 114m-114 0 114-114"/>
  </g>

  <!-- Far leg and pedal -->
  <path d="M339 316 382 364 409 409" fill="none" stroke="#DB923A" stroke-width="15" stroke-linecap="round"/>
  <path d="m402 401 34 14-43 5Z" fill="#DB923A"/>
  <path d="M394 421h43" stroke="#243C43" stroke-width="8" stroke-linecap="round"/>

  <!-- Open step-through frame -->
  <g fill="none" stroke="#E56F55" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="m220 457 89-131 55 131Z"/>
    <path d="M316 350q73 139 221-22"/>
    <path d="m364 457 178-106"/>
    <path d="m528 299 60 158"/>
  </g>
  <path d="m309 326-8-28m227 1-11-39 34-14" fill="none" stroke="#243C43" stroke-width="9" stroke-linecap="round"/>
  <rect x="268" y="289" width="75" height="15" rx="7" fill="#243C43"/>
  <path d="m542 248 24-8" stroke="#243C43" stroke-width="13" stroke-linecap="round"/>
  <g fill="#243C43">
    <circle cx="220" cy="457" r="10"/>
    <circle cx="588" cy="457" r="10"/>
    <circle cx="364" cy="457" r="22"/>
  </g>
  <circle cx="364" cy="457" r="12" fill="#F6EEDC"/>
  <path d="m364 457-29 36" stroke="#243C43" stroke-width="7" stroke-linecap="round"/>
  <path d="M315 494h43" stroke="#243C43" stroke-width="9" stroke-linecap="round"/>

  <!-- Far wing reaching the handlebar -->
  <path d="M324 224Q400 207 460 237L548 238Q561 239 555 249L455 255Q380 264 324 250Z" fill="#BDCFCB"/>

  <!-- Tail, body, and long curved neck -->
  <path d="m263 249-69-34 26 52 61 18Z" fill="#D5DFD8"/>
  <path d="M253 229
           C285 199 339 215 361 238
           C386 228 400 205 397 178
           L391 141
           C384 105 405 75 437 76
           C471 77 486 105 476 131
           C470 147 455 153 444 155
           L451 193
           C462 242 425 286 380 309
           C344 328 292 316 263 289
           C245 272 238 246 253 229Z" fill="#FFFDF5"/>

  <!-- Pelican's throat pouch and long bill -->
  <path d="M450 132 645 126Q604 181 523 184Q472 181 450 132Z" fill="#F0B74E"/>
  <path d="M450 118 657 125Q664 127 655 132L449 139Z" fill="#E58A3E"/>
  <path d="M638 126 657 125Q665 128 650 140Z" fill="#C96939"/>

  <!-- Face -->
  <circle cx="448" cy="109" r="11" fill="#F2C864"/>
  <circle cx="451" cy="109" r="5" fill="#243C43"/>
  <circle cx="453" cy="107" r="1.6" fill="#FFFDF5"/>

  <!-- Near wing, also resting on the handlebar -->
  <path d="M278 235
           C306 215 348 234 385 256
           Q411 272 441 263
           L540 243
           Q555 240 558 249
           Q560 257 546 261
           L444 287
           C393 306 313 287 284 266
           Q268 253 278 235Z" fill="#DCE5DE"/>
  <path d="M292 248q32 21 65 25-37 7-61-7Z" fill="#BDCFCB"/>

  <!-- Near leg and webbed foot pressing the pedal -->
  <path d="M320 310 300 373 334 480" fill="none" stroke="#F0B74E" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M328 474q11-3 18 8l24 8h-54Z" fill="#EAA342"/>
</svg>