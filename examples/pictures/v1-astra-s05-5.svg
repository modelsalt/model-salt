  <path d="m303 279 7 17m113 1-2 18" stroke="#9b573d" stroke-width="13" stroke-linecap="round"/>
  <circle cx="386" cy="282" r="9" fill="#f4bd53"/>

  <!-- Tail and body -->
  <path d="m244 281-56-17 24 37 40 15Z" fill="#253e43"/>
  <path d="M246 212c-37 27-45 69-21 97 21 25 68 30 98 6 26-20 28-62 10-91Z" fill="#fffdf3"/>
  <path d="M242 257c-13 26-7 45 17 56 14 6 32 6 44-1-29-7-40-25-38-53Z" fill="#d7e1db"/>

  <!-- Near leg and webbed foot -->
  <path d="m285 321-9 66 58 87" fill="none" stroke="#efa640" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m329 464 18 13 24 12-49 2-8-10Z" fill="#f6bc4e"/>

  <!-- Curving neck -->
  <path d="M288 252c25-2 40-25 30-53-9-25-19-39-12-63 5-19 23-31 43-29 28 3 42 25 37 48-3 18-18 31-25 44-9 17 0 36-1 56-1 27-21 50-45 51Z" fill="#fffdf3"/>
