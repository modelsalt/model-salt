  <ellipse cx="351" cy="139" rx="13" ry="15" fill="#fffdf3"/>
  <ellipse cx="355" cy="140" rx="6" ry="8" fill="#253e43"/>
  <circle cx="357" cy="137" r="2" fill="#fff"/>
  <path d="M323 112q-7-17-1-27l12 18q3-18 12-22l1 22" fill="#fffdf3"/>
</svg>