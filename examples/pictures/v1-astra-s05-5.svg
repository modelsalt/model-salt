<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
  <title id="title">Pelican riding a bicycle</title>
  <desc id="desc">A white pelican with a golden bill rides a teal city bicycle, seen from the front at a three-quarter angle.</desc>

  <rect width="640" height="640" rx="40" fill="#f5ead7"/>
  <circle cx="326" cy="282" r="222" fill="#e0ebdf"/>
  <ellipse cx="331" cy="554" rx="192" ry="24" fill="#c4d3c4"/>

  <!-- Wheels, offset in perspective -->
  <g fill="#f5ead7" stroke="#253e43" stroke-width="15">
    <ellipse cx="221" cy="455" rx="55" ry="92" transform="rotate(-13 221 455)"/>
    <ellipse cx="423" cy="476" rx="66" ry="101" transform="rotate(-13 423 476)"/>
  </g>
  <g fill="none" stroke="#a3b7b5" stroke-width="3">
    <path d="M201 366 241 544M168 443 274 467M181 390 261 520M180 512 262 398"/>
    <path d="M400 378 446 574M359 460 487 492M372 404 474 548M379 546 467 406"/>
  </g>
  <g fill="#253e43">
    <ellipse cx="221" cy="455" rx="10" ry="13"/>
    <ellipse cx="423" cy="476" rx="11" ry="14"/>
  </g>

  <!-- Far leg and pedal -->
  <path d="m289 319 43 48-17 59" fill="none" stroke="#dd8b36" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m309 416 30 8 9 14-47-2Z" fill="#edaa42"/>
  <path d="m303 440 49 1" stroke="#253e43" stroke-width="9" stroke-linecap="round"/>

  <!-- Step-through city frame -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="m221 455 55-111 31 130-86-19 104-66" stroke="#278f8b" stroke-width="12"/>
    <path d="M276 344c10 99 54 114 103-59" stroke="#36a7a0" stroke-width="15"/>
    <path d="m307 474 72-189" stroke="#278f8b" stroke-width="12"/>
    <path d="m374 365 49 111m-34-115 46 112" stroke="#278f8b" stroke-width="9"/>
    <path d="m276 346-8-30m111 69-14-63" stroke="#253e43" stroke-width="9"/>
  </g>
  <path d="M244 307q21-13 56 1 10 6-1 14l-48 2q-19-6-7-17Z" fill="#9b573d"/>
  <circle cx="307" cy="474" r="20" fill="#253e43"/>
  <circle cx="307" cy="474" r="10" fill="#edf1e5"/>
  <path d="m307 474 34 20" stroke="#253e43" stroke-width="7" stroke-linecap="round"/>
  <path d="m322 497 42-1" stroke="#253e43" stroke-width="9" stroke-linecap="round"/>

  <!-- Swept-back handlebars -->
  <path d="m365 322-7-38m-48 12-9-23q-2-11 12-9l45 20 53 1q14-1 13 12l-3 18"
