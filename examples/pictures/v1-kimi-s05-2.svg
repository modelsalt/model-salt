<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <title>A cheerful pelican riding a red bicycle</title>

  <!-- Background -->
  <rect x="0" y="0" width="640" height="480" fill="#DFF3FB"/>

  <!-- Sun -->
  <g stroke="#FFD93B" stroke-width="7" stroke-linecap="round">
    <line x1="136" y1="80" x2="154" y2="80"/>
    <line x1="122.5" y1="47.5" x2="131" y2="39"/>
    <line x1="90" y1="34" x2="90" y2="22"/>
    <line x1="57.5" y1="47.5" x2="49" y2="39"/>
    <line x1="44" y1="80" x2="26" y2="80"/>
    <line x1="57.5" y1="112.5" x2="49" y2="121"/>
    <line x1="90" y1="126" x2="90" y2="138"/>
    <line x1="122.5" y1="112.5" x2="131" y2="121"/>
  </g>
  <circle cx="90" cy="80" r="38" fill="#FFD93B"/>

  <!-- Clouds -->
  <g fill="#FFFFFF" opacity="0.92">
    <ellipse cx="505" cy="58" rx="34" ry="20"/>
    <ellipse cx="538" cy="68" rx="26" ry="15"/>
    <ellipse cx="476" cy="70" rx="24" ry="14"/>
    <ellipse cx="200" cy="118" rx="28" ry="16"/>
    <ellipse cx="226" cy="126" rx="20" ry="12"/>
    <ellipse cx="176" cy="128" rx="18" ry="11"/>
  </g>

  <!-- Ground + shadow -->
  <rect x="0" y="425" width="640" height="55" fill="#8FD14F"/>
  <ellipse cx="315" cy="433" rx="200" ry="9" fill="#7AB648" opacity="0.6"/>

  <!-- Motion lines -->
  <g stroke="#A8D8EA" stroke-width="6" stroke-linecap="round">
    <line x1="88" y1="296" x2="112" y2="296"/>
    <line x1="76" y1="332" x2="108" y2="332"/>
    <line x1="88" y1="368" x2="112" y2="368"/>
  </g>

  <!-- ===== BICYCLE ===== -->
  <!-- Wheels -->
  <g fill="none">
    <circle cx="190" cy="360" r="70" stroke="#2D3436" stroke-width="14"/>
    <circle cx="440" cy="360" r="70" stroke="#2D3436" stroke-width="14"/>
    <circle cx="190" cy="360" r="56" stroke="#B2BEC3" stroke-width="5"/>
    <circle cx="440" cy="360" r="56" stroke="#B2BEC3" stroke-width="5"/>
  </g>
  <!-- Spokes -->
  <g stroke="#A4B0B6" stroke-width="3">
    <line x1="190" y1="360" x2="244" y2="360"/><line x1="190" y1="360" x2="228" y2="398"/>
    <line x1="190" y1="360" x2="190" y2="414"/><line x1="190" y1="360" x2="152" y2="398"/>
    <line x1="190" y1="360" x2="136" y2="360"/><line x1="190" y1="360" x2="152" y2="322"/>
    <line x1="190" y1="360" x2="190" y2="306"/><line x1="190" y1="360" x2="228" y2="322"/>
    <line x1="440" y1="360" x2="494" y2="360"/><line x1="440" y1="360" x2="478" y2="398"/>
    <line x1="440" y1="360" x2="440" y2="414"/><line x1="440" y1="360" x2="402" y2="398"/>
    <line x1="440" y1="360" x2="386" y2="360"/><line x1="440" y1="360" x2="402" y2="322"/>
    <line x1="440" y1="360" x2="440" y2="306"/><line x1="440" y1="360" x2="478" y2="322"/>
  </g>
  <!-- Chain, cog, hubs, chainring -->
  <g stroke="#636E72" fill="none">
    <line x1="300" y1="339" x2="192" y2="353" stroke-width="3"/>
    <line x1="300" y1="371" x2="192" y2="367" stroke-width="3"/>
    <circle cx="190" cy="360" r="10" stroke-width="4"/>
  </g>
  <circle cx="300" cy="355" r="16" fill="#ECF0F1" stroke="#636E72" stroke-width="5"/>
  <circle cx="190" cy="360" r="6" fill="#2D3436"/>
  <circle cx="440" cy="360" r="6" fill="#2D3436"/>
  <!-- Frame -->
  <g stroke="#E74C3C" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="190" y1="360" x2="298" y2="356"/>
    <line x1="190" y1="360" x2="280" y2="250"/>
    <line x1="300" y1="355" x2="283" y2="246"/>
    <line x1="283" y1="246" x2="405" y2="245"/>
    <line x1="405" y1="245" x2="413" y2="292"/>
    <line x1="413" y1="292" x2="300" y2="355"/>
    <line x1="413" y1="292" x2="440" y2="360"/>
    <line x1="282" y1="246" x2="280" y2="233"/>
    <path d="M 406 244 L 420 206"/>
    <path d="M 420 206 C 428 200 430 192 424 186 C 420 181 412 181 406 185"/>
  </g>
  <!-- Grip + saddle -->
  <line x1="412" y1="184" x2="400" y2="189" stroke="#2C3E50" stroke-width="10" stroke-linecap="round"/>
  <path d="M 254 232 C 266 224 292 224 302 231 C 306 236 302 241 294 241 L 262 241 C 252 241 249 236 254 232 Z" fill="#2D3436"/>
  <!-- Cranks + pedals -->
  <g stroke="#2D3436" stroke-width="7" stroke-linecap="round">
    <line x1="300" y1="355" x2="330" y2="382"/>
    <line x1="300" y1="355" x2="270" y2="328"/>
  </g>
  <rect x="323" y="383" width="27" height="11" rx="4" fill="#2D3436"/>
  <rect x="250" y="317" width="25" height="10" rx="4" fill="#2D3436"/>

  <!-- ===== PELICAN ===== -->
  <!-- Far leg + foot -->
  <path d="M 286 238 L 276 286 L 268 316" stroke="#E08E36" stroke-width="9" stroke-linecap="round" fill="none"/>
  <path d="M 252 310 L 284 310 L 287 320 L 254 322 Z" fill="#E08E36" stroke="#2C3E50" stroke-width="4" stroke-linejoin="round"/>
  <!-- Near leg + foot -->
  <path d="M 300 236 L 324 294 L 334 376" stroke="#F39C12" stroke-width="10" stroke-linecap="round" fill="none"/>
  <path d="M 316 374 L 352 374 L 358 385 L 342 390 L 316 388 Z" fill="#F39C12" stroke="#2C3E50" stroke-width="4" stroke-linejoin="round"/>
  <!-- Tail -->
  <path d="M 226 166 L 188 152 L 204 174 L 182 180 L 208 194 L 194 210 L 228 202 Z"
        fill="#FFF9EF" stroke="#2C3E50" stroke-width="4" stroke-linejoin="round"/>
  <!-- Body -->
  <ellipse cx="292" cy="182" rx="80" ry="60" transform="rotate(-6 292 182)"
           fill="#FFF9EF" stroke="#2C3E50" stroke-width="5"/>
  <!-- Wing reaching the handlebar -->
  <path d="M 270 150 C 318 148 372 162 408 186 C 416 191 413 202 404 201 C 356 197 302 200 268 198 Z"
        fill="#F4E7D3" stroke="#2C3E50" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 368 180 Q 384 188 396 198 M 346 178 Q 362 188 372 198"
        stroke="#DEC9A8" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Neck + head -->
  <path d="M 334 152 C 348 122 350 100 358 80 C 364 62 386 54 400 66
           C 412 76 414 94 404 106 C 394 124 388 144 382 162 C 366 174 344 168 334 152 Z"
        fill="#FFF9EF" stroke="#2C3E50" stroke-width="5" stroke-linejoin="round"/>
  <!-- Pouch -->
  <path d="M 398 94 C 414 146 452 160 482 142 C 496 133 506 124 512 116 C 474 104 430 96 398 94 Z"
        fill="#FFC078" stroke="#2C3E50" stroke-width="4" stroke-linejoin="round"/>
  <!-- Upper beak -->
  <path d="M 396 72 C 438 78 482 92 516 106 C 524 110 522 119 513 119 C 472 110 430 100 398 96 Z"
        fill="#F39C12" stroke="#2C3E50" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 418 82 C 448 88 478 96 500 104" stroke="#D57F1F" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 420 112 C 442 134 466 138 488 128" stroke="#E8A25E" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Eye -->
  <circle cx="390" cy="82" r="5" fill="#2C3E50"/>
  <circle cx="392" cy="80" r="1.6" fill="#FFFFFF"/>
</svg>