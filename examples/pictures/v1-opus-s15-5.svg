<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <title>Pelican riding a bicycle in a racing tuck</title>
  <rect width="1200" height="500" fill="#ffffff"/>

  <g fill="none" stroke="#1d1d1f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">

    <!-- Plain ground -->
    <line x1="30" y1="400" x2="1170" y2="400"/>
    <line x1="560" y1="412" x2="600" y2="412"/>
    <line x1="820" y1="408" x2="845" y2="408"/>
    <line x1="1010" y1="414" x2="1060" y2="414"/>

    <!-- Motion streaks trailing behind the rider -->
    <line x1="70"  y1="232" x2="250" y2="232"/>
    <line x1="120" y1="252" x2="268" y2="252"/>
    <line x1="40"  y1="272" x2="230" y2="272" stroke-dasharray="40 10 18 10"/>
    <line x1="150" y1="296" x2="262" y2="296"/>
    <line x1="60"  y1="318" x2="200" y2="318" stroke-dasharray="60 12"/>
    <line x1="110" y1="342" x2="215" y2="342"/>
    <line x1="30"  y1="366" x2="205" y2="366" stroke-dasharray="30 8 70 8"/>
    <line x1="140" y1="388" x2="222" y2="388"/>
    <line x1="455" y1="268" x2="520" y2="268" opacity="0"/>

    <!-- Back leg (behind the frame) -->
    <path d="M346,288 L372,302 L330,325"/>
    <path d="M322,322 L338,320 L334,330 Z"/>

    <!-- ===== Bicycle ===== -->
    <defs>
      <g id="wheel">
        <circle r="55"/>
        <circle r="50"/>
        <circle r="4"/>
        <line x1="50" y1="0" x2="-50" y2="0"/>
        <line x1="46.2" y1="-19.1" x2="-46.2" y2="19.1"/>
        <line x1="35.4" y1="-35.4" x2="-35.4" y2="35.4"/>
        <line x1="19.1" y1="-46.2" x2="-19.1" y2="46.2"/>
        <line x1="0" y1="-50" x2="0" y2="50"/>
        <line x1="-19.1" y1="-46.2" x2="19.1" y2="46.2"/>
        <line x1="-35.4" y1="-35.4" x2="35.4" y2="35.4"/>
        <line x1="-46.2" y1="-19.1" x2="46.2" y2="19.1"/>
      </g>
    </defs>
    <use href="#wheel" x="280" y="345"/>
    <use href="#wheel" x="430" y="345"/>

    <!-- Frame -->
    <path d="M345,355 L280,345 L330,282 Z"/>          <!-- chainstay + seat stay + seat tube -->
    <line x1="330" y1="282" x2="410" y2="288"/>        <!-- top tube -->
    <line x1="345" y1="355" x2="418" y2="305"/>        <!-- down tube -->
    <line x1="410" y1="286" x2="418" y2="306"/>        <!-- head tube -->
    <path d="M418,306 C424,322 428,334 430,345"/>      <!-- fork -->
    <line x1="330" y1="282" x2="327" y2="272"/>        <!-- seat post -->
    <path d="M312,271 L342,270 L336,274 L316,275 Z"/>  <!-- saddle -->

    <!-- Stem + drop handlebar + brake lever -->
    <line x1="411" y1="285" x2="428" y2="282"/>
    <path d="M428,282 C442,282 444,296 436,303 C431,307 425,305 425,300"/>
    <path d="M437,288 L442,296"/>

    <!-- Rear cassette -->
    <circle cx="280" cy="345" r="9"/>
    <circle cx="280" cy="345" r="6.5"/>

    <!-- Chainring with teeth, bolt circle -->
    <circle cx="345" cy="355" r="18"/>
    <circle cx="345" cy="355" r="21" stroke-dasharray="2 3"/>
    <circle cx="345" cy="355" r="8"/>

    <!-- Chain -->
    <line x1="345" y1="334" x2="280" y2="336" stroke-dasharray="4 2"/>
    <path d="M345,376 L289,378 L284,363 L280,354" stroke-dasharray="4 2"/>

    <!-- Rear derailleur: hanger, cage, jockey pulleys -->
    <path d="M281,350 L276,358 L284,363"/>
    <line x1="284" y1="363" x2="289" y2="378"/>
    <circle cx="284" cy="363" r="3.5"/>
    <circle cx="289" cy="378" r="3.5"/>

    <!-- Cranks + pedals -->
    <line x1="345" y1="355" x2="361" y2="385"/>
    <line x1="345" y1="355" x2="329" y2="325"/>
    <rect x="354" y="383" width="14" height="5" rx="1"/>
    <rect x="322" y="322" width="14" height="5" rx="1"/>

    <!-- ===== Pelican ===== -->
    <!-- Tail feathers -->
    <path d="M294,262 L272,252 M294,264 L270,261 M295,267 L273,271"/>

    <!-- Body, low and stretched forward -->
    <path fill="#ffffff" d="M292,262 C305,238 362,230 396,240 C412,245 420,257 413,269
                            C401,289 350,296 318,286 C305,281 296,273 292,262 Z"/>

    <!-- Belly / breast feather rows -->
    <path d="M318,280 q5,5 10,0 q5,5 10,0 q5,5 10,0 q5,5 10,0 q5,5 10,0 q5,5 10,0"/>
    <path d="M330,288 q5,4 10,0 q5,4 10,0 q5,4 10,0 q5,4 10,0"/>
    <path d="M396,262 q4,4 8,0 q2,5 6,2"/>

    <!-- Folded wing with layered feathers -->
    <path fill="#ffffff" d="M398,248 C380,240 336,240 298,252 C322,268 362,272 396,262 Z"/>
    <path d="M388,250 q-5,6 -10,0 q-5,6 -10,0 q-5,6 -10,0 q-5,6 -10,0"/>
    <path d="M378,258 q-5,5 -10,0 q-5,5 -10,0 q-5,5 -10,0 q-5,5 -10,0 q-5,5 -10,0"/>
    <path d="M338,262 L300,253 M346,265 L306,257 M354,267 L312,260 M332,256 L302,251"/>

    <!-- Near leg driving the low pedal -->
    <path d="M362,286 L382,318 L361,382"/>
    <path d="M352,383 L372,381 L368,388 L361,384 L356,389 Z"/>

    <!-- Near wing reaching forward to grip the drops -->
    <path fill="#ffffff" d="M388,254 C402,266 416,280 428,292 C420,296 404,286 390,270 Z"/>
    <path d="M428,292 L434,298 M424,294 L428,301 M419,292 L421,299"/>
    <path d="M398,264 q3,5 8,3 M406,272 q3,5 8,3"/>

    <!-- Neck tucked low -->
    <path d="M395,240 C405,231 415,232 420,237"/>
    <path d="M410,264 C418,259 422,256 428,256"/>

    <!-- Head -->
    <ellipse fill="#ffffff" cx="428" cy="245" rx="14" ry="11"/>
    <path d="M416,238 L405,231 M417,242 L407,238"/>      <!-- crest feathers -->
    <circle cx="433" cy="242" r="2"/>                     <!-- eye -->
    <path d="M429,236 q4,-2 8,1"/>                        <!-- brow, focused -->

    <!-- Long beak thrust forward, with hooked tip and pouch -->
    <path fill="#ffffff" d="M440,240 L532,252 Q538,255 529,259 L440,250 Z"/>
    <path d="M440,252 C468,274 506,270 526,259"/>
    <path d="M455,256 C475,266 498,265 512,260"/>
  </g>
</svg>