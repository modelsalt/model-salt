<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title desc">
  <title id="title">A pelican riding a bicycle</title>
  <desc id="desc">A white pelican with an orange bill and salmon pouch, seated upright on a teal bicycle, pedaling with webbed feet while its wingtips rest on the handlebar grips.</desc>

  <!-- background -->
  <rect width="800" height="600" fill="#EDF4F1"/>

  <!-- ground shadows -->
  <ellipse cx="250" cy="534" rx="66" ry="9" fill="#DCE7E1"/>
  <ellipse cx="545" cy="534" rx="66" ry="9" fill="#DCE7E1"/>

  <!-- motion dashes -->
  <g stroke="#C7D6CF" stroke-width="7" stroke-linecap="round">
    <line x1="122" y1="420" x2="162" y2="420"/>
    <line x1="100" y1="460" x2="156" y2="460"/>
    <line x1="126" y1="500" x2="166" y2="500"/>
  </g>

  <!-- ======= BICYCLE ======= -->
  <!-- rear wheel -->
  <g fill="none">
    <circle cx="250" cy="460" r="72" stroke="#2F2F38" stroke-width="11"/>
    <circle cx="250" cy="460" r="57" stroke="#B9C0CC" stroke-width="3"/>
    <g stroke="#B9C0CC" stroke-width="3">
      <line x1="250" y1="403" x2="250" y2="517"/>
      <line x1="193" y1="460" x2="307" y2="460"/>
      <line x1="210" y1="420" x2="290" y2="500"/>
      <line x1="290" y1="420" x2="210" y2="500"/>
    </g>
  </g>
  <circle cx="250" cy="460" r="7" fill="#2F2F38"/>

  <!-- front wheel -->
  <g fill="none">
    <circle cx="545" cy="460" r="72" stroke="#2F2F38" stroke-width="11"/>
    <circle cx="545" cy="460" r="57" stroke="#B9C0CC" stroke-width="3"/>
    <g stroke="#B9C0CC" stroke-width="3">
      <line x1="545" y1="403" x2="545" y2="517"/>
      <line x1="488" y1="460" x2="602" y2="460"/>
      <line x1="505" y1="420" x2="585" y2="500"/>
      <line x1="585" y1="420" x2="505" y2="500"/>
    </g>
  </g>
  <circle cx="545" cy="460" r="7" fill="#2F2F38"/>

  <!-- frame -->
  <g stroke="#2A9D8F" stroke-width="9" stroke-linecap="round" fill="none">
    <line x1="250" y1="460" x2="395" y2="465"/>
    <line x1="250" y1="460" x2="372" y2="342"/>
    <line x1="395" y1="465" x2="374" y2="336"/>
    <line x1="395" y1="465" x2="510" y2="372"/>
    <line x1="374" y1="336" x2="498" y2="322"/>
    <line x1="510" y1="372" x2="545" y2="460"/>
    <line x1="496" y1="318" x2="512" y2="376"/>
  </g>

  <!-- handlebar and grip -->
  <path d="M498 322 L500 286 Q496 276 484 275 L470 277" fill="none" stroke="#2A9D8F" stroke-width="8" stroke-linecap="round"/>
  <line x1="474" y1="276" x2="458" y2="280" stroke="#2F2F38" stroke-width="10" stroke-linecap="round"/>

  <!-- saddle -->
  <path d="M342 322 Q344 312 358 311 L388 311 Q399 312 397 320 Q395 327 384 327 L352 327 Q342 326 342 322 Z" fill="#2F2F38"/>

  <!-- drivetrain -->
  <circle cx="395" cy="465" r="22" fill="none" stroke="#2F2F38" stroke-width="5"/>
  <circle cx="250" cy="460" r="10" fill="none" stroke="#2F2F38" stroke-width="4"/>
  <g stroke="#4A4A55" stroke-width="3">
    <line x1="250" y1="450" x2="395" y2="443"/>
    <line x1="250" y1="470" x2="395" y2="487"/>
  </g>
  <g stroke="#2F2F38" stroke-width="8" stroke-linecap="round">
    <line x1="395" y1="465" x2="430" y2="500"/>
    <line x1="395" y1="465" x2="360" y2="430"/>
  </g>
  <rect x="414" y="494" width="34" height="9" rx="4" fill="#2F2F38"/>
  <rect x="343" y="425" width="34" height="9" rx="4" fill="#2F2F38"/>

  <!-- ======= PELICAN ======= -->
  <!-- far leg and webbed foot (on the raised rear pedal) -->
  <path d="M336 300 C348 336 354 376 358 424" fill="none" stroke="#B5858A" stroke-width="12" stroke-linecap="round"/>
  <g transform="translate(360 424) rotate(-4)">
    <path d="M-12 -3 L6 -4 L20 -7 L23 -4 L13 -1 L24 1 L23 5 L12 3 L14 8 L9 8 L5 4 L-12 4 Q-16 0 -12 -3 Z" fill="#B5858A"/>
  </g>

  <!-- tail -->
  <path d="M292 246 C272 234 252 230 236 234 C250 246 262 258 272 272 C280 264 288 254 292 246 Z" fill="#FBF6EC"/>
  <path d="M236 234 C250 246 262 258 272 272 C260 268 246 254 236 240 Z" fill="#DDE4EA"/>

  <!-- body -->
  <ellipse cx="355" cy="260" rx="78" ry="58" fill="#FBF6EC" transform="rotate(-8 355 260)"/>
  <path d="M289 266 C296 302 330 320 372 316 C400 313 422 300 430 284 C420 308 392 322 356 321 C318 320 292 298 289 266 Z" fill="#EFE7D6"/>

  <!-- folded wing -->
  <path d="M338 206 C388 198 424 226 423 260 C422 290 394 307 357 305 C322 303 301 283 303 257 C305 231 317 210 338 206 Z" fill="#DDE4EA"/>
  <path d="M303 254 C300 282 322 302 356 305 C336 296 326 280 328 260 C318 266 309 262 303 254 Z" fill="#AEB9C4"/>

  <!-- near leg and webbed foot (on the lowered front pedal) -->
  <path d="M384 306 C400 334 398 386 412 434 C420 462 426 480 430 494" fill="none" stroke="#C89B9B" stroke-width="13" stroke-linecap="round"/>
  <g transform="translate(430 494) rotate(5)">
    <path d="M-12 -3 L6 -4 L20 -7 L23 -4 L13 -1 L24 1 L23 5 L12 3 L14 8 L9 8 L5 4 L-12 4 Q-16 0 -12 -3 Z" fill="#C89B9B"/>
  </g>

  <!-- wing arm reaching to handlebar grip -->
  <path d="M406 244 C428 250 448 262 466 273" fill="none" stroke="#FBF6EC" stroke-width="17" stroke-linecap="round"/>
  <ellipse cx="470" cy="277" rx="11" ry="7.5" fill="#FBF6EC" transform="rotate(15 470 277)"/>

  <!-- neck, crest, head -->
  <path d="M398 238 C414 214 428 200 444 188 C456 178 462 170 466 160" fill="none" stroke="#FBF6EC" stroke-width="30" stroke-linecap="round"/>
  <path d="M452 136 C444 126 444 116 450 110 C454 120 460 128 466 134 Z" fill="#FBF6EC"/>
  <ellipse cx="470" cy="154" rx="25" ry="22" fill="#FBF6EC" transform="rotate(-10 470 154)"/>

  <!-- pouch: one bold mass under the bill -->
  <path d="M492 168 C512 192 544 208 580 212 C614 216 650 206 670 192 C664 204 636 218 600 222 C556 227 518 212 500 190 C494 182 491 174 492 168 Z" fill="#F2997B"/>

  <!-- upper bill -->
  <path d="M486 138 C548 136 618 156 670 184 C676 188 676 193 670 194 C612 200 548 194 494 172 C486 162 484 148 486 138 Z" fill="#F4A259"/>
  <path d="M500 148 C550 148 610 164 652 182" fill="none" stroke="#D97F3F" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- eye -->
  <circle cx="478" cy="146" r="4.5" fill="#2F2F38"/>
  <circle cx="479.5" cy="144.5" r="1.3" fill="#FDFCF7"/>
</svg>