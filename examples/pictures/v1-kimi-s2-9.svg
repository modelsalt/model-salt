<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <title>Pelican riding a bicycle — one-line neon illustration</title>

  <defs>
    <radialGradient id="bg" cx="50%" cy="68%" r="90%">
      <stop offset="0" stop-color="#101033"/>
      <stop offset="1" stop-color="#05050f"/>
    </radialGradient>

    <linearGradient id="neon" gradientUnits="userSpaceOnUse" x1="70" y1="430" x2="530" y2="790">
      <stop offset="0"    stop-color="#1df2ff"/>
      <stop offset="0.25" stop-color="#4d7bff"/>
      <stop offset="0.5"  stop-color="#a44dff"/>
      <stop offset="0.75" stop-color="#ff3fd4"/>
      <stop offset="1"    stop-color="#ff5e8a"/>
    </linearGradient>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <path id="spark" d="M0 -7 L1.8 -1.8 L7 0 L1.8 1.8 L0 7 L-1.8 1.8 L-7 0 L-1.8 -1.8 Z"/>
  </defs>

  <!-- night sky -->
  <rect width="600" height="900" fill="url(#bg)"/>

  <!-- open space above: sparse sparkle + crescent moon -->
  <path d="M500 79 A26 26 0 1 0 500 131 A32 32 0 1 1 500 79 Z" fill="#ffe9a8" opacity="0.85"/>
  <use href="#spark" transform="translate(130 150)" fill="#7df9ff" opacity="0.8"/>
  <use href="#spark" transform="translate(262 92) scale(0.7)" fill="#ffffff" opacity="0.65"/>
  <use href="#spark" transform="translate(425 175) scale(1.25)" fill="#ff7ad9" opacity="0.8"/>
  <use href="#spark" transform="translate(520 320) scale(0.8)" fill="#7df9ff" opacity="0.5"/>
  <use href="#spark" transform="translate(88 332) scale(0.9)" fill="#b78bff" opacity="0.5"/>
  <use href="#spark" transform="translate(330 235) scale(0.55)" fill="#ffffff" opacity="0.35"/>

  <!-- ground glow + horizon -->
  <ellipse cx="300" cy="788" rx="255" ry="11" fill="url(#neon)" opacity="0.10"/>
  <path d="M36 782 H566" stroke="url(#neon)" stroke-width="2.5" opacity="0.3" stroke-linecap="round" fill="none"/>

  <!-- speed lines -->
  <g stroke="#7df9ff" stroke-width="3" stroke-linecap="round" opacity="0.45">
    <path d="M24 648 H64"/>
    <path d="M12 680 H60"/>
    <path d="M30 712 H68"/>
  </g>

  <!-- ================= ONE CONTINUOUS LINE =================
       beak -> head -> neck -> back -> tail -> belly -> legs/pedals
       -> chainring -> wing -> handlebar -> fork -> front wheel/fender
       -> basket -> frame -> saddle -> rear wheel/fender -> rack
       -> bird body -> pouch -> back to start (closed loop) -->
