<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican riding a folding bicycle</title>
  <desc id="desc">An earthy, softly shaded pelican with short legs rides a compact olive folding bicycle, seen from above its left side.</desc>
  <defs>
    <radialGradient id="background">
      <stop stop-color="#fff8e8"/>
      <stop offset="1" stop-color="#e5d6b6"/>
    </radialGradient>
    <linearGradient id="feathers" x1="0" y1="0" x2=".8" y2="1">
      <stop stop-color="#fff8df"/>
      <stop offset=".5" stop-color="#e5d8b6"/>
      <stop offset="1" stop-color="#a49970"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#dfd2aa"/>
      <stop offset=".55" stop-color="#a9a078"/>
      <stop offset="1" stop-color="#686c46"/>
    </linearGradient>
    <linearGradient id="bill" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#edc361"/>
      <stop offset=".45" stop-color="#c99939"/>
      <stop offset="1" stop-color="#a56236"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#d89763"/>
      <stop offset="1" stop-color="#a9573e"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#a0a265"/>
      <stop offset=".45" stop-color="#737b45"/>
      <stop offset="1" stop-color="#434d2c"/>
    </linearGradient>
    <linearGradient id="tire" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#75604c"/>
      <stop offset="1" stop-color="#352b24"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <g id="wheel">
      <ellipse rx="65" ry="71" fill="none" stroke="url(#tire)" stroke-width="14"/>
      <ellipse rx="55" ry="61" fill="none" stroke="#b7a684" stroke-width="4"/>
      <g stroke="#a99a7b" stroke-width="2">
        <path d="M-53-14 53 14M-43 37 43-37M-10 59 10-59M-46-32 46 32M-34-48 34 48M-54 13 54-13"/>
      </g>
      <ellipse rx="9" ry="10" fill="#786849" stroke="#d1bd91" stroke-width="3"/>
    </g>
  </defs>

  <path fill="url(#background)" d="M0 0h800v600H0z"/>
  <ellipse cx="411" cy="500" rx="232" ry="24" fill="#695b39" opacity=".16" filter="url(#blur)"/>

  <!-- Compact wheels and far pedal -->
  <use href="#wheel" transform="translate(256 420)"/>
  <use href="#wheel" transform="translate(548 442)"/>
  <path d="m421 409 35-24" fill="none" stroke="#776744" stroke-width="9" stroke-linecap="round"/>
  <path d="m443 382 31 5" stroke="#51432e" stroke-width="10" stroke-linecap="round"/>

  <!-- Single low folding frame, fork, and telescoping posts -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="m548 442-81-93-44 69 125 24" stroke="#626b3c" stroke-width="10"/>
    <path d="m256 420 31-102 133 65 47-34" stroke="url(#frame)" stroke-width="18"/>
    <path d="m287 318-11-85" stroke="#93896b" stroke-width="10"/>
    <path d="m280 274-5-40" stroke="#d2c19b" stroke-width="4"/>
    <path d="m467 349 7-65" stroke="#8b8063" stroke-width="11"/>
    <path d="m470 316 4-32" stroke="#d0bf96" stroke-width="4"/>
    <path d="m275 234-28-10-29 11m29-11 28-14 35 7" stroke="#766c4d" stroke-width="8"/>
    <path d="m219 235 18-7m54-15 18 4" stroke="#67452f" stroke-width="12"/>
  </g>
  <path d="m365 350 17 8-6 24-18-8z" fill="#b5a171" stroke="#625b39" stroke-width="3"/>
  <path d="m371 359 11 3" stroke="#f0dcad" stroke-width="3" stroke-linecap="round"/>
  <path d="M449 273q29-11 55 4 10 9-6 13l-48-2q-17-7-1-15" fill="#714b35"/>
  <path d="M451 276q26-6 46 4" fill="none" stroke="#a57b52" stroke-width="4" stroke-linecap="round"/>

  <!-- Far short leg -->
  <path d="m477 287-20 43 3 43" fill="none" stroke="#a66d3c" stroke-width="13" stroke-linecap="round"/>
  <path d="m459 366-16 13 36 4-7-13" fill="url(#bill)"/>

  <!-- Tail, body, and curved neck -->
  <path d="m535 236 63-11-33 29 24 1-49 31" fill="url(#wing)" stroke="#807853" stroke-width="2"/>
  <path d="M360 197
           C391 182 414 192 446 197
           C494 185 547 207 557 243
           C570 287 522 314 472 303
           C428 298 397 277 372 258
           C347 240 326 225 321 200
           C315 173 333 158 338 140
           C341 127 333 116 319 114
           C302 112 289 120 285 132
           C273 122 277 99 292 89
           C318 70 353 83 365 108
           C378 137 354 161 351 179
           C349 187 352 194 360 197Z"
        fill="url(#feathers)" stroke="#96845c" stroke-width="2"/>

  <!-- Long beak and hanging throat pouch -->
  <path d="M299 120 132 143
           C166 177 223 190 268 160
           Q290 145 299 120Z"
        fill="url(#pouch)" stroke="#9e673c" stroke-width="2"/>
  <path d="M299 112 121 139
           Q115 143 128 147
           L299 132Q308 122 299 112Z"
        fill="url(#bill)" stroke="#9f7735" stroke-width="2"/>
  <path d="m136 141 153-18" fill="none" stroke="#f5d27a" stroke-width="3" stroke-linecap="round"/>
  <path d="M152 151q65 26 112 1" fill="none" stroke="#e4ae78" stroke-width="3" opacity=".6"/>
  <ellipse cx="307" cy="108" rx="9" ry="10" fill="#d2ab54"/>
  <ellipse cx="305" cy="108" rx="4.5" ry="6" fill="#352b24"/>
  <circle cx="303.5" cy="105.5" r="1.7" fill="#fff8df"/>

  <!-- Wing reaching forward to the handlebar -->
  <path d="M477 220
           C440 198 409 214 378 231
           C344 246 311 235 285 222
           Q274 220 279 231
           C312 266 356 275 395 257
           C430 245 456 258 477 220Z"
        fill="url(#wing)" stroke="#8a8058" stroke-width="2"/>
  <g fill="none" stroke="#d5c69c" stroke-width="3" stroke-linecap="round" opacity=".75">
    <path d="M451 224q-34 0-62 19"/>
    <path d="M434 235q-35 20-66 19"/>
    <path d="M356 255q-36 0-61-22"/>
  </g>

  <!-- Near short leg and webbed foot on the pedal -->
  <path d="m458 295-37 26 1 45" fill="none" stroke="#b27e43" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m456 296-31 27 1 32" fill="none" stroke="#d5a65b" stroke-width="5" stroke-linecap="round"/>
  <path d="m421 359-24 18 12 1-8 7 39-3-8-18Z" fill="url(#bill)" stroke="#9b6d36" stroke-width="2"/>
  <ellipse cx="423" cy="418" rx="22" ry="24" fill="#716c43" stroke="#b4a373" stroke-width="4"/>
  <path d="m423 418-9-35" stroke="#d5c196" stroke-width="7" stroke-linecap="round"/>
  <path d="m398 384 35 2" stroke="#594730" stroke-width="8" stroke-linecap="round"/>
  <circle cx="423" cy="418" r="6" fill="#e5cf9e"/>
</svg>