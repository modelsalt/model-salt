<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5EB4F3"/>
      <stop offset="1" stop-color="#0F62C4"/>
    </linearGradient>
    <radialGradient id="highlight" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE9A8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFE9A8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunCore" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#FFE39A"/>
      <stop offset="1" stop-color="#FFB300"/>
    </radialGradient>
    <linearGradient id="cloudFill" x1="0" y1="228" x2="0" y2="386" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D2E7F9"/>
    </linearGradient>
  </defs>

  <!-- Square background, sharp corners -->
  <rect width="512" height="512" fill="url(#sky)"/>
  <ellipse cx="110" cy="80" rx="280" ry="210" fill="url(#highlight)"/>

  <!-- Distant cloud -->
  <g fill="#FFFFFF" opacity="0.35">
    <circle cx="396" cy="122" r="20"/>
    <circle cx="428" cy="108" r="27"/>
    <circle cx="460" cy="122" r="19"/>
    <rect x="376" y="122" width="103" height="20" rx="10"/>
  </g>

  <!-- Sun glow, rays, and core -->
  <circle cx="185" cy="178" r="150" fill="url(#glow)"/>
  <g stroke="#FFC93C" stroke-width="15" stroke-linecap="round">
    <line x1="185" y1="80" x2="185" y2="50"/>
    <line x1="185" y1="80" x2="185" y2="50" transform="rotate(45 185 178)"/>
    <line x1="185" y1="80" x2="185" y2="50" transform="rotate(90 185 178)"/>
    <line x1="185" y1="80" x2="185" y2="50" transform="rotate(135 185 178)"/>
    <line x1="185" y1="80" x2="185" y2="50" transform="rotate(180 185 178)"/>
    <line x1="185" y1="80" x2="185" y2="50" transform="rotate(225 185 178)"/>
    <line x1="185" y1="80" x2="185" y2="50" transform="rotate(270 185 178)"/>
    <line x1="185" y1="80" x2="185" y2="50" transform="rotate(315 185 178)"/>
  </g>
  <circle cx="185" cy="178" r="78" fill="url(#sunCore)"/>

  <!-- Cloud shadow -->
  <g transform="translate(0 16)" fill="#0B4DA2" opacity="0.15">
    <circle cx="178" cy="332" r="52"/>
    <circle cx="258" cy="298" r="68"/>
    <circle cx="336" cy="332" r="52"/>
    <rect x="126" y="332" width="262" height="52" rx="26"/>
  </g>

  <!-- Main cloud -->
  <g fill="url(#cloudFill)">
    <circle cx="178" cy="332" r="52"/>
    <circle cx="258" cy="298" r="68"/>
    <circle cx="336" cy="332" r="52"/>
    <rect x="126" y="332" width="262" height="52" rx="26"/>
  </g>
</svg>