<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Coastal Palette:
         Deep Ocean Navy (Line): #1B3B4B
         Ocean Blue: #387B98
         Deep Ocean Blue (Cel Shade): #285A70
         Soft Sky/Foam: #EBF2F5
         White: #FFFFFF
         Sandy Grey (Body/Pouch): #DED8CE
         Dark Sandy Grey (Cel Shade): #C4BDB0
         Warm Sand (Beak/Legs): #E6B87D
         Dark Warm Sand (Cel Shade): #CE9E60
    -->
    <style>
      .continuous-line {
        fill: none;
        stroke: #1B3B4B;
        stroke-width: 5.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .thin-line {
        fill: none;
        stroke: #1B3B4B;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .bg-sky { fill: #EBF2F5; }
      .fill-white { fill: #FFFFFF; }
      .fill-sand-grey { fill: #DED8CE; }
      .shade-sand-grey { fill: #C4BDB0; }
      .fill-warm-sand { fill: #E6B87D; }
      .shade-warm-sand { fill: #CE9E60; }
      .fill-ocean { fill: #387B98; }
      .shade-ocean { fill: #285A70; }
      .fill-navy { fill: #1B3B4B; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" class="bg-sky" />

  <!-- Subtle Coastal Horizon / Ground Shadow -->
  <ellipse cx="415" cy="520" rx="220" ry="12" class="fill-sand-grey" />

  <!-- ==========================================
       CEL-SHADED COLOR BLOCKS (UNDERLAY)
       ========================================== -->
  <g id="color-fills">
    <!-- Far Wing (Behind Neck) -->
    <path d="M 380 265 Q 435 285 480 250 Q 430 295 375 290 Z" class="shade-sand-grey" />

    <!-- Far Leg & Webbed Foot (Coasting Forward) -->
    <path d="M 355 365 L 475 315 L 495 280 L 510 295 L 490 325 L 472 325 L 350 375 Z" class="shade-warm-sand" />

    <!-- Bicycle Wheels (Small Circus Mini-Bike Wheels) -->
    <circle cx="290" cy="465" r="52" class="fill-white" />
    <circle cx="290" cy="465" r="52" stroke="#DED8CE" stroke-width="10" fill="none" />
    <circle cx="530" cy="465" r="52" class="fill-white" />
    <circle cx="530" cy="465" r="52" stroke="#DED8CE" stroke-width="10" fill="none" />

    <!-- Compact Folding Mini-Bike Frame (Ocean Blue with Cel Shading) -->
    <path d="M 285 460 L 340 385 L 415 415 L 505 375 L 535 465 L 522 468 L 498 392 L 415 432 L 410 470 L 395 470 L 400 425 L 345 402 L 295 468 Z" class="fill-ocean" />
    <!-- Frame Cel Shade -->
    <path d="M 415 425 L 500 388 L 503 395 L 415 434 Z" class="shade-ocean" />
    <path d="M 340 395 L 402 422 L 400 430 L 338 402 Z" class="shade-ocean" />
    <!-- Folding Hinge Box -->
    <rect x="442" y="395" width="14" height="22" rx="3" transform="rotate(-22 449 406)" class="shade-ocean" />

    <!-- Saddle -->
    <path d="M 310 380 Q 340 368 375 380 Q 365 398 320 392 Z" class="fill-navy" />

    <!-- Pelican Body & Head (White Base) -->
    <path d="M 235 335 
             C 245 310, 290 290, 325 275 
             C 340 245, 315 160, 345 120 
             C 365 95, 410 95, 430 120 
             C 425 165, 395 215, 415 265 
             C 440 325, 410 380, 345 380 
             C 295 380, 265 355, 235 335 Z" class="fill-white" />

    <!-- Pelican Body Cel-Shading (Sandy Grey Underbelly, Back & Neck Shadow) -->
    <path d="M 235 335 
             C 265 355, 295 380, 345 380 
             C 405 380, 430 335, 415 280 
             C 395 330, 355 350, 305 345 
             C 275 342, 255 335, 235 335 Z" class="fill-sand-grey" />
    <path d="M 345 120 C 328 155, 350 235, 338 275 C 352 275, 362 260, 360 230 C 358 190, 345 150, 360 120 Z" class="fill-sand-grey" />
    <!-- Deep Cel-Shade under tail/seat -->
    <path d="M 265 350 C 295 375, 335 382, 375 375 C 395 365, 410 345, 415 325 C 390 355, 340 365, 265 350 Z" class="shade-sand-grey" />

    <!-- Pelican Beak & Gular Pouch -->
    <!-- Upper Mandible (Warm Sand) -->
    <path d="M 426 115 C 495 110, 580 112, 625 118 C 632 120, 630 132, 620 132 C 560 130, 490 135, 425 140 Z" class="fill-warm-sand" />
    <path d="M 426 128 C 495 125, 570 125, 624 128 L 620 132 C 560 130, 490 135, 425 140 Z" class="shade-warm-sand" />
    
    <!-- Big Throat Pouch (Sandy Grey with Deep Cel-Shade) -->
    <path d="M 425 140 
             C 490 135, 560 130, 618 132 
             C 590 215, 505 245, 435 210 
             C 415 198, 412 165, 425 140 Z" class="fill-sand-grey" />
    <!-- Pouch Cel-Shade -->
    <path d="M 420 175 
             C 465 215, 545 205, 610 145 
             C 580 215, 500 242, 435 210 
             C 418 200, 414 185, 420 175 Z" class="shade-sand-grey" />

    <!-- Near Wing (Steering the Handlebar) -->
    <path d="M 335 275 
             C 375 260, 435 260, 488 252 
             C 495 262, 482 280, 460 288 
             C 420 305, 365 325, 320 315 
             C 305 310, 315 282, 335 275 Z" class="fill-white" />
    <!-- Wing Cel-Shade (Lower Feathers) -->
    <path d="M 320 315 
             C 365 325, 420 305, 460 288 
             C 482 280, 492 266, 488 255 
             C 455 275, 390 295, 318 302 Z" class="fill-sand-grey" />

    <!-- Near Leg & Webbed Foot (Lifted High & Coasting Forward) -->
    <path d="M 345 375 L 465 340 L 490 300 L 508 318 L 482 355 L 462 352 L 340 388 Z" class="fill-warm-sand" />
    <path d="M 342 382 L 463 347 L 482 355 L 462 352 L 340 388 Z" class="shade-warm-sand" />
  </g>

