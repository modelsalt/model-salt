<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Wheel Component for Equal-Sized Road Cruiser Wheels -->
    <g id="wheel">
      <!-- Spokes -->
      <g stroke="#CBD5E1" stroke-width="3">
        <line x1="-90" y1="0" x2="90" y2="0" />
        <line x1="0" y1="-90" x2="0" y2="90" />
        <line x1="-63.6" y1="-63.6" x2="63.6" y2="63.6" />
        <line x1="-63.6" y1="63.6" x2="63.6" y2="-63.6" />
        <line x1="-83.1" y1="-34.4" x2="83.1" y2="34.4" />
        <line x1="-34.4" y1="-83.1" x2="34.4" y2="83.1" />
        <line x1="-83.1" y1="34.4" x2="83.1" y2="-34.4" />
        <line x1="-34.4" y1="83.1" x2="34.4" y2="-83.1" />
      </g>
      <!-- Inner Rim -->
      <circle cx="0" cy="0" r="82" fill="none" stroke="#94A3B8" stroke-width="6" />
      <!-- Whitewall / Accent -->
      <circle cx="0" cy="0" r="87" fill="none" stroke="#F8FAFC" stroke-width="4" />
      <!-- Outer Tire -->
      <circle cx="0" cy="0" r="95" fill="none" stroke="#1E293B" stroke-width="14" />
      <!-- Hub -->
      <circle cx="0" cy="0" r="12" fill="#475569" />
    </g>
  </defs>

  <!-- Background: Clean, Flat Geometric Backdrop -->
  <rect width="800" height="600" fill="#E0F2FE" />
  
  <!-- Bold Geometric Sun -->
  <circle cx="650" cy="140" r="70" fill="#FDE047" />

  <!-- Minimalist Clouds -->
  <path d="M 100 140 L 220 140 A 20 20 0 0 0 220 100 L 200 100 A 35 35 0 0 0 130 100 L 100 100 A 20 20 0 0 0 100 140 Z" fill="#FFFFFF" />
  <path d="M 420 90 L 510 90 A 15 15 0 0 0 510 60 L 490 60 A 25 25 0 0 0 440 60 L 420 60 A 15 15 0 0 0 420 90 Z" fill="#FFFFFF" />

  <!-- Ground / Road -->
  <rect x="0" y="510" width="800" height="90" fill="#BAE6FD" />
  <line x1="60" y1="510" x2="740" y2="510" stroke="#38BDF8" stroke-width="8" stroke-linecap="round" />

  <!-- ==================== PELICAN: BACK LIMBS ==================== -->
  <!-- Far Wing (Reaching to Handlebar) -->
  <path d="M 300 220 C 370 190, 440 205, 505 220 C 440 245, 370 250, 300 240 Z" fill="#CBD5E1" />
  
  <!-- Left Leg (Far Side - Raised Pedal) -->
  <g id="left-leg">
    <!-- Far Crank Arm -->
    <line x1="360" y1="410" x2="330" y2="365" stroke="#64748B" stroke-width="8" stroke-linecap="round" />
    <!-- Drumstick / Upper Leg -->
    <line x1="295" y1="300" x2="275" y2="340" stroke="#D97706" stroke-width="14" stroke-linecap="round" />
    <!-- Lower Leg -->
    <line x1="275" y1="340" x2="325" y2="365" stroke="#D97706" stroke-width="10" stroke-linecap="round" />
    <!-- Webbed Foot -->
    <path d="M 320 365 L 355 365 L 345 352 Z" fill="#D97706" />
    <!-- Far Pedal -->
    <rect x="312" y="363" width="36" height="8" rx="4" fill="#0F172A" />
  </g>

  <!-- ==================== BICYCLE ==================== -->
  <!-- Rear & Front Equal-Sized Wheels -->
  <use href="#wheel" x="210" y="410" />
  <use href="#wheel" x="570" y="410" />

  <!-- Rear Drivetrain / Chain -->
  <path d="M 210 400 L 360 390 L 360 430 L 210 420 Z" fill="none" stroke="#475569" stroke-width="4" stroke-linejoin="round" />
  <circle cx="210" cy="410" r="14" fill="none" stroke="#475569" stroke-width="5" />

  <!-- Seatpost & handlebar stem (Under Frame) -->
  <line x1="315" y1="275" x2="295" y2="235" stroke="#94A3B8" stroke-width="10" stroke-linecap="round" />
  <path d="M 520 275 L 505 220 L 485 220" fill="none" stroke="#94A3B8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Classic Diamond Frame (Bold Teal) -->
  <g stroke="#0D9488" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Rear Triangle (Chainstay & Seatstay) -->
    <polygon points="210,410 315,275 360,410" />
    <!-- Front Triangle (Top Tube, Down Tube, Seat Tube) -->
    <polygon points="315,275 520,275 360,410" />
    <!-- Head Tube & Front Fork -->
    <line x1="517" y1="265" x2="570" y2="410" />
  </g>
  <!-- Head Tube Accent -->
  <line x1="515" y1="260" x2="528" y2="295" stroke="#0F766E" stroke-width="14" stroke-linecap="round" />

  <!-- Center Hubs Over Frame -->
  <circle cx="210" cy="410" r="6" fill="#E2E8F0" />
  <circle cx="570" cy="410" r="6" fill="#E2E8F0" />

  <!-- Crankset / Chainring -->
  <circle cx="360" cy="410" r="24" fill="#CBD5E1" stroke="#334155" stroke-width="6" />
  <circle cx="360" cy="410" r="8" fill="#334155" />

  <!-- Cruiser Saddle -->
  <path d="M 255 235 C 255 220, 325 225, 335 235 C 325 250, 270 250, 255 235 Z" fill="#1E293B" />

  <!-- ==================== PELICAN: BODY & HEAD ==================== -->
  <!-- Tail Feathers -->
  <polygon points="215,235 170,210 185,235 165,250 215,255" fill="#CBD5E1" />
  <polygon points="220,230 180,195 235,215" fill="#F8FAFC" />

  <!-- Main Body & Curved Neck (Full Side Profile) -->
  <path d="M 215 235 
           C 215 315, 345 315, 365 235 
           C 380 180, 345 145, 345 90 
           L 385 90 
           C 400 145, 420 190, 385 265 
           C 350 330, 215 320, 215 235 Z" fill="#F8FAFC" />
  <!-- Torso Fill to solidify geometry -->
  <path d="M 215 235 C 215 170, 340 165, 370 235 C 365 315, 215 315, 215 235 Z" fill="#F8FAFC" />
  <!-- Minimalist Underbelly Shading -->
  <path d="M 225 260 C 255 310, 345 305, 375 245 C 350 290, 255 290, 225 260 Z" fill="#E2E8F0" />

  <!-- Head Feathers / Crest -->
  <polygon points="345,75 315,65 335,88 310,95 345,100" fill="#E2E8F0" />
  
  <!-- Head Base -->
  <circle cx="368" cy="85" r="26" fill="#F8FAFC" />
  <!-- Yellow Crown Patch -->
  <path d="M 350 67 A 26 26 0 0 1 388 70 L 368 85 Z" fill="#FDE047" />

  <!-- Giant Pelican Beak & Gular Pouch (Clear Side Profile) -->
  <!-- Lower Gular Pouch (Massive Geometric Sweep) -->
  <path d="M 380 92 C 390 195, 520 195, 585 92 Z" fill="#FB923C" />
  <!-- Pouch Minimalist Shadow Fold -->
  <path d="M 385 100 C 410 170, 510 170, 575 94 C 510 150, 415 150, 385 100 Z" fill="#F97316" />
  
  <!-- Upper Mandible (Long, Straight Top Ridge) -->
  <polygon points="380,72 590,82 585,94 380,94" fill="#FACC15" />
  <!-- Beak Hook Tip -->
  <path d="M 588 82 C 600 82, 602 98, 588 104 L 583 94 Z" fill="#EF4444" />

  <!-- Eye & Eye Ring -->
  <circle cx="374" cy="80" r="8" fill="#FDE047" />
  <circle cx="376" cy="80" r="4.5" fill="#0F172A" />
  <circle cx="378" cy="78" r="1.5" fill="#FFFFFF" />

  <!-- ==================== PELICAN: FRONT LIMBS ==================== -->
  <!-- Right Leg (Near Side - Extended Down to Bottom Pedal) -->
  <g id="right-leg">
    <!-- Thigh Feather Base -->
    <path d="M 285 275 L 330 275 L 320 315 L 295 315 Z" fill="#E2E8F0" />
    <!-- Upper Leg -->
    <line x1="308" y1="305" x2="345" y2="380" stroke="#F97316" stroke-width="14" stroke-linecap="round" />
    <!-- Knee Joint -->
    <circle cx="345" cy="380" r="7" fill="#F97316" />
    <!-- Lower Leg -->
    <line x1="345" y1="380" x2="385" y2="455" stroke="#F97316" stroke-width="10" stroke-linecap="round" />
    <!-- Near Crank Arm -->
    <line x1="360" y1="410" x2="390" y2="455" stroke="#94A3B8" stroke-width="8" stroke-linecap="round" />
    <!-- Webbed Foot -->
    <path d="M 380 455 L 420 455 L 405 440 Z" fill="#F97316" />
    <!-- Near Pedal -->
    <rect x="372" y="453" width="36" height="8" rx="4" fill="#1E293B" />
  </g>

  <!-- Near Wing (Reaching Forward to Grip Handlebar) -->
  <g id="near-wing">
    <!-- Wing Shoulder & Main Span -->
    <path d="M 285 210 
             C 340 190, 420 215, 488 225 
             C 488 242, 430 265, 360 260 
             C 310 255, 275 240, 285 210 Z" fill="#F8FAFC" />
    <!-- Bold Geometric Secondary Feathers -->
    <path d="M 310 248 C 360 262, 430 258, 488 232 L 488 222 C 430 245, 360 248, 310 235 Z" fill="#CBD5E1" />
    <!-- Primary Wingtips Wrapping Handlebar -->
    <path d="M 465 218 L 495 215 A 10 10 0 0 1 495 235 L 465 235 Z" fill="#334155" />
    <!-- Handlebar Grip (Over Wingtip) -->
    <rect x="468" y="214" width="26" height="12" rx="6" fill="#1E293B" />
  </g>

  <!-- Motion Lines (Clean Geometric Accents) -->
  <line x1="70" y1="410" x2="95" y2="410" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
  <line x1="40" y1="350" x2="85" y2="350" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
  <line x1="90" y1="240" x2="135" y2="240" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
</svg>