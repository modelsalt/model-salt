<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Rear wheel -->
  <circle cx="100" cy="220" r="52" fill="#2b2b2b"/>
  <circle cx="100" cy="220" r="44" fill="#ffffff"/>
  <circle cx="100" cy="220" r="6" fill="#2b2b2b"/>
  <g stroke="#2b2b2b" stroke-width="2">
    <line x1="100" y1="176" x2="100" y2="264"/>
    <line x1="56" y1="220" x2="144" y2="220"/>
    <line x1="69" y1="189" x2="131" y2="251"/>
    <line x1="131" y1="189" x2="69" y2="251"/>
  </g>

  <!-- Front wheel -->
  <circle cx="300" cy="220" r="52" fill="#2b2b2b"/>
  <circle cx="300" cy="220" r="44" fill="#ffffff"/>
  <circle cx="300" cy="220" r="6" fill="#2b2b2b"/>
  <g stroke="#2b2b2b" stroke-width="2">
    <line x1="300" y1="176" x2="300" y2="264"/>
    <line x1="256" y1="220" x2="344" y2="220"/>
    <line x1="269" y1="189" x2="331" y2="251"/>
    <line x1="331" y1="189" x2="269" y2="251"/>
  </g>

  <!-- Frame -->
  <g stroke="#d9342b" stroke-width="7" stroke-linecap="round" fill="none">
    <line x1="100" y1="220" x2="190" y2="225"/>
    <line x1="100" y1="220" x2="170" y2="140"/>
    <line x1="170" y1="140" x2="190" y2="225"/>
    <line x1="170" y1="140" x2="270" y2="140"/>
    <line x1="270" y1="140" x2="190" y2="225"/>
    <line x1="270" y1="140" x2="300" y2="220"/>
    <line x1="270" y1="140" x2="262" y2="112"/>
    <line x1="170" y1="140" x2="165" y2="120"/>
  </g>
  <!-- Handlebar -->
  <rect x="246" y="106" width="34" height="7" rx="3" fill="#2b2b2b"/>
  <!-- Seat -->
  <rect x="146" y="112" width="40" height="9" rx="4" fill="#2b2b2b"/>
  <!-- Crank and pedal -->
  <circle cx="190" cy="225" r="9" fill="#2b2b2b"/>
  <line x1="190" y1="225" x2="208" y2="244" stroke="#2b2b2b" stroke-width="4"/>
  <rect x="202" y="240" width="18" height="7" rx="2" fill="#2b2b2b"/>
  <line x1="190" y1="225" x2="172" y2="206" stroke="#2b2b2b" stroke-width="4"/>

  <!-- Pelican body -->
  <ellipse cx="165" cy="105" rx="52" ry="34" fill="#f4f1ea"/>
  <!-- Tail -->
  <polygon points="118,98 88,88 96,112" fill="#f4f1ea"/>
  <!-- Wing (reaching forward to handlebar) -->
  <path d="M150 92 Q205 70 258 110 L255 118 Q205 95 155 112 Z" fill="#dcd6c8"/>
  <!-- Neck -->
  <path d="M192 90 Q215 60 220 40 L236 44 Q232 72 206 102 Z" fill="#f4f1ea"/>
  <!-- Head -->
  <circle cx="232" cy="38" r="18" fill="#f4f1ea"/>
  <!-- Upper beak -->
  <polygon points="244,32 312,42 246,46" fill="#f5a623"/>
  <!-- Pouch -->
  <path d="M246 46 L306 44 Q290 74 250 60 Z" fill="#e8893d"/>
  <!-- Eye -->
  <circle cx="238" cy="33" r="3.5" fill="#2b2b2b"/>

  <!-- Leg to pedal -->
  <path d="M178 132 L198 200 L208 244" stroke="#f5a623" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Foot -->
  <polygon points="200,240 222,236 224,246 202,250" fill="#f5a623"/>
</svg>