<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Partly cloudy weather app icon">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="85%">
      <stop offset="0%" stop-color="#151524"/>
      <stop offset="60%" stop-color="#0d0d16"/>
      <stop offset="100%" stop-color="#07070c"/>
    </radialGradient>
    <radialGradient id="haloG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffc300" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#ffc300" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunFill" cx="38%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#fff6c9"/>
      <stop offset="45%" stop-color="#ffe14d"/>
      <stop offset="100%" stop-color="#ffb200"/>
    </radialGradient>
    <linearGradient id="cloudFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2feff"/>
      <stop offset="55%" stop-color="#c9f1ff"/>
      <stop offset="100%" stop-color="#8fdcff"/>
    </linearGradient>
    <filter id="neonSun" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14" result="b"/>
      <feFlood flood-color="#ffc300" flood-opacity=".9" result="c"/>
      <feComposite in="c" in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="neonCloud" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" result="b"/>
      <feFlood flood-color="#38d6ff" flood-opacity=".75" result="c"/>
      <feComposite in="c" in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="rayL" d="M185 -40 L206 75 L164 75 Z"/>
    <path id="rayS" d="M185 15 L200 75 L170 75 Z"/>
  </defs>

  <!-- near-black field, sharp square corners -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- ambient halo + tiny neon stars -->
  <circle cx="185" cy="175" r="170" fill="url(#haloG)"/>
  <g fill="#8ef4ff">
    <circle cx="430" cy="52" r="3" opacity=".8"/>
    <circle cx="496" cy="140" r="2.5" opacity=".7"/>
    <circle cx="30" cy="132" r="2.5" opacity=".6"/>
    <circle cx="104" cy="492" r="2.5" opacity=".5"/>
    <circle cx="44" cy="452" r="2.5" opacity=".6"/>
  </g>
  <g stroke-linecap="round" fill="none">
    <path d="M456 84 H480 M468 72 V96" stroke="#bdf3ff" stroke-width="5"/>
    <path d="M66 468 H82 M74 460 V476" stroke="#ffe27a" stroke-width="4.5"/>
  </g>

  <!-- sun: spiky alternating rays, cropped by top/left borders -->
  <g filter="url(#neonSun)">
    <g fill="#ffc933" stroke="#171006" stroke-width="9" stroke-linejoin="round">
      <use href="#rayL"/>
      <use href="#rayS" transform="rotate(30 185 175)"/>
      <use href="#rayL" transform="rotate(60 185 175)"/>
      <use href="#rayS" transform="rotate(90 185 175)"/>
      <use href="#rayL" transform="rotate(120 185 175)"/>
      <use href="#rayS" transform="rotate(150 185 175)"/>
      <use href="#rayL" transform="rotate(180 185 175)"/>
      <use href="#rayS" transform="rotate(210 185 175)"/>
      <use href="#rayL" transform="rotate(240 185 175)"/>
      <use href="#rayS" transform="rotate(270 185 175)"/>
      <use href="#rayL" transform="rotate(300 185 175)"/>
      <use href="#rayS" transform="rotate(330 185 175)"/>
    </g>
    <circle cx="185" cy="175" r="105" fill="url(#sunFill)" stroke="#171006" stroke-width="10"/>
  </g>

  <!-- sun face peeking over the cloud -->
  <g stroke="#241a05" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M128 150 q14 -16 28 0"/>
    <path d="M214 150 q14 -16 28 0"/>
    <path d="M164 188 q21 18 42 0"/>
  </g>
  <ellipse cx="118" cy="178" rx="12" ry="8" fill="#ff8fa3" opacity=".55"/>
  <ellipse cx="250" cy="178" rx="12" ry="8" fill="#ff8fa3" opacity=".55"/>

  <!-- single cloud, half-hiding the sun, cropped by right border -->
  <g filter="url(#neonCloud)">
    <path d="M138 430
             C124 346 158 268 226 262
             C224 196 276 162 330 172
             C344 116 430 110 452 168
             C506 156 552 206 540 268
             C578 290 574 392 542 430 Z"
          fill="url(#cloudFill)" stroke="#0b1c26" stroke-width="11" stroke-linejoin="round"/>
  </g>
  <ellipse cx="388" cy="178" rx="46" ry="20" fill="#ffffff" opacity=".6" transform="rotate(-16 388 178)"/>
  <ellipse cx="205" cy="290" rx="26" ry="11" fill="#ffffff" opacity=".5" transform="rotate(-12 205 290)"/>

  <!-- cloud face -->
  <circle cx="368" cy="302" r="9" fill="#0e2a38"/>
  <circle cx="438" cy="302" r="9" fill="#0e2a38"/>
  <circle cx="365" cy="299" r="2.5" fill="#ffffff"/>
  <circle cx="435" cy="299" r="2.5" fill="#ffffff"/>
  <path d="M382 326 q21 16 42 0" stroke="#0e2a38" stroke-width="8" stroke-linecap="round" fill="none"/>
  <ellipse cx="338" cy="322" rx="10" ry="7" fill="#ff9fb2" opacity=".5"/>
  <ellipse cx="468" cy="322" rx="10" ry="7" fill="#ff9fb2" opacity=".5"/>
</svg>