<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e6fd9"/>
      <stop offset="1" stop-color="#8cc8ff"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#ffb347" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>

    <!-- Sticker die-cut: white border + dark outer line + soft drop shadow -->
    <filter id="sticker" x="-15%" y="-15%" width="130%" height="130%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="7" result="d1"/>
      <feFlood flood-color="#ffffff" result="w"/>
      <feComposite in="w" in2="d1" operator="in" result="white"/>
      <feMorphology in="SourceAlpha" operator="dilate" radius="10" result="d2"/>
      <feFlood flood-color="#13213d" result="n"/>
      <feComposite in="n" in2="d2" operator="in" result="dark"/>
      <feOffset in="d2" dx="6" dy="8" result="off"/>
      <feFlood flood-color="#0a3570" flood-opacity="0.35" result="s"/>
      <feComposite in="s" in2="off" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="dark"/>
        <feMergeNode in="white"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <g id="spokes" stroke="#9fb3cc" stroke-width="2">
      <line x1="-88" y1="0" x2="88" y2="0"/>
      <line x1="-88" y1="0" x2="88" y2="0" transform="rotate(30)"/>
      <line x1="-88" y1="0" x2="88" y2="0" transform="rotate(60)"/>
      <line x1="-88" y1="0" x2="88" y2="0" transform="rotate(90)"/>
      <line x1="-88" y1="0" x2="88" y2="0" transform="rotate(120)"/>
      <line x1="-88" y1="0" x2="88" y2="0" transform="rotate(150)"/>
    </g>
    <g id="wheel">
      <circle r="100" fill="none" stroke="#13213d" stroke-width="12"/>
      <circle r="91" fill="none" stroke="#ff8a1f" stroke-width="4"/>
      <use xlink:href="#spokes"/>
      <circle r="9" fill="#13213d"/>
      <circle r="4" fill="#c9d3e0"/>
    </g>
  </defs>

  <!-- ===== SKY ===== -->
  <rect width="800" height="600" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="680" cy="100" r="95" fill="url(#sunGlow)"/>
  <g stroke="#ffb347" stroke-width="8" stroke-linecap="round">
    <line x1="680" y1="20" x2="680" y2="0"/>
    <line x1="680" y1="180" x2="680" y2="200"/>
    <line x1="600" y1="100" x2="580" y2="100"/>
    <line x1="760" y1="100" x2="780" y2="100"/>
    <line x1="623" y1="43" x2="609" y2="29"/>
    <line x1="737" y1="157" x2="751" y2="171"/>
    <line x1="737" y1="43" x2="751" y2="29"/>
    <line x1="623" y1="157" x2="609" y2="171"/>
  </g>
  <circle cx="680" cy="100" r="58" fill="#ff8a1f" stroke="#ffffff" stroke-width="6"/>
  <circle cx="662" cy="82" r="18" fill="#ffb04d"/>

  <!-- Clouds -->
  <g fill="#ffffff">
    <g opacity="0.95">
      <ellipse cx="140" cy="110" rx="70" ry="28"/>
      <circle cx="110" cy="95" r="30"/>
      <circle cx="155" cy="82" r="38"/>
      <circle cx="195" cy="102" r="26"/>
    </g>
    <g opacity="0.85">
      <ellipse cx="430" cy="70" rx="55" ry="20"/>
      <circle cx="410" cy="58" r="24"/>
      <circle cx="448" cy="50" r="28"/>
    </g>
    <g opacity="0.8">
      <ellipse cx="560" cy="200" rx="45" ry="16"/>
      <circle cx="545" cy="190" r="18"/>
      <circle cx="575" cy="184" r="22"/>
    </g>
  </g>

  <!-- Speed lines -->
  <g stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.75">
    <line x1="40" y1="250" x2="170" y2="250"/>
    <line x1="70" y1="300" x2="150" y2="300"/>
    <line x1="20" y1="380" x2="120" y2="380"/>
    <line x1="60" y1="460" x2="130" y2="460"/>
  </g>

  <!-- ===== STICKER: PELICAN + BICYCLE ===== -->
  <g filter="url(#sticker)">

    <!-- Far leg (behind the bike) -->
    <polyline points="420,282 448,345 362,407" fill="none" stroke="#d96a0a" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M362,407 L340,398 L346,414 L336,422 L364,416 Z" fill="#d96a0a"/>

    <!-- Far crank and pedal -->
    <line x1="390" y1="450" x2="360" y2="410" stroke="#3a4a66" stroke-width="7" stroke-linecap="round"/>
    <rect x="346" y="405" width="28" height="9" rx="2" fill="#13213d"/>

    <!-- Wheels -->
    <use xlink:href="#wheel" x="250" y="440"/>
    <use xlink:href="#wheel" x="565" y="440"/>

    <!-- Chain -->
    <g fill="none" stroke="#5b6b85" stroke-width="4" stroke-dasharray="5 3">
      <line x1="250" y1="427" x2="390" y2="421"/>
      <line x1="250" y1="453" x2="390" y2="479"/>
    </g>
    <!-- Rear cog + derailleur -->
    <circle cx="250" cy="440" r="13" fill="none" stroke="#5b6b85" stroke-width="4"/>
    <path d="M252,455 L258,478 L250,486" fill="none" stroke="#3a4a66" stroke-width="4" stroke-linecap="round"/>
    <circle cx="258" cy="478" r="4" fill="#3a4a66"/>

    <!-- Diamond frame -->
    <g stroke="#1f5fbf" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="360" y1="300" x2="390" y2="450"/>   <!-- seat tube -->
      <line x1="360" y1="300" x2="520" y2="290"/>   <!-- top tube -->
      <line x1="390" y1="450" x2="535" y2="340"/>   <!-- down tube -->
      <line x1="390" y1="450" x2="250" y2="440"/>   <!-- chainstay -->
      <line x1="360" y1="300" x2="250" y2="440"/>   <!-- seatstay -->
    </g>
    <!-- Head tube + fork -->
    <line x1="518" y1="282" x2="537" y2="345" stroke="#174a96" stroke-width="14" stroke-linecap="round"/>
    <path d="M535,340 L560,425 L565,440" fill="none" stroke="#174a96" stroke-width="8" stroke-linecap="round"/>
    <!-- Orange frame accents -->
    <line x1="420" y1="296" x2="470" y2="293" stroke="#ff8a1f" stroke-width="4" stroke-linecap="round"/>
    <line x1="430" y1="420" x2="490" y2="374" stroke="#ff8a1f" stroke-width="4" stroke-linecap="round"/>

    <!-- Chainring -->
    <circle cx="390" cy="450" r="29" fill="#c9d3e0" stroke="#3a4a66" stroke-width="5"/>
    <circle cx="390" cy="450" r="18" fill="none" stroke="#5b6b85" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="390" cy="450" r="6" fill="#13213d"/>

    <!-- Seat post + saddle -->
    <line x1="360" y1="300" x2="357" y2="290" stroke="#3a4a66" stroke-width="7"/>
    <path d="M330,288 L388,285 C394,291 384,297 362,297 L338,296 Z" fill="#13213d"/>

    <!-- Stem + drop handlebar -->
    <line x1="519" y1="286" x2="550" y2="283" stroke="#3a4a66" stroke-width="7" stroke-linecap="round"/>
    <path d="M550,283 C574,281 576,300 568,315 C562,326 550,326 545,320" fill="none" stroke="#13213d" stroke-width="8" stroke-linecap="round"/>

    <!-- Pelican: tail -->
    <path d="M320,256 L280,238 L298,262 L282,280 L326,272 Z" fill="#e9eef5" stroke="#13213d" stroke-width="3" stroke-linejoin="round"/>

    <!-- Body (low, stretched racer pose) -->
    <path d="M310,262 C320,230 380,212 450,215 C505,218 535,236 538,258 C532,286 470,296 400,293 C358,291 328,282 310,262 Z"
          fill="#ffffff" stroke="#13213d" stroke-width="3"/>
    <!-- Racing jersey number patch -->
    <circle cx="420" cy="262" r="15" fill="#1f5fbf"/>
    <text x="420" y="268" font-family="Arial Black, Arial, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">7</text>

    <!-- Folded wing on body -->
    <path d="M478,230 C430,224 375,236 340,262 C360,268 380,262 395,256 C405,264 420,262 432,254 C445,262 465,258 485,250 Z"
          fill="#d7e0ec" stroke="#13213d" stroke-width="3" stroke-linejoin="round"/>

    <!-- Near leg pumping down to pedal -->
    <polyline points="440,288 478,372 424,486" fill="none" stroke="#ff8a1f" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="478" cy="372" r="7" fill="#ff8a1f"/>

    <!-- Near crank + pedal + webbed foot -->
    <line x1="390" y1="450" x2="420" y2="490" stroke="#3a4a66" stroke-width="8" stroke-linecap="round"/>
    <rect x="404" y="486" width="32" height="10" rx="2" fill="#13213d"/>
    <path d="M424,486 L398,478 L406,489 L396,497 L410,494 L432,492 Z" fill="#ff8a1f" stroke="#13213d" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Neck, stretched forward -->
    <path d="M498,232 C530,225 552,198 586,195 L600,226 C572,229 546,256 516,262 Z"
          fill="#ffffff" stroke="#13213d" stroke-width="3" stroke-linejoin="round"/>

    <!-- Wing-arm reaching to grip the drops -->
    <path d="M494,238 C522,248 548,274 560,300 L548,308 C532,286 506,268 486,258 Z"
          fill="#d7e0ec" stroke="#13213d" stroke-width="3" stroke-linejoin="round"/>
    <path d="M548,300 C556,296 566,302 566,312 C560,318 550,316 546,310 Z" fill="#c2cedd" stroke="#13213d" stroke-width="2.5"/>

    <!-- Head -->
    <ellipse cx="596" cy="212" rx="27" ry="22" fill="#ffffff" stroke="#13213d" stroke-width="3"/>

    <!-- Aero helmet -->
    <path d="M566,206 C566,182 598,172 624,186 C634,192 636,200 630,204 L600,200 Z"
          fill="#1f5fbf" stroke="#13213d" stroke-width="3" stroke-linejoin="round"/>
    <path d="M578,190 C592,183 610,183 624,190" fill="none" stroke="#ff8a1f" stroke-width="4" stroke-linecap="round"/>
    <path d="M566,204 L546,200 L566,196 Z" fill="#1f5fbf" stroke="#13213d" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Pouch -->
    <path d="M614,226 L730,232 C704,262 654,270 620,252 Z" fill="#e8700c" stroke="#13213d" stroke-width="3" stroke-linejoin="round"/>
    <!-- Upper beak -->
    <path d="M610,202 L738,220 C746,224 744,232 732,233 L612,227 Z" fill="#ff9a2e" stroke="#13213d" stroke-width="3" stroke-linejoin="round"/>
    <path d="M736,221 C744,226 744,232 734,234 L728,228 Z" fill="#d95f00"/>

    <!-- Focused eye -->
    <circle cx="604" cy="208" r="6" fill="#13213d"/>
    <circle cx="606" cy="206" r="2" fill="#ffffff"/>
    <path d="M594,199 L614,202" stroke="#13213d" stroke-width="3" stroke-linecap="round"/>

    <!-- Sweat drop -->
    <path d="M572,226 C568,234 568,240 573,240 C578,240 578,234 572,226 Z" fill="#8cc8ff" stroke="#13213d" stroke-width="2"/>
  </g>

  <!-- Motion puffs behind the rear wheel -->
  <g fill="#ffffff" opacity="0.9">
    <circle cx="130" cy="535" r="14"/>
    <circle cx="105" cy="528" r="10"/>
    <circle cx="85" cy="538" r="7"/>
  </g>
</svg>