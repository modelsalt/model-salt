    <path d="m330 275 14 17m102 18 4 21" stroke-width="13"/>

    <!-- Near wing reaching the handlebar -->
    <path d="M322 207c22 5 36 28 42 50l-19 36-16-7 10-31-29-24Z" fill="#F59B38"/>

    <!-- Near leg and webbed foot -->
    <path d="m265 285 30 48-14 80" stroke="#F59B38" stroke-width="17"/>
    <path d="m281 402 27 24-11 7-13-6-14 2-11-9Z" fill="#F59B38"/>
    <circle cx="316" cy="458" r="15" fill="#F59B38"/>
    <path d="m316 458-30-27m-18 0 36 3"/>

    <!-- Front wheel -->
    <ellipse cx="435" cy="492" rx="66" ry="111" fill="#142C45"/>
    <ellipse cx="435" cy="492" rx="53" ry="97" stroke="#F59B38" stroke-width="5"/>
    <g stroke="#F59B38" stroke-width="3">
      <path d="M435 395v194m-53-97h106m-91-69 76 138m-76 0 76-138m-88 32 100 74m-100 0 100-74"/>
    </g>
    <path d="m399 403 36 89" stroke="#142C45" stroke-width="15"/>
    <path d="m399 403 36 89" stroke="#F59B38" stroke-width="6"/>
    <circle cx="435" cy="492" r="10" fill="#F59B38"/>
