<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
  <title id="title">Pelican riding a folding bicycle</title>
  <desc id="desc">A long-necked pelican pedals left on a small-wheeled folding bicycle, illustrated in angular violet, lavender, muted gold, and ivory facets.</desc>
