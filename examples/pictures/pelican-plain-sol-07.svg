<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640"
     role="img" aria-labelledby="title desc">
  <title id="title">Pelican riding a bicycle</title>
  <desc id="desc">A cheerful white pelican with a golden bill pedals a coral bicycle against a soft mint background.</desc>

  <defs>
    <g id="wheel">
      <circle r="94" fill="#fffaf0" stroke="#243b43" stroke-width="12"/>
      <circle r="81" fill="none" stroke="#b6c9c5" stroke-width="3"/>
      <g stroke="#b6c9c5" stroke-width="2.5">
        <path d="M-80 0H80M0-80V80M-57-57 57 57M-57 57 57-57"/>
        <path d="m-74-31 148 62m-105 43 62-148m-105 105 148-62m-105-43 62 148"/>
      </g>
      <circle r="10" fill="#243b43"/>
    </g>
  </defs>

  <!-- A little seaside sunshine -->
  <rect width="800" height="640" rx="32" fill="#fffaf0"/>
  <circle cx="405" cy="302" r="246" fill="#dceee6"/>
  <circle cx="638" cy="130" r="39" fill="#f4cf75"/>
  <g fill="none" stroke="#a5c8bc" stroke-width="4" stroke-linecap="round">
    <path d="M111 225h46m-66 19h41"/>
    <path d="M126 340h53m-72 19h31"/>
    <path d="M613 249q12-14 24 0 12-14 24 0"/>
  </g>
  <ellipse cx="407" cy="591" rx="267" ry="15" fill="#d2ded2"/>

  <!-- Bicycle wheels -->
  <use href="#wheel" x="249" y="487"/>
  <use href="#wheel" x="566" y="487"/>

  <!-- Far pedal and leg -->
  <g stroke="#243b43" stroke-linecap="round" stroke-linejoin="round">
    <path d="m397 472-33 27" fill="none" stroke-width="8"/>
    <path d="M349 499h32" fill="none" stroke-width="9"/>
    <path d="m342 329 29 68-16 75" fill="none" stroke="#ce8b39" stroke-width="14"/>
    <path d="m355 466-19 25 43-1-12-13" fill="#e8a440" stroke-width="4"/>
  </g>

  <!-- Coral frame -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="m249 487 96-121 52 106-148 15
             m96-121 167-4-115 110
             m115-110 54 125"
          stroke="#243b43" stroke-width="15"/>
    <path d="m249 487 96-121 52 106-148 15
             m96-121 167-4-115 110
             m115-110 54 125"
          stroke="#e67f66" stroke-width="9"/>
    <path d="m345 366-11-30m178 26-14-48q-3-14 12-14h29"
          stroke="#243b43" stroke-width="9"/>
    <path d="M526 300h23" stroke="#8c654b" stroke-width="12"/>
  </g>
  <path d="M310 329q21-9 54 1 7 3 2 10h-53q-13-2-3-11"
        fill="#243b43"/>
  <circle cx="397" cy="472" r="24" fill="#fffaf0" stroke="#243b43" stroke-width="6"/>
  <circle cx="397" cy="472" r="7" fill="#243b43"/>
  <path d="m397 472 37-29" stroke="#243b43" stroke-width="8" stroke-linecap="round"/>
  <path d="M421 443h34" stroke="#243b43" stroke-width="9" stroke-linecap="round"/>

  <!-- Pelican tail and body -->
  <g stroke="#243b43" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round">
    <path d="m306 299-66-24 29 42-31-7q32 39 80 28"
          fill="#344e57"/>
    <path d="M282 285
             C306 250 351 249 383 266
             C411 248 425 215 424 180
             C422 140 440 114 468 117
             C500 119 507 144 493 167
             C479 191 466 213 466 242
             C465 289 438 325 398 343
             C357 366 300 351 281 323
             Q269 305 282 285Z"
          fill="#fffdf5"/>

    <!-- Long bill and generous throat pouch -->
    <path d="M483 156 692 178
             Q665 200 630 213
             Q558 243 499 189Z"
          fill="#efb852"/>
    <path d="M483 153q95-1 209 25l-202 1"
          fill="#f7d778"/>
    <path d="m500 181 164 1" fill="none" stroke="#d5923b" stroke-width="3"/>
    <path d="M513 190q41 29 93 15" fill="none" stroke="#f9d68d" stroke-width="5"/>

    <!-- Face -->
    <circle cx="471" cy="144" r="7" fill="#243b43" stroke="none"/>
    <circle cx="473" cy="142" r="2" fill="#fffdf5" stroke="none"/>
    <path d="M451 128q9-5 17-2" fill="none" stroke-width="3"/>
    <path d="m441 117-8-11m17 10-1-14" fill="none" stroke-width="3"/>

    <!-- Folded wing -->
    <path d="M302 282
             Q344 261 387 288
             Q402 301 394 318
             Q350 343 305 315
             Q288 304 302 282Z"
          fill="#e4e9df"/>
    <path d="M313 300q24 23 61 15
             m-50-25q22 19 52 16"
          fill="none" stroke="#a9bbb4" stroke-width="3"/>

    <!-- Wing reaching toward the handlebars -->
    <path d="M410 253q24 6 42 31l66 16
             q12 4 8 12-3 7-14 4l-75-12
             q-24-5-36-24"
          fill="#fffdf5"/>

    <!-- Near leg and webbed foot -->
    <path d="m382 337 42 42-4 44"
          fill="none" stroke="#e5a345" stroke-width="14"/>
    <path d="m420 416-10 22q15 9 41 4l-14-13-8-13"
          fill="#f0b94f"/>
    <path d="m422 431 9 9" fill="none" stroke="#cb8a36" stroke-width="2.5"/>
  </g>

  <!-- A jaunty scarf -->
  <path d="m429 219 37 11-4 15-39-12Z" fill="#e67f66"/>
  <path d="M428 230q-34 10-66-4l13 19-18 8q40 6 77-13"
        fill="#e67f66" stroke="#243b43" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="m378 235 30 5" fill="none" stroke="#f9baa3" stroke-width="3" stroke-linecap="round"/>

  <!-- Bell -->
  <path d="M514 295q0-11 10-11t10 11Z"
        fill="#f2c55c" stroke="#243b43" stroke-width="3"/>
  <g fill="none" stroke="#d7aa47" stroke-width="3" stroke-linecap="round">
    <path d="m540 278 7-7m-22 1v-9"/>
  </g>
</svg>