<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" shape-rendering="geometricPrecision">
  <!-- Sharp-edged Square Background: Upper Horizon (Deepest Midnight Blue) -->
  <rect x="0" y="0" width="512" height="256" fill="#070B19" />
  
  <!-- Sharp-edged Square Background: Lower Horizon (Rich Midnight Blue) -->
  <rect x="0" y="256" width="512" height="256" fill="#111C38" />
  
  <!-- Horizon Split Highlight Line (Electric Cyan) -->
  <rect x="0" y="254" width="512" height="4" fill="#00F0FF" />

  <!-- Minimalist Geometric Sun (Gold, positioned across the horizon line) -->
  <circle cx="240" cy="240" r="105" fill="#FFB800" />

  <!-- Flat Vector Cloud (Electric Cyan, asymmetrically anchored to the bottom-left) -->
  <path d="M -20 512 
           L -20 350 
           A 85 85 0 0 1 130 295 
           A 70 70 0 0 1 255 335 
           A 65 65 0 0 1 355 390 
           A 65 65 0 0 1 355 512 
           Z" 
        fill="#00F0FF" />
</svg>