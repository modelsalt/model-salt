<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <title>A pelican casually riding a unicycle along the beach, seen from ground level</title>

  <!-- ====== SKY (pale tint of the ink hue) ====== -->
  <rect x="0" y="0" width="800" height="800" fill="#EAF3F4"/>

  <!-- Accent sun -->
  <circle cx="648" cy="140" r="66" fill="none" stroke="#EE6C4A" stroke-width="3" opacity="0.4"/>
  <circle cx="648" cy="140" r="52" fill="#EE6C4A"/>

  <!-- Distant gulls -->
  <path d="M176,172 q9,-11 18,0 q9,-11 18,0" fill="none" stroke="#17404F" stroke-width="3" stroke-linecap="round"/>
  <path d="M290,140 q7,-9 14,0 q7,-9 14,0" fill="none" stroke="#17404F" stroke-width="3" stroke-linecap="round"/>

  <!-- Breeze lines -->
  <path d="M140,250 h34 M172,286 h26" fill="none" stroke="#17404F" stroke-width="4" stroke-linecap="round" opacity="0.45"/>

  <!-- ====== SEA (low horizon — we're down on the sand) ====== -->
  <rect x="0" y="600" width="800" height="60" fill="#C3DDE3"/>
  <g fill="none" stroke="#17404F" stroke-width="3" stroke-linecap="round" opacity="0.45">
    <path d="M60,620 q11,-9 22,0"/>
    <path d="M170,634 q11,-9 22,0"/>
    <path d="M300,620 q11,-9 22,0"/>
    <path d="M480,632 q11,-9 22,0"/>
    <path d="M590,620 q11,-9 22,0"/>
    <path d="M700,636 q11,-9 22,0"/>
    <path d="M120,648 q11,-9 22,0"/>
    <path d="M540,648 q11,-9 22,0"/>
  </g>

  <!-- ====== SAND ====== -->
  <rect x="0" y="660" width="800" height="140" fill="#FFFFFF"/>
  <path d="M0,662 C150,654 250,668 400,662 C550,656 650,668 800,660" fill="none" stroke="#17404F" stroke-width="2" opacity="0.35"/>
  <g fill="#17404F" opacity="0.3">
    <circle cx="90" cy="700" r="2.5"/><circle cx="150" cy="742" r="2"/><circle cx="210" cy="684" r="2.5"/>
    <circle cx="560" cy="700" r="2"/><circle cx="620" cy="742" r="2.5"/><circle cx="690" cy="690" r="2"/>
    <circle cx="740" cy="730" r="2.5"/><circle cx="660" cy="770" r="2"/><circle cx="120" cy="770" r="2.5"/>
  </g>
  <g stroke="#17404F" stroke-width="3" stroke-linecap="round" opacity="0.3">
    <path d="M80,730 h18"/><path d="M600,720 h22"/><path d="M700,760 h16"/>
  </g>

  <!-- Ground shadow stretching toward the viewer -->
  <ellipse cx="400" cy="746" rx="185" ry="13" fill="#17404F" opacity="0.12"/>

  <!-- Sand kicked up behind the wheel -->
  <g fill="#17404F" opacity="0.5">
    <circle cx="232" cy="700" r="3"/><circle cx="214" cy="716" r="4"/><circle cx="196" cy="734" r="3"/>
  </g>
  <path d="M240,690 q-16,8 -26,20" fill="none" stroke="#17404F" stroke-width="4" stroke-linecap="round" opacity="0.5"/>

  <!-- Speed lines -->
  <g stroke="#17404F" stroke-width="6" stroke-linecap="round" opacity="0.8">
    <path d="M238,552 L206,544"/><path d="M234,590 L198,590"/><path d="M238,628 L206,636"/>
  </g>

  <!-- ====== THE UNICYCLE (big foreground wheel — low angle) ====== -->
  <circle cx="400" cy="590" r="150" fill="none" stroke="#17404F" stroke-width="16"/>
  <g stroke="#17404F" stroke-width="3" opacity="0.9">
    <line x1="414" y1="590" x2="524" y2="590"/><line x1="412" y1="597" x2="507" y2="652"/>
    <line x1="407" y1="602" x2="462" y2="697"/><line x1="400" y1="604" x2="400" y2="714"/>
    <line x1="393" y1="602" x2="338" y2="697"/><line x1="388" y1="597" x2="293" y2="652"/>
    <line x1="386" y1="590" x2="276" y2="590"/><line x1="388" y1="583" x2="293" y2="528"/>
    <line x1="393" y1="578" x2="338" y2="483"/><line x1="400" y1="576" x2="400" y2="466"/>
    <line x1="407" y1="578" x2="462" y2="483"/><line x1="412" y1="583" x2="507" y2="528"/>
  </g>
  <circle cx="400" cy="590" r="126" fill="none" stroke="#17404F" stroke-width="5"/>
  <circle cx="400" cy="590" r="12" fill="#17404F"/>
  <circle cx="400" cy="590" r="4" fill="#FFFFFF"/>

  <!-- Cranks + pedals -->
  <g stroke="#17404F" stroke-width="10" stroke-linecap="round">
    <line x1="400" y1="590" x2="452" y2="542"/><line x1="400" y1="590" x2="348" y2="638"/>
  </g>
  <rect x="435" y="535" width="34" height="14" rx="7" fill="#17404F"/>
  <rect x="331" y="631" width="34" height="14" rx="7" fill="#17404F"/>
  <circle cx="452" cy="542" r="4" fill="#EE6C4A"/>
  <circle cx="348" cy="638" r="4" fill="#EE6C4A"/>

  <!-- Fork, seat post, saddle -->
  <path d="M390,584 C386,528 388,492 394,456 M410,584 C414,528 412,492 406,456" fill="none" stroke="#17404F" stroke-width="7" stroke-linecap="round"/>
  <line x1="400" y1="456" x2="400" y2="432" stroke="#17404F" stroke-width="7" stroke-linecap="round"/>
  <rect x="363" y="424" width="78" height="18" rx="9" fill="#17404F" transform="rotate(-4 400 433)"/>

  <!-- Handlebar mounted on the seat post -->
  <path d="M406,438 C430,432 452,424 470,410" fill="none" stroke="#17404F" stroke-width="7" stroke-linecap="round"/>
  <rect x="462" y="400" width="26" height="12" rx="6" fill="#17404F" transform="rotate(-18 475 406)"/>

  <!-- ====== THE PELICAN ====== -->
  <!-- Legs (tops tuck under the body) -->
  <g fill="none" stroke-linecap="round">
    <path d="M414,442 C428,472 442,500 450,528" stroke="#17404F" stroke-width="13"/>
    <path d="M414,442 C428,472 442,500 450,528" stroke="#FFFFFF" stroke-width="7"/>
    <path d="M382,444 C372,486 358,540 350,592 C348,606 347,618 348,626" stroke="#17404F" stroke-width="13"/>
    <path d="M382,444 C372,486 358,540 350,592 C348,606 347,618 348,626" stroke="#FFFFFF" stroke-width="7"/>
  </g>
  <!-- Webbed feet gripping the pedals -->
  <g fill="none" stroke="#17404F" stroke-width="5" stroke-linecap="round">
    <path d="M450,528 L438,541 M450,528 L451,544 M450,528 L463,540"/>
    <path d="M438,541 Q451,549 463,540" stroke-width="3"/>
    <path d="M348,624 L336,638 M348,624 L348,641 M348,624 L360,638"/>
    <path d="M336,638 Q348,646 360,638" stroke-width="3"/>
  </g>

  <!-- Tail feathers -->
  <g fill="#17404F">
    <path d="M326,380 C306,382 290,392 282,404 C296,406 314,402 326,396 Z"/>
    <path d="M328,398 C310,402 296,412 290,424 C304,424 320,418 330,410 Z"/>
    <path d="M334,414 C318,420 306,430 302,440 C314,440 328,432 336,424 Z"/>
  </g>

  <!-- Body (belly hanging low over the saddle — we see it from below) -->
  <path d="M330,318 C356,300 396,296 424,312 C452,328 464,360 456,394 C451,424 428,446 394,449 C360,452 332,440 320,416 C308,392 308,346 330,318 Z"
        fill="#FFFFFF" stroke="#17404F" stroke-width="6" stroke-linejoin="round"/>
  <path d="M340,430 C360,442 390,444 412,436" fill="none" stroke="#17404F" stroke-width="3" opacity="0.5" stroke-linecap="round"/>

  <!-- Folded wing, tip resting on the handlebar grip -->
  <path d="M398,316 C432,318 458,340 468,372 C472,386 474,398 473,408 C460,414 444,414 430,406 C410,394 398,372 396,348 C395,336 395,324 398,316 Z"
        fill="#FFFFFF" stroke="#17404F" stroke-width="6" stroke-linejoin="round"/>
  <path d="M414,336 C432,348 448,368 458,392 M410,362 C424,376 438,390 456,400"
        fill="none" stroke="#17404F" stroke-width="3" opacity="0.75" stroke-linecap="round"/>

  <!-- Neck (S-curve, drawn as outlined tube) -->
  <path d="M424,326 C448,300 464,274 472,240" fill="none" stroke="#17404F" stroke-width="38" stroke-linecap="round"/>
  <path d="M424,326 C448,300 464,274 472,240" fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round"/>

  <!-- Head + windswept crest -->
  <circle cx="482" cy="216" r="27" fill="#FFFFFF" stroke="#17404F" stroke-width="6"/>
  <path d="M462,194 C452,186 444,184 436,186 M466,186 C458,176 450,172 442,172"
        fill="none" stroke="#17404F" stroke-width="4" stroke-linecap="round"/>

  <!-- Beak -->
  <path d="M500,198 C538,202 574,218 602,242 C604,246 600,250 594,248 C566,234 534,226 504,224 Z"
        fill="#FFFFFF" stroke="#17404F" stroke-width="5" stroke-linejoin="round"/>

  <!-- Pouch (accent color, seen from below) -->
  <path d="M508,226 C520,256 546,274 572,270 C590,267 600,254 601,243 C580,236 544,228 508,226 Z"
        fill="#EE6C4A" stroke="#17404F" stroke-width="5" stroke-linejoin="round"/>

  <!-- Eye -->
  <circle cx="492" cy="208" r="4" fill="#17404F"/>
  <circle cx="493.5" cy="206.5" r="1.3" fill="#FFFFFF"/>
</svg>