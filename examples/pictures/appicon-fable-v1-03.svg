<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Square background: sky above, sea band below (split horizon) -->
  <rect x="0" y="0" width="512" height="512" fill="#5BB3E8"/>
  <rect x="0" y="368" width="512" height="144" fill="#2E86C9"/>

  <!-- Horizon line -->
  <line x1="0" y1="368" x2="512" y2="368" stroke="#FFFFFF" stroke-width="10" stroke-linecap="square"/>

  <!-- Warm yellow accent: sun peeking at the horizon (outline only) -->
  <path d="M 96 368 A 72 72 0 0 1 240 368" fill="none" stroke="#F8C93A" stroke-width="14" stroke-linecap="round"/>
  <line x1="168" y1="272" x2="168" y2="248" stroke="#F8C93A" stroke-width="14" stroke-linecap="round"/>
  <line x1="104" y1="300" x2="86" y2="282" stroke="#F8C93A" stroke-width="14" stroke-linecap="round"/>
  <line x1="232" y1="300" x2="250" y2="282" stroke="#F8C93A" stroke-width="14" stroke-linecap="round"/>

  <!-- Falling raindrops, outline strokes only, no cloud -->
  <g fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <!-- Large central drop -->
    <path d="M 336 96 C 336 96 272 184 272 232 A 64 64 0 0 0 400 232 C 400 184 336 96 336 96 Z"/>
    <!-- Smaller drop, upper left -->
    <path d="M 216 72 C 216 72 184 116 184 140 A 32 32 0 0 0 248 140 C 248 116 216 72 216 72 Z"/>
    <!-- Smaller drop, lower right, overlapping horizon -->
    <path d="M 424 296 C 424 296 388 344 388 370 A 36 36 0 0 0 460 370 C 460 344 424 296 424 296 Z"/>
    <!-- Motion ticks suggesting falling -->
    <line x1="296" y1="40" x2="296" y2="72"/>
    <line x1="376" y1="56" x2="376" y2="88"/>
    <line x1="160" y1="200" x2="160" y2="232"/>
  </g>

  <!-- Ripple rings on the sea where drops land -->
  <g fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round">
    <ellipse cx="336" cy="440" rx="56" ry="16"/>
    <ellipse cx="336" cy="440" rx="24" ry="7"/>
    <ellipse cx="200" cy="470" rx="32" ry="9"/>
  </g>
</svg>