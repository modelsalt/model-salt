<svg xmlns="http://www.w3.org/2000/svg" width="700" height="650" viewBox="0 0 700 650" role="img" aria-labelledby="title desc">
  <title id="title">Pelican riding a bicycle</title>
  <desc id="desc">A long-legged cream pelican rides an ochre penny-farthing, seen from behind at a three-quarter angle, with its long bill in profile.</desc>

  <rect width="700" height="650" rx="32" fill="#f7efdc"/>
  <ellipse cx="353" cy="574" rx="209" ry="19" fill="#e5d7ba"/>

  <!-- Small trailing wheel -->
  <ellipse cx="222" cy="510" rx="45" ry="61" fill="#513e30"/>
  <ellipse cx="222" cy="510" rx="34" ry="49" fill="#f7efdc"/>
  <g fill="#c5ae83">
    <path d="M219 462h5v96h-5z"/>
    <path d="m188 507 68 3v5l-68-3z"/>
    <path d="m199 474 49 68-4 3-49-68z"/>
    <path d="m246 477 4 3-49 65-4-3z"/>
  </g>

  <!-- Large front wheel, elliptical in perspective -->
  <ellipse cx="439" cy="424" rx="112" ry="151" fill="#513e30"/>
  <ellipse cx="439" cy="424" rx="99" ry="137" fill="#c29443"/>
  <ellipse cx="439" cy="424" rx="94" ry="132" fill="#f7efdc"/>
  <g fill="#c9b58e">
    <path d="M436 292h6v264h-6z"/>
    <path d="m345 421 188 1v6l-188-1z"/>
