    <path d="m472 300 5 2-71 246-5-2z"/>
    <path d="m350 370 3-5 174 112-3 5z"/>
    <path d="m524 365 3 5-174 112-3-5z"/>
  </g>

  <!-- Sweeping frame and fork -->
  <path d="M216 509c23-27 43-65 57-109l31-111 15 4-31 112c-16 48-37 85-62 112z" fill="#a97935"/>
  <path d="m310 290 97-27 5 15-97 28z" fill="#a97935"/>
  <path d="m402 248 13-3 31 180-14 3z" fill="#bc8b38"/>
  <path d="m413 255 11-2 37 166-10 3z" fill="#8c632f"/>
  <ellipse cx="439" cy="424" rx="13" ry="17" fill="#795531"/>
  <ellipse cx="222" cy="510" rx="8" ry="11" fill="#795531"/>

