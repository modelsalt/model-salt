<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fd3ff"/>
      <stop offset="100%" stop-color="#e6f6ff"/>
    </linearGradient>
    <g id="wheel">
      <circle r="72" fill="none" stroke="#222" stroke-width="8"/>
      <circle r="66" fill="none" stroke="#9aa3ab" stroke-width="2"/>
      <g stroke="#b9c0c6" stroke-width="1.5">
        <line x1="-66" y1="0" x2="66" y2="0"/>
        <line x1="-66" y1="0" x2="66" y2="0" transform="rotate(22.5)"/>
        <line x1="-66" y1="0" x2="66" y2="0" transform="rotate(45)"/>
        <line x1="-66" y1="0" x2="66" y2="0" transform="rotate(67.5)"/>
        <line x1="-66" y1="0" x2="66" y2="0" transform="rotate(90)"/>
        <line x1="-66" y1="0" x2="66" y2="0" transform="rotate(112.5)"/>
        <line x1="-66" y1="0" x2="66" y2="0" transform="rotate(135)"/>
        <line x1="-66" y1="0" x2="66" y2="0" transform="rotate(157.5)"/>
      </g>
      <circle r="7" fill="#555"/>
      <circle r="3" fill="#ccc"/>
    </g>
  </defs>

  <!-- Background -->
  <rect width="500" height="400" fill="url(#sky)"/>
  <circle cx="430" cy="60" r="32" fill="#ffd95a"/>
  <g fill="#fff" opacity="0.9">
    <ellipse cx="90" cy="60" rx="40" ry="14"/>
    <ellipse cx="115" cy="50" rx="28" ry="14"/>
    <ellipse cx="300" cy="35" rx="34" ry="11"/>
  </g>
  <rect y="382" width="500" height="18" fill="#7cc46a"/>
  <line x1="0" y1="382" x2="500" y2="382" stroke="#5a9e4b" stroke-width="3"/>

  <!-- Motion lines -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8">
    <line x1="20" y1="200" x2="70" y2="200"/>
    <line x1="10" y1="240" x2="55" y2="240"/>
    <line x1="30" y1="280" x2="62" y2="280"/>
  </g>

  <!-- Wheels -->
  <use href="#wheel" x="140" y="310"/>
  <use href="#wheel" x="380" y="310"/>

  <!-- Far leg (behind frame) -->
  <g stroke="#d9772b" stroke-width="7" stroke-linecap="round" fill="none">
    <polyline points="235,185 262,232 230,288"/>
  </g>
  <path d="M222,288 L240,284 L236,294 Z" fill="#d9772b"/>

  <!-- Frame -->
  <g stroke="#d6336c" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="140" y1="310" x2="250" y2="310"/>   <!-- chain stay -->
    <line x1="140" y1="310" x2="228" y2="212"/>   <!-- seat stay -->
    <line x1="250" y1="310" x2="222" y2="200"/>   <!-- seat tube -->
    <line x1="228" y1="212" x2="345" y2="198"/>   <!-- top tube -->
    <line x1="250" y1="310" x2="352" y2="225"/>   <!-- down tube -->
    <line x1="345" y1="195" x2="354" y2="230"/>   <!-- head tube -->
    <line x1="354" y1="228" x2="380" y2="310"/>   <!-- fork -->
  </g>

  <!-- Handlebar -->
  <g stroke="#333" stroke-width="6" stroke-linecap="round" fill="none">
    <line x1="345" y1="196" x2="342" y2="174"/>
    <path d="M342,174 Q330,164 314,170"/>
  </g>
  <line x1="314" y1="170" x2="322" y2="167" stroke="#111" stroke-width="9" stroke-linecap="round"/>

  <!-- Chainring & crank -->
  <circle cx="250" cy="310" r="18" fill="none" stroke="#444" stroke-width="4"/>
  <circle cx="250" cy="310" r="5" fill="#444"/>
  <line x1="230" y1="288" x2="270" y2="332" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <rect x="261" y="329" width="18" height="6" rx="2" fill="#222"/>

  <!-- Saddle -->
  <path d="M200,198 Q222,190 240,197 Q222,204 200,198 Z" fill="#222"/>

  <!-- Tail -->
  <path d="M165,150 L132,138 L146,157 L130,170 L168,172 Z" fill="#e3e8ec" stroke="#b8c1c8" stroke-width="1.5"/>

  <!-- Body -->
  <ellipse cx="215" cy="160" rx="58" ry="36" transform="rotate(-12 215 160)"
           fill="#ffffff" stroke="#c4ccd2" stroke-width="2"/>

  <!-- Neck -->
  <path d="M250,150 C278,140 268,110 287,90" stroke="#ffffff" stroke-width="24"
        stroke-linecap="round" fill="none"/>
  <path d="M262,150 C285,138 276,112 296,96" stroke="#c4ccd2" stroke-width="2" fill="none"/>

  <!-- Head -->
  <circle cx="292" cy="82" r="18" fill="#ffffff" stroke="#c4ccd2" stroke-width="2"/>
  <path d="M282,66 Q276,56 268,58 Q277,62 280,70 Z" fill="#f2f2f2" stroke="#c4ccd2" stroke-width="1"/>

  <!-- Beak & pouch -->
  <path d="M304,90 Q352,92 405,100 Q385,110 368,122 Q332,140 308,104 Z"
        fill="#f08a3c" stroke="#c96a22" stroke-width="1.5"/>
  <path d="M300,73 Q352,80 405,99 Q352,93 304,91 Z"
        fill="#f6bd45" stroke="#c98f1e" stroke-width="1.5"/>
  <path d="M403,97 Q412,100 405,107" stroke="#c96a22" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Eye -->
  <circle cx="297" cy="78" r="4.5" fill="#1a1a1a"/>
  <circle cx="298.5" cy="76.5" r="1.5" fill="#fff"/>

  <!-- Wing reaching to the handlebar -->
  <path d="M182,142 Q228,118 274,142 Q300,156 320,168 Q282,172 252,176 Q204,182 182,142 Z"
        fill="#d3dade" stroke="#9fa9b1" stroke-width="1.5"/>
  <g stroke="#9fa9b1" stroke-width="1.2" fill="none">
    <path d="M210,150 Q240,145 270,155"/>
    <path d="M215,162 Q245,158 285,163"/>
  </g>

  <!-- Near leg -->
  <g stroke="#f08a3c" stroke-width="7" stroke-linecap="round" fill="none">
    <polyline points="242,186 278,250 270,332"/>
  </g>
  <path d="M260,332 L284,328 L278,338 Z" fill="#f08a3c"/>
</svg>