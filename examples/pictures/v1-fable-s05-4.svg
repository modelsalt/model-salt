<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <defs>
    <!-- Pelican body: white with soft grey shading underneath -->
    <radialGradient id="bodyGrad" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#eeeae2"/>
      <stop offset="100%" stop-color="#b9b3a8"/>
    </radialGradient>
    <!-- Folded wing: slightly darker with feather tone -->
    <linearGradient id="wingGrad" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#f4f1ea"/>
      <stop offset="55%" stop-color="#d6d0c4"/>
      <stop offset="100%" stop-color="#9a9388"/>
    </linearGradient>
    <!-- Neck/head -->
    <linearGradient id="headGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cfc9bd"/>
    </linearGradient>
    <!-- Beak: warm orange-yellow -->
    <linearGradient id="beakGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd25a"/>
      <stop offset="60%" stop-color="#f2a93b"/>
      <stop offset="100%" stop-color="#c7761c"/>
    </linearGradient>
    <!-- Pouch -->
    <linearGradient id="pouchGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6b968"/>
      <stop offset="100%" stop-color="#d4832a"/>
    </linearGradient>
    <!-- Legs / feet -->
    <linearGradient id="legGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8f8a82"/>
      <stop offset="50%" stop-color="#b8b2a8"/>
      <stop offset="100%" stop-color="#6e6961"/>
    </linearGradient>
    <!-- Bicycle frame: red metallic -->
    <linearGradient id="frameGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="45%" stop-color="#c62828"/>
      <stop offset="100%" stop-color="#7a1414"/>
    </linearGradient>
    <!-- Tyre -->
    <radialGradient id="tyreGrad" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#555"/>
      <stop offset="100%" stop-color="#151515"/>
    </radialGradient>
    <!-- Rim / chrome -->
    <linearGradient id="chromeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#b9bec4"/>
      <stop offset="70%" stop-color="#eef1f3"/>
      <stop offset="100%" stop-color="#7f868c"/>
    </linearGradient>
    <!-- Saddle leather -->
    <linearGradient id="saddleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a5a3a"/>
      <stop offset="100%" stop-color="#4a2c18"/>
    </linearGradient>
    <!-- Soft shadow under bike -->
    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- Ground shadow (no scenery, just contact shadow) -->
  <ellipse cx="320" cy="412" rx="230" ry="14" fill="url(#shadowGrad)"/>

  <!-- ================= BICYCLE (facing right) ================= -->
  <g id="bike">
    <!-- Rear wheel -->
    <g transform="translate(170 340)">
      <circle r="70" fill="url(#tyreGrad)"/>
      <circle r="58" fill="none" stroke="url(#chromeGrad)" stroke-width="6"/>
      <circle r="55" fill="none" stroke="#1a1a1a" stroke-width="1" opacity="0.6"/>
      <g stroke="#cfd4d8" stroke-width="1.6" opacity="0.9">
        <line x1="0" y1="-55" x2="0" y2="55"/>
        <line x1="-55" y1="0" x2="55" y2="0"/>
        <line x1="-39" y1="-39" x2="39" y2="39"/>
        <line x1="-39" y1="39" x2="39" y2="-39"/>
        <line x1="-21" y1="-51" x2="21" y2="51"/>
        <line x1="-51" y1="-21" x2="51" y2="21"/>
        <line x1="21" y1="-51" x2="-21" y2="51"/>
        <line x1="51" y1="-21" x2="-51" y2="21"/>
      </g>
      <circle r="7" fill="url(#chromeGrad)" stroke="#555" stroke-width="1"/>
    </g>

    <!-- Front wheel -->
    <g transform="translate(470 340)">
      <circle r="70" fill="url(#tyreGrad)"/>
      <circle r="58" fill="none" stroke="url(#chromeGrad)" stroke-width="6"/>
      <circle r="55" fill="none" stroke="#1a1a1a" stroke-width="1" opacity="0.6"/>
      <g stroke="#cfd4d8" stroke-width="1.6" opacity="0.9">
        <line x1="0" y1="-55" x2="0" y2="55"/>
        <line x1="-55" y1="0" x2="55" y2="0"/>
        <line x1="-39" y1="-39" x2="39" y2="39"/>
        <line x1="-39" y1="39" x2="39" y2="-39"/>
        <line x1="-21" y1="-51" x2="21" y2="51"/>
        <line x1="-51" y1="-21" x2="51" y2="21"/>
        <line x1="21" y1="-51" x2="-21" y2="51"/>
        <line x1="51" y1="-21" x2="-51" y2="21"/>
      </g>
      <circle r="7" fill="url(#chromeGrad)" stroke="#555" stroke-width="1"/>
    </g>

    <!-- Frame -->
    <g fill="none" stroke="url(#frameGrad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
      <!-- chain stay: rear hub -> bottom bracket -->
      <line x1="170" y1="340" x2="300" y2="345"/>
      <!-- seat stay: rear hub -> seat cluster -->
      <line x1="170" y1="340" x2="265" y2="235"/>
      <!-- seat tube -->
      <line x1="300" y1="345" x2="265" y2="235"/>
      <!-- top tube -->
      <line x1="265" y1="235" x2="400" y2="235"/>
      <!-- down tube -->
      <line x1="300" y1="345" x2="400" y2="235"/>
      <!-- head tube -->
      <line x1="400" y1="235" x2="412" y2="265"/>
      <!-- fork -->
      <line x1="412" y1="265" x2="470" y2="340"/>
    </g>
    <!-- Frame highlight lines -->
    <g fill="none" stroke="#ffb3b3" stroke-width="2" stroke-linecap="round" opacity="0.7">
      <line x1="268" y1="232" x2="397" y2="232"/>
      <line x1="298" y1="340" x2="398" y2="232"/>
    </g>

    <!-- Seat post + saddle -->
    <line x1="265" y1="235" x2="260" y2="205" stroke="#8a8f94" stroke-width="6" stroke-linecap="round"/>
    <path d="M 232 203 Q 262 192 292 203 Q 282 213 258 212 Q 240 212 232 203 Z" fill="url(#saddleGrad)" stroke="#2e1a0d" stroke-width="1.5"/>
    <path d="M 240 203 Q 262 197 285 203" fill="none" stroke="#b07a52" stroke-width="1.2" opacity="0.8"/>

    <!-- Handlebar stem + bars (unused — hands-free) -->
    <line x1="400" y1="235" x2="396" y2="205" stroke="#8a8f94" stroke-width="6" stroke-linecap="round"/>
    <path d="M 376 205 Q 396 196 420 203 Q 432 208 440 218" fill="none" stroke="url(#chromeGrad)" stroke-width="7" stroke-linecap="round"/>
    <path d="M 376 205 Q 396 196 420 203 Q 432 208 440 218" fill="none" stroke="#5c6166" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <!-- grips -->
    <circle cx="376" cy="205" r="5" fill="#222"/>
    <circle cx="440" cy="218" r="5" fill="#222"/>

    <!-- Chainring & crank -->
    <circle cx="300" cy="345" r="22" fill="none" stroke="url(#chromeGrad)" stroke-width="5"/>
    <circle cx="300" cy="345" r="22" fill="none" stroke="#3a3f44" stroke-width="1"/>
    <circle cx="300" cy="345" r="5" fill="#3a3f44"/>
    <!-- chain -->
    <path d="M 300 323 L 170 282 M 300 367 L 170 398" fill="none" stroke="#444" stroke-width="3" stroke-dasharray="4 2"/>
    <circle cx="170" cy="340" r="12" fill="none" stroke="#666" stroke-width="3"/>
  </g>

  <!-- ================= PELICAN ================= -->
  <g id="pelican">
    <!-- Far leg (behind body/frame), crank at ~210° -->
    <g>
      <path d="M 262 300 Q 272 330 282 362" fill="none" stroke="#7d786f" stroke-width="9" stroke-linecap="round"/>
      <!-- far pedal + webbed foot -->
      <g transform="translate(281 364)">
        <rect x="-16" y="-4" width="32" height="8" rx="2" fill="#333"/>
        <path d="M -14 -4 L 18 -4 L 24 -10 L 12 -8 L 8 -14 L 2 -8 L -6 -14 L -8 -8 Z" fill="#8a857c"/>
      </g>
    </g>

    <!-- Tail feathers -->
    <path d="M 218 232 L 186 252 L 196 240 L 180 246 L 198 232 L 182 230 Z" fill="url(#wingGrad)" stroke="#8c867b" stroke-width="1"/>

    <!-- Body (ovoid, bolt upright posture, seated on saddle) -->
    <path d="M 215 240
             C 205 205 225 170 262 160
             C 300 152 330 180 326 220
             C 322 252 300 268 270 268
             C 240 268 222 258 215 240 Z"
          fill="url(#bodyGrad)" stroke="#9d978c" stroke-width="1.5"/>
    <!-- belly shading -->
    <path d="M 232 256 Q 272 272 316 240 Q 300 266 268 268 Q 244 268 232 256 Z" fill="#9f998e" opacity="0.35" filter="url(#soft)"/>

    <!-- Folded wing along the side -->
    <path d="M 238 196
             C 262 178 300 182 318 206
             C 306 236 278 252 240 246
             C 228 236 228 214 238 196 Z"
          fill="url(#wingGrad)" stroke="#8c867b" stroke-width="1.5"/>
    <!-- feather lines on wing -->
    <g fill="none" stroke="#8c867b" stroke-width="1" opacity="0.6">
      <path d="M 250 236 Q 275 232 300 216"/>
      <path d="M 246 226 Q 272 220 294 206"/>
      <path d="M 300 240 Q 286 246 262 248"/>
      <path d="M 310 230 Q 296 240 272 244"/>
    </g>
    <!-- dark primary tips -->
    <path d="M 276 250 L 300 242 L 318 224 Q 312 246 290 254 Z" fill="#5f5a52" opacity="0.8"/>

    <!-- Neck (S-curve rising bolt upright) -->
    <path d="M 262 170
             C 252 150 258 118 286 100
             C 300 92 314 96 322 110
             L 306 122
             C 298 114 290 118 286 124
             C 276 136 282 150 290 166 Z"
          fill="url(#headGrad)" stroke="#9d978c" stroke-width="1.5"/>
    <!-- neck shading -->
    <path d="M 266 164 C 258 146 264 124 284 108" fill="none" stroke="#b8b2a6" stroke-width="5" opacity="0.5" filter="url(#soft)"/>

    <!-- Head -->
    <ellipse cx="312" cy="98" rx="30" ry="24" fill="url(#headGrad)" stroke="#9d978c" stroke-width="1.5"/>
    <!-- crest tuft -->
    <path d="M 296 78 Q 300 66 310 74 Q 312 64 320 72" fill="none" stroke="#c9c3b8" stroke-width="3" stroke-linecap="round"/>

    <!-- Pouch (under beak, drooping) -->
    <path d="M 332 108
             C 350 112 380 118 416 112
             C 400 134 360 140 336 124 Z"
          fill="url(#pouchGrad)" stroke="#b56a1e" stroke-width="1.2"/>

    <!-- Upper beak (long, pointing right) -->
    <path d="M 330 92
             L 428 104
             Q 436 106 428 110
             L 334 110 Z"
          fill="url(#beakGrad)" stroke="#b56a1e" stroke-width="1.2"/>
    <!-- beak highlight -->
    <path d="M 336 96 L 420 105" fill="none" stroke="#ffe9a8" stroke-width="2" opacity="0.8" stroke-linecap="round"/>
    <!-- beak hook tip -->
    <path d="M 428 104 Q 436 108 430 114 L 426 110 Z" fill="#c7761c"/>
    <!-- beak lower edge line -->
    <path d="M 334 110 L 426 110" fill="none" stroke="#8a4f12" stroke-width="1"/>

    <!-- Eye -->
    <circle cx="322" cy="94" r="7" fill="#fff8e1" stroke="#9d978c" stroke-width="1"/>
    <circle cx="324" cy="94" r="4.5" fill="#2b1b0e"/>
    <circle cx="325.5" cy="92.5" r="1.6" fill="#fff"/>
    <!-- eye ring (bare skin) -->
    <circle cx="322" cy="94" r="9" fill="none" stroke="#e9b26a" stroke-width="1.5" opacity="0.8"/>

    <!-- Near leg (in front), crank at ~30° -->
    <path d="M 270 262 Q 290 290 318 330" fill="none" stroke="url(#legGrad)" stroke-width="10" stroke-linecap="round"/>
    <path d="M 274 262 Q 292 290 318 328" fill="none" stroke="#d9d3c8" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <!-- near pedal (crank arm from bottom bracket) -->
    <line x1="300" y1="345" x2="320" y2="326" stroke="#3a3f44" stroke-width="5" stroke-linecap="round"/>
    <g transform="translate(320 326)">
      <rect x="-16" y="-4" width="32" height="8" rx="2" fill="#333"/>
      <rect x="-16" y="-4" width="32" height="3" rx="1" fill="#777"/>
      <!-- webbed foot -->
      <path d="M -14 -4 L 20 -4 L 28 -12 L 14 -9 L 10 -17 L 3 -9 L -5 -17 L -8 -9 Z" fill="url(#legGrad)" stroke="#5f5a52" stroke-width="1"/>
    </g>
    <!-- far crank arm (behind) -->
    <line x1="300" y1="345" x2="281" y2="364" stroke="#2a2e32" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>