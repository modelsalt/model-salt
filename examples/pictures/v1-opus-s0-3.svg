<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Plain background -->
  <rect width="400" height="300" fill="#ffffff"/>

  <g stroke="#2b2b2b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">

    <!-- Wheels -->
    <g fill="none">
      <circle cx="110" cy="220" r="50" stroke-width="6"/>
      <circle cx="290" cy="220" r="50" stroke-width="6"/>
      <!-- Spokes -->
      <g stroke-width="1.5" stroke="#8a8a8a">
        <line x1="110" y1="170" x2="110" y2="270"/>
        <line x1="60"  y1="220" x2="160" y2="220"/>
        <line x1="75"  y1="185" x2="145" y2="255"/>
        <line x1="145" y1="185" x2="75"  y2="255"/>
        <line x1="290" y1="170" x2="290" y2="270"/>
        <line x1="240" y1="220" x2="340" y2="220"/>
        <line x1="255" y1="185" x2="325" y2="255"/>
        <line x1="325" y1="185" x2="255" y2="255"/>
      </g>
    </g>
    <circle cx="110" cy="220" r="5" fill="#2b2b2b"/>
    <circle cx="290" cy="220" r="5" fill="#2b2b2b"/>

    <!-- Frame -->
    <g fill="none" stroke="#2a7de1" stroke-width="6">
      <line x1="110" y1="220" x2="190" y2="220"/> <!-- chain stay -->
      <line x1="110" y1="220" x2="170" y2="152"/> <!-- seat stay -->
      <line x1="190" y1="220" x2="168" y2="148"/> <!-- seat tube -->
      <line x1="170" y1="152" x2="268" y2="148"/> <!-- top tube -->
      <line x1="190" y1="220" x2="272" y2="162"/> <!-- down tube -->
      <line x1="268" y1="148" x2="290" y2="220"/> <!-- fork -->
      <line x1="268" y1="148" x2="264" y2="128"/> <!-- stem -->
    </g>

    <!-- Seat -->
    <path d="M150 145 Q168 136 186 143 L182 149 Q166 146 152 150 Z" fill="#2b2b2b"/>

    <!-- Handlebar -->
    <path d="M258 128 L284 124 Q292 124 290 132" fill="none" stroke="#2b2b2b" stroke-width="5"/>

    <!-- Crank and pedals -->
    <circle cx="190" cy="220" r="10" fill="#cfd6de"/>
    <line x1="176" y1="206" x2="204" y2="234" stroke-width="4"/>
    <rect x="166" y="202" width="18" height="6" rx="2" fill="#2b2b2b"/>
    <rect x="196" y="231" width="18" height="6" rx="2" fill="#2b2b2b"/>

    <!-- Pelican tail -->
    <path d="M140 112 L108 104 L114 118 L104 126 L142 128 Z" fill="#e9edf1"/>

    <!-- Pelican body -->
    <ellipse cx="178" cy="120" rx="46" ry="28" fill="#ffffff"/>

    <!-- Leg (thigh + shin) and webbed foot on pedal -->
    <path d="M190 140 L216 182 L206 228" fill="none" stroke="#f08a24" stroke-width="6"/>
    <path d="M198 232 L214 232 L208 226 Z" fill="#f08a24" stroke="#f08a24"/>

    <!-- Wing reaching to handlebar -->
    <path d="M150 108 Q190 96 222 112 Q252 120 276 124 Q262 132 230 130 Q196 134 152 126 Z"
          fill="#e9edf1"/>
    <path d="M160 118 Q190 112 214 120" fill="none" stroke-width="2"/>
    <path d="M166 124 Q192 120 212 126" fill="none" stroke-width="2"/>

    <!-- Neck -->
    <path d="M200 104 Q206 80 214 70 Q222 58 232 60 Q238 70 226 82 Q218 96 216 112 Z"
          fill="#ffffff"/>

    <!-- Head -->
    <circle cx="228" cy="60" r="15" fill="#ffffff"/>
    <!-- Crest -->
    <path d="M220 47 Q216 38 222 36 Q226 42 226 46" fill="#f3d36b"/>

    <!-- Beak: pouch first, then upper bill -->
    <path d="M236 68 Q270 98 304 80 L300 76 Q268 80 238 70 Z" fill="#f7c35f"/>
    <path d="M238 56 L306 74 Q310 78 304 80 L236 68 Z" fill="#f5a623"/>

    <!-- Eye -->
    <circle cx="230" cy="57" r="3.5" fill="#2b2b2b" stroke="none"/>
    <circle cx="231" cy="56" r="1" fill="#ffffff" stroke="none"/>
  </g>
</svg>