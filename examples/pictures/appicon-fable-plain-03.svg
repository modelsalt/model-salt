<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Sky gradient: deep blue top to lighter horizon -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E5BC6"/>
      <stop offset="1" stop-color="#4FA3F0"/>
    </linearGradient>
    <!-- Sun gradient -->
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE97A"/>
      <stop offset="1" stop-color="#FFB627"/>
    </radialGradient>
    <!-- Cloud gradient -->
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCE9F7"/>
    </linearGradient>
    <!-- Soft shadow under the cloud -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="22" flood-color="#0B2E6E" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Square background, hard corners -->
  <rect width="1024" height="1024" fill="url(#sky)"/>

  <!-- Sun rays -->
  <g stroke="#FFD75E" stroke-width="34" stroke-linecap="round" opacity="0.95">
    <line x1="612" y1="118" x2="612" y2="190"/>
    <line x1="612" y1="118" x2="612" y2="190" transform="rotate(45 612 400)"/>
    <line x1="612" y1="118" x2="612" y2="190" transform="rotate(90 612 400)"/>
    <line x1="612" y1="118" x2="612" y2="190" transform="rotate(-45 612 400)"/>
    <line x1="612" y1="118" x2="612" y2="190" transform="rotate(-90 612 400)"/>
  </g>

  <!-- Sun -->
  <circle cx="612" cy="400" r="170" fill="url(#sun)"/>

  <!-- Cloud -->
  <g filter="url(#shadow)">
    <path fill="url(#cloud)" d="
      M 280 740
      A 110 110 0 0 1 300 522
      A 160 160 0 0 1 606 490
      A 128 128 0 0 1 756 740
      Z"/>
  </g>
</svg>