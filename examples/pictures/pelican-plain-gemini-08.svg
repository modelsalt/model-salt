<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background & Environment Gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BCE6FF"/>
      <stop offset="60%" stop-color="#E8F7FF"/>
      <stop offset="100%" stop-color="#FFF9EB"/>
    </linearGradient>
    
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9E6D"/>
      <stop offset="100%" stop-color="#FFE07D"/>
    </linearGradient>

    <!-- Pelican Gradients -->
    <linearGradient id="pouchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFCA3A"/>
      <stop offset="50%" stop-color="#FF9F1C"/>
      <stop offset="100%" stop-color="#E06D06"/>
    </linearGradient>

    <linearGradient id="beakTopGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="80%" stop-color="#FF9F1C"/>
      <stop offset="100%" stop-color="#EF476F"/>
    </linearGradient>

    <linearGradient id="bodyShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F4F8FA"/>
      <stop offset="100%" stop-color="#CFE0E8"/>
    </linearGradient>

    <linearGradient id="wingShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F0F5F9"/>
      <stop offset="100%" stop-color="#B8CEDC"/>
    </linearGradient>

    <linearGradient id="legGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9F1C"/>
      <stop offset="100%" stop-color="#E06D06"/>
    </linearGradient>

    <!-- Bike & Accessories Gradients -->
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#118AB2"/>
      <stop offset="100%" stop-color="#073B4C"/>
    </linearGradient>

    <linearGradient id="tireGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A3E4C"/>
      <stop offset="100%" stop-color="#1E2029"/>
    </linearGradient>
    
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8F9FA"/>
      <stop offset="50%" stop-color="#ADB5BD"/>
      <stop offset="100%" stop-color="#6C757D"/>
    </linearGradient>

    <linearGradient id="fishGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00BBF9"/>
      <stop offset="50%" stop-color="#00F5D4"/>
      <stop offset="100%" stop-color="#0A369D"/>
    </linearGradient>

    <!-- Wheel Component (Reused) -->
    <g id="wheel">
      <!-- Spokes -->
      <g stroke="#CBD5E1" stroke-width="2" opacity="0.8">
        <line x1="-85" y1="0" x2="85" y2="0"/>
        <line x1="0" y1="-85" x2="0" y2="85"/>
        <line x1="-60" y1="-60" x2="60" y2="60"/>
        <line x1="-60" y1="60" x2="60" y2="-60"/>
        <line x1="-78" y1="-32" x2="78" y2="32"/>
        <line x1="-32" y1="-78" x2="32" y2="78"/>
        <line x1="-32" y1="78" x2="32" y2="-78"/>
        <line x1="-78" y1="32" x2="78" y2="-32"/>
      </g>
      <!-- Inner Rim -->
      <circle cx="0" cy="0" r="76" fill="none" stroke="url(#metalGrad)" stroke-width="5"/>
      <!-- Whitewall -->
      <circle cx="0" cy="0" r="81" fill="none" stroke="#FFFDF9" stroke-width="6"/>
      <!-- Outer Tire -->
      <circle cx="0" cy="0" r="88" fill="none" stroke="url(#tireGrad)" stroke-width="12"/>
      <!-- Hub -->
      <circle cx="0" cy="0" r="10" fill="url(#metalGrad)"/>
      <circle cx="0" cy="0" r="4" fill="#1E2029"/>
    </g>
  </defs>

  <!-- ================= BACKGROUND ================= -->
  <rect width="100%" height="100%" fill="url(#skyGrad)"/>
  
  <!-- Sun -->
  <circle cx="650" cy="140" r="65" fill="url(#sunGrad)" opacity="0.9"/>

  <!-- Distant Clouds -->
  <g fill="#FFFFFF" opacity="0.85">
    <path d="M 80 180 Q 95 150 125 160 Q 150 130 185 150 Q 215 155 210 180 Z"/>
    <path d="M 550 240 Q 570 215 595 225 Q 620 190 655 215 Q 685 210 695 230 Q 715 235 710 250 L 545 250 Z" opacity="0.6"/>
  </g>

  <!-- Distant Seagulls -->
  <g fill="none" stroke="#8FA8BE" stroke-width="2.5" stroke-linecap="round">
    <path d="M 600 100 Q 610 90 620 100 Q 630 90 640 100"/>
    <path d="M 650 80 Q 657 73 664 80 Q 671 73 678 80"/>
    <path d="M 180 100 Q 188 92 196 100 Q 204 92 212 100"/>
  </g>

  <!-- Ground Shadow -->
  <ellipse cx="400" cy="525" rx="280" ry="12" fill="#BCE0EE"/>
  <ellipse cx="395" cy="525" rx="220" ry="6" fill="#92C5D8"/>

  <!-- ================= PELICAN BACK LAYER ================= -->
  
  <!-- Scarf (Back tail) -->
  <path d="M 355 200 C 280 205, 230 165, 175 185 L 185 205 C 240 195, 285 220, 355 210 Z" fill="#AE2012"/>

  <!-- Left Leg (Back) -->
  <g id="left-leg">
    <!-- Upper Leg -->
    <path d="M 330 300 L 395 315 L 340 375" fill="none" stroke="#E06D06" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Knee Joint -->
    <circle cx="395" cy="315" r="8" fill="#E06D06"/>
    <!-- Webbed Foot -->
    <path d="M 340 375 L 385 370 C 390 375, 385 385, 375 385 L 325 385 Z" fill="#E06D06"/>
    <!-- Pedal (Back) -->
    <rect x="335" y="382" width="36" height="8" rx="4" fill="#1E2029"/>
    <!-- Crank Arm (Back) -->
    <line x1="380" y1="430" x2="353" y2="386" stroke="#6C757D" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- ================= BICYCLE ================= -->
  <g id="bicycle">
    <!-- Wheels -->
    <use href="#wheel" x="220" y="430"/>
    <use href="#wheel" x="570" y="430"/>

    <!-- Rear Fender -->
    <path d="M 122 430 A 98 98 0 0 1 310 390" fill="none" stroke="#073B4C" stroke-width="8" stroke-linecap="round"/>
    <!-- Front Fender -->
    <path d="M 475 405 A 98 98 0 0 1 655 380" fill="none" stroke="#073B4C" stroke-width="8" stroke-linecap="round"/>

    <!-- Frame - Rear Triangle (Chainstay & Seatstay) -->
    <path d="M 380 430 L 220 430 L 315 290" fill="none" stroke="url(#frameGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Seat Post -->
    <line x1="315" y1="290" x2="303" y2="255" stroke="url(#metalGrad)" stroke-width="10" stroke-linecap="round"/>

    <!-- Frame - Main Body (Seat tube, Down tube, Top tube) -->
    <path d="M 315 290 L 380 430 C 425 400, 470 340, 505 295" fill="none" stroke="url(#frameGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Swept Cruiser Top Tube -->
    <path d="M 322 305 C 380 325, 440 310, 495 265" fill="none" stroke="url(#frameGrad)" stroke-width="12" stroke-linecap="round"/>

    <!-- Handlebars & Stem -->
    <path d="M 495 260 L 480 215 C 475 200, 460 195, 445 205 L 415 225" fill="none" stroke="url(#metalGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Bike Bell -->
    <path d="M 445 190 A 10 10 0 0 1 465 190 Z" fill="#FFD166"/>
    <rect x="452" y="190" width="6" height="5" fill="#6C757D"/>

    <!-- Head Tube & Front Fork -->
    <line x1="490" y1="255" x2="510" y2="305" stroke="url(#frameGrad)" stroke-width="16" stroke-linecap="round"/>
    <path d="M 510 305 C 525 350, 540 390, 570 430" fill="none" stroke="url(#frameGrad)" stroke-width="12" stroke-linecap="round"/>

    <!-- Headlight -->
    <path d="M 505 265 L 530 255 C 535 255, 538 285, 530 285 L 512 278 Z" fill="url(#metalGrad)"/>
    <ellipse cx="532" cy="270" rx="3" ry="12" fill="#FFE066"/>
    <!-- Light Beam (subtle) -->
    <polygon points="535,258 750,210 750,330 535,282" fill="#FFF9EB" opacity="0.25"/>

    <!-- Saddle / Seat -->
    <path d="M 265 255 C 265 240, 325 245, 345 260 C 335 275, 280 278, 265 255 Z" fill="#5C3A21"/>
    <path d="M 275 265 C 290 272, 315 272, 330 265" fill="none" stroke="#3B2313" stroke-width="3" stroke-linecap="round"/>

    <!-- Chain & Crankset -->
    <line x1="220" y1="420" x2="380" y2="400" stroke="#495057" stroke-width="4" stroke-dasharray="6,4"/>
    <line x1="220" y1="440" x2="380" y2="455" stroke="#495057" stroke-width="4" stroke-dasharray="6,4"/>
    <!-- Chain Guard -->
    <path d="M 380 392 A 38 38 0 0 1 418 430 L 380 430 Z" fill="#118AB2"/>
    <circle cx="380" cy="430" r="32" fill="url(#metalGrad)" stroke="#495057" stroke-width="2"/>
    <!-- Chainring cutouts -->
    <circle cx="380" cy="410" r="6" fill="#E8F7FF"/>
    <circle cx="380" cy="450" r="6" fill="#E8F7FF"/>
    <circle cx="360" cy="430" r="6" fill="#E8F7FF"/>
    <circle cx="400" cy="430" r="6" fill="#E8F7FF"/>
    <circle cx="380" cy="430" r="10" fill="#495057"/>
  </g>

  <!-- ================= PELICAN MAIN BODY ================= -->
  <g id="pelican-body">
    <!-- Tail Feathers -->
    <path d="M 245 250 C 210 245, 195 225, 225 215 C 205 200, 215 185, 240 200 C 225 180, 245 175, 265 195 Z" fill="#CFE0E8"/>
    
    <!-- Main Torso & Neck -->
    <path d="M 335 120 
             C 325 160, 345 190, 355 215 
             C 375 245, 385 270, 360 300 
             C 330 325, 275 305, 255 270 
             C 235 235, 250 190, 290 195 
             C 310 198, 295 155, 305 110 
             C 315 70, 360 65, 385 85 
             C 395 95, 390 115, 370 120 Z" fill="url(#bodyShadow)"/>

    <!-- Fluffy Chest Feathers (Detail) -->
    <path d="M 362 225 Q 375 235 365 245 Q 380 255 365 265" fill="none" stroke="#CFE0E8" stroke-width="4" stroke-linecap="round"/>

    <!-- ================= FISH IN POUCH ================= -->
    <g id="fish" transform="translate(15, 5)">
      <!-- Fish Body -->
      <path d="M 480 155 C 510 120, 540 100, 560 95 C 555 125, 535 150, 505 170 Z" fill="url(#fishGrad)"/>
      <!-- Fish Tail (sticking out) -->
      <path d="M 555 98 C 575 80, 595 75, 590 95 C 585 105, 575 105, 565 105 C 575 115, 585 125, 570 130 C 555 135, 555 110, 555 98 Z" fill="#00BBF9"/>
      <!-- Fish Fin -->
      <path d="M 520 135 C 510 125, 495 130, 505 145 Z" fill="#0A369D"/>
      <!-- Fish Eye (Shocked) -->
      <circle cx="535" cy="115" r="5" fill="#FFFFFF"/>
      <circle cx="536" cy="114" r="2" fill="#000000"/>
      <!-- Water Droplets -->
      <path d="M 595 65 Q 605 55 600 70 A 4 4 0 1 1 595 65 Z" fill="#00BBF9"/>
      <path d="M 605 105 Q 620 105 610 115 A 4 4 0 1 1 605 105 Z" fill="#00BBF9"/>
      <circle cx="545" cy="80" r="3" fill="#00F5D4"/>
    </g>

    <!-- ================= PELICAN HEAD & BEAK ================= -->
    <!-- Massive Throat Pouch -->
    <path d="M 375 115 
             C 430 115, 520 115, 600 105 
             C 590 165, 545 215, 480 215 
             C 415 215, 370 175, 352 145 Z" fill="url(#pouchGrad)"/>
    
    <!-- Pouch Stretch Lines -->
    <path d="M 410 155 C 450 185, 510 185, 565 135" fill="none" stroke="#E06D06" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
    <path d="M 385 140 C 425 160, 470 160, 515 130" fill="none" stroke="#FFE066" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

    <!-- Upper Mandible (Beak Top) -->
    <path d="M 375 90 
             C 445 95, 525 95, 605 90 
             C 612 90, 615 98, 608 106 
             C 603 112, 598 108, 595 105 
             C 520 115, 430 115, 365 118 Z" fill="url(#beakTopGrad)"/>
    <!-- Beak Smile Line -->
    <path d="M 365 118 C 430 115, 520 115, 598 106" fill="none" stroke="#9E2A2B" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Cheek / Eye Area -->
    <circle cx="362" cy="98" r="14" fill="#FFE066"/>
    <!-- Eye -->
    <circle cx="362" cy="98" r="8" fill="#FFFFFF"/>
    <circle cx="365" cy="98" r="4.5" fill="#1E2029"/>
    <circle cx="367" cy="96" r="1.5" fill="#FFFFFF"/>
    <!-- Happy/Focused Eyebrow -->
    <path d="M 350 88 Q 362 82 374 90" fill="none" stroke="#CFE0E8" stroke-width="4" stroke-linecap="round"/>

    <!-- Sailor Cap -->
    <g id="hat" transform="rotate(-12, 335, 70)">
      <path d="M 305 75 C 305 50, 360 50, 365 75 Z" fill="#FFFFFF" stroke="#CFE0E8" stroke-width="2"/>
      <path d="M 302 74 C 320 80, 350 80, 368 74 L 366 82 C 350 88, 320 88, 304 82 Z" fill="#073B4C"/>
      <!-- Cap Rim -->
      <path d="M 300 72 C 320 65, 350 65, 370 72" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
      <!-- Little Gold Anchor/Button -->
      <circle cx="335" cy="64" r="3" fill="#FFD166"/>
      <path d="M 335 50 C 340 45, 330 45, 335 50" fill="#118AB2" stroke="#118AB2" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- ================= SCARF (FRONT) ================= -->
    <g id="scarf">
      <!-- Neck Wrap -->
      <path d="M 310 190 C 330 205, 355 200, 368 185 L 362 208 C 345 220, 320 220, 305 205 Z" fill="#EF476F"/>
      <!-- White Stripes on Wrap -->
      <path d="M 325 198 L 320 214" stroke="#FFFFFF" stroke-width="5"/>
      <path d="M 348 197 L 345 215" stroke="#FFFFFF" stroke-width="5"/>
      
      <!-- Flowing Tail (Front) -->
      <path d="M 315 202 C 250 220, 200 180, 140 215 L 150 240 C 205 210, 255 245, 320 212 Z" fill="#EF476F"/>
      <!-- White Stripes on Tail -->
      <path d="M 280 210 L 285 225" stroke="#FFFFFF" stroke-width="6"/>
      <path d="M 240 208 L 245 225" stroke="#FFFFFF" stroke-width="6"/>
      <path d="M 200 203 L 202 222" stroke="#FFFFFF" stroke-width="6"/>
      <path d="M 165 208 L 172 229" stroke="#FFFFFF" stroke-width="6"/>
    </g>
  </g>

  <!-- ================= PELICAN FRONT LAYER ================= -->

  <!-- Right Leg (Front) -->
  <g id="right-leg">
    <!-- Crank Arm (Front) -->
    <line x1="380" y1="430" x2="407" y2="474" stroke="url(#metalGrad)" stroke-width="10" stroke-linecap="round"/>
    <circle cx="380" cy="430" r="5" fill="#F8F9FA"/>

    <!-- Thigh (Feathered) -->
    <path d="M 310 285 C 315 315, 345 325, 355 300 Z" fill="#CFE0E8"/>
    
    <!-- Orange Leg -->
    <path d="M 340 305 L 430 375 L 400 465" fill="none" stroke="url(#legGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Knobby Knee -->
    <circle cx="430" cy="375" r="9" fill="#FF9F1C"/>
    <circle cx="432" cy="373" r="4" fill="#FFE066" opacity="0.6"/>
    
    <!-- Webbed Foot (Front) -->
    <path d="M 396 460 L 450 462 C 455 468, 445 478, 435 476 L 385 472 C 380 470, 388 460, 396 460 Z" fill="url(#legGrad)"/>
    <!-- Toes detail -->
    <path d="M 400 464 L 442 466" stroke="#FFE066" stroke-width="2" stroke-linecap="round"/>
    <path d="M 398 468 L 435 472" stroke="#FFE066" stroke-width="2" stroke-linecap="round"/>

    <!-- Pedal (Front) -->
    <rect x="390" y="472" width="40" height="10" rx="5" fill="#1E2029" stroke="#6C757D" stroke-width="2"/>
    <rect x="398" y="475" width="24" height="4" rx="2" fill="#FF9F1C"/> <!-- Reflector -->
  </g>

  <!-- Right Wing (Holding Handlebar) -->
  <g id="right-wing">
    <!-- Handlebar Grip (underneath wing tip) -->
    <path d="M 435 212 L 405 232" fill="none" stroke="#5C3A21" stroke-width="16" stroke-linecap="round"/>
    
    <!-- Main Wing Shape -->
    <path d="M 295 220 
             C 275 245, 300 300, 345 290 
             C 375 282, 405 265, 430 230 
             C 440 218, 430 200, 415 210 
             C 405 218, 395 225, 380 228
             C 395 215, 385 200, 370 215
             C 350 235, 320 200, 295 220 Z" fill="url(#wingShadow)"/>
    
    <!-- Wing Feather Details -->
    <path d="M 320 265 C 345 270, 375 255, 395 235" fill="none" stroke="#B8CEDC" stroke-width="3" stroke-linecap="round"/>
    <path d="M 335 280 C 365 280, 395 260, 415 235" fill="none" stroke="#B8CEDC" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Wing Tip "Fingers" curled over grip -->
    <path d="M 415 210 C 425 205, 438 215, 428 228 C 420 238, 408 230, 415 222" fill="#FFFFFF" stroke="#B8CEDC" stroke-width="2" stroke-linecap="round"/>
    <path d="M 405 218 C 415 213, 428 223, 418 236 C 410 244, 398 236, 405 228" fill="#F0F5F9" stroke="#B8CEDC" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- ================= FOREGROUND / MOTION LINES ================= -->
  <!-- Speed Lines -->
  <g stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <line x1="80" y1="220" x2="120" y2="220"/>
    <line x1="50" y1="235" x2="105" y2="235"/>
    <line x1="90" y1="350" x2="140" y2="350"/>
    <line x1="650" y1="490" x2="720" y2="490"/>
  </g>

  <!-- Ground Elements (Pebbles / Grass tufts) -->
  <g fill="#76B0C5">
    <path d="M 150 525 C 145 515, 140 515, 135 525 Z"/>
    <path d="M 150 525 C 155 510, 165 510, 160 525 Z"/>
    <ellipse cx="620" cy="530" rx="8" ry="3"/>
    <ellipse cx="635" cy="532" rx="4" ry="2"/>
    <ellipse cx="260" cy="535" rx="6" ry="2.5"/>
  </g>

</svg>