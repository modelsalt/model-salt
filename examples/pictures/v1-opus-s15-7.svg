<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Sky -->
  <rect width="100" height="100" fill="#e9e6c9"/>
  <!-- Distant hills -->
  <path d="M0 52 Q20 40 40 48 T80 44 T100 46 V100 H0Z" fill="#a9b77a"/>
  <!-- Fields -->
  <rect y="56" width="100" height="44" fill="#7e9a52"/>
  <!-- Country lane -->
  <path d="M44 56 L56 56 L96 100 L4 100Z" fill="#b08a5a"/>
  <path d="M50 58 L50 62 M50 67 L50 73 M50 79 L50 87" stroke="#d2b588" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Bushes lining the lane -->
  <g fill="#4f6b34">
    <circle cx="6" cy="62" r="7"/><circle cx="14" cy="59" r="6"/>
    <circle cx="30" cy="57" r="4"/><circle cx="36" cy="56" r="3"/>
    <circle cx="94" cy="62" r="7"/><circle cx="86" cy="59" r="6"/>
    <circle cx="70" cy="57" r="4"/><circle cx="64" cy="56" r="3"/>
  </g>
  <g fill="#62823f">
    <circle cx="9" cy="60" r="4"/><circle cx="90" cy="60" r="4"/>
    <circle cx="33" cy="55" r="2.5"/><circle cx="67" cy="55" r="2.5"/>
  </g>

  <!-- Ground shadow -->
  <ellipse cx="49" cy="91" rx="32" ry="3" fill="#8a6a42" opacity="0.6"/>

  <!-- Bicycle -->
  <g fill="none" stroke="#4a3322" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="26" cy="78" r="12"/>
    <circle cx="72" cy="78" r="12"/>
  </g>
  <g fill="none" stroke="#7a5a2e" stroke-width="0.8">
    <path d="M26 66 V90 M14 78 H38 M72 66 V90 M60 78 H84"/>
  </g>
  <g fill="none" stroke="#5c7a2e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- frame -->
    <path d="M26 78 L46 78 L40 60 Z"/>
    <path d="M46 78 L66 60 L40 60"/>
    <!-- fork -->
    <path d="M66 60 L72 78"/>
    <!-- stem -->
    <path d="M66 60 L67 53"/>
  </g>
  <!-- handlebars -->
  <path d="M63 53 H71" stroke="#4a3322" stroke-width="2.4" stroke-linecap="round"/>
  <!-- seat -->
  <path d="M35 59 H44" stroke="#4a3322" stroke-width="3" stroke-linecap="round"/>
  <!-- hubs -->
  <circle cx="26" cy="78" r="1.6" fill="#4a3322"/>
  <circle cx="72" cy="78" r="1.6" fill="#4a3322"/>

  <!-- Back leg + crank -->
  <path d="M41 54 L43 66 L42 73" stroke="#c98a3a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M46 78 L42 73" stroke="#4a3322" stroke-width="1.6" stroke-linecap="round"/>
  <ellipse cx="42" cy="73" rx="3" ry="1.3" fill="#c98a3a"/>

  <!-- Pelican body -->
  <ellipse cx="41" cy="48" rx="14" ry="11" fill="#f4ecd4" stroke="#6b5434" stroke-width="1.2" transform="rotate(-12 41 48)"/>
  <!-- tail -->
  <path d="M28 46 L21 42 L23 49 Z" fill="#8c7350" stroke="#6b5434" stroke-width="1" stroke-linejoin="round"/>
  <!-- folded wing -->
  <path d="M33 44 Q42 38 50 45 Q45 54 34 52 Q30 48 33 44Z" fill="#a88b62" stroke="#6b5434" stroke-width="1"/>
  <path d="M37 47 Q42 46 46 48 M36 50 Q40 50 43 51" stroke="#6b5434" stroke-width="0.7" fill="none" stroke-linecap="round"/>

  <!-- Neck -->
  <path d="M47 42 Q49 34 53 30" stroke="#f4ecd4" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M44.5 41 Q46 33 50.5 28.5 M50 43 Q52 36 56 31.5" stroke="#6b5434" stroke-width="1" fill="none" stroke-linecap="round"/>

  <!-- Head -->
  <circle cx="56" cy="27" r="6.5" fill="#f4ecd4" stroke="#6b5434" stroke-width="1.2"/>
  <!-- little crest -->
  <path d="M53 21 Q52 17 55 18 Q55 15 58 17" stroke="#6b5434" stroke-width="1" fill="none" stroke-linecap="round"/>

  <!-- Pouch (resting over handlebars) -->
  <path d="M59 31 Q60 46 66 52 Q70 54 71 51 L62 30 Z" fill="#d9a24a" stroke="#8a5a22" stroke-width="1" stroke-linejoin="round"/>
  <!-- Upper beak -->
  <path d="M60 25 Q66 34 71 50 Q72 53 70 52 Q64 40 58 30 Z" fill="#e6b45a" stroke="#8a5a22" stroke-width="1" stroke-linejoin="round"/>

  <!-- Eye + cheek -->
  <circle cx="57.5" cy="25.5" r="2" fill="#2e2418"/>
  <circle cx="58.2" cy="24.8" r="0.7" fill="#fff"/>
  <circle cx="54" cy="29.5" r="1.6" fill="#e3a98a" opacity="0.8"/>

  <!-- Front leg + crank -->
  <path d="M45 55 L50 70 L50 83" stroke="#c98a3a" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M46 78 L50 83" stroke="#4a3322" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="46" cy="78" r="2.2" fill="#5c7a2e" stroke="#4a3322" stroke-width="0.8"/>
  <ellipse cx="50.5" cy="83" rx="3.4" ry="1.4" fill="#c98a3a"/>
</svg>