<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <!-- Sky -->
  <rect width="400" height="500" fill="#dbeefc"/>

  <!-- Road (front view, vanishing toward the horizon) -->
  <polygon points="150,250 250,250 400,500 0,500" fill="#5a5a5a"/>
  <!-- Dashed center line -->
  <line x1="200" y1="250" x2="200" y2="500" stroke="#f5e663" stroke-width="7"
        stroke-dasharray="18 22" stroke-linecap="butt"/>
  <!-- Grass verges -->
  <polygon points="0,250 150,250 0,500" fill="#7fb45e"/>
  <polygon points="250,250 400,250 400,500" fill="#7fb45e"/>

  <!-- ===== BICYCLE (front view) ===== -->
  <!-- Rear wheel (peeking out behind the front wheel) -->
  <ellipse cx="200" cy="420" rx="14" ry="64" fill="#2b2b2b"/>
  <ellipse cx="200" cy="420" rx="7" ry="54" fill="#8a8a8a"/>

  <!-- Front fork -->
  <line x1="190" y1="300" x2="190" y2="420" stroke="#e8462b" stroke-width="7" stroke-linecap="round"/>
  <line x1="210" y1="300" x2="210" y2="420" stroke="#e8462b" stroke-width="7" stroke-linecap="round"/>
  <!-- Head tube -->
  <rect x="192" y="270" width="16" height="40" rx="6" fill="#e8462b"/>

  <!-- Front wheel -->
  <ellipse cx="200" cy="420" rx="18" ry="72" fill="#2b2b2b"/>
  <ellipse cx="200" cy="420" rx="9" ry="60" fill="#9c9c9c"/>
  <ellipse cx="200" cy="420" rx="4" ry="8" fill="#555"/>

  <!-- Pedals / cranks (visible at sides) -->
  <rect x="150" y="372" width="22" height="8" rx="3" fill="#333"/>
  <rect x="228" y="372" width="22" height="8" rx="3" fill="#333"/>

  <!-- Handlebar -->
  <line x1="110" y1="272" x2="290" y2="272" stroke="#e8462b" stroke-width="9" stroke-linecap="round"/>
  <!-- Grips -->
  <rect x="100" y="265" width="30" height="14" rx="7" fill="#222"/>
  <rect x="270" y="265" width="30" height="14" rx="7" fill="#222"/>

  <!-- ===== PELICAN (hunched low, head-on) ===== -->
  <!-- Tucked legs (just peeking below the body) -->
  <rect x="170" y="330" width="14" height="30" rx="5" fill="#f2a33a"/>
  <rect x="216" y="330" width="14" height="30" rx="5" fill="#f2a33a"/>
  <!-- Webbed feet -->
  <polygon points="160,360 194,360 177,372" fill="#e38a1e"/>
  <polygon points="206,360 240,360 223,372" fill="#e38a1e"/>

  <!-- Body (hunched, wide) -->
  <ellipse cx="200" cy="300" rx="78" ry="58" fill="#6b4e3a"/>
  <!-- Lighter chest/belly -->
  <ellipse cx="200" cy="315" rx="52" ry="40" fill="#8c7260"/>

  <!-- Wings reaching forward and down to grip the bars -->
  <path d="M135,275 Q110,290 112,305 Q120,290 150,290 Z" fill="#5a4030"/>
  <path d="M265,275 Q290,290 288,305 Q280,290 250,290 Z" fill="#5a4030"/>
  <!-- Wing arms -->
  <path d="M150,280 Q125,275 115,272" stroke="#5a4030" stroke-width="16" stroke-linecap="round" fill="none"/>
  <path d="M250,280 Q275,275 285,272" stroke="#5a4030" stroke-width="16" stroke-linecap="round" fill="none"/>
  <!-- Wing tips wrapped over the grips -->
  <ellipse cx="115" cy="272" rx="14" ry="10" fill="#5a4030"/>
  <ellipse cx="285" cy="272" rx="14" ry="10" fill="#5a4030"/>

  <!-- Neck (short, hunched) -->
  <rect x="178" y="215" width="44" height="50" rx="20" fill="#f4f1e6"/>

  <!-- Head -->
  <circle cx="200" cy="205" r="36" fill="#f4f1e6"/>
  <!-- Grayish-brown crown -->
  <path d="M166,200 A36,36 0 0 1 234,200 Q200,185 166,200 Z" fill="#9e8e80"/>

  <!-- Eyes -->
  <circle cx="186" cy="203" r="6" fill="#fff"/>
  <circle cx="214" cy="203" r="6" fill="#fff"/>
  <circle cx="187" cy="204" r="3" fill="#222"/>
  <circle cx="213" cy="204" r="3" fill="#222"/>
  <!-- Determined brows -->
  <line x1="178" y1="194" x2="192" y2="197" stroke="#4a3b30" stroke-width="3" stroke-linecap="round"/>
  <line x1="222" y1="194" x2="208" y2="197" stroke="#4a3b30" stroke-width="3" stroke-linecap="round"/>

  <!-- Bill (seen head-on: a long tapering wedge pointing at the viewer, then down) -->
  <path d="M182,215 L218,215 L212,300 L188,300 Z" fill="#f2a33a"/>
  <!-- Pouch bulge -->
  <path d="M186,240 Q200,310 214,240 Q200,250 186,240 Z" fill="#d98a2a"/>
  <!-- Bill ridge -->
  <line x1="200" y1="218" x2="200" y2="296" stroke="#c9771c" stroke-width="2"/>
  <!-- Bill hook tip -->
  <path d="M188,300 Q200,312 212,300 Z" fill="#c9771c"/>
</svg>