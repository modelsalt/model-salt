<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- Background -->
  <rect width="800" height="600" fill="#E3F4F4"/>
  
  <!-- Sun -->
  <circle cx="150" cy="120" r="65" fill="#FFE596"/>

  <!-- Ground -->
  <rect y="500" width="800" height="100" fill="#D2E6E6"/>
  <rect x="70" y="500" width="660" height="8" rx="4" fill="#B6D5D5"/>

  <!-- ================= PELICAN BACK LIMBS ================= -->
  <!-- Left Wing (Back) gripping left handlebar -->
  <path d="M 335 205 C 395 200 430 220 455 245 C 430 250 385 245 335 235 Z" fill="#CBD5E1"/>
  
  <!-- Left Leg (Back) on up-pedal -->
  <path d="M 300 320 L 352 382 L 364 382 L 320 320 Z" fill="#D97706"/>
  <!-- Left Webbed Foot -->
  <path d="M 352 380 L 385 372 L 380 390 L 348 386 Z" fill="#D97706"/>
  <!-- Back Pedal -->
  <rect x="355" y="384" width="26" height="8" rx="4" fill="#334155"/>
  <!-- Back Crank Arm -->
  <path d="M 378 418 L 362 386 L 372 382 L 388 414 Z" fill="#64748B"/>

  <!-- ================= BICYCLE ================= -->
  <!-- Rear Wheel -->
  <g id="rear-wheel">
    <!-- Tire (Donut) -->
    <path d="M 220 325 A 95 95 0 1 0 220 515 A 95 95 0 1 0 220 325 Z M 220 343 A 77 77 0 1 1 220 497 A 77 77 0 1 1 220 343 Z" fill="#334155" fill-rule="evenodd"/>
    <!-- Whitewall Rim (Donut) -->
    <path d="M 220 343 A 77 77 0 1 0 220 497 A 77 77 0 1 0 220 343 Z M 220 353 A 67 67 0 1 1 220 487 A 67 67 0 1 1 220 353 Z" fill="#F8FAFC" fill-rule="evenodd"/>
    <!-- Spokes -->
    <rect x="218" y="345" width="4" height="150" fill="#CBD5E1"/>
    <rect x="145" y="418" width="150" height="4" fill="#CBD5E1"/>
    <rect x="218" y="345" width="4" height="150" fill="#CBD5E1" transform="rotate(45 220 420)"/>
    <rect x="218" y="345" width="4" height="150" fill="#CBD5E1" transform="rotate(135 220 420)"/>
    <rect x="218" y="345" width="4" height="150" fill="#CBD5E1" transform="rotate(22.5 220 420)"/>
    <rect x="218" y="345" width="4" height="150" fill="#CBD5E1" transform="rotate(67.5 220 420)"/>
    <rect x="218" y="345" width="4" height="150" fill="#CBD5E1" transform="rotate(112.5 220 420)"/>
    <rect x="218" y="345" width="4" height="150" fill="#CBD5E1" transform="rotate(157.5 220 420)"/>
  </g>

  <!-- Front Wheel -->
  <g id="front-wheel">
    <!-- Tire (Donut) -->
    <path d="M 580 325 A 95 95 0 1 0 580 515 A 95 95 0 1 0 580 325 Z M 580 343 A 77 77 0 1 1 580 497 A 77 77 0 1 1 580 343 Z" fill="#334155" fill-rule="evenodd"/>
    <!-- Whitewall Rim (Donut) -->
    <path d="M 580 343 A 77 77 0 1 0 580 497 A 77 77 0 1 0 580 343 Z M 580 353 A 67 67 0 1 1 580 487 A 67 67 0 1 1 580 353 Z" fill="#F8FAFC" fill-rule="evenodd"/>
    <!-- Spokes -->
    <rect x="578" y="345" width="4" height="150" fill="#CBD5E1"/>
    <rect x="505" y="418" width="150" height="4" fill="#CBD5E1"/>
    <rect x="578" y="345" width="4" height="150" fill="#CBD5E1" transform="rotate(45 580 420)"/>
    <rect x="578" y="345" width="4" height="150" fill="#CBD5E1" transform="rotate(135 580 420)"/>
    <rect x="578" y="345" width="4" height="150" fill="#CBD5E1" transform="rotate(22.5 580 420)"/>
    <rect x="578" y="345" width="4" height="150" fill="#CBD5E1" transform="rotate(67.5 580 420)"/>
    <rect x="578" y="345" width="4" height="150" fill="#CBD5E1" transform="rotate(112.5 580 420)"/>
    <rect x="578" y="345" width="4" height="150" fill="#CBD5E1" transform="rotate(157.5 580 420)"/>
  </g>

  <!-- Fenders -->
  <!-- Rear Fender -->
  <path d="M 116 420 A 104 104 0 0 1 310 368 L 297 375 A 90 90 0 0 0 130 420 Z" fill="#E63946"/>
  <!-- Front Fender -->
  <path d="M 485 378 A 104 104 0 0 1 670 368 L 658 375 A 90 90 0 0 0 498 384 Z" fill="#E63946"/>

  <!-- Stem & Swept-Back Cruiser Handlebars -->
  <path d="M 521 285 L 508 235 L 520 235 L 533 285 Z" fill="#CBD5E1"/>
  <path d="M 514 232 C 514 212 485 235 440 242 L 440 254 C 485 247 526 225 526 242 Z" fill="#CBD5E1"/>
  
  <!--Seat Post -->
  <path d="M 315 310 L 323 345 L 335 342 L 327 307 Z" fill="#CBD5E1"/>

  <!-- Cruiser Frame -->
  <!-- Chainstay -->
  <path d="M 220 413 L 385 408 L 385 420 L 220 427 Z" fill="#E63946"/>
  <!-- Seatstay -->
  <path d="M 216 416 L 325 335 L 333 345 L 224 426 Z" fill="#E63946"/>
  <!-- Seat Tube -->
  <path d="M 320 340 L 376 420 L 390 412 L 334 332 Z" fill="#E63946"/>
  <!-- Curved Down Tube -->
  <path d="M 378 422 C 430 422 475 375 538 320 L 528 308 C 465 365 425 406 378 406 Z" fill="#E63946"/>
  <!-- Curved Top Tube -->
  <path d="M 326 346 C 390 300 460 285 532 296 L 534 280 C 460 268 385 284 318 334 Z" fill="#E63946"/>
  <!-- Head Tube -->
  <path d="M 520 280 L 534 276 L 548 325 L 534 329 Z" fill="#E63946"/>
  <!-- Front Fork -->
  <path d="M 534 325 L 546 320 C 558 365 570 400 586 416 L 574 424 C 556 405 546 370 534 325 Z" fill="#E63946"/>

  <!-- Hubs -->
  <circle cx="220" cy="420" r="12" fill="#94A3B8"/>
  <circle cx="580" cy="420" r="12" fill="#94A3B8"/>

  <!-- Chain Guard -->
  <path d="M 220 405 L 385 390 A 28 28 0 0 1 385 446 L 220 430 A 12 12 0 0 1 220 405 Z" fill="#F1FAEE"/>
  <circle cx="383" cy="418" r="16" fill="#94A3B8"/>

  <!-- Cruiser Saddle -->
  <path d="M 285 312 C 275 292 315 295 360 305 C 350 322 300 325 285 312 Z" fill="#475569"/>

  <!-- ================= PELICAN BODY & HEAD ================= -->
  <!-- Tail Feathers -->
  <path d="M 275 295 L 235 285 L 250 302 L 240 312 L 285 310 Z" fill="#F8FAFC"/>
  
  <!-- Upright Torso & Neck -->
  <path d="M 275 300 C 260 250 295 190 350 185 C 365 140 385 95 400 75 C 415 55 445 60 445 85 C 445 110 420 155 415 195 C 435 250 405 320 345 320 C 305 320 285 315 275 300 Z" fill="#F8FAFC"/>

  <!-- Head Crest Feathers -->
  <path d="M 400 72 L 372 62 L 390 78 L 376 88 L 402 86 Z" fill="#F8FAFC"/>
  
  <!-- White Facial/Crown Blending -->
  <circle cx="422" cy="78" r="24" fill="#F8FAFC"/>

  <!-- Giant Pelican Beak & Pouch -->
  <!-- Throat Pouch (Bottom) -->
  <path d="M 432 82 C 470 82 580 85 620 82 C 600 165 485 195 415 145 C 410 120 422 95 432 82 Z" fill="#FF9F1C"/>
  <!-- Upper Mandible (Top Beak) -->
  <path d="M 432 68 C 495 65 570 62 625 68 C 632 69 634 78 625 84 L 616 86 L 614 80 C 560 84 480 84 432 84 Z" fill="#FFBF69"/>

  <!-- Eye -->
  <circle cx="426" cy="74" r="9" fill="#FEF08A"/>
  <circle cx="428" cy="74" r="5" fill="#1E293B"/>

  <!-- ================= PELICAN FRONT LIMBS ================= -->
  <!-- Right Leg (Front) on down-pedal -->
  <path d="M 330 310 L 392 448 L 406 444 L 350 305 Z" fill="#FF9F1C"/>
  <!-- Right Webbed Foot -->
  <path d="M 392 446 L 432 438 L 424 456 L 388 452 Z" fill="#FF9F1C"/>
  
  <!-- Front Crank Arm & Pedal -->
  <path d="M 378 418 L 396 452 L 406 448 L 388 414 Z" fill="#CBD5E1"/>
  <rect x="390" y="450" width="28" height="8" rx="4" fill="#1E293B"/>

  <!-- Handlebar Grip (Dark) -->
  <rect x="430" y="238" width="32" height="14" rx="7" fill="#1E293B" transform="rotate(-8 446 245)"/>

  <!-- Right Wing (Front) reaching forward to grip handlebar -->
  <path d="M 340 205 C 375 195 425 220 455 240 C 462 246 455 262 440 258 C 400 252 355 255 335 230 Z" fill="#E2E8F0"/>
  <!-- Wing Primary Feathers (Tips wrapping the grip) -->
  <path d="M 420 228 C 440 232 455 238 460 245 C 462 252 448 252 435 246 Z" fill="#94A3B8"/>
  <path d="M 415 240 C 435 242 452 248 456 254 C 456 260 442 258 430 252 Z" fill="#94A3B8"/>
</svg>