<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Weather app icon</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6FC3F7"/>
      <stop offset="1" stop-color="#2A7DE1"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE082" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FFE082" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE082"/>
      <stop offset="0.6" stop-color="#FFCA28"/>
      <stop offset="1" stop-color="#FFA726"/>
    </radialGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D9ECFB"/>
    </linearGradient>
  </defs>

  <!-- square background, no rounded corners -->
  <rect width="512" height="512" fill="url(#sky)"/>

  <!-- sun glow -->
  <circle cx="225" cy="195" r="115" fill="url(#glow)"/>

  <!-- small background cloud -->
  <g fill="#FFFFFF" opacity="0.35">
    <circle cx="395" cy="118" r="26"/>
    <circle cx="438" cy="102" r="33"/>
    <circle cx="478" cy="120" r="23"/>
    <rect x="369" y="118" width="132" height="28" rx="14"/>
  </g>

  <!-- sun rays -->
  <g stroke="#FFC107" stroke-width="16" stroke-linecap="round">
    <line x1="322" y1="195" x2="351" y2="195"/>
    <line x1="293.6" y1="263.6" x2="314.1" y2="284.1"/>
    <line x1="225" y1="292" x2="225" y2="321"/>
    <line x1="156.4" y1="263.6" x2="135.9" y2="284.1"/>
    <line x1="128" y1="195" x2="99" y2="195"/>
    <line x1="156.4" y1="126.4" x2="135.9" y2="105.9"/>
    <line x1="225" y1="98" x2="225" y2="69"/>
    <line x1="293.6" y1="126.4" x2="314.1" y2="105.9"/>
  </g>

  <!-- sun -->
  <circle cx="225" cy="195" r="78" fill="url(#sun)"/>

  <!-- soft shadow under main cloud -->
  <ellipse cx="285" cy="394" rx="135" ry="15" fill="#0D47A1" opacity="0.12"/>

  <!-- main cloud -->
  <g fill="url(#cloud)">
    <circle cx="205" cy="320" r="58"/>
    <circle cx="285" cy="292" r="72"/>
    <circle cx="365" cy="322" r="55"/>
    <rect x="147" y="330" width="273" height="48" rx="24"/>
  </g>
</svg>