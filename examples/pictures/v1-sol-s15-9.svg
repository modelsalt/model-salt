<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="800" height="640" role="img" aria-labelledby="title desc">
  <title id="title">Pelican riding a bicycle</title>
  <desc id="desc">A precise side-profile illustration in sepia and cream, showing a surprised pelican pedaling a bicycle.</desc>
  <defs>
    <g id="spokes" stroke="#aa9170" stroke-width="1">
      <path d="M0-95V95M-95 0H95M-67-67 67 67M-67 67 67-67M-36-88 36 88M-88-36 88 36M-88 36 88-36M-36 88 36-88"/>
    </g>
  </defs>

  <rect width="800" height="640" fill="#fbf5e8"/>
  <path d="M105 540H695" stroke="#bca98a" stroke-width="1"/>

  <!-- Wheels -->
  <g fill="none">
    <g transform="translate(230 440)">
      <use href="#spokes"/>
      <circle r="98" stroke="#493726" stroke-width="9"/>
      <circle r="89" stroke="#b39a75" stroke-width="2"/>
      <circle r="8" fill="#f3e7cf" stroke="#493726" stroke-width="3"/>
    </g>
    <g transform="translate(580 440)">
