    <!-- Long bill and unmistakable pelican pouch. -->
    <path d="M360 141Q407 151 491 187
             Q454 230 408 207Q378 190 360 158Z"
          fill="#FF9D23" stroke-width="6"/>
    <path d="M376 162Q413 188 467 190Q425 213 397 188"
          fill="#FFCE43" stroke="none"/>
    <path d="M358 136Q415 139 505 181
