    <path d="M258 234Q237 270 264 289Q285 303 307 278"
          fill="#E2F8FF" stroke-width="5"/>
    <path d="M260 263Q273 277 288 274"
          fill="none" stroke="#86C9DD" stroke-width="4"/>

    <!-- Near leg reaches its pedal. -->
    <path d="M285 316Q284 349 307 371L318 451"
          fill="none" stroke="#FFAB24" stroke-width="14"/>
    <circle cx="332" cy="449" r="13" fill="#FFE35A" stroke-width="5"/>
    <path d="M332 449L309 478" fill="none" stroke-width="8"/>
    <path d="M293 481L327 486" fill="none" stroke-width="10"/>
    <path d="M316 449Q332 461 327 478L295 475Q294 461 316 449Z"
          fill="#FFB321" stroke-width="5"/>

    <!-- A wing holds the near handlebar. -->
    <path d="M331 230Q352 244 368 268Q388 282 433 291
