          fill="#FFFFFF" stroke-width="5"/>
    <ellipse cx="346" cy="125" rx="11" ry="15" fill="#173558" stroke="none"/>
    <circle cx="349" cy="120" r="4" fill="#FFFFFF" stroke="none"/>
    <path d="M333 105Q343 100 352 105" fill="none" stroke-width="4"/>
    <ellipse cx="332" cy="151" rx="12" ry="8" fill="#FF8CAA" stroke="none"/>

    <!-- Front hub and little bell. -->
    <circle cx="464" cy="483" r="9" fill="#FFE34C" stroke-width="4"/>
    <circle cx="226" cy="454" r="7" fill="#FFE34C" stroke-width="4"/>
    <path d="M393 308Q390 292 402 291Q414 292 413 309Z"
          fill="#FFE34C" stroke-width="4"/>
  </g>
</svg>