<svg xmlns="http://www.w3.org/2000/svg" width="720" height="680" viewBox="0 0 720 680" role="img" aria-labelledby="title desc">
  <title id="title">Pelican riding a bicycle</title>
  <desc id="desc">A cheerful upright pelican rides a bright coral bicycle, seen from a front three-quarter angle.</desc>

  <rect width="720" height="680" rx="40" fill="#78E8EE"/>
  <circle cx="355" cy="307" r="241" fill="#C6FFFF"/>
  <ellipse cx="354" cy="582" rx="215" ry="27" fill="#26BECF" opacity=".4"/>

  <g stroke="#173558" stroke-linecap="round" stroke-linejoin="round">
    <!-- Wheels recede toward the upper left. -->
    <g fill="#E9FFFF" stroke-width="13">
      <ellipse cx="226" cy="454" rx="66" ry="104"/>
      <ellipse cx="464" cy="483" rx="78" ry="119"/>
    </g>
    <g fill="none" stroke="#24BDD2" stroke-width="5">
      <ellipse cx="226" cy="454" rx="53" ry="90"/>
      <ellipse cx="464" cy="483" rx="64" ry="105"/>
    </g>
    <g fill="none" stroke="#78BED1" stroke-width="3">
      <path d="M226 364V544M173 454H279M188 390L264 518M187 518L265 390"/>
      <path d="M464 378V588M400 483H528M419 409L509 557M419 557L509 409"/>
    </g>

    <!-- Far pedal and bicycle frame. -->
    <path d="M332 449L353 421" fill="none" stroke-width="8"/>
    <path d="M341 418L369 424" fill="none" stroke-width="9"/>
    <path d="M226 454L281 341L332 449L226 454
             M281 341L415 365L332 449
             M415 365L464 483"
          fill="none" stroke-width="16"/>
    <path d="M226 454L281 341L332 449L226 454
             M281 341L415 365L332 449
             M415 365L464 483"
          fill="none" stroke="#FF466E" stroke-width="9"/>
    <path d="M281 341L274 315" fill="none" stroke-width="9"/>
    <path d="M250 313Q276 304 300 316" fill="none" stroke-width="15"/>
    <path d="M415 365L410 320L441 298M410 320L369 300"
          fill="none" stroke-width="9"/>
    <path d="M429 296L449 301M357 298L378 304"
          fill="none" stroke="#713BDD" stroke-width="12"/>

    <!-- Tail, body, and upright neck. -->
    <path d="M253 285Q208 292 195 264Q221 266 245 250"
          fill="#FFFFFF" stroke-width="6"/>
    <path d="M291 293Q309 335 348 378L356 417"
          fill="none" stroke="#FFAB24" stroke-width="13"/>
    <path d="M345 412Q360 403 375 422L347 427Z"
          fill="#FFAB24" stroke-width="5"/>

    <path d="M259 312
             C222 287 225 231 260 210
             C283 195 293 185 291 155
             C288 111 309 87 343 91
             C378 94 388 121 373 152
             C359 184 349 210 353 244
             C358 285 330 320 290 322
             Q272 323 259 312Z"
          fill="#FFFFFF" stroke-width="6"/>
    <path d="M305 180Q313 214 300 241Q289 268 303 292"
