<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" width="560" height="430">
  <title>A pelican riding a bicycle</title>

  <!-- speed lines -->
  <g stroke="#EC7063" stroke-width="8" stroke-linecap="round">
    <line x1="48" y1="282" x2="114" y2="282"/>
    <line x1="26" y1="326" x2="106" y2="326"/>
    <line x1="54" y1="368" x2="124" y2="368"/>
  </g>

  <!-- wheels -->
  <g fill="none">
    <!-- spinning motion rings -->
    <circle cx="190" cy="330" r="74" stroke="#D5DBDB" stroke-width="6" stroke-dasharray="30 36" stroke-linecap="round"/>
    <circle cx="440" cy="330" r="74" stroke="#D5DBDB" stroke-width="6" stroke-dasharray="30 36" stroke-linecap="round"/>
    <!-- tires -->
    <circle cx="190" cy="330" r="60" stroke="#2E4053" stroke-width="12"/>
    <circle cx="440" cy="330" r="60" stroke="#2E4053" stroke-width="12"/>
    <!-- spokes -->
    <g stroke="#85929E" stroke-width="4">
      <line x1="153" y1="293" x2="227" y2="367"/>
      <line x1="153" y1="367" x2="227" y2="293"/>
      <line x1="403" y1="293" x2="477" y2="367"/>
      <line x1="403" y1="367" x2="477" y2="293"/>
    </g>
    <!-- hubs -->
    <circle cx="190" cy="330" r="8" fill="#2E4053" stroke="none"/>
    <circle cx="440" cy="330" r="8" fill="#2E4053" stroke="none"/>
  </g>

  <!-- bicycle frame -->
  <g stroke="#2E4053" stroke-linecap="round" fill="none">
    <line x1="190" y1="330" x2="295" y2="318" stroke-width="7"/>
    <line x1="190" y1="330" x2="268" y2="234" stroke-width="7"/>
    <line x1="295" y1="318" x2="268" y2="234" stroke-width="9"/>
    <line x1="272" y1="238" x2="388" y2="226" stroke-width="9"/>
    <line x1="295" y1="318" x2="390" y2="230" stroke-width="9"/>
    <line x1="386" y1="232" x2="402" y2="208" stroke-width="9"/>
    <line x1="398" y1="216" x2="440" y2="330" stroke-width="9"/>
    <line x1="401" y1="210" x2="414" y2="182" stroke-width="8"/>
    <line x1="414" y1="182" x2="388" y2="176" stroke-width="8"/>
  </g>

  <!-- saddle -->
  <line x1="228" y1="228" x2="272" y2="222" stroke="#2E4053" stroke-width="13" stroke-linecap="round"/>

  <!-- chainring, cranks, pedals -->
  <circle cx="295" cy="318" r="15" fill="none" stroke="#2E4053" stroke-width="6"/>
  <g stroke="#2E4053" stroke-width="8" stroke-linecap="round">
    <line x1="295" y1="318" x2="318" y2="346"/>
    <line x1="295" y1="318" x2="272" y2="290"/>
  </g>
  <rect x="306" y="342" width="24" height="9" rx="4" fill="#2E4053"/>
  <rect x="260" y="286" width="24" height="9" rx="4" fill="#2E4053"/>

  <!-- pelican -->
  <!-- far leg -->
  <path d="M 264 214 L 246 258 L 272 288" fill="none" stroke="#CA6F1E" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="272" cy="290" rx="12" ry="7" fill="#CA6F1E"/>

  <!-- near leg, mid pedal-push -->
  <path d="M 294 212 L 322 274 L 318 342" fill="none" stroke="#E67E22" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="318" cy="344" rx="12" ry="7" fill="#E67E22"/>

  <!-- tail -->
  <polygon points="212,162 180,154 198,190" fill="#D5DBDB"/>

  <!-- body -->
  <ellipse cx="272" cy="176" rx="72" ry="50" fill="#FDFEFE" transform="rotate(-6 272 176)"/>

  <!-- neck -->
  <path d="M 344 128 Q 326 150 314 172" fill="none" stroke="#FDFEFE" stroke-width="30" stroke-linecap="round"/>

  <!-- wing reaching for the handlebar -->
  <path d="M 334 156 C 358 160, 380 168, 397 177 C 386 190, 360 194, 338 186 C 326 178, 327 164, 334 156 Z" fill="#D5DBDB"/>

  <!-- head -->
  <circle cx="352" cy="108" r="27" fill="#FDFEFE"/>

  <!-- beak and pouch -->
  <path d="M 370 100 C 410 103, 448 115, 475 130 C 449 127, 410 119, 371 114 Z" fill="#E67E22"/>
  <path d="M 371 114 C 410 119, 448 127, 470 133 C 453 158, 412 160, 389 141 C 379 132, 372 123, 371 114 Z" fill="#F5B041"/>

  <!-- eye -->
  <circle cx="354" cy="102" r="4.5" fill="#2E4053"/>
  <circle cx="355.6" cy="100.4" r="1.4" fill="#FDFEFE"/>
</svg>