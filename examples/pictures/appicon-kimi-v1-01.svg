<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background: solid sky blue, full square, no rounding -->
  <rect width="512" height="512" fill="#2E9BE3"/>

  <!-- Halo layer: lighter blue disc for depth -->
  <circle cx="256" cy="256" r="168" fill="#64BAEE"/>

  <!-- Sun rays: 12 white bars radiating outward -->
  <g fill="#FFFFFF">
    <rect x="243" y="40" width="26" height="86" rx="13"/>
    <rect x="243" y="40" width="26" height="86" rx="13" transform="rotate(30 256 256)"/>
    <rect x="243" y="40" width="26" height="86" rx="13" transform="rotate(60 256 256)"/>
    <rect x="243" y="40" width="26" height="86" rx="13" transform="rotate(90 256 256)"/>
    <rect x="243" y="40" width="26" height="86" rx="13" transform="rotate(120 256 256)"/>
    <rect x="243" y="40" width="26" height="86" rx="13" transform="rotate(150 256 256)"/>
    <rect x="243" y="40" width="26" height="86" rx="13" transform="rotate(180 256 256)"/>
    <rect x="243" y="40" width="26" height="86" rx="13" transform="rotate(210 256 256)"/>
    <rect x="243" y="40" width="26" height="86" rx="13" transform="rotate(240 256 256)"/>
    <rect x="243" y="40" width="26" height="86" rx="13" transform="rotate(270 256 256)"/>
    <rect x="243" y="40" width="26" height="86" rx="13" transform="rotate(300 256 256)"/>
    <rect x="243" y="40" width="26" height="86" rx="13" transform="rotate(330 256 256)"/>
  </g>

  <!-- Deep layer: amber disc offset down-right, peeking out as a crescent -->
  <circle cx="290" cy="290" r="112" fill="#F5A83A"/>

  <!-- Main sun disc: warm yellow -->
  <circle cx="256" cy="256" r="112" fill="#FFD340"/>

  <!-- Inner highlight: lighter yellow, offset up-left -->
  <circle cx="228" cy="224" r="58" fill="#FFE28A"/>
</svg>