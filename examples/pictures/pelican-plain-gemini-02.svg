<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8ec5fc" />
      <stop offset="100%" stop-color="#e0c3fc" />
    </linearGradient>
    
    <!-- Sun Gradient -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffecd2" />
      <stop offset="100%" stop-color="#fcb69f" />
    </linearGradient>

    <!-- Beak Pouch Gradient -->
    <linearGradient id="pouchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff9a44" />
      <stop offset="50%" stop-color="#fc6076" />
      <stop offset="100%" stop-color="#ff9a44" />
    </linearGradient>

    <!-- Upper Beak Gradient -->
    <linearGradient id="beakTopGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd26f" />
      <stop offset="100%" stop-color="#ff7b00" />
    </linearGradient>

    <!-- Pelican Body Shading -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f0f4f8" />
      <stop offset="100%" stop-color="#d9e2ec" />
    </linearGradient>

    <!-- Bike Frame Gradient -->
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00b4db" />
      <stop offset="100%" stop-color="#0083b0" />
    </linearGradient>

    <!-- Tire Gradient -->
    <linearGradient id="tireGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c3e50" />
      <stop offset="100%" stop-color="#1a252f" />
    </linearGradient>

    <!-- Reusable Wheel Component -->
    <g id="wheel">
      <!-- Spokes -->
      <g stroke="#bdc3c7" stroke-width="2">
        <line x1="-80" y1="0" x2="80" y2="0" />
        <line x1="0" y1="-80" x2="0" y2="80" />
        <line x1="-56.5" y1="-56.5" x2="56.5" y2="56.5" />
        <line x1="-56.5" y1="56.5" x2="56.5" y2="-56.5" />
        <line x1="-73.9" y1="-30.6" x2="73.9" y2="30.6" />
        <line x1="-30.6" y1="-73.9" x2="30.6" y2="73.9" />
        <line x1="-73.9" y1="30.6" x2="73.9" y2="-30.6" />
        <line x1="-30.6" y1="73.9" x2="30.6" y2="-73.9" />
      </g>
      <!-- Rim -->
      <circle cx="0" cy="0" r="76" fill="none" stroke="#ecf0f1" stroke-width="6" />
      <circle cx="0" cy="0" r="80" fill="none" stroke="#bdc3c7" stroke-width="2" />
      <!-- Tire -->
      <circle cx="0" cy="0" r="85" fill="none" stroke="url(#tireGrad)" stroke-width="12" />
      <!-- Inner Hub -->
      <circle cx="0" cy="0" r="10" fill="#7f8c8d" />
    </g>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- ================= BACKGROUND ================= -->
  <rect width="800" height="600" fill="#fdfbfb" />
  
  <!-- Main Sky Circle -->
  <circle cx="400" cy="300" r="260" fill="url(#skyGrad)" />
  
  <!-- Sun -->
  <circle cx="260" cy="180" r="55" fill="url(#sunGrad)" opacity="0.9" />

  <!-- Distant Clouds -->
  <g fill="#ffffff" opacity="0.7">
    <path d="M 160 240 Q 175 220 195 230 Q 215 210 235 230 Q 250 235 245 250 L 155 250 Q 145 240 160 240 Z" />
    <path d="M 520 150 Q 540 125 565 140 Q 590 115 615 140 Q 635 145 630 165 L 515 165 Q 500 150 520 150 Z" />
    <path d="M 100 350 Q 115 335 130 345 Q 145 335 155 350 L 95 350 Z" />
  </g>

  <!-- Distant Birds -->
  <g stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.8">
    <path d="M 200 130 Q 210 120 220 130 Q 230 120 240 130" />
    <path d="M 245 115 Q 252 108 260 115 Q 268 108 275 115" />
    <path d="M 180 145 Q 187 138 195 145 Q 203 138 210 145" />
  </g>

  <!-- Ground / Road -->
  <line x1="80" y1="536" x2="720" y2="536" stroke="#8c9eff" stroke-width="6" stroke-linecap="round" />
  <line x1="150" y1="550" x2="650" y2="550" stroke="#e0c3fc" stroke-width="4" stroke-linecap="round" stroke-dasharray="40 20 10 20" />
  
  <!-- Bike Shadow -->
  <ellipse cx="400" cy="536" rx="190" ry="8" fill="#5e6472" opacity="0.3" />


  <!-- ================= PELICAN BACK LAYER ================= -->
  <!-- Back Leg -->
  <g id="back-leg">
    <!-- Thigh/Lower Leg -->
    <path d="M 330 310 L 355 345 L 335 405" fill="none" stroke="#e67e22" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Joint -->
    <circle cx="355" cy="345" r="7" fill="#d35400" />
    <!-- Webbed Foot -->
    <path d="M 335 405 L 370 400 C 375 400 375 408 368 410 L 325 412 C 320 412 325 405 335 405 Z" fill="#e67e22" stroke="#d35400" stroke-width="2" stroke-linejoin="round" />
    <!-- Back Pedal -->
    <rect x="330" y="410" width="36" height="8" rx="4" fill="#2c3e50" />
    <!-- Crank Arm (Back) -->
    <line x1="370" y1="450" x2="348" y2="414" stroke="#7f8c8d" stroke-width="8" stroke-linecap="round" />
  </g>

  <!--Back Wing (Partially visible) -->
  <path d="M 360 220 Q 430 220 485 260 Q 440 275 370 250 Z" fill="#dce4ec" stroke="#bdc3c7" stroke-width="2" />


  <!-- ================= BICYCLE ================= -->
  <g id="bicycle" filter="url(#shadow)">
    <!-- Wheels -->
    <use href="#wheel" x="220" y="445" />
    <use href="#wheel" x="560" y="445" />

    <!-- Rear Frame (Chainstay & Seatstay) -->
    <line x1="220" y1="445" x2="370" y2="450" stroke="url(#frameGrad)" stroke-width="9" stroke-linecap="round" />
    <line x1="220" y1="445" x2="305" y2="320" stroke="url(#frameGrad)" stroke-width="8" stroke-linecap="round" />
    
    <!-- Chain & Gears -->
    <path d="M 220 433 L 370 424 A 26 26 0 0 1 370 476 L 220 457 A 12 12 0 0 1 220 433 Z" fill="none" stroke="#34495e" stroke-width="4" stroke-dasharray="6 4" />
    <circle cx="220" cy="445" r="12" fill="#95a5a6" stroke="#2c3e50" stroke-width="3" />
    
    <!-- Main Frame (Seat tube, Down tube, Top tube) -->
    <line x1="370" y1="450" x2="295" y2="300" stroke="url(#frameGrad)" stroke-width="12" stroke-linecap="round" />
    <line x1="370" y1="450" x2="505" y2="320" stroke="url(#frameGrad)" stroke-width="14" stroke-linecap="round" />
    <path d="M 305 320 Q 400 325 495 300" fill="none" stroke="url(#frameGrad)" stroke-width="10" stroke-linecap="round" />

    <!-- Front Fork & Head Tube -->
    <line x1="485" y1="270" x2="505" y2="255" stroke="#bdc3c7" stroke-width="8" stroke-linecap="round" /> <!-- Stem -->
    <path d="M 495 290 L 555 440 L 560 445" fill="none" stroke="url(#frameGrad)" stroke-width="10" stroke-linecap="round" />
    <line x1="490" y1="280" x2="510" y2="330" stroke="url(#frameGrad)" stroke-width="14" stroke-linecap="round" /> <!-- Head tube -->
    
    <!-- Handlebars -->
    <path d="M 485 270 Q 495 240 465 245 Q 450 245 450 260" fill="none" stroke="#ecf0f1" stroke-width="9" stroke-linecap="round" />
    <!-- Handlebar Grip -->
    <path d="M 465 245 Q 450 245 450 260" fill="none" stroke="#e74c3c" stroke-width="11" stroke-linecap="round" />

    <!-- Seat Post & Saddle -->
    <line x1="295" y1="300" x2="285" y2="280" stroke="#bdc3c7" stroke-width="8" stroke-linecap="round" />
    <path d="M 255 280 C 255 265 280 270 315 275 C 325 277 325 288 305 290 C 285 292 255 295 255 280 Z" fill="#8e44ad" stroke="#2c3e50" stroke-width="3" />
    
    <!-- Wheel Hubs (Overlay) -->
    <circle cx="220" cy="445" r="6" fill="#ecf0f1" />
    <circle cx="560" cy="445" r="8" fill="#ecf0f1" stroke="#2c3e50" stroke-width="2" />

    <!-- Crankset (Main Gear) -->
    <circle cx="370" cy="450" r="24" fill="#ecf0f1" stroke="#7f8c8d" stroke-width="5" />
    <circle cx="370" cy="450" r="16" fill="none" stroke="#bdc3c7" stroke-width="3" stroke-dasharray="8 6" />
    <circle cx="370" cy="450" r="8" fill="#2c3e50" />
    
    <!-- Fenders -->
    <path d="M 130 430 A 90 90 0 0 1 295 395" fill="none" stroke="#ff6b6b" stroke-width="6" stroke-linecap="round" />
    <path d="M 490 390 A 90 90 0 0 1 645 415" fill="none" stroke="#ff6b6b" stroke-width="6" stroke-linecap="round" />
    
    <!-- Bike Bell -->
    <path d="M 475 235 A 8 8 0 0 1 490 235 Z" fill="#f1c40f" stroke="#d35400" stroke-width="1.5" />
  </g>


  <!-- ================= PELICAN MAIN BODY ================= -->
  <g id="pelican" filter="url(#shadow)">
    <!-- Tail Feathers -->
    <path d="M 260 250 L 210 230 L 225 245 L 205 250 L 230 260 L 215 270 L 265 270 Z" fill="#d9e2ec" stroke="#bcccdc" stroke-width="2" stroke-linejoin="round" />

    <!-- Main Torso -->
    <path d="M 255 255 C 245 200 320 180 375 215 C 415 240 395 290 355 295 C 315 300 265 285 255 255 Z" fill="url(#bodyGrad)" stroke="#bcccdc" stroke-width="2" />

    <!-- Neck and Head -->
    <path d="M 355 235 C 385 210 355 150 365 110 C 370 85 405 85 415 105 C 425 125 410 140 405 160 C 400 180 415 225 380 255 Z" fill="url(#bodyGrad)" />
    
    <!-- Head Tuft / Feathers -->
    <path d="M 368 98 L 350 85 L 362 103 L 345 98 L 362 110" fill="#ffffff" stroke="#bcccdc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Giant Beak - Pouch (Lower) -->
    <path d="M 408 128 C 430 220 510 235 595 130 C 550 132 450 128 408 128 Z" fill="url(#pouchGrad)" stroke="#e65100" stroke-width="3" stroke-linejoin="round" />
    
    <!-- Pouch Texture Lines -->
    <path d="M 435 130 Q 460 190 520 185" fill="none" stroke="#d84315" stroke-width="1.5" opacity="0.5" />
    <path d="M 470 130 Q 495 175 555 165" fill="none" stroke="#d84315" stroke-width="1.5" opacity="0.5" />
    <path d="M 510 131 Q 530 155 575 145" fill="none" stroke="#d84315" stroke-width="1.5" opacity="0.5" />

    <!-- Giant Beak - Mandible (Upper) -->
    <path d="M 405 110 C 460 112 540 105 595 120 C 605 122 605 132 595 135 C 590 136 588 130 585 130 C 530 132 450 128 402 128 Z" fill="url(#beakTopGrad)" stroke="#e65100" stroke-width="3" stroke-linejoin="round" />

    <!-- Face / Eye Patch -->
    <circle cx="395" cy="115" r="10" fill="#ff9a44" opacity="0.8" />
    <!-- Eye -->
    <circle cx="395" cy="115" r="5" fill="#2c3e50" />
    <circle cx="397" cy="113" r="2" fill="#ffffff" />
    <!-- Cheek blush -->
    <ellipse cx="388" cy="126" rx="6" ry="3" fill="#ff5252" opacity="0.5" />

    <!-- Sailor Cap -->
    <g transform="translate(365, 75) rotate(-15)">
      <path d="M 0 15 C 5 5 30 5 35 15 Z" fill="#ffffff" stroke="#2c3e50" stroke-width="2" />
      <rect x="-2" y="13" width="39" height="5" rx="2" fill="#0083b0" stroke="#2c3e50" stroke-width="1.5" />
      <path d="M 10 18 Q 20 23 38 15" fill="none" stroke="#2c3e50" stroke-width="3" stroke-linecap="round" />
      <circle cx="17" cy="5" r="3" fill="#f1c40f" stroke="#2c3e50" stroke-width="1.5" />
    </g>
  </g>


  <!-- ================= PELICAN FRONT LAYER ================= -->
  <!-- Front Leg -->
  <g id="front-leg" filter="url(#shadow)">
    <!-- Crank Arm (Front) -->
    <line x1="370" y1="450" x2="392" y2="486" stroke="#bdc3c7" stroke-width="8" stroke-linecap="round" />
    
    <!-- Thigh/Lower Leg -->
    <path d="M 320 285 L 385 375 L 375 475" fill="none" stroke="#ff9a44" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Knee Joint -->
    <circle cx="385" cy="375" r="8" fill="#e67e22" />
    <!-- Feather Cuff -->
    <path d="M 305 275 Q 320 305 340 295 Q 335 275 320 270 Z" fill="#f0f4f8" stroke="#bcccdc" stroke-width="2" />
    
    <!-- Webbed Foot -->
    <path d="M 375 475 L 415 475 C 422 475 420 485 410 486 L 365 483 C 360 483 365 475 375 475 Z" fill="#ff9a44" stroke="#d35400" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Front Pedal -->
    <rect x="374" y="482" width="36" height="8" rx="4" fill="#2c3e50" stroke="#ecf0f1" stroke-width="1" />
  </g>

  <!-- Flowing Scarf -->
  <g id="scarf" filter="url(#shadow)">
    <!-- Neck Wrap -->
    <path d="M 358 195 Q 385 210 408 195 Q 415 210 402 220 Q 375 225 352 210 Z" fill="#e74c3c" stroke="#c0392b" stroke-width="2" />
    <!-- Scarf Tails -->
    <path d="M 358 205 Q 290 215 230 185 Q 190 165 150 180 L 155 205 Q 195 195 235 210 Q 295 230 355 215 Z" fill="#e74c3c" stroke="#c0392b" stroke-width="2" stroke-linejoin="round" />
    <!-- Scarf Stripes -->
    <path d="M 320 209 L 315 220" stroke="#f1c40f" stroke-width="5" />
    <path d="M 280 205 L 273 218" stroke="#f1c40f" stroke-width="5" />
    <path d="M 240 192 L 232 208" stroke="#f1c40f" stroke-width="5" />
    <path d="M 200 177 L 195 198" stroke="#f1c40f" stroke-width="5" />
    <path d="M 165 178 L 168 202" stroke="#f1c40f" stroke-width="5" />
    <!-- Scarf Fringes -->
    <g stroke="#f1c40f" stroke-width="2" stroke-linecap="round">
      <line x1="150" y1="182" x2="138" y2="178" />
      <line x1="151" y1="188" x2="139" y2="186" />
      <line x1="153" y1="194" x2="140" y2="194" />
      <line x1="154" y1="200" x2="142" y2="202" />
    </g>
  </g>

  <!-- Front Wing -->
  <g id="front-wing" filter="url(#shadow)">
    <path d="M 335 225 C 320 200 365 195 395 215 C 430 240 445 250 465 250 C 470 250 475 260 460 265 C 450 268 465 275 450 275 C 435 275 445 282 430 280 C 390 275 350 250 335 225 Z" fill="url(#bodyGrad)" stroke="#bcccdc" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Wing Feather Details -->
    <path d="M 365 235 Q 395 250 435 260" fill="none" stroke="#bcccdc" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 380 250 Q 410 265 445 270" fill="none" stroke="#bcccdc" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 350 220 Q 375 235 400 235" fill="none" stroke="#bcccdc" stroke-width="2" stroke-linecap="round" />
  </g>


  <!-- ================= FOREGROUND / EFFECTS ================= -->
  <!-- Speed / Motion Lines -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <line x1="60" y1="280" x2="140" y2="280" />
    <line x1="40" y1="300" x2="90" y2="300" />
    <line x1="80" y1="420" x2="120" y2="420" />
    <line x1="650" y1="350" x2="730" y2="350" />
    <line x1="680" y1="370" x2="710" y2="370" />
  </g>
  
  <!-- Dynamic Wind Swirls -->
  <path d="M 120 190 Q 90 190 80 170 Q 70 150 90 140 Q 110 130 115 150" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
  <path d="M 670 480 Q 710 480 720 460 Q 730 440 710 430 Q 690 420 695 440" fill="none" stroke="#8ec5fc" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />

  <!-- Little Flowers on the Side -->
  <g transform="translate(130, 525)">
    <path d="M 0 10 Q -5 0 -10 -5" fill="none" stroke="#2ecc71" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 0 10 Q 5 0 12 -2" fill="none" stroke="#2ecc71" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="-10" cy="-5" r="5" fill="#ff6b6b" />
    <circle cx="-10" cy="-5" r="2" fill="#f1c40f" />
    <circle cx="12" cy="-2" r="4" fill="#ff9ff3" />
    <circle cx="12" cy="-2" r="1.5" fill="#f1c40f" />
  </g>

  <g transform="translate(650, 528)">
    <path d="M 0 8 Q -3 -2 -8 -6" fill="none" stroke="#2ecc71" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="-8" cy="-6" r="4.5" fill="#feca57" />
    <circle cx="-8" cy="-6" r="1.5" fill="#ffffff" />
  </g>

</svg>