  <g fill="#2f4f45">
    <rect x="6"  y="22" width="2" height="16"/>
    <rect x="4"  y="19" width="6" height="3"/>
    <rect x="5"  y="37" width="4" height="2"/>
    <rect x="56" y="22" width="2" height="16"/>
    <rect x="54" y="19" width="6" height="3"/>
    <rect x="55" y="37" width="4" height="2"/>
  </g>
  <rect x="5"  y="20" width="4" height="1" fill="#ffe58a"/>
  <rect x="55" y="20" width="4" height="1" fill="#ffe58a"/>

