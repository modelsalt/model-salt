    <rect x="0" y="52" width="64" height="1"/>
    <rect x="0" y="61" width="64" height="1"/>
    <rect x="9"  y="38" width="1" height="6"/>
    <rect x="20" y="45" width="1" height="7"/>
    <rect x="44" y="45" width="1" height="7"/>
    <rect x="54" y="38" width="1" height="6"/>
    <rect x="12" y="53" width="1" height="8"/>
    <rect x="52" y="53" width="1" height="8"/>
  </g>

  <!-- Railing -->
  <g fill="#eef2f2">
    <rect x="0" y="31" width="64" height="1"/>
    <rect x="0" y="34" width="64" height="1"/>
    <rect x="0"  y="31" width="1" height="7"/>
    <rect x="5"  y="31" width="1" height="7"/>
    <rect x="10" y="31" width="1" height="7"/>
    <rect x="15" y="31" width="1" height="7"/>
    <rect x="20" y="31" width="1" height="7"/>
    <rect x="25" y="31" width="1" height="7"/>
    <rect x="38" y="31" width="1" height="7"/>
    <rect x="43" y="31" width="1" height="7"/>
    <rect x="48" y="31" width="1" height="7"/>
    <rect x="53" y="31" width="1" height="7"/>
    <rect x="58" y="31" width="1" height="7"/>
    <rect x="63" y="31" width="1" height="7"/>
