<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512" shape-rendering="crispEdges">
  <!-- Sky (banded) -->
  <rect x="0" y="0"  width="64" height="10" fill="#7ec8ef"/>
  <rect x="0" y="10" width="64" height="9"  fill="#9bd5f3"/>
  <rect x="0" y="19" width="64" height="9"  fill="#b8e3f7"/>

  <!-- Sun behind the rider's head -->
  <g fill="#ffe27a">
    <rect x="30" y="3"  width="4"  height="1"/>
    <rect x="28" y="4"  width="8"  height="1"/>
    <rect x="27" y="5"  width="10" height="4"/>
    <rect x="28" y="9"  width="8"  height="1"/>
    <rect x="30" y="10" width="4"  height="1"/>
  </g>

  <!-- Clouds -->
  <g fill="#ffffff">
    <rect x="15" y="3" width="5"  height="1"/>
    <rect x="13" y="4" width="10" height="2"/>
    <rect x="44" y="2" width="6"  height="1"/>
    <rect x="42" y="3" width="11" height="2"/>
  </g>

  <!-- Sea -->
  <rect x="0" y="28" width="64" height="8" fill="#2b74a8"/>
  <rect x="0" y="28" width="64" height="1" fill="#4f95c4"/>
  <g fill="#8cc6e8">
    <rect x="3"  y="30" width="3" height="1"/>
    <rect x="14" y="32" width="2" height="1"/>
    <rect x="22" y="29" width="3" height="1"/>
    <rect x="40" y="30" width="3" height="1"/>
    <rect x="50" y="33" width="2" height="1"/>
    <rect x="58" y="29" width="3" height="1"/>
