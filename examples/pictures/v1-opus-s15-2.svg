  <g fill="#f7f7f4">
    <!-- left wing -->
    <rect x="4"  y="8"  width="3"  height="1"/>
    <rect x="3"  y="9"  width="6"  height="1"/>
    <rect x="3"  y="10" width="8"  height="1"/>
    <rect x="4"  y="11" width="9"  height="1"/>
    <rect x="5"  y="12" width="10" height="1"/>
    <rect x="6"  y="13" width="11" height="1"/>
    <rect x="7"  y="14" width="12" height="1"/>
    <rect x="8"  y="15" width="12" height="1"/>
    <rect x="10" y="16" width="12" height="1"/>
    <rect x="11" y="17" width="12" height="1"/>
    <rect x="13" y="18" width="11" height="1"/>
    <rect x="14" y="19" width="12" height="1"/>
    <rect x="16" y="20" width="11" height="1"/>
    <rect x="17" y="21" width="10" height="1"/>
    <rect x="19" y="22" width="8"  height="1"/>
    <rect x="20" y="23" width="7"  height="1"/>
    <rect x="22" y="24" width="5"  height="1"/>
    <rect x="23" y="25" width="4"  height="1"/>
    <rect x="24" y="26" width="3"  height="1"/>
    <!-- right wing (mirror) -->
    <rect x="57" y="8"  width="3"  height="1"/>
    <rect x="55" y="9"  width="6"  height="1"/>
    <rect x="53" y="10" width="8"  height="1"/>
    <rect x="51" y="11" width="9"  height="1"/>
    <rect x="49" y="12" width="10" height="1"/>
    <rect x="47" y="13" width="11" height="1"/>
    <rect x="45" y="14" width="12" height="1"/>
    <rect x="44" y="15" width="12" height="1"/>
    <rect x="42" y="16" width="12" height="1"/>
    <rect x="41" y="17" width="12" height="1"/>
    <rect x="40" y="18" width="11" height="1"/>
    <rect x="38" y="19" width="12" height="1"/>
    <rect x="37" y="20" width="11" height="1"/>
    <rect x="37" y="21" width="10" height="1"/>
    <rect x="37" y="22" width="8"  height="1"/>
    <rect x="37" y="23" width="7"  height="1"/>
    <rect x="37" y="24" width="5"  height="1"/>
    <rect x="37" y="25" width="4"  height="1"/>
    <rect x="37" y="26" width="3"  height="1"/>
  </g>
  <!-- black primary feathers -->
  <g fill="#222428">
    <rect x="4"  y="8"  width="3" height="1"/>
    <rect x="3"  y="9"  width="4" height="1"/>
    <rect x="3"  y="10" width="4" height="1"/>
    <rect x="4"  y="11" width="4" height="1"/>
    <rect x="5"  y="12" width="4" height="1"/>
    <rect x="6"  y="13" width="4" height="1"/>
    <rect x="7"  y="14" width="4" height="1"/>
    <rect x="8"  y="15" width="3" height="1"/>
    <rect x="10" y="16" width="3" height="1"/>
    <rect x="11" y="17" width="3" height="1"/>
    <rect x="57" y="8"  width="3" height="1"/>
    <rect x="57" y="9"  width="4" height="1"/>
    <rect x="57" y="10" width="4" height="1"/>
    <rect x="56" y="11" width="4" height="1"/>
    <rect x="55" y="12" width="4" height="1"/>
    <rect x="54" y="13" width="4" height="1"/>
    <rect x="53" y="14" width="4" height="1"/>
    <rect x="53" y="15" width="3" height="1"/>
    <rect x="51" y="16" width="3" height="1"/>
    <rect x="50" y="17" width="3" height="1"/>
  </g>
  <!-- grey secondary feathers -->
  <g fill="#b9bdc5">
    <rect x="13" y="18" width="1" height="1"/>
    <rect x="14" y="19" width="1" height="1"/>
    <rect x="16" y="20" width="1" height="1"/>
    <rect x="17" y="21" width="1" height="1"/>
    <rect x="19" y="22" width="1" height="1"/>
    <rect x="20" y="23" width="1" height="1"/>
    <rect x="12" y="15" width="1" height="1"/>
    <rect x="14" y="16" width="1" height="1"/>
    <rect x="16" y="17" width="1" height="1"/>
    <rect x="18" y="18" width="1" height="1"/>
    <rect x="50" y="18" width="1" height="1"/>
    <rect x="49" y="19" width="1" height="1"/>
    <rect x="47" y="20" width="1" height="1"/>
    <rect x="46" y="21" width="1" height="1"/>
    <rect x="44" y="22" width="1" height="1"/>
    <rect x="43" y="23" width="1" height="1"/>
    <rect x="51" y="15" width="1" height="1"/>
    <rect x="49" y="16" width="1" height="1"/>
    <rect x="47" y="17" width="1" height="1"/>
    <rect x="45" y="18" width="1" height="1"/>
  </g>

  <!-- Body, sitting back on the saddle -->
  <g fill="#f7f7f4">
    <rect x="27" y="24" width="10" height="1"/>
    <rect x="25" y="25" width="14" height="1"/>
    <rect x="24" y="26" width="16" height="10"/>
    <rect x="25" y="36" width="14" height="1"/>
    <rect x="27" y="37" width="10" height="1"/>
  </g>
  <g fill="#c9ccd2">
    <rect x="24" y="29" width="1"  height="7"/>
    <rect x="39" y="29" width="1"  height="7"/>
    <rect x="25" y="36" width="2"  height="1"/>
    <rect x="37" y="36" width="2"  height="1"/>
    <rect x="27" y="37" width="10" height="1"/>
  </g>

  <!-- Neck & head -->
  <rect x="29" y="17" width="6" height="8" fill="#f7f7f4"/>
  <rect x="29" y="12" width="6" height="1" fill="#f3e9a6"/>
  <rect x="28" y="13" width="8" height="5" fill="#f7f7f4"/>
  <rect x="28" y="13" width="8" height="1" fill="#f3e9a6"/>
  <rect x="29" y="15" width="1" height="1" fill="#1d1d1d"/>
  <rect x="34" y="15" width="1" height="1" fill="#1d1d1d"/>
  <rect x="29" y="14" width="1" height="1" fill="#f2b8b0"/>
  <rect x="34" y="14" width="1" height="1" fill="#f2b8b0"/>

  <!-- Bill & pouch, pointing at the viewer -->
  <rect x="30" y="16" width="4" height="4"  fill="#f5c242"/>
  <rect x="29" y="20" width="6" height="12" fill="#f0902a"/>
  <rect x="29" y="21" width="1" height="10" fill="#c9661d"/>
  <rect x="34" y="21" width="1" height="10" fill="#c9661d"/>
  <rect x="31" y="16" width="2" height="16" fill="#f5c242"/>
  <rect x="30" y="32" width="4" height="1"  fill="#d9531e"/>
  <rect x="31" y="33" width="2" height="1"  fill="#d9531e"/>

  <!-- Shadow -->
  <rect x="23" y="60" width="18" height="3" fill="#c8b591"/>

  <!-- Bicycle (head-on) -->
  <rect x="31" y="40" width="2" height="2"  fill="#444"/>       <!-- rear tyre peeking -->
  <rect x="31" y="42" width="2" height="20" fill="#1e1e1e"/>    <!-- front tyre -->
  <g fill="#d62828">
    <rect x="29" y="40" width="6" height="2"/>                  <!-- fork crown -->
    <rect x="29" y="41" width="1" height="11"/>                 <!-- fork legs -->
    <rect x="34" y="41" width="1" height="11"/>
    <rect x="30" y="41" width="4" height="4"/>                  <!-- mudguard -->
    <rect x="30" y="37" width="4" height="3"/>                  <!-- head tube -->
  </g>
  <rect x="30" y="37" width="1" height="3" fill="#ef5050"/>
  <rect x="29" y="51" width="6" height="2" fill="#9a9a9a"/>     <!-- hub -->
  <rect x="21" y="37" width="22" height="1" fill="#3a3a3a"/>    <!-- handlebar -->
  <rect x="20" y="36" width="3" height="3" fill="#111"/>        <!-- grips -->
  <rect x="41" y="36" width="3" height="3" fill="#111"/>
  <rect x="30" y="39" width="4" height="2" fill="#fff6b0"/>     <!-- headlamp -->
  <rect x="30" y="39" width="4" height="1" fill="#e8d36a"/>

  <!-- Cranks & pedals -->
  <g fill="#555">
    <rect x="28" y="48" width="3" height="1"/>
    <rect x="27" y="47" width="1" height="1"/>
    <rect x="33" y="52" width="1" height="1"/>
    <rect x="34" y="53" width="1" height="1"/>
  </g>
  <rect x="23" y="47" width="6" height="1" fill="#333"/>
  <rect x="35" y="55" width="6" height="1" fill="#333"/>

  <!-- Legs & webbed feet -->
  <g fill="#f08a24">
    <rect x="26" y="38" width="2" height="8"/>
    <rect x="36" y="38" width="2" height="16"/>
    <rect x="23" y="46" width="6" height="1"/>
    <rect x="35" y="54" width="6" height="1"/>
  </g>
  <rect x="21" y="37" width="5" height="1" fill="#3a3a3a"/>
  <rect x="38" y="37" width="5" height="1" fill="#3a3a3a"/>
</svg>