<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Sky background: deep blue top to lighter horizon -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E5BB8"/>
      <stop offset="1" stop-color="#4FA3E8"/>
    </linearGradient>
    <!-- Sun -->
    <radialGradient id="sun" cx="0.4" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#FFE98A"/>
      <stop offset="1" stop-color="#FFB627"/>
    </radialGradient>
    <!-- Cloud -->
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCE8F5"/>
    </linearGradient>
    <!-- Soft shadow under cloud -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#0B3A7A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Square background, sharp corners -->
  <rect width="1024" height="1024" fill="url(#sky)"/>

  <!-- Sun rays -->
  <g stroke="#FFD166" stroke-width="34" stroke-linecap="round" opacity="0.95">
    <line x1="640" y1="110" x2="640" y2="170"/>
    <line x1="640" y1="110" x2="640" y2="170" transform="rotate(45 640 345)"/>
    <line x1="640" y1="110" x2="640" y2="170" transform="rotate(90 640 345)"/>
    <line x1="640" y1="110" x2="640" y2="170" transform="rotate(135 640 345)"/>
    <line x1="640" y1="110" x2="640" y2="170" transform="rotate(-45 640 345)"/>
    <line x1="640" y1="110" x2="640" y2="170" transform="rotate(-90 640 345)"/>
  </g>

  <!-- Sun disc -->
  <circle cx="640" cy="345" r="150" fill="url(#sun)"/>

  <!-- Cloud -->
  <g filter="url(#shadow)">
    <path fill="url(#cloud)" d="
      M 250 720
      A 120 120 0 0 1 300 490
      A 165 165 0 0 1 615 445
      A 125 125 0 0 1 770 720
      Z"/>
  </g>

  <!-- Rain drops -->
  <g fill="#9ED4FF">
    <path d="M 380 790 q 30 60 0 90 q -30 -30 0 -90 z"/>
    <path d="M 510 800 q 30 60 0 90 q -30 -30 0 -90 z"/>
    <path d="M 640 790 q 30 60 0 90 q -30 -30 0 -90 z"/>
  </g>
</svg>