<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <rect width="600" height="800" fill="#ffffff"/>

  <!-- Far leg (behind the bike) -->
  <g stroke="#3d3a37" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="262,448 302,540 252,618"/>
  </g>
  <path d="M240 616 L268 612 L264 624 Z" fill="#3d3a37"/>

  <!-- Wheels -->
  <g fill="none">
    <circle cx="170" cy="640" r="105" stroke="#222" stroke-width="14"/>
    <circle cx="170" cy="640" r="94" stroke="#cfcfcf" stroke-width="4"/>
    <circle cx="430" cy="640" r="105" stroke="#222" stroke-width="14"/>
    <circle cx="430" cy="640" r="94" stroke="#cfcfcf" stroke-width="4"/>
  </g>
  <g stroke="#cfcfcf" stroke-width="2.5">
    <line x1="170" y1="546" x2="170" y2="734"/>
    <line x1="76" y1="640" x2="264" y2="640"/>
    <line x1="430" y1="546" x2="430" y2="734"/>
    <line x1="336" y1="640" x2="524" y2="640"/>
  </g>
  <circle cx="170" cy="640" r="9" fill="#555"/>
  <circle cx="430" cy="640" r="9" fill="#555"/>

  <!-- Chain -->
  <path d="M170 631 L290 623 M170 649 L290 667" stroke="#666" stroke-width="3" fill="none"/>

  <!-- Red frame -->
  <g stroke="#d62828" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="170" y1="640" x2="290" y2="645"/>
    <line x1="170" y1="640" x2="255" y2="490"/>
    <line x1="290" y1="645" x2="250" y2="478"/>
    <line x1="255" y1="490" x2="407" y2="482"/>
    <line x1="290" y1="645" x2="410" y2="500"/>
    <line x1="404" y1="468" x2="414" y2="512"/>
    <line x1="414" y1="512" x2="430" y2="640"/>
  </g>

  <!-- Chainring and cranks -->
  <circle cx="290" cy="645" r="22" fill="none" stroke="#444" stroke-width="5"/>
  <circle cx="290" cy="645" r="6" fill="#444"/>
  <line x1="250" y1="620" x2="330" y2="670" stroke="#333" stroke-width="7" stroke-linecap="round"/>
  <rect x="236" y="616" width="28" height="7" rx="2" fill="#222"/>

  <!-- Stem and handlebar -->
  <g stroke="#d62828" stroke-width="10" stroke-linecap="round" fill="none">
    <line x1="404" y1="470" x2="400" y2="446"/>
    <path d="M396 446 L428 440"/>
  </g>
  <rect x="414" y="433" width="26" height="13" rx="6" fill="#222"/>

  <!-- Saddle -->
  <path d="M215 474 Q250 462 285 476 Q252 488 215 482 Z" fill="#222"/>

  <!-- Tail -->
  <path d="M185 405 L135 448 L192 440 Z" fill="#6b625a"/>

  <!-- Body -->
  <ellipse cx="258" cy="408" rx="90" ry="58" transform="rotate(-15 258 408)" fill="#8a8178"/>

  <!-- Near leg -->
  <g stroke="#3d3a37" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="292,452 340,560 330,668"/>
  </g>
  <rect x="316" y="666" width="30" height="8" rx="2" fill="#222"/>
  <path d="M318 666 L354 660 L350 674 Z" fill="#3d3a37"/>

  <!-- Wing reaching to the handlebar -->
  <path d="M225 372 Q300 338 352 378 Q392 410 418 440 Q372 446 330 432 Q268 424 225 398 Z" fill="#5e554c"/>
  <g stroke="#b8afa3" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M262 392 Q310 395 352 418"/>
    <path d="M285 375 Q330 380 372 412"/>
  </g>

  <!-- Neck -->
  <path d="M305 372 C350 330 298 282 332 218" stroke="#5a3a28" stroke-width="34" stroke-linecap="round" fill="none"/>

  <!-- Head -->
  <circle cx="335" cy="200" r="30" fill="#f3ead2"/>
  <path d="M310 188 Q330 164 360 182 Q338 178 312 194 Z" fill="#e8cf7a"/>
  <circle cx="346" cy="193" r="5" fill="#f5f0d8" stroke="#333" stroke-width="1.5"/>
  <circle cx="347" cy="193" r="2.2" fill="#222"/>

  <!-- Pouch -->
  <path d="M358 212 L522 252 Q452 302 382 252 Q362 236 356 216 Z" fill="#6b5a4a"/>

  <!-- Upper bill with hooked orange tip -->
  <path d="M352 186 L522 238 L524 252 L358 214 Z" fill="#c9a27a"/>
  <path d="M512 235 Q540 240 532 256 Q526 250 518 249 Z" fill="#d9773a"/>
</svg>