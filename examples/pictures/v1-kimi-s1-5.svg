<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680">
  <title>Pelican riding a cruiser bicycle</title>
  <desc>A grayscale flat-cartoon pelican sits upright on a comfort cruiser, wings resting on the swept-back handlebars, pedaling casually. Elevated three-quarter view.</desc>

  <rect width="900" height="680" fill="#f5f5f5"/>

  <!-- distant birds -->
  <g fill="none" stroke="#c2c2c2" stroke-width="5" stroke-linecap="round">
    <path d="M 118 128 C 126 116, 136 116, 144 128 C 152 116, 162 116, 170 128"/>
    <path d="M 716 96 C 722 87, 730 87, 736 96 C 742 87, 750 87, 756 96"/>
  </g>

  <!-- ground shadow -->
  <ellipse cx="468" cy="588" rx="345" ry="30" fill="#d9d9d9"/>

  <g stroke-linecap="round" stroke-linejoin="round">

    <!-- ======== REAR WHEEL ======== -->
    <g fill="none">
      <ellipse cx="282" cy="472" rx="95" ry="82" stroke="#565656" stroke-width="5"/>
      <ellipse cx="290" cy="478" rx="95" ry="82" stroke="#2a2a2a" stroke-width="20"/>
      <ellipse cx="290" cy="478" rx="76" ry="65" stroke="#c7c7c7" stroke-width="7"/>
      <path stroke="#9a9a9a" stroke-width="3.5" d="M290 478 L366 478 M290 478 L344 524 M290 478 L290 543 M290 478 L236 524 M290 478 L214 478 M290 478 L236 432 M290 478 L290 413 M290 478 L344 432"/>
    </g>

    <!-- ======== FRONT WHEEL ======== -->
    <g fill="none">
      <ellipse cx="632" cy="492" rx="100" ry="86" stroke="#565656" stroke-width="5"/>
      <ellipse cx="640" cy="498" rx="100" ry="86" stroke="#2a2a2a" stroke-width="20"/>
      <ellipse cx="640" cy="498" rx="82" ry="70" stroke="#c7c7c7" stroke-width="7"/>
      <path stroke="#9a9a9a" stroke-width="3.5" d="M640 498 L720 498 M640 498 L697 546 M640 498 L640 566 M640 498 L583 546 M640 498 L560 498 M640 498 L583 450 M640 498 L640 430 M640 498 L697 450"/>
    </g>

    <!-- ======== FRAME (dark outline pass, then grey pass) ======== -->
    <g fill="none" stroke="#1f1f1f" stroke-width="15">
      <path d="M 400 348 L 294 472"/>
      <path d="M 450 468 L 294 477"/>
      <path d="M 398 346 L 450 466"/>
      <path d="M 598 306 C 548 290, 472 300, 402 344"/>
      <path d="M 612 378 C 562 398, 506 438, 454 466"/>
    </g>
    <g fill="none" stroke="#8c8c8c" stroke-width="8">
      <path d="M 400 348 L 294 472"/>
      <path d="M 450 468 L 294 477"/>
      <path d="M 398 346 L 450 466"/>
      <path d="M 598 306 C 548 290, 472 300, 402 344"/>
      <path d="M 612 378 C 562 398, 506 438, 454 466"/>
    </g>
    <!-- head tube + fork -->
    <path d="M 596 302 L 614 378" fill="none" stroke="#1f1f1f" stroke-width="22"/>
    <path d="M 596 302 L 614 378" fill="none" stroke="#8c8c8c" stroke-width="13"/>
    <path d="M 614 380 C 622 425, 632 465, 638 496" fill="none" stroke="#1f1f1f" stroke-width="14"/>
    <path d="M 614 380 C 622 425, 632 465, 638 496" fill="none" stroke="#8c8c8c" stroke-width="8"/>

    <!-- hubs -->
    <circle cx="290" cy="478" r="10" fill="#3a3a3a" stroke="#1f1f1f" stroke-width="4"/>
    <circle cx="640" cy="498" r="10" fill="#3a3a3a" stroke="#1f1f1f" stroke-width="4"/>
    <circle cx="640" cy="498" r="4" fill="#d9d9d9"/>

    <!-- chain + rear cog -->
    <path d="M 423 459 L 296 471 M 423 481 L 296 483" fill="none" stroke="#4a4a4a" stroke-width="4.5"/>
    <circle cx="290" cy="478" r="11" fill="#b3b3b3" stroke="#1f1f1f" stroke-width="4"/>
    <circle cx="290" cy="478" r="3.5" fill="#3a3a3a"/>

    <!-- chainring + cranks + pedals -->
    <circle cx="450" cy="470" r="27" fill="#c9c9c9" stroke="#1f1f1f" stroke-width="5"/>
    <circle cx="450" cy="470" r="15" fill="none" stroke="#8f8f8f" stroke-width="3"/>
    <path d="M 450 470 L 410 424" fill="none" stroke="#1f1f1f" stroke-width="12"/>
    <path d="M 450 470 L 410 424" fill="none" stroke="#5a5a5a" stroke-width="6"/>
    <rect x="388" y="416" width="38" height="13" rx="6" fill="#4a4a4a" stroke="#1f1f1f" stroke-width="4"/>
    <circle cx="450" cy="470" r="7" fill="#6f6f6f" stroke="#1f1f1f" stroke-width="4"/>
    <path d="M 450 470 L 492 520" fill="none" stroke="#1f1f1f" stroke-width="12"/>
    <path d="M 450 470 L 492 520" fill="none" stroke="#7a7a7a" stroke-width="6"/>
    <rect x="472" y="516" width="42" height="14" rx="6" fill="#2b2b2b" stroke="#1f1f1f" stroke-width="4"/>

    <!-- seat post + comfort saddle -->
    <path d="M 399 346 L 366 324" fill="none" stroke="#1f1f1f" stroke-width="13"/>
    <path d="M 399 346 L 366 324" fill="none" stroke="#8c8c8c" stroke-width="7"/>
    <path d="M 306 312 C 302 301, 314 294, 336 293 C 360 292, 380 298, 384 308 C 387 317, 376 323, 358 325 C 338 327, 310 323, 306 312 Z" fill="#333333" stroke="#1f1f1f" stroke-width="5"/>
    <path d="M 318 304 C 332 299, 354 299, 368 304" fill="none" stroke="#6a6a6a" stroke-width="4"/>

    <!-- stem + swept-back handlebars (far bar first) -->
    <path d="M 592 252 C 582 236, 562 226, 538 230" fill="none" stroke="#1f1f1f" stroke-width="13"/>
    <path d="M 592 252 C 582 236, 562 226, 538 230" fill="none" stroke="#6a6a6a" stroke-width="7"/>
    <path d="M 538 230 L 514 234" fill="none" stroke="#141414" stroke-width="17"/>
    <path d="M 538 230 L 514 234" fill="none" stroke="#565656" stroke-width="11"/>
    <path d="M 600 304 L 592 254 C 584 240, 564 232, 528 238" fill="none" stroke="#1f1f1f" stroke-width="14"/>
    <path d="M 600 304 L 592 254 C 584 240, 564 232, 528 238" fill="none" stroke="#8c8c8c" stroke-width="8"/>
    <path d="M 528 238 L 500 243" fill="none" stroke="#141414" stroke-width="18"/>
    <path d="M 528 238 L 500 243" fill="none" stroke="#2e2e2e" stroke-width="12"/>
    <!-- bell -->
    <circle cx="566" cy="230" r="8.5" fill="#d9d9d9" stroke="#1f1f1f" stroke-width="4"/>
    <path d="M 573 236 L 580 240" fill="none" stroke="#1f1f1f" stroke-width="3.5"/>

    <!-- ================= PELICAN ================= -->

    <!-- tail feathers -->
    <path d="M 322 288 C 300 296, 272 314, 254 338 L 268 342 L 258 358 L 280 348 L 278 368 L 296 346 C 310 330, 318 308, 322 288 Z" fill="#d0d0d0" stroke="#1f1f1f" stroke-width="5"/>

    <!-- far leg + foot (on the raised pedal) -->
    <path d="M 390 316 C 396 348, 402 386, 408 414" fill="none" stroke="#1f1f1f" stroke-width="15"/>
    <path d="M 390 316 C 396 348, 402 386, 408 414" fill="none" stroke="#6f6f6f" stroke-width="8"/>
    <path d="M 388 410 C 394 402, 408 400, 416 406 C 422 411, 422 420, 416 424 C 408 429, 394 427, 389 420 C 386 416, 386 413, 388 410 Z" fill="#6f6f6f" stroke="#1f1f1f" stroke-width="4"/>

    <!-- far wing reaching to far grip -->
    <path d="M 416 214 C 452 200, 502 205, 540 230 C 532 241, 518 245, 505 242 C 474 235, 443 228, 420 228 C 414 224, 413 218, 416 214 Z" fill="#b3b3b3" stroke="#1f1f1f" stroke-width="5"/>

    <!-- body -->
    <path d="M 332 312 C 296 296, 286 254, 304 214 C 318 182, 352 158, 388 162 C 424 166, 446 196, 448 234 C 450 272, 432 306, 402 320 C 378 330, 350 326, 332 312 Z" fill="#f4f4f4" stroke="#1f1f1f" stroke-width="6.5"/>
    <path d="M 338 308 C 324 282, 323 246, 337 214 C 329 250, 331 286, 349 310 C 345 313, 341 312, 338 308 Z" fill="#d5d5d5"/>

    <!-- neck -->
    <path d="M 398 174 C 390 142, 399 113, 423 97" fill="none" stroke="#1f1f1f" stroke-width="40"/>
    <path d="M 398 174 C 390 142, 399 113, 423 97" fill="none" stroke="#f4f4f4" stroke-width="31"/>

    <!-- crest tuft -->
    <g fill="none" stroke="#1f1f1f" stroke-width="4.5">
      <path d="M 413 63 C 408 53, 404 45, 402 37"/>
      <path d="M 421 59 C 418 48, 417 40, 417 32"/>
      <path d="M 429 58 C 429 47, 430 39, 432 31"/>
    </g>

    <!-- head -->
    <circle cx="436" cy="88" r="33" fill="#f4f4f4" stroke="#1f1f1f" stroke-width="6"/>

    <!-- pouch -->
    <path d="M 466 109 L 593 124 C 592 160, 572 193, 538 196 C 506 199, 484 164, 472 122 C 470 115, 468 111, 466 109 Z" fill="#bcbcbc" stroke="#1f1f1f" stroke-width="5"/>
    <path d="M 500 130 C 512 156, 528 172, 548 176" fill="none" stroke="#8f8f8f" stroke-width="3"/>

    <!-- upper bill -->
    <path d="M 463 83 C 516 89, 561 102, 596 116 C 601 118, 601 124, 596 126 C 552 120, 507 114, 463 109 C 457 101, 457 91, 463 83 Z" fill="#d2d2d2" stroke="#1f1f1f" stroke-width="5"/>
    <path d="M 466 111 L 590 125" fill="none" stroke="#1f1f1f" stroke-width="3"/>
    <path d="M 482 93 C 505 97, 528 102, 548 108" fill="none" stroke="#8f8f8f" stroke-width="2.5"/>
    <path d="M 590 114 C 598 115, 601 120, 598 126 C 595 129, 591 127, 590 124 Z" fill="#9a9a9a" stroke="#1f1f1f" stroke-width="3.5"/>

    <!-- eye -->
    <circle cx="447" cy="79" r="10" fill="#ffffff" stroke="#1f1f1f" stroke-width="4"/>
    <circle cx="450" cy="81" r="4.5" fill="#1a1a1a"/>
    <circle cx="452" cy="79" r="1.6" fill="#ffffff"/>
    <path d="M 436 64 C 443 60, 452 60, 458 64" fill="none" stroke="#1f1f1f" stroke-width="3.5"/>

    <!-- near leg + webbed foot (pushing the low pedal) -->
    <path d="M 412 322 C 430 378, 462 452, 490 512" fill="none" stroke="#1f1f1f" stroke-width="16"/>
    <path d="M 412 322 C 430 378, 462 452, 490 512" fill="none" stroke="#7a7a7a" stroke-width="9"/>
    <path d="M 469 511 C 477 503, 493 501, 503 508 C 511 513, 513 524, 506 531 C 511 536, 508 544, 500 544 C 496 550, 486 550, 482 544 C 473 543, 467 534, 469 525 C 467 520, 467 515, 469 511 Z" fill="#7a7a7a" stroke="#1f1f1f" stroke-width="4.5"/>
    <g fill="none" stroke="#3d3d3d" stroke-width="3">
      <path d="M 488 506 C 487 518, 486 530, 485 542"/>
      <path d="M 497 509 C 497 520, 496 532, 495 543"/>
    </g>

    <!-- near wing resting on the grip -->
    <path d="M 408 198 C 449 202, 489 216, 519 234 C 524 238, 522 246, 515 246 L 502 246 C 500 254, 490 257, 484 252 C 481 260, 470 262, 464 256 C 445 250, 425 236, 413 219 C 407 211, 404 203, 408 198 Z" fill="#e8e8e8" stroke="#1f1f1f" stroke-width="5.5"/>
    <g fill="none" stroke="#9a9a9a" stroke-width="3">
      <path d="M 428 214 C 450 224, 474 233, 498 240"/>
      <path d="M 440 232 C 456 240, 472 246, 488 250"/>
    </g>

  </g>
</svg>