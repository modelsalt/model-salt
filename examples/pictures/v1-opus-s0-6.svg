<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Sky & ground -->
  <rect width="400" height="300" fill="#e8f4fb"/>
  <rect y="270" width="400" height="30" fill="#c9b89a"/>
  <line x1="0" y1="270" x2="400" y2="270" stroke="#a8977a" stroke-width="2"/>

  <!-- Wheels -->
  <g fill="none" stroke="#2b2b2b" stroke-width="6">
    <circle cx="110" cy="220" r="48"/>
    <circle cx="290" cy="220" r="48"/>
  </g>
  <g stroke="#9aa3a8" stroke-width="1.5">
    <line x1="110" y1="174" x2="110" y2="266"/>
    <line x1="64" y1="220" x2="156" y2="220"/>
    <line x1="290" y1="174" x2="290" y2="266"/>
    <line x1="244" y1="220" x2="336" y2="220"/>
  </g>
  <circle cx="110" cy="220" r="5" fill="#555"/>
  <circle cx="290" cy="220" r="5" fill="#555"/>

  <!-- Frame -->
  <g stroke="#1e88a8" stroke-width="6" stroke-linecap="round" fill="none">
    <line x1="110" y1="220" x2="190" y2="222"/>  <!-- chain stay -->
    <line x1="110" y1="220" x2="172" y2="152"/>  <!-- seat stay -->
    <line x1="190" y1="222" x2="172" y2="152"/>  <!-- seat tube -->
    <line x1="172" y1="152" x2="266" y2="150"/>  <!-- top tube -->
    <line x1="190" y1="222" x2="266" y2="150"/>  <!-- down tube -->
    <line x1="266" y1="150" x2="290" y2="220"/>  <!-- fork -->
    <line x1="266" y1="150" x2="262" y2="128"/>  <!-- stem -->
  </g>
  <line x1="262" y1="128" x2="246" y2="126" stroke="#2b2b2b" stroke-width="6" stroke-linecap="round"/>

  <!-- Seat -->
  <rect x="156" y="144" width="30" height="7" rx="3" fill="#2b2b2b"/>

  <!-- Crank & chainring -->
  <circle cx="190" cy="222" r="10" fill="none" stroke="#555" stroke-width="3"/>
  <line x1="190" y1="222" x2="204" y2="242" stroke="#555" stroke-width="4" stroke-linecap="round"/>
  <rect x="197" y="240" width="16" height="5" rx="2" fill="#2b2b2b"/>

  <!-- Pelican leg & foot -->
  <polyline points="190,140 214,190 205,240" fill="none" stroke="#f08a24" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <ellipse cx="208" cy="240" rx="11" ry="4" fill="#f08a24"/>

  <!-- Tail -->
  <polygon points="132,112 100,100 104,124" fill="#8e979c"/>

  <!-- Body -->
  <ellipse cx="182" cy="118" rx="54" ry="30" fill="#ffffff" stroke="#cfd6da" stroke-width="2"/>

  <!-- Wing (reaching to handlebar) -->
  <path d="M140,108 Q190,92 248,124 Q200,128 150,126 Z" fill="#a9b2b7"/>
  <path d="M140,108 Q160,104 172,106 L150,126 Z" fill="#6f777c"/>

  <!-- Neck -->
  <rect x="214" y="48" width="18" height="70" rx="9" fill="#ffffff" stroke="#cfd6da" stroke-width="2"/>

  <!-- Head -->
  <circle cx="226" cy="48" r="16" fill="#ffffff" stroke="#cfd6da" stroke-width="2"/>
  <path d="M214,36 Q224,30 236,36" fill="none" stroke="#f3e3a0" stroke-width="4" stroke-linecap="round"/>

  <!-- Beak & pouch -->
  <path d="M236,52 Q262,78 330,62 Q290,96 240,64 Z" fill="#f5a623"/>
  <polygon points="236,44 334,56 330,62 238,54" fill="#f7c948"/>
  <circle cx="333" cy="59" r="3" fill="#e07b1a"/>

  <!-- Eye -->
  <circle cx="230" cy="45" r="3" fill="#1a1a1a"/>
</svg>