<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <title>Pelican riding a bicycle</title>
  <desc>A low front-right view of a pelican with both wings swept backward, riding a step-through bicycle. Expressive contours in terracotta, ochre, cream, and dark brown.</desc>

  <g stroke="#482D25">
    <!-- Wheels recede toward the left. -->
    <ellipse cx="163" cy="605" rx="60" ry="109" transform="rotate(-12 163 605)" stroke-width="7"/>
    <ellipse cx="163" cy="605" rx="50" ry="98" transform="rotate(-12 163 605)" stroke-width="2"/>
    <ellipse cx="337" cy="716" rx="88" ry="148" transform="rotate(-12 337 716)" stroke-width="9"/>
    <ellipse cx="337" cy="716" rx="76" ry="135" transform="rotate(-12 337 716)" stroke-width="3"/>
  </g>

  <g stroke="#B87832" stroke-width="2">
    <path d="M163 503V706M112 572L214 638M117 650L207 556M107 606L220 604"/>
    <path d="M307 578L367 854M257 675L417 757M272 812L402 620M253 735L421 697"/>
    <path d="M163 605L146 531M163 605L188 689M337 716L282 615M337 716L388 818"/>
  </g>

  <!-- Two lowered connecting tubes form the step-through frame. -->
  <g stroke="#B95F43">
    <path d="M192 521Q207 617 269 642L294 538" stroke-width="9"/>
    <path d="M186 553Q207 664 274 678L309 561" stroke-width="6"/>
    <path d="M192 521L163 605L269 642" stroke-width="6"/>
  </g>
  <g stroke="#482D25">
    <path d="M192 521L185 482M160 477Q183 468 207 479Q192 490 165 486" stroke-width="6"/>
    <path d="M337 716L294 538L279 487" stroke-width="8"/>
    <path d="M324 715L282 549" stroke-width="3"/>
    <path d="M279 487L251 470Q240 461 245 448M279 487L334 493Q354 493 355 476" stroke-width="6"/>
    <path d="M240 448L259 451M344 475L362 479" stroke-width="9"/>
    <ellipse cx="269" cy="650" rx="21" ry="29" transform="rotate(-15 269 650)" stroke-width="4"/>
    <path d="M269 650L295 679M269 650L245 625M284 681L310 685M231 622L257 629" stroke-width="5"/>
  </g>

  <!-- Far wing sweeps behind the rider. -->
  <g stroke="#B87832">
    <path d="M255 371Q190 329 88 288Q99 326 141 364Q187 404 225 412" stroke-width="4"/>
    <path d="M94 300Q145 359 206 384M112 304Q161 345 208 359" stroke-width="2"/>
  </g>

  <!-- Webbed feet on the pedals. -->
  <g stroke="#B87832">
    <path d="M213 487Q210 541 236 565L245 622L227 628L256 636L265 629L248 614L252 558" stroke-width="5"/>
    <path d="M256 490Q286 540 269 576L287 661L278 677L312 690L321 683L301 666L294 577" stroke-width="6"/>
  </g>

  <!-- Body, rising neck, and head. -->
  <g stroke="#482D25">
    <path d="M177 403Q142 446 170 481Q206 527 260 498Q299 478 296 435Q291 409 302 373L325 307Q337 277 321 252Q306 231 283 241Q257 251 258 278Q264 309 244 343L222 371" stroke-width="6"/>
    <path d="M177 403L136 420L152 438" stroke-width="4"/>
    <path d="M291 295Q284 337 272 359Q256 390 269 423" stroke-width="2"/>
    <path d="M300 252Q306 244 313 255" stroke-width="3"/>
    <ellipse cx="309" cy="266" rx="4" ry="6" stroke-width="4"/>
  </g>

  <!-- Long bill and hanging pelican pouch. -->
  <g stroke="#B87832">
    <path d="M321 270Q378 275 449 307Q392 313 322 295" stroke-width="5"/>
    <path d="M323 297Q357 357 382 345Q412 330 449 307" stroke-width="4"/>
    <path d="M334 304Q359 335 382 336" stroke-width="2"/>
  </g>

  <!-- Near wing trails backward, with open feather contours. -->
  <g stroke="#B95F43">
    <path d="M252 403Q197 379 77 350Q88 386 123 419Q158 449 207 458" stroke-width="7"/>
    <path d="M85 365Q127 411 197 438" stroke-width="3"/>
    <path d="M105 365Q145 399 203 420" stroke-width="2"/>
    <path d="M135 371Q169 393 214 405" stroke-width="4"/>
  </g>

  <g stroke="#E8D9B8" stroke-width="3">
    <path d="M183 463Q208 487 238 475"/>
    <path d="M274 274Q279 254 290 253"/>
    <path d="M299 745Q311 799 335 822"/>
  </g>

  <g stroke="#B95F43">
    <path d="M85 739Q112 748 139 748" stroke-width="4"/>
    <path d="M102 766L151 773" stroke-width="2"/>
    <path d="M241 885Q322 907 412 878" stroke-width="3"/>
