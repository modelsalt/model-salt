<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="bodyGrad" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#eef1f5"/>
      <stop offset="1" stop-color="#b9c2cf"/>
    </radialGradient>
    <linearGradient id="wingGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f6f9"/>
      <stop offset="0.7" stop-color="#c9d0db"/>
      <stop offset="1" stop-color="#7d8796"/>
    </linearGradient>
    <linearGradient id="beakGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd35c"/>
      <stop offset="1" stop-color="#f29a1f"/>
    </linearGradient>
    <linearGradient id="pouchGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc56b"/>
      <stop offset="1" stop-color="#e67e22"/>
    </linearGradient>
    <linearGradient id="frameGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b6b"/>
      <stop offset="1" stop-color="#c0392b"/>
    </linearGradient>
    <linearGradient id="legGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#e8871e"/>
    </linearGradient>
  </defs>

  <!-- Plain sky -->
  <rect width="800" height="600" fill="#cfe9f7"/>

  <!-- Ground line -->
  <line x1="0" y1="545" x2="800" y2="545" stroke="#222" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="405" cy="547" rx="250" ry="7" fill="#000" opacity="0.12"/>

  <g stroke="#222" stroke-linejoin="round" stroke-linecap="round">

    <!-- Rear wheel -->
    <circle cx="250" cy="450" r="95" fill="none" stroke="#222" stroke-width="16"/>
    <circle cx="250" cy="450" r="95" fill="none" stroke="#444" stroke-width="8"/>
    <circle cx="250" cy="450" r="84" fill="none" stroke="#9aa3ad" stroke-width="3"/>
    <g stroke="#7f8893" stroke-width="2">
      <line x1="250" y1="366" x2="250" y2="534"/>
      <line x1="166" y1="450" x2="334" y2="450"/>
      <line x1="191" y1="391" x2="309" y2="509"/>
      <line x1="309" y1="391" x2="191" y2="509"/>
      <line x1="218" y1="372" x2="282" y2="528"/>
      <line x1="282" y1="372" x2="218" y2="528"/>
      <line x1="172" y1="418" x2="328" y2="482"/>
      <line x1="328" y1="418" x2="172" y2="482"/>
    </g>
    <circle cx="250" cy="450" r="9" fill="#ccc" stroke-width="3"/>

    <!-- Front wheel -->
    <circle cx="560" cy="450" r="95" fill="none" stroke="#222" stroke-width="16"/>
    <circle cx="560" cy="450" r="95" fill="none" stroke="#444" stroke-width="8"/>
    <circle cx="560" cy="450" r="84" fill="none" stroke="#9aa3ad" stroke-width="3"/>
    <g stroke="#7f8893" stroke-width="2">
      <line x1="560" y1="366" x2="560" y2="534"/>
      <line x1="476" y1="450" x2="644" y2="450"/>
      <line x1="501" y1="391" x2="619" y2="509"/>
      <line x1="619" y1="391" x2="501" y2="509"/>
      <line x1="528" y1="372" x2="592" y2="528"/>
      <line x1="592" y1="372" x2="528" y2="528"/>
      <line x1="482" y1="418" x2="638" y2="482"/>
      <line x1="638" y1="418" x2="482" y2="482"/>
    </g>
    <circle cx="560" cy="450" r="9" fill="#ccc" stroke-width="3"/>

    <!-- Far leg + far pedal -->
    <path d="M368 300 L408 372 L368 430" fill="none" stroke="#222" stroke-width="11"/>
    <path d="M368 300 L408 372 L368 430" fill="none" stroke="#d9771a" stroke-width="5"/>
    <line x1="390" y1="455" x2="365" y2="430" stroke="#555" stroke-width="7"/>
    <rect x="350" y="425" width="30" height="9" rx="3" fill="#666" stroke-width="3"/>
    <path d="M362 428 L346 436 L352 424 L344 418 L372 424 Z" fill="#e0801c" stroke-width="3"/>

    <!-- Frame -->
    <g fill="none" stroke-width="13">
      <path d="M250 450 L390 455 L352 330 Z"/>
      <path d="M352 330 L522 315 L390 455"/>
      <path d="M522 300 L560 450"/>
    </g>
    <g fill="none" stroke="url(#frameGrad)" stroke-width="7">
      <path d="M250 450 L390 455 L352 330 Z"/>
      <path d="M352 330 L522 315 L390 455"/>
      <path d="M522 300 L560 450"/>
    </g>
    <circle cx="390" cy="455" r="20" fill="#bfc6ce" stroke-width="4"/>
    <circle cx="390" cy="455" r="6" fill="#555" stroke-width="2"/>
    <line x1="352" y1="330" x2="348" y2="312" stroke-width="7"/>
    <path d="M318 306 Q350 296 378 306 Q370 316 348 316 Q326 316 318 306 Z" fill="#333" stroke-width="4"/>
    <line x1="522" y1="300" x2="515" y2="272" stroke-width="8"/>

    <!-- Pelican: tail, body, neck, head -->
    <path d="M308 285 L268 300 L282 308 L266 320 L310 312 Z" fill="url(#wingGrad)" stroke-width="4"/>
    <ellipse cx="360" cy="245" rx="55" ry="78" transform="rotate(14 360 245)" fill="url(#bodyGrad)" stroke-width="5"/>
    <path d="M378 190 Q372 150 400 120 Q418 105 440 112 Q420 140 418 170 Q416 200 400 215 Z" fill="url(#bodyGrad)" stroke-width="5"/>
    <circle cx="428" cy="112" r="28" fill="url(#bodyGrad)" stroke-width="5"/>
    <path d="M412 88 Q402 72 392 76 Q404 80 408 92" fill="#fff" stroke-width="3"/>

    <!-- Pouch + beak -->
    <path d="M444 126 Q500 200 584 148 L446 122 Z" fill="url(#pouchGrad)" stroke-width="4"/>
    <path d="M440 104 Q520 112 590 134 Q596 140 588 148 Q520 132 444 126 Z" fill="url(#beakGrad)" stroke-width="4"/>
    <path d="M590 134 Q600 140 588 148" fill="#e07b10" stroke-width="3"/>
    <line x1="452" y1="115" x2="575" y2="137" stroke="#c46a12" stroke-width="2"/>

    <!-- Eye -->
    <circle cx="434" cy="104" r="7" fill="#fff" stroke-width="3"/>
    <circle cx="436" cy="104" r="3.5" fill="#222" stroke="none"/>
    <path d="M424 94 Q434 89 444 95" fill="none" stroke-width="3"/>

    <!-- Wing stretched to the handlebars -->
    <path d="M352 200 Q420 205 470 235 Q510 252 540 262 L534 276 Q500 274 470 272 L480 282 Q440 282 420 276 L428 290 Q385 285 360 268 Q335 240 352 200 Z" fill="url(#wingGrad)" stroke-width="5"/>
    <path d="M380 230 Q430 240 470 255" fill="none" stroke="#8a94a3" stroke-width="2.5"/>
    <path d="M378 250 Q420 258 455 266" fill="none" stroke="#8a94a3" stroke-width="2.5"/>

    <!-- Handlebar -->
    <path d="M500 270 L548 266 Q562 266 560 282 L556 296" fill="none" stroke-width="10"/>
    <path d="M500 270 L548 266 Q562 266 560 282 L556 296" fill="none" stroke="#666" stroke-width="5"/>

    <!-- Wing-tip feathers gripping the bar -->
    <path d="M536 258 Q552 252 560 262 Q562 274 552 278 Q556 268 546 266 Z" fill="url(#wingGrad)" stroke-width="4"/>
    <path d="M534 270 Q552 276 556 288 Q548 292 542 284 Z" fill="url(#wingGrad)" stroke-width="4"/>

    <!-- Near leg + near pedal -->
    <path d="M382 302 L438 388 L415 478" fill="none" stroke="#222" stroke-width="12"/>
    <path d="M382 302 L438 388 L415 478" fill="none" stroke="url(#legGrad)" stroke-width="6"/>
    <circle cx="438" cy="388" r="5" fill="#f29a1f" stroke-width="2.5"/>
    <line x1="390" y1="455" x2="415" y2="480" stroke="#888" stroke-width="7"/>
    <rect x="400" y="476" width="32" height="9" rx="3" fill="#888" stroke-width="3"/>
    <path d="M412 474 L396 482 L404 470 L398 462 L430 470 Z" fill="#f29a1f" stroke-width="3.5"/>
  </g>
</svg>