<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Pelican riding a recumbent bicycle</title>
  <desc id="desc">An engraved illustration of a warm beige pelican facing right, its head tilted toward its left shoulder, riding a low burgundy recumbent bicycle. Its long bill and webbed feet are gold.</desc>
  <defs>
    <pattern id="feathers" width="7" height="7" patternUnits="userSpaceOnUse">
      <path d="M0 7 7 0" stroke="#79634d" stroke-width=".55" opacity=".48"/>
    </pattern>
    <pattern id="goldHatch" width="5" height="5" patternUnits="userSpaceOnUse">
      <path d="M0 0 5 5" stroke="#78552d" stroke-width=".5" opacity=".55"/>
    </pattern>
    <pattern id="rubber" width="5" height="5" patternUnits="userSpaceOnUse">
      <path d="M0 5 5 0M0 0 5 5" stroke="#eee2cb" stroke-width=".5" opacity=".4"/>
    </pattern>
    <g id="wheel">
      <circle r="94" fill="#faf5e9" stroke="#3c332d" stroke-width="10"/>
      <circle r="94" fill="none" stroke="url(#rubber)" stroke-width="8"/>
      <circle r="85" fill="none" stroke="#827666" stroke-width="1.5"/>
      <g stroke="#918473" stroke-width=".85">
        <path d="M-85 0H85M0-85V85M-60-60 60 60M-60 60 60-60"/>
        <path d="m-79-33 158 66m-112-112 66 158m-112-46 158-66m-112 112 66-158"/>
      </g>
      <circle r="8" fill="#ad9b80" stroke="#49392f" stroke-width="2"/>
    </g>
  </defs>

  <rect width="960" height="540" fill="#faf5e9"/>
  <g fill="none" stroke="#99836b" stroke-width=".7" opacity=".5">
    <path d="M126 464h704M158 470h101m24 0h126m204 0h175M192 477h77m359 0h116"/>
  </g>

  <!-- Side-profile wheels and low recumbent frame -->
  <use href="#wheel" x="250" y="365"/>
  <use href="#wheel" x="714" y="365"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="m250 365 129-34 142 34 102-75"
          fill="none" stroke="#432b2d" stroke-width="12"/>
    <path d="m250 365 129-34 142 34 102-75"
          fill="none" stroke="#793d48" stroke-width="8"/>
    <path d="m521 365 193 0-42-115"
          fill="none" stroke="#432b2d" stroke-width="10"/>
    <path d="m521 365 193 0-42-115"
          fill="none" stroke="#793d48" stroke-width="6"/>
    <path d="m674 252-19-38 20-19 22 2"
          fill="none" stroke="#4a3c33" stroke-width="6"/>
    <path d="m686 197h20" stroke="#382e29" stroke-width="9"/>
    <path d="m292 230 55 88q12 17 35 17h56"
          fill="none" stroke="#40352e" stroke-width="17"/>
    <path d="m292 228 56 86q10 15 33 15h55"
          fill="none" stroke="#90745e" stroke-width="10"/>
    <path d="m296 238 49 75m15 13 65 0" fill="none" stroke="#c4a586" stroke-width="1.3"/>
    <path d="m258 360 356-83m-356 93 361-77"
          fill="none" stroke="#66564a" stroke-width="1.5"/>
    <circle cx="623" cy="286" r="25" fill="#e4d4b6" stroke="#49392f" stroke-width="2"/>
    <circle cx="623" cy="286" r="19" fill="none" stroke="#89715b" stroke-width="1" stroke-dasharray="2 3"/>
    <path d="m604 301 38-30" stroke="#49392f" stroke-width="4"/>
    <path d="M592 302h24m15-32h24" stroke="#49392f" stroke-width="6"/>
  </g>

  <!-- Far leg and webbed foot -->
  <path d="m419 257 66 21 52-25 89 16-12 13-78-11-48 28-72-23"
        fill="#c0a17a" stroke="#5b4633" stroke-width="2"/>
  <path d="m605 267 29-1 24 8-8 7-16-3-18 3Z"
        fill="#c5963f" stroke="#5b4633" stroke-width="2"/>

  <!-- Reclining pelican, neck curving toward its tilted head -->
  <path d="m307 249-37-36 59 8
           C352 181 404 179 442 202
           C466 214 472 196 475 171
           C478 140 496 118 519 119
           C542 119 555 134 550 153
           C547 166 535 171 524 175
           C518 192 530 214 509 242
           C491 268 460 290 416 294
           C369 300 334 282 307 249Z"
        fill="#dcc5a1" stroke="#594431" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="m307 249-37-36 59 8
           C352 181 404 179 442 202
           C466 214 472 196 475 171
           C478 140 496 118 519 119
           C542 119 555 134 550 153
           C547 166 535 171 524 175
           C518 192 530 214 509 242
           C491 268 460 290 416 294
           C369 300 334 282 307 249Z"
        fill="url(#feathers)"/>

  <!-- Folded wing with engraved feather contours -->
  <g fill="none" stroke="#72573e" stroke-width="1.1">
    <path d="M339 226q48-37 105 11-27 48-104 18 46-4 69-18"/>
    <path d="M347 230q30-16 61-3M349 239q31-13 65-5M352 249q30-9 58-10"/>
    <path d="m366 258 25-15m-12 19 24-17m-10 19 21-17m-8 16 18-18"/>
    <path d="M485 168q-7 38 1 55m8-48q-7 31 0 43M319 233l-31-14m38 22-27-15"/>
  </g>

  <!-- Long gold bill and deep pelican pouch -->
  <path d="M543 149 723 163q-57 45-138 30-28-7-42-31Z"
        fill="#cda24b" stroke="#594431" stroke-width="2"/>
  <path d="M543 149 723 163q-57 45-138 30-28-7-42-31Z" fill="url(#goldHatch)"/>
  <path d="m543 148 185 13-9 8-176-8Z"
        fill="#e2b956" stroke="#594431" stroke-width="1.7"/>
  <path d="m559 168 125 3m-117 5q54 16 113-1" fill="none" stroke="#80612e" stroke-width=".8"/>
  <path d="M511 134q13-6 24 1" fill="none" stroke="#594431" stroke-width="1.5"/>
  <circle cx="526" cy="141" r="5.2" fill="#faf5e9" stroke="#594431" stroke-width="1.4"/>
  <circle cx="527" cy="141" r="2.5" fill="#342b24"/>

  <!-- Near leg extends to the forward pedal -->
  <path d="M430 273q20-11 37 3l39 31 68-13 18 8-85 24q-9 2-16-5l-52-31"
        fill="#dcc5a1" stroke="#594431" stroke-width="2" stroke-linejoin="round"/>
  <path d="m446 280 53 36m-47-40 51 35m11 5 58-15"
        fill="none" stroke="#8d7150" stroke-width=".8"/>
  <path d="m576 294 18 0 10-7 9 13 20 7-9 8-23-5-18 2-9-9Z"
        fill="#cea347" stroke="#594431" stroke-width="2" stroke-linejoin="round"/>
  <path d="m589 300 13 5 20 3m-23-10 5 7m-19 3 17-3"
        fill="none" stroke="#84602e" stroke-width="1"/>
</svg>