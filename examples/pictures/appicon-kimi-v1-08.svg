<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Sky field: two flat regions split by one straight diagonal seam -->
  <rect width="512" height="512" fill="#1C2B6B"/>
  <polygon points="0,0 512,0 512,512" fill="#3E8FE0"/>

  <!-- Snowflake mark: perfectly centered, six-armed, mirror-symmetric -->
  <g fill="none" stroke="#FFFFFF" stroke-linejoin="round">
    <!-- Bold outer silhouette: one arm, reused at 60° intervals -->
    <g id="arm" stroke-width="22" stroke-linecap="round">
      <path d="M256 256 L256 88"/>
      <path d="M256 156 L207.5 128 M256 156 L304.5 128"/>
      <path d="M256 116 L221.4 96 M256 116 L290.6 96"/>
    </g>
    <use href="#arm" transform="rotate(60 256 256)"/>
    <use href="#arm" transform="rotate(120 256 256)"/>
    <use href="#arm" transform="rotate(180 256 256)"/>
    <use href="#arm" transform="rotate(240 256 256)"/>
    <use href="#arm" transform="rotate(300 256 256)"/>

    <!-- Thin inner detail line: hexagon ring linking the arms -->
    <polygon points="256,204 301,230 301,282 256,308 211,282 211,230" stroke-width="7"/>
  </g>
</svg>