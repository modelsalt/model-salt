<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <!-- Sky Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1B2A" />
      <stop offset="40%" stop-color="#1B4965" />
      <stop offset="80%" stop-color="#4281A4" />
      <stop offset="100%" stop-color="#82C0CC" />
    </linearGradient>

    <!-- Sun Gradient -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="35%" stop-color="#FFB703" />
      <stop offset="100%" stop-color="#FB5607" />
    </linearGradient>

    <!-- Cloud Solid Gradient -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#DCE4F2" />
    </linearGradient>

    <!-- Cloud Glassmorphism Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#B8C9E6" stop-opacity="0.1" />
    </linearGradient>

    <!-- Glass Border Gradient -->
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Lightning Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFB7" />
      <stop offset="40%" stop-color="#FFEA00" />
      <stop offset="100%" stop-color="#FF9000" />
    </linearGradient>

    <!-- Raindrop Gradient -->
    <linearGradient id="rainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#90E0EF" />
      <stop offset="100%" stop-color="#0077B6" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="sunGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60" result="blur1" />
      <feGaussianBlur stdDeviation="20" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Drop Shadow for Main Elements -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#060B19" flood-opacity="0.4" />
    </filter>

    <!-- Soft Shadow for Layering -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-8" dy="16" stdDeviation="12" flood-color="#0A192F" flood-opacity="0.25" />
    </filter>

    <!-- Lightning Glow -->
    <filter id="boltGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#FF9000" flood-opacity="0.6" />
    </filter>

    <!-- Reusable Raindrop -->
    <g id="raindrop">
      <path d="M 0,-30 C 12,-5 22,12 18,26 C 14,40 -14,40 -18,26 C -22,12 -12,-5 0,-30 Z" fill="url(#rainGrad)" />
      <path d="M -6,22 C -10,14 -6,0 0,-18 C -2,0 -4,14 0,24 C -2,26 -4,25 -6,22 Z" fill="#CAF0F8" opacity="0.6" />
    </g>
  </defs>

  <!-- 1. Sharp Square Background (No rounded borders) -->
  <rect width="1024" height="1024" fill="url(#skyGrad)" />

  <!-- 2. Background Atmospheric Curves -->
  <g opacity="0.07" fill="#FFFFFF">
    <circle cx="0" cy="0" r="800" />
    <circle cx="0" cy="0" r="600" />
    <circle cx="1024" cy="1024" r="700" />
    <circle cx="1024" cy="1024" r="500" />
  </g>

  <!-- 3. Celestial Elements (Stars in upper left) -->
  <g fill="#FFFFFF">
    <circle cx="150" cy="180" r="4" opacity="0.8" />
    <circle cx="280" cy="120" r="6" opacity="0.5" />
    <circle cx="100" cy="320" r="5" opacity="0.4" />
    <circle cx="220" cy="280" r="3" opacity="0.9" />
    <circle cx="380" cy="200" r="4" opacity="0.3" />
    <!-- 4-point sparkle -->
    <path d="M 180,100 Q 180,120 160,120 Q 180,120 180,140 Q 180,120 200,120 Q 180,120 180,100 Z" fill="#FFFFFF" opacity="0.7" />
    <path d="M 80,220 Q 80,230 70,230 Q 80,230 80,240 Q 80,230 90,230 Q 80,230 80,220 Z" fill="#FFFFFF" opacity="0.5" />
  </g>

  <!-- 4. The Sun -->
  <g filter="url(#sunGlow)">
    <circle cx="640" cy="360" r="200" fill="url(#sunGrad)" />
  </g>
  <!-- Sun inner rim highlight -->
  <circle cx="640" cy="360" r="198" fill="none" stroke="#FFF3B0" stroke-width="4" opacity="0.5" />

  <!-- 5. Back Cloud (Frosted Glass Effect) -->
  <path d="M 380,600 
           L 780,600 
           A 90,90 0 0,0 850,450 
           A 110,110 0 0,0 640,380 
           A 130,130 0 0,0 410,430 
           A 85,85 0 0,0 380,600 Z" 
        fill="url(#glassGrad)" 
        stroke="url(#glassBorder)" 
        stroke-width="4" 
        filter="url(#dropShadow)" />

  <!-- 6. Precipitation & Lightning (Sandwiched between clouds for depth) -->
  <!-- Raindrops -->
  <g filter="url(#softShadow)">
    <use href="#raindrop" transform="translate(280, 760) rotate(20) scale(1.1)" />
    <use href="#raindrop" transform="translate(230, 880) rotate(20) scale(0.85)" opacity="0.8" />
    
    <use href="#raindrop" transform="translate(420, 830) rotate(20) scale(1)" />
    
    <use href="#raindrop" transform="translate(650, 760) rotate(20) scale(1.1)" />
    <use href="#raindrop" transform="translate(600, 880) rotate(20) scale(0.9)" opacity="0.8" />
    
    <use href="#raindrop" transform="translate(760, 820) rotate(20) scale(0.8)" opacity="0.6" />
  </g>

  <!-- Lightning Bolt -->
  <g filter="url(#boltGlow)">
    <path d="M 530,580 
             L 430,740 
             L 510,740 
             L 460,920 
             L 630,710 
             L 540,710 
             L 610,580 Z" 
          fill="url(#boltGrad)" />
    <!-- Bolt Highlight -->
    <path d="M 530,580 L 430,740 L 510,740 L 460,920 L 475,900 L 525,730 L 450,730 L 540,580 Z" fill="#FFFFFF" opacity="0.6" />
  </g>

  <!-- 7. Front Cloud (Solid, Crisp, Dimensional) -->
  <g filter="url(#dropShadow)">
    <path d="M 260,680 
             L 680,680 
             A 110,110 0 0,0 790,570 
             A 110,110 0 0,0 695,462 
             A 140,140 0 0,0 560,360 
             A 160,160 0 0,0 265,430 
             A 125,125 0 0,0 135,555 
             A 125,125 0 0,0 260,680 Z" 
          fill="url(#cloudGrad)" />

    <!-- Cloud Scallop Highlights/Shadows for 3D internal volume -->
    <!-- Soft inner shadow at the base -->
    <path d="M 135,555 A 125,125 0 0,0 260,680 L 680,680 A 110,110 0 0,0 790,570 C 790,620 730,650 660,650 L 260,650 C 180,650 135,600 135,555 Z" 
          fill="#B8C9E6" opacity="0.6" />

    <!-- Rim Light (Top Edge) -->
    <path d="M 265,430 A 160,160 0 0,1 560,360 A 140,140 0 0,1 695,462 A 110,110 0 0,1 788,550 A 115,115 0 0,0 690,472 A 140,140 0 0,0 555,370 A 160,160 0 0,0 265,442 A 125,125 0 0,0 140,540 A 125,125 0 0,1 265,430 Z" 
          fill="#FFFFFF" opacity="0.9" />

    <!-- Internal Puff Creases -->
    <path d="M 265,430 C 310,430 350,460 365,500 C 345,470 305,445 265,442 Z" fill="#DCE4F2" />
    <path d="M 560,360 C 520,390 500,440 510,490 C 490,440 505,390 545,362 Z" fill="#DCE4F2" />
    <path d="M 695,462 C 650,470 620,510 620,550 C 610,505 640,465 685,460 Z" fill="#DCE4F2" />
  </g>

  <!-- 8. Foreground Sunbeams / Lens Flare -->
  <g opacity="0.15" style="mix-blend-mode: screen;">
    <polygon points="640,360 -100,800 0,950" fill="url(#glassGrad)" />
    <polygon points="640,360 200,1124 400,1124" fill="url(#glassGrad)" />
    <circle cx="480" cy="580" r="40" fill="#FFEA00" filter="url(#sunGlow)" />
    <circle cx="380" cy="680" r="15" fill="#FFFFFF" />
  </g>

  <!-- 9. Sharp Edge Inner Border (Gives the square icon a Finished UI feel) -->
  <rect width="1024" height="1024" fill="none" stroke="#FFFFFF" stroke-width="16" opacity="0.1" />
  <rect width="1024" height="1024" fill="none" stroke="#000000" stroke-width="4" opacity="0.2" />
</svg>