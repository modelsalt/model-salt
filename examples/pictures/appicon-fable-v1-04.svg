<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Sky backdrop: sky-blue into lilac -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A9DDF7"/>
      <stop offset="0.55" stop-color="#C6C3F2"/>
      <stop offset="1" stop-color="#D9C9F4"/>
    </linearGradient>
    <!-- Sun: peach core fading out -->
    <radialGradient id="sun" cx="0.4" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#FFE3B8"/>
      <stop offset="0.6" stop-color="#FFBE9A"/>
      <stop offset="1" stop-color="#F9A08A"/>
    </radialGradient>
    <!-- Sun glow halo -->
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#FFD9B0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFD9B0" stop-opacity="0"/>
    </radialGradient>
    <!-- Cloud: mint-white top to lilac-tinted belly -->
    <linearGradient id="cloud" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#E2F7EE"/>
      <stop offset="1" stop-color="#C8E8DC"/>
    </linearGradient>
    <!-- Cloud shadow belly -->
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B9B2E6" stop-opacity="0"/>
      <stop offset="1" stop-color="#B9B2E6" stop-opacity="0.55"/>
    </linearGradient>
    <!-- Numeral: lilac to sky -->
    <linearGradient id="num" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8E86D6"/>
      <stop offset="1" stop-color="#6FB6E8"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- Hard-edged square canvas, no corner radius -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Oversized sun, cropped by the top-right edges -->
  <circle cx="720" cy="300" r="520" fill="url(#glow)"/>
  <circle cx="720" cy="300" r="360" fill="url(#sun)"/>

  <!-- Oversized cloud, cropped by left, right and bottom edges; sun tucks behind it -->
  <g>
    <ellipse cx="300" cy="760" rx="420" ry="300" fill="#8E86D6" opacity="0.25" filter="url(#soft)" transform="translate(30 50)"/>
    <path fill="url(#cloud)" d="
      M -140 1024
      L -140 760
      C -140 640 -40 560 90 580
      C 130 440 300 380 440 450
      C 520 330 720 330 800 460
      C 920 420 1060 500 1090 640
      L 1120 1024 Z"/>
    <path fill="url(#belly)" d="
      M -140 1024
      L -140 760
      C -140 640 -40 560 90 580
      C 130 440 300 380 440 450
      C 520 330 720 330 800 460
      C 920 420 1060 500 1090 640
      L 1120 1024 Z"/>
  </g>

  <!-- Temperature numeral set into the cloud body -->
  <text x="512" y="880" text-anchor="middle"
        font-family="'SF Pro Rounded', 'Nunito', 'Avenir Next Rounded', 'Helvetica Neue', Arial, sans-serif"
        font-weight="800" font-size="400" letter-spacing="-18" fill="url(#num)">72<tspan font-size="220" dy="-150">°</tspan></text>
</svg>