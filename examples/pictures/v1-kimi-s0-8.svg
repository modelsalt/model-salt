  <path d="M392 92 q14 2 26 6" fill="none" stroke="#ffd9a0" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <path d="M372 90 l7 1.5" fill="none" stroke="#b06f1e" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M447 100 C457 101 463 106 461 112 C459 117 450 117 445 112 Z" fill="#e07f2e" stroke="#3c3434" stroke-width="3.5" stroke-linejoin="round"/>

