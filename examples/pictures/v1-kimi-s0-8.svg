  <path id="frame" d="M235 405 L335 404 M235 405 L302 290 M335 404 L302 290 M302 290 L446 278 M335 404 L460 320 M446 278 L460 320 M458 316 L487 405 M446 278 L439 247 M439 247 C431 240 420 241 411 250" fill="none" stroke="#1c6e69" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <use href="#frame" stroke="#45c2bb" stroke-width="8"/>

