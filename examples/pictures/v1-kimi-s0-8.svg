  <path d="M302 290 L300 272" fill="none" stroke="#5d666c" stroke-width="8" stroke-linecap="round"/>
  <path d="M302 290 L300 272" fill="none" stroke="#aeb8bf" stroke-width="4" stroke-linecap="round"/>
  <path d="M268 272 C270 261 286 254 302 254 C320 254 332 261 332 268 C332 274 325 277 314 277 L286 277 C275 277 267 276 268 272 Z" fill="#7a4f3a" stroke="#3c3434" stroke-width="4" stroke-linejoin="round"/>

