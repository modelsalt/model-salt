<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520">
  <title>Pelican riding a bicycle</title>

  <!-- Rear wheel -->
  <g fill="none" stroke-linecap="round">
    <circle cx="235" cy="405" r="78" stroke="#3a3535" stroke-width="15"/>
