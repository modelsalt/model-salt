  <ellipse cx="298" cy="370" rx="15" ry="7.5" transform="rotate(-6 298 370)" fill="#d97a2b" stroke="#3c3434" stroke-width="4"/>
  <path d="M311 366 L302 369 M311 373 L302 372" fill="none" stroke="#3c3434" stroke-width="3" stroke-linecap="round"/>

