  <path d="M363 100 C368 124 388 141 412 141 C435 141 450 128 454 112 C430 120 392 114 363 100 Z" fill="#f9c186" stroke="#3c3434" stroke-width="4.5" stroke-linejoin="round"/>
  <path d="M374 118 C390 129 410 133 428 128" fill="none" stroke="#e09a5a" stroke-width="3" stroke-linecap="round"/>

