  <path d="M335 404 L368 424 M335 404 L300 382" fill="none" stroke="#3c3434" stroke-width="7" stroke-linecap="round"/>
  <rect x="354" y="420" width="28" height="9" rx="4.5" fill="#3c3434"/>
  <rect x="286" y="377" width="28" height="9" rx="4.5" fill="#3c3434"/>

