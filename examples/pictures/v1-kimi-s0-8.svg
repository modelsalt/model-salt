    <circle cx="235" cy="405" r="68" stroke="#c3ccd2" stroke-width="5"/>
    <circle cx="235" cy="405" r="8" fill="#6d767d" stroke="#3c3434" stroke-width="3"/>
  </g>

  <!-- Front wheel -->
  <g fill="none" stroke-linecap="round">
