  <circle cx="356" cy="91" r="3.2" fill="#2c2626"/>
  <circle cx="357.3" cy="89.7" r="1.1" fill="#ffffff"/>
  <ellipse cx="337" cy="108" rx="7" ry="4.5" fill="#f2a49b" opacity="0.55"/>

  <!-- Wing resting on the handlebars -->
  <path d="M302 174 C332 182 362 200 386 222 C398 233 407 242 415 250 C411 256 405 257 399 253 C395 257 388 256 383 251 C360 237 334 219 318 205 C306 196 300 185 302 174 Z" fill="#ffffff" stroke="#3c3434" stroke-width="4.5" stroke-linejoin="round"/>
  <path d="M320 190 C342 204 364 220 384 236 M312 202 C330 216 350 230 368 242" fill="none" stroke="#b0bdc7" stroke-width="3.5" stroke-linecap="round"/>
</svg>