<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Sky -->
  <rect width="800" height="600" fill="#9fd3f0"/>
  <circle cx="680" cy="60" r="32" fill="#ffe08a"/>
  <g fill="#ffffff">
    <ellipse cx="150" cy="60" rx="50" ry="16"/>
    <ellipse cx="185" cy="50" rx="34" ry="16"/>
    <ellipse cx="470" cy="85" rx="44" ry="12"/>
    <ellipse cx="500" cy="77" rx="28" ry="12"/>
  </g>

  <!-- Distant hills & trees -->
  <path d="M0,150 Q120,118 260,142 Q420,112 560,140 Q690,120 800,140 L800,600 L0,600 Z" fill="#7aa84a"/>
  <g fill="#4f7d32">
    <circle cx="90" cy="140" r="12"/><circle cx="108" cy="143" r="9"/>
    <circle cx="610" cy="136" r="11"/><circle cx="628" cy="139" r="8"/>
    <circle cx="300" cy="141" r="8"/>
  </g>

  <!-- Fields -->
  <path d="M0,160 Q400,148 800,160 L800,600 L0,600 Z" fill="#94c45e"/>
  <path d="M0,260 Q300,240 520,265 Q680,280 800,262 L800,600 L0,600 Z" fill="#a3cf6a"/>

  <!-- Dirt road -->
  <path d="M170,600 C320,460 470,300 432,152 L446,152 C505,300 620,450 790,600 Z" fill="#c9a26b"/>
  <!-- Ruts -->
  <path d="M330,600 C400,470 470,320 437,160 L440,160 C482,320 430,470 360,600 Z" fill="#b38a55"/>
  <path d="M590,600 C520,470 470,320 442,160 L444,160 C490,320 560,470 625,600 Z" fill="#b38a55"/>

  <!-- Fence posts -->
  <g fill="#7a5532">
    <rect x="60" y="400" width="10" height="46"/>
    <rect x="150" y="315" width="8" height="34"/>
    <rect x="225" y="255" width="6" height="25"/>
    <rect x="285" y="212" width="5" height="18"/>
    <rect x="335" y="183" width="4" height="12"/>
  </g>
  <g stroke="#7a5532" stroke-width="3" fill="none">
    <path d="M65,410 L154,322 L228,260 L287,216 L337,186"/>
    <path d="M65,428 L154,338 L228,272 L287,225 L337,192"/>
  </g>

  <!-- Grass tufts -->
  <g fill="#6f9e3f">
    <path d="M700,520 l6,-18 l4,16 l5,-20 l4,22 Z"/>
    <path d="M120,540 l5,-16 l4,14 l5,-18 l4,20 Z"/>
    <path d="M640,330 l4,-12 l3,10 l4,-13 l3,15 Z"/>
  </g>

  <!-- Shadow on road -->
  <ellipse cx="400" cy="505" rx="200" ry="24" fill="#a07d4c"/>

  <!-- Wheels -->
  <g fill="none" stroke="#2b2b2b">
    <ellipse cx="270" cy="450" rx="78" ry="50" stroke-width="9"/>
    <ellipse cx="530" cy="450" rx="78" ry="50" stroke-width="9"/>
  </g>
  <g fill="none" stroke="#b9bec4" stroke-width="3">
    <ellipse cx="270" cy="450" rx="70" ry="44"/>
    <ellipse cx="530" cy="450" rx="70" ry="44"/>
  </g>
  <g stroke="#b9bec4" stroke-width="2">
    <line x1="200" y1="450" x2="340" y2="450"/><line x1="270" y1="406" x2="270" y2="494"/>
    <line x1="221" y1="419" x2="319" y2="481"/><line x1="221" y1="481" x2="319" y2="419"/>
    <line x1="460" y1="450" x2="600" y2="450"/><line x1="530" y1="406" x2="530" y2="494"/>
    <line x1="481" y1="419" x2="579" y2="481"/><line x1="481" y1="481" x2="579" y2="419"/>
  </g>
  <circle cx="270" cy="450" r="6" fill="#7d8389"/>
  <circle cx="530" cy="450" r="6" fill="#7d8389"/>

  <!-- Frame -->
  <g stroke="#c0392b" stroke-width="9" stroke-linecap="round" fill="none">
    <line x1="380" y1="445" x2="345" y2="362"/>
    <line x1="352" y1="378" x2="492" y2="372"/>
    <line x1="380" y1="445" x2="485" y2="392"/>
    <line x1="380" y1="445" x2="270" y2="450"/>
    <line x1="352" y1="378" x2="270" y2="450"/>
  </g>
  <line x1="494" y1="366" x2="530" y2="450" stroke="#8e8e8e" stroke-width="7" stroke-linecap="round"/>
  <line x1="492" y1="372" x2="486" y2="346" stroke="#8e8e8e" stroke-width="7" stroke-linecap="round"/>
  <!-- Handlebar (seen from above, crossing toward the viewer) -->
  <line x1="468" y1="336" x2="508" y2="360" stroke="#555" stroke-width="7" stroke-linecap="round"/>
  <!-- Seat -->
  <path d="M322,356 Q345,346 368,354 Q350,366 322,356 Z" fill="#2b2b2b"/>
  <!-- Chainring & chain -->
  <ellipse cx="380" cy="445" rx="18" ry="12" fill="none" stroke="#555" stroke-width="4"/>
  <line x1="380" y1="433" x2="270" y2="444" stroke="#555" stroke-width="2"/>
  <line x1="380" y1="457" x2="270" y2="456" stroke="#555" stroke-width="2"/>

  <!-- Far leg & pedal -->
  <line x1="365" y1="445" x2="365" y2="423" stroke="#444" stroke-width="5"/>
  <rect x="355" y="419" width="22" height="6" fill="#333"/>
  <path d="M348,352 L338,394 L364,418" fill="none" stroke="#e8955a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M354,420 L378,416 L370,426 Z" fill="#e8955a"/>

  <!-- Tail -->
  <path d="M305,315 L272,330 L300,340 Z" fill="#ffffff"/>

  <!-- Body -->
  <ellipse cx="355" cy="300" rx="58" ry="72" transform="rotate(-20 355 300)" fill="#ffffff"/>

  <!-- Near leg & pedal -->
  <line x1="380" y1="445" x2="395" y2="468" stroke="#444" stroke-width="5"/>
  <rect x="384" y="466" width="24" height="7" fill="#333"/>
  <path d="M365,355 L382,402 L396,464" fill="none" stroke="#e8955a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M384,466 L412,463 L402,475 Z" fill="#e8955a"/>

  <!-- Neck -->
  <path d="M378,262 Q392,218 420,196" fill="none" stroke="#ffffff" stroke-width="30" stroke-linecap="round"/>

  <!-- Wing reaching to handlebar -->
  <path d="M362,262 Q440,272 482,330 L496,352 Q470,352 452,342 Q400,334 336,322 Z" fill="#e9ecef"/>
  <path d="M440,316 Q470,330 496,352 Q468,354 444,342 Z" fill="#2a2a2a"/>
  <path d="M410,300 Q440,312 460,330" fill="none" stroke="#d3d8dd" stroke-width="3"/>

  <!-- Head -->
  <circle cx="425" cy="186" r="25" fill="#ffffff"/>
  <path d="M402,180 L392,172 L404,174 Z" fill="#ffffff"/>
  <circle cx="432" cy="178" r="7" fill="#f6d5b0"/>
  <circle cx="432" cy="178" r="3.5" fill="#1a1a1a"/>

  <!-- Bill & pouch -->
  <path d="M440,196 L556,238 Q502,266 452,222 Z" fill="#f5b84a"/>
  <path d="M434,176 L562,226 Q575,232 564,240 L440,196 Z" fill="#f29a2e"/>
</svg>