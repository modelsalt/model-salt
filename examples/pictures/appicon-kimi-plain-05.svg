<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4FC3F7"/>
      <stop offset="1" stop-color="#1976D2"/>
    </linearGradient>
    <radialGradient id="sunGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF176"/>
      <stop offset="1" stop-color="#FFB300"/>
    </radialGradient>
    <linearGradient id="cloudGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E3F2FD"/>
    </linearGradient>
  </defs>

  <!-- Square background — no rounded corners -->
  <rect width="512" height="512" fill="url(#sky)"/>

  <!-- Distant decorative cloud -->
  <g fill="#FFFFFF" opacity="0.3">
    <circle cx="398" cy="106" r="24"/>
    <circle cx="432" cy="92" r="32"/>
    <circle cx="464" cy="106" r="22"/>
    <rect x="380" y="104" width="106" height="24" rx="12"/>
  </g>

  <!-- Sun rays -->
  <g stroke="#FFD54F" stroke-width="14" stroke-linecap="round">
    <line x1="175" y1="70"  x2="175" y2="100"/>
    <line x1="256" y1="104" x2="235" y2="125"/>
    <line x1="290" y1="185" x2="260" y2="185"/>
    <line x1="94"  y1="104" x2="115" y2="125"/>
    <line x1="60"  y1="185" x2="90"  y2="185"/>
    <line x1="94"  y1="266" x2="115" y2="245"/>
  </g>

  <!-- Sun -->
  <circle cx="175" cy="185" r="65" fill="url(#sunGrad)"/>
  <circle cx="155" cy="165" r="18" fill="#FFF9C4" opacity="0.6"/>

  <!-- Main cloud -->
  <g fill="url(#cloudGrad)">
    <circle cx="248" cy="318" r="52"/>
    <circle cx="318" cy="290" r="66"/>
    <circle cx="392" cy="320" r="48"/>
    <rect x="212" y="314" width="212" height="54" rx="27"/>
  </g>
  <ellipse cx="318" cy="348" rx="105" ry="18" fill="#BBDEFB" opacity="0.4"/>

  <!-- Raindrops -->
  <g stroke="#E1F5FE" stroke-width="12" stroke-linecap="round" opacity="0.9">
    <line x1="252" y1="408" x2="242" y2="440"/>
    <line x1="318" y1="412" x2="308" y2="444"/>
    <line x1="384" y1="408" x2="374" y2="440"/>
  </g>
</svg>