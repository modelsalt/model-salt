<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Sky: deep blue at top fading to a warm, hazy horizon -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D4ED8"/>
      <stop offset="0.55" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#7DD3FC"/>
    </linearGradient>

    <!-- Sun -->
    <radialGradient id="sun" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#FFF4B8"/>
      <stop offset="0.55" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </radialGradient>

    <!-- Sun glow -->
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FDE68A" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FDE68A" stop-opacity="0"/>
    </radialGradient>

    <!-- Cloud: white on top, slightly cool shadow underneath -->
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.7" stop-color="#F1F5F9"/>
      <stop offset="1" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- Raindrop -->
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BAE6FD"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>

    <!-- Soft shadow under the cloud -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dy="22" result="blur"/>
      <feComponentTransfer in="blur" result="shadow">
        <feFuncA type="linear" slope="0.28"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Square background, sharp corners -->
  <rect width="1024" height="1024" fill="url(#sky)"/>

  <!-- Subtle horizon band to add depth -->
  <rect y="760" width="1024" height="264" fill="#FFFFFF" opacity="0.06"/>

  <!-- Sun glow -->
  <circle cx="620" cy="380" r="330" fill="url(#glow)"/>

  <!-- Sun rays (short, evenly spaced) -->
  <g stroke="#FDE68A" stroke-width="26" stroke-linecap="round" opacity="0.9">
    <line x1="620" y1="130" x2="620" y2="180"/>
    <line x1="620" y1="580" x2="620" y2="630"/>
    <line x1="370" y1="380" x2="420" y2="380"/>
    <line x1="820" y1="380" x2="870" y2="380"/>
    <line x1="443" y1="203" x2="479" y2="239"/>
    <line x1="761" y1="521" x2="797" y2="557"/>
    <line x1="797" y1="203" x2="761" y2="239"/>
    <line x1="479" y1="521" x2="443" y2="557"/>
  </g>

  <!-- Sun disc -->
  <circle cx="620" cy="380" r="150" fill="url(#sun)"/>

  <!-- Cloud (overlaps lower-left of the sun) -->
  <g filter="url(#shadow)">
    <path fill="url(#cloud)" d="
      M 250 690
      C 170 690, 120 630, 130 565
      C 140 500, 200 465, 260 480
      C 275 395, 350 335, 440 345
      C 520 355, 580 405, 600 470
      C 620 455, 650 450, 680 458
      C 740 475, 775 540, 760 600
      C 820 605, 860 650, 850 700
      C 842 745, 800 775, 750 775
      L 300 775
      C 270 775, 250 740, 250 690 Z"/>
  </g>

  <!-- Raindrops, slightly staggered for rhythm -->
  <g fill="url(#drop)">
    <path d="M 345 830 C 345 830, 300 880, 300 912 A 45 45 0 0 0 390 912 C 390 880, 345 830, 345 830 Z"/>
    <path d="M 515 860 C 515 860, 470 910, 470 942 A 45 45 0 0 0 560 942 C 560 910, 515 860, 515 860 Z"/>
    <path d="M 685 830 C 685 830, 640 880, 640 912 A 45 45 0 0 0 730 912 C 730 880, 685 830, 685 830 Z"/>
  </g>

  <!-- Highlights on raindrops -->
  <g fill="#FFFFFF" opacity="0.55">
    <ellipse cx="328" cy="900" rx="10" ry="18" transform="rotate(-20 328 900)"/>
    <ellipse cx="498" cy="930" rx="10" ry="18" transform="rotate(-20 498 930)"/>
    <ellipse cx="668" cy="900" rx="10" ry="18" transform="rotate(-20 668 900)"/>
  </g>
</svg>