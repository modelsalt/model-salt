<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <title>Pelican riding a bicycle</title>
  <desc>A cheerful cartoon pelican seen from the front at a three-quarter angle, balancing with both wings outstretched on a bicycle. All colors are black, white, and gray.</desc>

  <rect width="640" height="640" rx="36" fill="#f5f5f5"/>
  <ellipse cx="344" cy="564" rx="183" ry="23" fill="#dedede"/>

  <!-- Bicycle wheels and spokes -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <g fill="#fafafa" stroke="#292929" stroke-width="11">
      <ellipse cx="253" cy="468" rx="53" ry="83" transform="rotate(-12 253 468)"/>
      <ellipse cx="429" cy="493" rx="57" ry="86" transform="rotate(-12 429 493)"/>
    </g>
    <g fill="none" stroke="#b4b4b4" stroke-width="2">
      <path d="M236 387 270 549M201 457 305 479M219 407 287 529M211 515 295 421"/>
      <path d="M411 409 447 577M373 481 485 505M390 432 468 554M385 548 473 438"/>
    </g>

    <!-- Frame, saddle, and steering -->
    <g fill="none" stroke="#555" stroke-width="12">
      <path d="m253 468 43-112 37 126-80-14 126-83-46 97"/>
      <path d="m379 385 50 108"/>
      <path d="m296 356-8-28"/>
      <path d="m379 385-18-57 18-18"/>
    </g>
    <path d="m379 310 30 7m-30-7-29-10" fill="none" stroke="#252525" stroke-width="10"/>
    <path d="M264 327q26-17 58 1-1 14-29 13-26 0-29-14" fill="#292929"/>
    <circle cx="333" cy="482" r="16" fill="#ddd" stroke="#333" stroke-width="5"/>
    <path d="m333 482 28 18m-28-18-23-26" fill="none" stroke="#333" stroke-width="6"/>
    <path d="m350 502 25-5m-77-38 24-6" stroke="#222" stroke-width="8"/>

    <!-- Far leg and webbed foot -->
    <path d="m289 327-12 58 32 63" fill="none" stroke="#888" stroke-width="13"/>
    <path d="m309 439 23 17-38 8-9-12Z" fill="#777" stroke="#333" stroke-width="4"/>

    <!-- Outstretched wings -->
    <path d="M283 259C244 230 205 212 156 211
             L88 203Q73 207 91 221L131 238
             Q86 225 93 241L139 264
             Q107 256 114 272
             C168 306 226 310 284 299Z"
          fill="#eee" stroke="#292929" stroke-width="5"/>
    <path d="M359 261C406 236 448 218 492 221
             L551 219Q570 222 552 235L518 250
             Q562 238 551 255L511 275
             Q541 268 534 282
             C481 313 419 311 360 298Z"
          fill="#fff" stroke="#292929" stroke-width="5"/>
    <path d="M135 239q54 12 100 37M513 251q-58 6-99 28"
          fill="none" stroke="#aaa" stroke-width="4"/>

    <!-- Rounded body -->
    <path d="M267 263C248 290 250 336 275 354
             C300 372 347 364 367 336
             C388 307 374 270 350 252Z"
          fill="#fff" stroke="#292929" stroke-width="5"/>
    <path d="M270 310q2 43 39 43 35 0 49-29-43 23-88-14" fill="#ddd"/>

    <!-- Near leg and foot on pedal -->
    <path d="m333 351 23 53-12 67" fill="none" stroke="#555" stroke-width="14"/>
    <path d="m344 465 31 18 8 16-41 2-16-14Z"
          fill="#999" stroke="#292929" stroke-width="4"/>
    <path d="m349 482 16 9m-22-3 9 9" fill="none" stroke="#666" stroke-width="3"/>

    <!-- Neck and head -->
    <path d="M288 284C276 256 282 232 295 208
             C282 187 286 158 307 141
             C330 123 363 133 378 156
             C388 172 381 196 364 208
             C342 226 331 245 340 273
             Q320 295 288 284Z"
          fill="#fff" stroke="#292929" stroke-width="5"/>
    <path d="M299 213q-17 36-5 61" fill="none" stroke="#d0d0d0" stroke-width="9"/>

    <!-- Pelican pouch and long bill in three-quarter perspective -->
    <path d="M342 187C372 185 414 205 465 237
             C446 256 406 272 382 254
             C363 240 350 212 342 187Z"
          fill="#bcbcbc" stroke="#292929" stroke-width="5"/>
    <path d="M340 181C378 181 423 204 477 237
             Q481 245 466 245
             C414 227 374 207 340 199Z"
          fill="#e3e3e3" stroke="#292929" stroke-width="5"/>
    <path d="m365 205 67 28" fill="none" stroke="#929292" stroke-width="3"/>

    <!-- Face -->
    <ellipse cx="338" cy="166" rx="10" ry="13" fill="#292929"/>
    <circle cx="341" cy="162" r="3.5" fill="#fff"/>
    <path d="M321 146q11-8 22-2" fill="none" stroke="#292929" stroke-width="4"/>
    <path d="m299 143-8-12m19 6-1-14" fill="none" stroke="#292929" stroke-width="4"/>
    <path d="M322 207q8 8 17 3" fill="none" stroke="#292929" stroke-width="3"/>
  </g>
</svg>