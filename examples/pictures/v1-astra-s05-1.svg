<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican riding a bicycle</title>
  <desc id="desc">An upright pelican with a golden bill pedals a teal step-through city bicycle, rendered with soft gradient shading.</desc>
  <defs>
    <linearGradient id="feathers" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fffefa"/>
      <stop offset=".55" stop-color="#f0f3ee"/>
      <stop offset="1" stop-color="#a9bec6"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fffefa"/>
      <stop offset="1" stop-color="#829faa"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffe790"/>
      <stop offset=".5" stop-color="#f4b84f"/>
      <stop offset="1" stop-color="#df7e39"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffdea0"/>
      <stop offset="1" stop-color="#e89565"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#6bd1c2"/>
      <stop offset=".5" stop-color="#299d9e"/>
      <stop offset="1" stop-color="#176474"/>
    </linearGradient>
    <linearGradient id="tire" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#50616a"/>
      <stop offset="1" stop-color="#202e3b"/>
    </linearGradient>
    <radialGradient id="background">
      <stop stop-color="#fffdf5"/>
      <stop offset="1" stop-color="#e5efea"/>
    </radialGradient>
    <g id="wheel">
      <circle r="88" fill="url(#tire)"/>
      <circle r="77" fill="#faf7e9" stroke="#bacac9" stroke-width="3"/>
      <g fill="none" stroke="#afbfbe" stroke-width="1.6">
        <path d="M-75 0H75M0-75V75M-53-53 53 53M-53 53 53-53"/>
        <path d="m-69-29 138 58m-98 40 58-138m-98 98 138-58m-98-40 58 138"/>
      </g>
      <circle r="9" fill="url(#teal)" stroke="#294f5b" stroke-width="3"/>
    </g>
  </defs>

  <rect width="600" height="600" rx="32" fill="url(#background)"/>
  <ellipse cx="300" cy="543" rx="226" ry="14" fill="#b2c8c1" opacity=".35"/>

  <!-- Wheels and curved mudguards -->
  <use href="#wheel" x="165" y="449"/>
  <use href="#wheel" x="432" y="449"/>
  <g fill="none" stroke-linecap="round">
    <path d="M74 428a94 94 0 0 1 182-7M342 421a94 94 0 0 1 181 8"
          stroke="#527f83" stroke-width="7"/>
    <path d="M74 426a94 94 0 0 1 182-7M342 419a94 94 0 0 1 181 8"
          stroke="#beded6" stroke-width="3"/>
  </g>

  <!-- Far leg and pedal -->
  <path d="M270 326 303 368 281 412" fill="none" stroke="#ad753f"
        stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m278 405 22 6 8 10h-38Z" fill="url(#gold)" stroke="#825b3b" stroke-width="2"/>
  <path d="M275 424h35" stroke="#304651" stroke-width="7" stroke-linecap="round"/>

  <!-- Low step-through bicycle frame -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="m251 350 36 99H165l78-80" stroke="#266675" stroke-width="10"/>
    <path d="M249 371q45 104 137-18M287 449l104-116"
          stroke="#235c6b" stroke-width="15"/>
    <path d="M249 368q45 104 137-18M287 446l104-116"
          stroke="url(#teal)" stroke-width="10"/>
    <path d="m387 323 45 126" stroke="#235c6b" stroke-width="12"/>
    <path d="m387 323 45 126" stroke="url(#teal)" stroke-width="7"/>
    <path d="m386 325-10-34q-3-12 10-15h24" stroke="#91a7aa" stroke-width="8"/>
    <path d="M399 276h19" stroke="#304651" stroke-width="10"/>
    <path d="m249 354-5-23" stroke="#8fa4a7" stroke-width="8"/>
  </g>
  <path d="M221 331q23-10 50-1l3 9q-26 7-53 0Z"
        fill="url(#tire)" stroke="#253c48" stroke-width="2"/>
  <path d="M169 439h115a13 13 0 0 1 0 26H169a13 13 0 0 1 0-26Z"
        fill="url(#teal)" stroke="#285f6c" stroke-width="2"/>
  <circle cx="287" cy="449" r="17" fill="#d7e2dc" stroke="#477b81" stroke-width="4"/>
  <path d="m287 449 29 24" stroke="#475c65" stroke-width="6" stroke-linecap="round"/>

  <!-- Pelican's tail and upright body -->
  <path d="m227 295-60-22 24 41 46 9" fill="url(#wing)" stroke="#526d77" stroke-width="3"/>
  <path d="M242 332c-36-9-48-43-40-78 6-26 28-44 44-63
           14-17 15-40 21-62 6-24 24-39 47-35
           24 4 35 24 28 43-5 15-20 22-33 27
           -13 5-13 25-9 46 7 36 20 62 10 88
           -9 26-37 44-68 34Z"
        fill="url(#feathers)" stroke="#526d77" stroke-width="3" stroke-linejoin="round"/>

  <!-- Bill with characteristic hanging throat pouch -->
  <path d="M316 141 491 145c-33 25-78 57-118 47-29-7-46-28-57-51Z"
        fill="url(#pouch)" stroke="#9e704b" stroke-width="2.5"/>
  <path d="M323 126c60 0 123 6 180 18-35 9-117 8-185-1Z"
        fill="url(#gold)" stroke="#966b3f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M335 140q79 8 150 5" fill="none" stroke="#fff0bd" stroke-width="3"/>
  <path d="M282 102q-5-14 3-23M293 99q-1-14 7-20"
        fill="none" stroke="#526d77" stroke-width="3" stroke-linecap="round"/>
  <circle cx="314" cy="120" r="9" fill="#fffaf0"/>
  <circle cx="316" cy="120" r="5" fill="#263d49"/>
  <circle cx="317.5" cy="118.5" r="1.5" fill="white"/>

  <!-- Wing reaching the handlebar -->
  <path d="M249 221c19-10 35 4 51 18 21 18 48 25 80 29
           12 2 15 10 6 15-42 4-82-2-112-17
           -21-10-32-28-25-45Z"
        fill="url(#wing)" stroke="#526d77" stroke-width="3"/>
  <g fill="none" stroke="#839da6" stroke-width="2" stroke-linecap="round">
    <path d="M270 244q39 30 97 31"/>
    <path d="M267 253q32 27 77 27"/>
  </g>

  <!-- Near leg and webbed foot on the pedal -->
  <path d="M260 322q-13 25 1 47l48 86"
        fill="none" stroke="#986940" stroke-width="14" stroke-linecap="round"/>
  <path d="M260 322q-13 25 1 47l48 86"
        fill="none" stroke="url(#gold)" stroke-width="9" stroke-linecap="round"/>
  <path d="m305 448 20 7 17 13-19-1-10 5-15-7Z"
        fill="url(#gold)" stroke="#986940" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M302 475h39" stroke="#304651" stroke-width="7" stroke-linecap="round"/>
</svg>