<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background: smooth vertical sunset gradient, square with no rounded corners -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#F05A7E"/>  <!-- warm pink, top -->
      <stop offset="55%"  stop-color="#F7843F"/>  <!-- sunset orange -->
      <stop offset="100%" stop-color="#FFB45C"/>  <!-- golden amber, bottom -->
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" fill="url(#sky)"/>

  <!-- Single cloud: flat vector, no shading, centered with even margins -->
  <!-- Bounding box ≈ x 96–416, y 176–336 → 96px margin left/right, 176px top/bottom (visually centered) -->
  <g fill="#FFF4E8">
    <!-- Base slab -->
    <rect x="96" y="256" width="320" height="80" rx="40"/>
    <!-- Left puff -->
    <circle cx="176" cy="256" r="60"/>
    <!-- Center puff (tallest) -->
    <circle cx="264" cy="228" r="78"/>
    <!-- Right puff -->
    <circle cx="352" cy="262" r="52"/>
  </g>
</svg>