  <path d="m701 178 18 0-18 15-13-3Z" fill="#e76622"/>

  <!-- Eye -->
  <path d="m484 104 12-7 11 9-10 12-12-3Z" fill="#203658"/>
  <circle cx="497" cy="105" r="3" fill="#fff"/>

  <!-- One wing reaching forward to the handlebars -->
  <path d="m462 220 34 12 27 47 65-42 14 12-70 65-31-4-46-62Z" fill="#fefbea"/>
  <path d="m462 220 34 12 27 47-22 31-46-62Z" fill="#e6fcff"/>
  <path d="m523 279 65-42 14 12-70 65-31-4Z" fill="#76c9e2"/>
  <path d="m588 237 15-5 9 11-10 14-12-7Z" fill="#6555d5"/>
</svg>