  <path d="m415 106 37-34 48 19-46 32-4 67-13 43-28-66Z" fill="#fff"/>
  <path d="m454 123 46-32 12 37-29 36 11 46-25 66-32-43 13-43Z" fill="#b5e9ef"/>
  <path d="m469 276 25-66-26-31-18 11-13 43Z" fill="#63c6e1"/>

