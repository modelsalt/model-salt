<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Ground line -->
  <line x1="10" y1="262" x2="390" y2="262" stroke="#555" stroke-width="3" stroke-linecap="round"/>

  <!-- Rear wheel -->
  <circle cx="100" cy="212" r="48" fill="none" stroke="#222" stroke-width="7"/>
  <circle cx="100" cy="212" r="6" fill="#222"/>
  <g stroke="#222" stroke-width="2">
    <line x1="100" y1="164" x2="100" y2="260"/>
    <line x1="52" y1="212" x2="148" y2="212"/>
    <line x1="66" y1="178" x2="134" y2="246"/>
    <line x1="134" y1="178" x2="66" y2="246"/>
  </g>

  <!-- Front wheel -->
  <circle cx="300" cy="212" r="48" fill="none" stroke="#222" stroke-width="7"/>
  <circle cx="300" cy="212" r="6" fill="#222"/>
  <g stroke="#222" stroke-width="2">
    <line x1="300" y1="164" x2="300" y2="260"/>
    <line x1="252" y1="212" x2="348" y2="212"/>
    <line x1="266" y1="178" x2="334" y2="246"/>
    <line x1="334" y1="178" x2="266" y2="246"/>
  </g>

  <!-- Frame -->
  <g stroke="#D62828" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="100,212 170,140 260,140 300,212"/>
    <polyline points="170,140 200,212 100,212"/>
    <line x1="200" y1="212" x2="260" y2="140"/>
    <line x1="170" y1="140" x2="160" y2="110"/>
    <line x1="260" y1="140" x2="275" y2="100"/>
  </g>

  <!-- Saddle -->
  <path d="M138 108 L182 108 L176 118 L146 118 Z" fill="#222"/>

  <!-- Handlebars -->
  <path d="M275 100 L290 92" stroke="#222" stroke-width="6" stroke-linecap="round"/>
  <circle cx="290" cy="92" r="5" fill="#222"/>

  <!-- Crank and pedals -->
  <circle cx="200" cy="212" r="9" fill="#222"/>
  <line x1="200" y1="212" x2="222" y2="232" stroke="#222" stroke-width="5" stroke-linecap="round"/>
  <line x1="200" y1="212" x2="178" y2="192" stroke="#222" stroke-width="5" stroke-linecap="round"/>
  <rect x="214" y="228" width="18" height="7" rx="2" fill="#444"/>
  <rect x="168" y="188" width="18" height="7" rx="2" fill="#444"/>

  <!-- Legs -->
  <g stroke="#F4A024" stroke-width="7" stroke-linecap="round" fill="none">
    <polyline points="165,130 205,185 223,228"/>
    <polyline points="160,130 170,165 177,188"/>
  </g>
  <!-- Feet -->
  <path d="M212 232 L234 232 L238 226 L228 230 Z" fill="#F4A024"/>
  <path d="M166 192 L188 192 L192 186 L182 190 Z" fill="#F4A024"/>

  <!-- Body -->
  <ellipse cx="160" cy="112" rx="48" ry="34" fill="#F5F5F5"/>
  <!-- Tail feathers -->
  <path d="M116 100 L92 88 L104 112 L88 116 L116 124 Z" fill="#E6E6E6"/>

  <!-- Wing -->
  <path d="M175 110 Q215 70 285 92 Q230 100 180 128 Z" fill="#DADADA"/>

  <!-- Neck -->
  <path d="M190 92 Q210 60 230 50" stroke="#F5F5F5" stroke-width="22" stroke-linecap="round" fill="none"/>

  <!-- Head -->
  <circle cx="236" cy="46" r="20" fill="#F5F5F5"/>

  <!-- Eye -->
  <circle cx="243" cy="40" r="4" fill="#222"/>
  <circle cx="244.5" cy="38.5" r="1.3" fill="#fff"/>

  <!-- Beak -->
  <path d="M250 44 L330 54 L250 58 Z" fill="#F4A024"/>
  <!-- Pouch -->
  <path d="M252 58 Q290 90 328 56 Z" fill="#F7B541"/>
  <line x1="250" y1="44" x2="330" y2="54" stroke="#D98A10" stroke-width="2"/>
</svg>