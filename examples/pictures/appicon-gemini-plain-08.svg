<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <!-- Strict Square Clip Path (No Round Borders) -->
    <clipPath id="square-canvas">
      <rect x="0" y="0" width="1024" height="1024" />
    </clipPath>

    <!-- Main Cloud Clip Path for Volumetric Shading -->
    <clipPath id="cloud-clip">
      <path d="M 300 680 A 120 120 0 0 1 300 440 A 160 160 0 0 1 566.7 320.7 A 140 140 0 0 1 772.4 485.4 A 100 100 0 0 1 740 680 Z" />
    </clipPath>

    <!-- Sky Background Gradient -->
    <linearGradient id="sky-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="28%" stop-color="#1E3A8A" />
      <stop offset="65%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Sun Atmospheric Glow -->
    <radialGradient id="sun-atmosphere" cx="33%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#FF9E00" stop-opacity="0.65" />
      <stop offset="35%" stop-color="#FF5E00" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#F59E0B" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>

    <!-- Bottom Horizon Glow -->
    <radialGradient id="horizon-glow" cx="70%" cy="90%" r="60%">
      <stop offset="0%" stop-color="#7DD3FC" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </radialGradient>

    <!-- Sun Core Gradient -->
    <linearGradient id="sun-core" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="25%" stop-color="#FDE047" />
      <stop offset="65%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Sun Rim Highlight -->
    <linearGradient id="sun-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#FDE047" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#9A3412" stop-opacity="0.5" />
    </linearGradient>

    <!-- Back Cloud Gradient -->
    <linearGradient id="back-cloud-grad" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#7DD3FC" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0.15" />
    </linearGradient>

    <!-- Main Cloud Base Gradient -->
    <linearGradient id="cloud-base" x1="50%" y1="15%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.96" />
      <stop offset="55%" stop-color="#F0F9FF" stop-opacity="0.92" />
      <stop offset="85%" stop-color="#E0F2FE" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#BAE6FD" stop-opacity="0.95" />
    </linearGradient>

    <!-- Subsurface Sun Scattering in Cloud -->
    <radialGradient id="cloud-sun-scatter" cx="35%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.85" />
      <stop offset="35%" stop-color="#FDBA74" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#FCA5A5" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- 3D Puff Shading Gradients -->
    <radialGradient id="puff-light" cx="35%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="55%" stop-color="#F8FAFC" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="puff-shadow" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="65%" stop-color="#0284C7" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0.28" />
    </radialGradient>

    <linearGradient id="cloud-bottom-shadow" x1="50%" y1="70%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0" />
      <stop offset="70%" stop-color="#0369A1" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0C4A6E" stop-opacity="0.35" />
    </linearGradient>

    <!-- Cloud Glass Rim Border -->
    <linearGradient id="cloud-rim" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="30%" stop-color="#FEF08A" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.7" />
    </linearGradient>

    <!-- Lightning Gradient -->
    <linearGradient id="lightning-grad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="20%" stop-color="#FEF08A" />
      <stop offset="55%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Raindrop Gradient -->
    <linearGradient id="rain-grad" x1="25%" y1="10%" x2="75%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="30%" stop-color="#E0F2FE" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#38BDF8" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.95" />
    </linearGradient>

    <!-- Heavy Drop Shadow for Main Cloud -->
    <filter id="cloud-drop-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#08142C" flood-opacity="0.42" />
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0369A1" flood-opacity="0.25" />
    </filter>

    <!-- Glow Filter for Sun and Lightning -->
    <filter id="vibrant-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Soft Shadow for Rain and Lightning -->
    <filter id="element-shadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#09193A" flood-opacity="0.45" />
    </filter>

    <!-- Reusable Raindrop Template -->
    <g id="raindrop">
      <path d="M 0 -42 C 10 -18 26 6 26 22 A 26 26 0 1 1 -26 22 C -26 6 -10 -18 0 -42 Z" fill="url(#rain-grad)" />
      <!-- Inner Shadow / Refraction -->
      <path d="M 0 -42 C 10 -18 26 6 26 22 A 26 26 0 1 1 -26 22 C -26 6 -10 -18 0 -42 Z" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.7" />
      <!-- Glossy Highlight -->
      <path d="M -12 20 C -14 10 -8 -6 -3 -20 C -6 -5 -7 8 -5 20 C -4 25 -10 26 -12 20 Z" fill="#FFFFFF" opacity="0.85" />
      <circle cx="10" cy="30" r="5" fill="#FFFFFF" opacity="0.5" />
    </g>
  </defs>

  <!-- Main Square Canvas -->
  <g clip-path="url(#square-canvas)">
    
    <!-- 1. Sky Background -->
    <rect x="0" y="0" width="1024" height="1024" fill="url(#sky-bg)" />
    <rect x="0" y="0" width="1024" height="1024" fill="url(#horizon-glow)" />
    <rect x="0" y="0" width="1024" height="1024" fill="url(#sun-atmosphere)" />

    <!-- 2. Meteorological Isobars & Radar Rings (Subtle Background Texture) -->
    <g stroke="#FFFFFF" fill="none" opacity="0.08">
      <!-- Centered on Sun (340, 350) -->
      <circle cx="340" cy="350" r="260" stroke-width="2" />
      <circle cx="340" cy="350" r="340" stroke-width="1.5" stroke-dasharray="12 18" />
      <circle cx="340" cy="350" r="430" stroke-width="2" />
      <circle cx="340" cy="350" r="530" stroke-width="1.5" stroke-dasharray="6 14" />
      <circle cx="340" cy="350" r="650" stroke-width="2" />
      <circle cx="340" cy="350" r="790" stroke-width="2" stroke-dasharray="24 16" />
      <circle cx="340" cy="350" r="950" stroke-width="3" />
      
      <!-- Crosshairs / Cardinal Ticks -->
      <line x1="340" y1="0" x2="340" y2="1024" stroke-width="1" stroke-dasharray="8 16" />
      <line x1="0" y1="350" x2="1024" y2="350" stroke-width="1" stroke-dasharray="8 16" />
    </g>

    <!-- Sweeping Atmospheric Wind Curves -->
    <path d="M -100 750 C 250 680, 650 880, 1124 700 L 1124 1024 L -100 1024 Z" fill="#FFFFFF" opacity="0.03" />
    <path d="M -100 860 C 300 980, 750 720, 1124 840 L 1124 1024 L -100 1024 Z" fill="#38BDF8" opacity="0.06" />

    <!-- 3. Background Cloud (Depth Layer) -->
    <g transform="translate(210, -55) scale(0.82)">
      <path d="M 300 680 A 120 120 0 0 1 300 440 A 160 160 0 0 1 566.7 320.7 A 140 140 0 0 1 772.4 485.4 A 100 100 0 0 1 740 680 Z" 
            fill="url(#back-cloud-grad)" 
            stroke="#FFFFFF" 
            stroke-width="2.5" 
            stroke-opacity="0.3" />
    </g>

    <!-- 4. The Sun -->
    <g>
      <!-- Outer Corona Glow -->
      <circle cx="340" cy="350" r="225" fill="#FF7B00" opacity="0.22" filter="url(#vibrant-glow)" />
      <circle cx="340" cy="350" r="195" fill="#FDE047" opacity="0.35" filter="url(#vibrant-glow)" />
      
      <!-- Sun Main Body -->
      <circle cx="340" cy="350" r="180" fill="url(#sun-core)" filter="url(#element-shadow)" />
      
      <!-- 3D Inner Rim Light -->
      <circle cx="340" cy="350" r="178" fill="none" stroke="url(#sun-rim)" stroke-width="4" />
      
      <!-- Top-Left Specular Crescent -->
      <path d="M 205 265 A 160 160 0 0 1 425 205 A 165 170 0 0 0 205 265 Z" fill="#FFFFFF" opacity="0.6" />
    </g>

    <!-- 5. Weather Precipitation (Underneath Main Cloud) -->
    <g filter="url(#element-shadow)">
      <!-- Lightning Bolt -->
      <g>
        <!-- Outer Neon Glow -->
        <path d="M 525 630 L 415 780 L 495 780 L 445 945 L 625 745 L 535 745 L 595 630 Z" 
              fill="#FACC15" opacity="0.45" filter="url(#vibrant-glow)" />
        
        <!-- Main Bolt Body -->
        <path d="M 525 630 L 415 780 L 495 780 L 445 945 L 625 745 L 535 745 L 595 630 Z" 
              fill="url(#lightning-grad)" 
              stroke="#FEF08A" 
              stroke-width="3" 
              stroke-linejoin="round" />
              
        <!-- 3D Bevel / Crisp Inner Highlight -->
        <path d="M 525 630 L 415 780 L 495 780 L 445 945 L 518 762 L 452 762 L 548 630 Z" 
              fill="#FFFFFF" opacity="0.45" />
      </g>

      <!-- Raindrops (Tilted 18 degrees for dynamic motion) -->
      <use href="#raindrop" transform="translate(310, 775) rotate(18) scale(0.95)" />
      <use href="#raindrop" transform="translate(260, 895) rotate(18) scale(0.70)" />
      <use href="#raindrop" transform="translate(680, 770) rotate(18) scale(1.0)" />
      <use href="#raindrop" transform="translate(615, 895) rotate(18) scale(0.80)" />
      <use href="#raindrop" transform="translate(765, 875) rotate(18) scale(0.65)" />
    </g>

    <!-- 6. Main Foreground Cloud (Volumetric 3D + Glassmorphism) -->
    <g filter="url(#cloud-drop-shadow)">
      <!-- Base Cloud Shape -->
      <path d="M 300 680 A 120 120 0 0 1 300 440 A 160 160 0 0 1 566.7 320.7 A 140 140 0 0 1 772.4 485.4 A 100 100 0 0 1 740 680 Z" 
            fill="url(#cloud-base)" />

      <!-- Internal Volumetric Shading (Clipped to Cloud Contour) -->
      <g clip-path="url(#cloud-clip)">
        <!-- Warm Subsurface Scattering from the Sun -->
        <circle cx="340" cy="350" r="310" fill="url(#cloud-sun-scatter)" />

        <!-- Puff 4 (Far Right: cx=740, cy=580, R=100) -->
        <circle cx="740" cy="580" r="105" fill="url(#puff-shadow)" />
        <circle cx="730" cy="570" r="95" fill="url(#puff-light)" />

        <!-- Puff 1 (Far Left: cx=300, cy=560, R=120) -->
        <circle cx="300" cy="560" r="125" fill="url(#puff-shadow)" />
        <circle cx="290" cy="550" r="115" fill="url(#puff-light)" />

        <!-- Puff 3 (Mid Right: cx=640, cy=440, R=140) -->
        <circle cx="640" cy="440" r="150" fill="url(#puff-shadow)" />
        <circle cx="625" cy="425" r="135" fill="url(#puff-light)" />

        <!-- Puff 2 (Main Center-Left: cx=460, cy=440, R=160) -->
        <circle cx="460" cy="440" r="170" fill="url(#puff-shadow)" />
        <circle cx="445" cy="420" r="155" fill="url(#puff-light)" />

        <!-- Global Cloud Base Ambient Occlusion -->
        <rect x="150" y="550" width="750" height="150" fill="url(#cloud-bottom-shadow)" />

        <!-- Crisp Inner Specular Highlights on Cloud Billows -->
        <path d="M 310 435 A 155 155 0 0 1 560 325 A 150 155 0 0 0 310 435 Z" fill="#FFFFFF" opacity="0.85" />
        <path d="M 570 325 A 135 135 0 0 1 765 475 A 135 140 0 0 0 570 325 Z" fill="#FFFFFF" opacity="0.65" />
        <path d="M 190 550 A 115 115 0 0 1 300 445 A 115 120 0 0 0 190 550 Z" fill="#FFFFFF" opacity="0.75" />
      </g>

      <!-- Glassmorphic Rim Border -->
      <path d="M 300 680 A 120 120 0 0 1 300 440 A 160 160 0 0 1 566.7 320.7 A 140 140 0 0 1 772.4 485.4 A 100 100 0 0 1 740 680 Z" 
            fill="none" 
            stroke="url(#cloud-rim)" 
            stroke-width="5" 
            stroke-linejoin="round" />
    </g>

    <!-- 7. Atmospheric Lens Flare / Sparkle Highlights -->
    <!-- Sun Edge Glint -->
    <g transform="translate(300, 440)">
      <circle cx="0" cy="0" r="28" fill="#FEF08A" opacity="0.4" filter="url(#vibrant-glow)" />
      <path d="M 0 -28 C 2 -7 7 -2 28 0 C 7 2 2 7 0 28 C -2 7 -7 2 -28 0 C -7 -2 -2 -7 0 -28 Z" fill="#FFFFFF" opacity="0.95" />
      <circle cx="0" cy="0" r="5" fill="#FFFFFF" />
    </g>

    <!-- Secondary Small Glint -->
    <g transform="translate(215, 225) scale(0.65)">
      <path d="M 0 -24 C 2 -6 6 -2 24 0 C 6 2 2 6 0 24 C -2 6 -6 2 -24 0 C -6 -2 -2 -6 0 -24 Z" fill="#FFFFFF" opacity="0.85" />
    </g>

    <!-- Subtle Square Frame Inner Bevel (Sharp 90-degree edges) -->
    <rect x="2" y="2" width="1020" height="1020" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="4" />
  </g>
</svg>