<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="40%" stop-color="#1C2541" />
      <stop offset="80%" stop-color="#3A506B" />
      <stop offset="100%" stop-color="#48CAE4" />
    </linearGradient>

    <!-- Atmospheric Glow Gradient -->
    <radialGradient id="sunrise-glow" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FF9E00" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#FF007F" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0B132B" stop-opacity="0" />
    </radialGradient>

    <!-- Sun Gradient -->
    <linearGradient id="sun-gradient" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="25%" stop-color="#FFBE0B" />
      <stop offset="75%" stop-color="#FB5607" />
      <stop offset="100%" stop-color="#FF006E" />
    </linearGradient>

    <!-- Back Cloud Gradient -->
    <linearGradient id="back-cloud-grad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#A5B4FC" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.2" />
    </linearGradient>

    <!-- Main Cloud Base Gradient -->
    <linearGradient id="cloud-gradient" x1="30%" y1="10%" x2="70%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F1F5F9" />
      <stop offset="85%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Cloud Highlight/Shadow Gradients for 3D Volumetrics -->
    <radialGradient id="cloud-puff-1" cx="40%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0" />
    </radialGradient>
    
    <radialGradient id="cloud-puff-2" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F8FAFC" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="cloud-inner-shadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="70%" stop-color="#94A3B8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#64748B" stop-opacity="0.35" />
    </linearGradient>

    <!-- Lightning Gradient -->
    <linearGradient id="lightning-gradient" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="20%" stop-color="#FFF3B0" />
      <stop offset="60%" stop-color="#FFBE0B" />
      <stop offset="100%" stop-color="#FB5607" />
    </linearGradient>

    <!-- Raindrop Gradient -->
    <linearGradient id="rain-gradient" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="30%" stop-color="#38BDF8" />
      <stop offset="80%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <!-- Raindrop Highlight -->
    <linearGradient id="rain-highlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="sun-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="40" flood-color="#FF5400" flood-opacity="0.5" />
    </filter>

    <filter id="cloud-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="35" stdDeviation="30" flood-color="#050814" flood-opacity="0.5" />
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#050814" flood-opacity="0.3" />
    </filter>

    <filter id="element-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#050814" flood-opacity="0.4" />
    </filter>

    <filter id="lightning-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="5" stdDeviation="20" flood-color="#FFBE0B" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#FFFFFF" flood-opacity="0.8" />
    </filter>

    <!-- Clip Path for 3D Cloud Interior -->
    <clipPath id="cloud-clip">
      <path d="M 320 680 
               L 740 680 
               A 130 130 0 0 0 870 550 
               A 130 130 0 0 0 763 422 
               A 160 160 0 0 0 610 300 
               A 160 160 0 0 0 476 373 
               A 200 200 0 0 0 350 320 
               A 200 200 0 0 0 156 472 
               A 160 160 0 0 0 160 520
               A 160 160 0 0 0 320 680 Z" />
    </clipPath>
    
    <!-- Reusable Raindrop -->
    <g id="raindrop">
      <path d="M 0 0 C -15 35 -55 70 -55 110 A 55 55 0 1 0 55 110 C 55 70 15 35 0 0 Z" fill="url(#rain-gradient)" />
      <path d="M -10 30 C -20 55 -40 80 -40 105 A 40 40 0 0 0 -15 140 C -30 125 -30 100 -25 85 C -20 65 -10 45 -10 30 Z" fill="url(#rain-highlight)" />
    </g>
  </defs>

  <!-- 1. Square Background (No Round Borders) -->
  <rect width="1024" height="1024" fill="url(#bg-gradient)" />
  <rect width="1024" height="1024" fill="url(#sunrise-glow)" />

  <!-- Subtle Background Grid/Rings for Weather Map Aesthetic -->
  <g stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="2" fill="none">
    <circle cx="360" cy="360" r="280" />
    <circle cx="360" cy="360" r="380" />
    <circle cx="360" cy="360" r="480" />
    <circle cx="360" cy="360" r="580" />
    <circle cx="360" cy="360" r="680" />
    <circle cx="360" cy="360" r="780" />
  </g>

  <!-- 2. The Sun -->
  <g filter="url(#sun-shadow)">
    <circle cx="360" cy="360" r="210" fill="url(#sun-gradient)" />
    <!-- Sun Inner Rim Highlight -->
    <circle cx="360" cy="360" r="208" fill="none" stroke="#FFF3B0" stroke-width="4" stroke-opacity="0.5" />
  </g>

  <!-- 3. Back Cloud (Frosted Glass Effect) -->
  <path d="M 480 630 
           L 820 630 
           A 100 100 0 0 0 920 530 
           A 100 100 0 0 0 835 431 
           A 130 130 0 0 0 710 330 
           A 130 130 0 0 0 585 400 
           A 110 110 0 0 0 480 370 
           A 110 110 0 0 0 375 460 
           A 90 90 0 0 0 390 540
           A 90 90 0 0 0 480 630 Z" 
        fill="url(#back-cloud-grad)" 
        backdrop-filter="blur(10px)"
        stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.2" />

  <!-- 4. Weather Elements (Rain & Lightning) - Layered behind front cloud -->
  
  <!-- Left Raindrop -->
  <use href="#raindrop" transform="translate(260, 730) rotate(18) scale(0.85)" filter="url(#element-shadow)" />
  
  <!-- Center Raindrop -->
  <use href="#raindrop" transform="translate(450, 770) rotate(18) scale(1)" filter="url(#element-shadow)" />
  
  <!-- Right Raindrop (Smaller, higher) -->
  <use href="#raindrop" transform="translate(810, 710) rotate(18) scale(0.7)" filter="url(#element-shadow)" />

  <!-- Lightning Bolt -->
  <g filter="url(#lightning-glow)">
    <path d="M 650 580 
             L 530 750 
             L 620 750 
             L 560 940 
             L 750 720 
             L 650 720 
             Z" 
          fill="url(#lightning-gradient)" 
          stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" />
  </g>

  <!-- 5. Main Foreground Cloud -->
  <g filter="url(#cloud-shadow)">
    <!-- Base Cloud Shape -->
    <path d="M 320 680 
             L 740 680 
             A 130 130 0 0 0 870 550 
             A 130 130 0 0 0 763 422 
             A 160 160 0 0 0 610 300 
             A 160 160 0 0 0 476 373 
             A 200 200 0 0 0 350 320 
             A 200 200 0 0 0 156 472 
             A 160 160 0 0 0 160 520
             A 160 160 0 0 0 320 680 Z" 
          fill="url(#cloud-gradient)" />

    <!-- 3D Volumetric Shading (Clipped to Cloud) -->
    <g clip-path="url(#cloud-clip)">
      <!-- Puff Highlights -->
      <circle cx="350" cy="320" r="200" fill="url(#cloud-puff-1)" />
      <circle cx="610" cy="300" r="160" fill="url(#cloud-puff-1)" />
      <circle cx="320" cy="520" r="160" fill="url(#cloud-puff-2)" />
      <circle cx="740" cy="550" r="130" fill="url(#cloud-puff-2)" />
      
      <!-- Warm Sun Bleed on Top Left -->
      <circle cx="280" cy="350" r="250" fill="url(#sunrise-glow)" style="mix-blend-mode: overlay;" />
      
      <!-- Global Cloud Inner Shadow for Depth -->
      <rect x="100" y="100" width="800" height="600" fill="url(#cloud-inner-shadow)" />

      <!-- Subtle Crease Shadows -->
      <path d="M 476 373 A 180 180 0 0 1 520 480" stroke="#CBD5E1" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.5" filter="blur(4px)" />
      <path d="M 763 422 A 130 130 0 0 0 680 500" stroke="#CBD5E1" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.5" filter="blur(4px)" />
    </g>

    <!-- Cloud Rim Light (Top Edge Highlight) -->
    <path d="M 156 472 
             A 200 200 0 0 1 350 320 
             A 200 200 0 0 1 476 373 
             A 160 160 0 0 1 610 300 
             A 160 160 0 0 1 763 422
             A 130 130 0 0 1 870 550" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="6" 
          stroke-linecap="round"
          opacity="0.9" />
  </g>

  <!-- 6. Foreground Atmospheric Details -->
  <!-- Light Rays / Lens Flare Effect -->
  <g opacity="0.15" style="mix-blend-mode: screen;">
    <polygon points="360,360 -100,800 0,900" fill="url(#rain-highlight)" />
    <polygon points="360,360 800,-100 900,0" fill="url(#rain-highlight)" />
    <polygon points="360,360 1100,500 1100,650" fill="url(#rain-highlight)" />
  </g>
  
  <!-- Sharp Inner Border for App Icon Polish (Square) -->
  <rect width="1024" height="1024" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.08" />
</svg>