  <path d="M 210 420 C 210 400 235 395 385 388 A 34 34 0 0 1 416 422 L 416 428 L 210 422 Z" fill="#9BB09D" />
  <circle cx="380" cy="420" r="22" fill="#7D9982" />

  <!-- Wide Sprung Saddle -->
  <!-- Springs -->
  <g fill="#46534C">
    <rect x="268" y="280" width="24" height="6" rx="3" />
    <rect x="266" y="290" width="28" height="6" rx="3" />
