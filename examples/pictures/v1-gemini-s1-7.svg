  <path d="M 255 268 C 255 258 285 262 342 271 C 350 272 350 277 340 278 C 305 281 255 281 255 268 Z" fill="#DF826B" />


  <!-- ==================== PELICAN CYCLIST ==================== -->
  <!-- Body & Tail Feathers -->
  <path d="M 350 185 C 385 225 365 295 305 300 C 265 304 235 285 215 268 L 185 270 L 202 252 L 178 244 L 208 235 C 232 235 260 225 292 185 Z" fill="#FDF9F1" />
  <!-- Subtle Underbelly Shadow -->
  <path d="M 355 255 C 345 285 325 298 305 300 C 265 304 235 285 215 268 L 185 270 L 195 260 C 230 275 265 288 305 285 C 330 283 345 270 355 255 Z" fill="#EAE0CE" />

