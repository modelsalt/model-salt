  <path d="M 620 150 C 620 130 650 130 660 142 C 675 120 710 120 725 142 C 745 135 760 142 760 150 Z" fill="#FDF9F1" />

  <!-- Ground Plane -->
  <rect x="60" y="511" width="680" height="8" rx="4" fill="#DECEB4" />

