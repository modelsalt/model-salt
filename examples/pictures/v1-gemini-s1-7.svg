  <!-- Wing "Hand" Feather Tips Curled Over Grip -->
  <path d="M 442 246 C 452 242 462 248 458 260 C 454 268 444 265 440 258 Z" fill="#FDF9F1" />
  <path d="M 450 248 C 458 245 466 250 462 260 C 459 266 452 264 448 258 Z" fill="#EAE0CE" />

</svg>