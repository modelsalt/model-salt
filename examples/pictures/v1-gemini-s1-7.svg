  <!-- Webbed Foot on Pedal -->
  <path d="M 332 432 L 382 444 L 330 446 Z" fill="#DF826B" />
  <!-- Near Pedal Block -->
  <rect x="335" y="444" width="34" height="10" rx="5" fill="#46534C" />


  <!-- ==================== SWEPT-BACK HANDLEBARS & NEAR WING ==================== -->
  <!-- Swept-back Cruiser Handlebars (From Stem 532,218 sweeping back to 450,255) -->
  <path d="M 532 212 C 512 212 495 248 450 248 L 450 262 C 502 262 518 226 532 226 Z" fill="#DFD5C3" />

  <!-- Near Arm/Wing (Bendable Arm-like Wing) -->
  <!-- Upper Wing & Shoulder -->
