    <path d="M 0 -78 A 78 78 0 1 0 0 78 A 78 78 0 1 0 0 -78 Z M 0 -68 A 68 68 0 1 1 0 68 A 68 68 0 1 1 0 -68 Z" fill="#FDF9F1" fill-rule="evenodd" />
    <path d="M 0 -68 A 68 68 0 1 0 0 68 A 68 68 0 1 0 0 -68 Z M 0 -64 A 64 64 0 1 1 0 64 A 64 64 0 1 1 0 -64 Z" fill="#9BB09D" fill-rule="evenodd" />
  </g>

  <!-- Front Wheel (Center: 580, 420) -->
