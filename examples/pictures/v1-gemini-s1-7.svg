    <g fill="#DFD5C3">
      <rect x="-82" y="-2" width="164" height="4" />
      <rect x="-82" y="-2" width="164" height="4" transform="rotate(30)" />
      <rect x="-82" y="-2" width="164" height="4" transform="rotate(60)" />
      <rect x="-82" y="-2" width="164" height="4" transform="rotate(90)" />
      <rect x="-82" y="-2" width="164" height="4" transform="rotate(120)" />
      <rect x="-82" y="-2" width="164" height="4" transform="rotate(150)" />
    </g>
