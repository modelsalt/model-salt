<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- Background -->
  <rect width="800" height="600" fill="#F6F0E2" />
  
  <!-- Vintage Sun -->
  <circle cx="480" cy="300" r="210" fill="#EBD7B7" />
  
  <!-- Distant Clouds (Flat Geometric) -->
