  <rect x="515" y="260" width="22" height="6" rx="2" transform="rotate(-14 526 263)" fill="#DFD5C3" />
  <rect x="528" y="308" width="22" height="6" rx="2" transform="rotate(-14 539 311)" fill="#DFD5C3" />

  <!-- Front Fork -->
