  <!-- Front Fender -->
  <path d="M 488 375 A 102 102 0 0 1 678 395 L 666 400 A 90 90 0 0 0 500 381 Z" fill="#9BB09D" />

  <!-- Wheel Hubs -->
  <circle cx="220" cy="420" r="12" fill="#46534C" />
  <circle cx="220" cy="420" r="5" fill="#FDF9F1" />
  <circle cx="580" cy="420" r="12" fill="#46534C" />
  <circle cx="580" cy="420" r="5" fill="#FDF9F1" />

