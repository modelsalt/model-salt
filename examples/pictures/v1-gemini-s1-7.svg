  <path d="M 380 68 C 445 72 525 74 592 76 C 602 76 606 86 598 94 C 592 99 585 95 582 92 L 375 94 Z" fill="#E8A56B" />

  <!-- Eye & Cheek -->
  <circle cx="358" cy="74" r="10" fill="#EAE0CE" />
  <circle cx="358" cy="74" r="6" fill="#46534C" />
  <circle cx="360" cy="72" r="2" fill="#FDF9F1" />
  <ellipse cx="348" cy="92" rx="8" ry="5" fill="#DF826B" opacity="0.6" />

  <!-- Retro Cycling Cap (Sage Green) -->
  <path d="M 312 58 C 320 32 365 34 378 58 Z" fill="#7D9982" />
  <path d="M 365 50 L 402 44 C 406 44 405 52 398 54 L 372 58 Z" fill="#9BB09D" />
  <circle cx="344" cy="40" r="4" fill="#FDF9F1" />


  <!-- ==================== NEAR SIDE (RIGHT LEG & CRANK) ==================== -->
  <!-- Crankset -->
  <circle cx="380" cy="420" r="14" fill="#DFD5C3" />
  <!-- Crank Arm (To Near Pedal at 350, 445) -->
  <path d="M 376 414 L 346 440 L 354 450 L 384 426 Z" fill="#DFD5C3" />
  <circle cx="380" cy="420" r="6" fill="#46534C" />

