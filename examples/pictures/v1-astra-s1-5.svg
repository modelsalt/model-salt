<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
  <title id="title">Pelican riding a bicycle</title>
  <desc id="desc">A sunny yellow pelican sits upright on a red bicycle, facing right, illustrated with flat orange, red, and yellow shapes.</desc>

  <rect width="640" height="640" rx="40" fill="#FFF3CF"/>
  <circle cx="470" cy="150" r="82" fill="#FFE393"/>
  <ellipse cx="326" cy="548" rx="237" ry="17" fill="#FFD782"/>

  <!-- Bicycle wheels -->
  <g fill="#A93232" fill-rule="evenodd">
