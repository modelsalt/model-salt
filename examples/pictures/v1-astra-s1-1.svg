<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 600 400">
  <title>Pelican riding a bicycle</title>
  <desc>A loose black-and-white sketch of a pelican leaning forward on a bicycle, viewed from the front three-quarter angle.</desc>
  <rect width="600" height="400" fill="#fff"/>

  <g fill="none" stroke="#222" stroke-linecap="round" stroke-linejoin="round">
    <!-- Ground -->
    <path d="M134 354q90-5 161 2m36 8q78-5 146-1" stroke="#bbb" stroke-width="2"/>

    <!-- Wheels, turned in perspective -->
    <path d="M220 227c-36-3-58 24-59 60-2 37 18 66 48 68
             32 2 55-25 58-61 3-35-15-65-47-67Z"
          fill="#eee" stroke-width="6"/>
    <path d="M218 235c-29-2-48 22-49 53-2 31 15 57 40 59
             26 2 46-23 49-54 2-30-13-56-40-58Z" fill="#fff" stroke-width="1.5"/>
    <path d="M425 241c-30-2-49 27-51 63-2 38 13 69 39 72
             29 3 51-26 53-64 2-37-15-68-41-71Z"
          fill="#eee" stroke-width="6"/>
    <path d="M424 249c-24-1-40 24-42 55-2 33 11 60 32 63
             23 2 41-24 44-56 2-32-12-60-34-62Z" fill="#fff" stroke-width="1.5"/>

    <!-- Spokes -->
    <g stroke="#aaa" stroke-width="1.2">
      <path d="m216 291 2-56m-2 56 34-37m-34 37 42 2m-42-2 26 43
               m-26-43-7 56m7-56-37 33m37-33-47-3m47 3-31-42"/>
      <path d="m420 308 4-59m-4 59 30-39m-30 39 38 3m-38-3 23 43
               m-23-43-6 59m6-59-30 35m30-35-38-4m38 4-24-43"/>
    </g>

    <!-- Bicycle frame -->
    <path d="m216 291 57-79 40 91-97-12 153-73-56 85
             m-40-91 96 6m-96-6-9-29"
          stroke="#555" stroke-width="7"/>
    <path d="m216 291 57-79 40 91m-97-12 153-73-56 85"
          stroke="#ddd" stroke-width="2"/>
    <path d="m360 191 11 32 49 85m-52-87 39 86" stroke-width="5"/>
    <path d="m359 191-7-23 28-9m-29 9-27-11m55 2 14 7"
          stroke-width="5"/>
    <path d="m245 182q17-10 42 2l-2 8q-24 5-40-3Z" fill="#333" stroke-width="3"/>

    <!-- Far leg and pedal -->
    <path d="m294 204 36 32-23 36" stroke="#777" stroke-width="8"/>
    <path d="m304 268 24 4-15 8-21-2Z" fill="#aaa" stroke-width="2"/>
    <path d="m313 303-15-28m-12 1 27 2" stroke-width="4"/>

    <!-- Tail and forward-leaning body -->
    <path d="m242 174-43-15 16 23-21-5q17 27 50 27" fill="#ddd" stroke-width="3"/>
    <path d="M238 199c-21-18-22-42-7-65 12-20 33-34 55-32
             27 3 44 25 40 51-3 27-19 48-40 56-17 6-37 1-48-10Z"
          fill="#f7f7f7" stroke-width="3"/>
    <path d="M248 139q-18 20-10 42 9 19 32 17l-12-10
             15 2-11-12 14 2-9-12q17-8 20-22"
          fill="#d4d4d4" stroke-width="2.5"/>
    <path d="m242 157 14 19m-13-7 10 15m-12-4 9 8" stroke="#888" stroke-width="1.5"/>

    <!-- Long neck and head -->
    <path d="M285 138c18-10 20-26 19-43-2-22 9-42 30-46
             20-5 41 5 44 23 3 15-6 26-20 31
             -16 6-16 20-18 37-2 22-13 35-29 42"
          fill="#fff" stroke-width="3.2"/>
    <path d="M320 104q-6 24-5 40m11-46q-4 13-4 22" stroke="#aaa" stroke-width="1.7"/>
    <path d="m324 51-6-10 13 6-1-10 12 11" fill="#fff" stroke-width="2"/>

    <!-- Bill and expansive throat pouch -->
    <path d="M355 91q48 16 133 24c-22 12-48 27-72 27
             -26 0-48-15-61-35Z"
          fill="#c8c8c8" stroke-width="2.7"/>
    <path d="M365 76q56 10 126 38-57 4-132-19Z"
          fill="#eee" stroke-width="3"/>
    <path d="m369 94 108 20m-111-8q22 23 52 27" stroke="#888" stroke-width="1.4"/>
    <path d="m488 113 6 3-7 4" stroke-width="2"/>
    <ellipse cx="351" cy="73" rx="5" ry="6" fill="#222" stroke="none"/>
    <circle cx="352.5" cy="71" r="1.5" fill="#fff" stroke="none"/>
    <path d="m341 62q8-5 16 0" stroke-width="2"/>

    <!-- Wing reaching the handlebar -->
    <path d="M291 135q15-3 26 11l27 22 17-4-8 13
             q-10 9-23 1l-32-18"
          fill="#eee" stroke-width="3"/>
    <path d="m335 168 12 8m-6-14 11 10" stroke="#888" stroke-width="1.5"/>

    <!-- Near leg and webbed foot -->
    <path d="m276 208-4 35 41 55" stroke="#444" stroke-width="9"/>
    <path d="m310 294 17 7 17 14-16-1-8 5-20-13Z"
          fill="#aaa" stroke-width="2.5"/>
    <circle cx="313" cy="303" r="10" fill="#ddd" stroke-width="3"/>
    <path d="m313 303 19 21m-11 1 26-2" stroke-width="4"/>

    <!-- Stray pencil marks -->
    <g stroke="#999" stroke-width="1" opacity=".7">
      <path d="M156 283q-3 43 23 66m255-112q28 11 36 44
               M231 128q15-24 38-28m41-13q-1-21 14-31
               m-53 163 34 76m73-68 32 65"/>
      <path d="m126 269 22 1m-30 11 25 1m-9-25 16 1"/>
    </g>
  </g>
</svg>