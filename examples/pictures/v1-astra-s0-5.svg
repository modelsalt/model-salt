<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" role="img" aria-labelledby="title desc">
  <title id="title">Pelican riding a bicycle</title>
  <desc id="desc">An upright white pelican with a long orange bill pedals a teal bicycle, seen from the side.</desc>

  <rect width="800" height="650" rx="32" fill="#fff8eb"/>
  <ellipse cx="400" cy="568" rx="291" ry="18" fill="#e8dfce"/>

  <!-- Bicycle wheels -->
  <g fill="#fffdf6" stroke="#283d46" stroke-width="12">
    <circle cx="225" cy="465" r="98"/>
    <circle cx="585" cy="465" r="98"/>
  </g>
  <g stroke="#bbc9c7" stroke-width="3">
    <path d="M225 371v188m-94-94h188m-160-66 132 132m-132 0 132-132"/>
    <path d="M585 371v188m-94-94h188m-160-66 132 132m-132 0 132-132"/>
  </g>

  <!-- Far leg and pedal -->
  <path d="M373 326 420 373 397 430" fill="none"
        stroke="#d58b38" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m388 432 30 3 12 10h-48Z" fill="#eaa548"/>
  <path d="M379 447h55" stroke="#283d46" stroke-width="9" stroke-linecap="round"/>

  <!-- Bicycle frame -->
  <g fill="none" stroke="#268f91" stroke-width="12" stroke-linejoin="round">
    <path d="m225 465 88-139 67 139Zm88-139h216L380 465"/>
    <path d="m518 297 67 168"/>
  </g>
  <g fill="none" stroke="#283d46" stroke-width="8" stroke-linecap="round">
    <path d="m313 326-10-30m215 1-13-36h42q26 0 24 22"/>
    <path d="M282 296h60"/>
  </g>
  <path d="M278 283q31-10 68 0v13h-68Z" fill="#644e43"/>
  <circle cx="380" cy="465" r="24" fill="#fff8eb" stroke="#283d46" stroke-width="7"/>
  <path d="m380 465-35 38h-21" fill="none" stroke="#283d46" stroke-width="7" stroke-linecap="round"/>
  <path d="M317 507h58" stroke="#283d46" stroke-width="10" stroke-linecap="round"/>
  <g fill="#283d46">
    <circle cx="225" cy="465" r="9"/>
    <circle cx="585" cy="465" r="9"/>
  </g>

  <!-- Pelican tail and upright body -->
  <path d="m293 272-59-27 24 47 48 15" fill="#dce5e6" stroke="#283d46" stroke-width="5" stroke-linejoin="round"/>
  <path d="M294 284c-33-29-25-80 9-104 22-16 41-20 52-44
           l17-43 49 15c-17 48-9 83 13 121 24 41-4 89-55 99
           -35 6-66-11-85-44Z"
        fill="#fff" stroke="#283d46" stroke-width="5" stroke-linejoin="round"/>

  <!-- Near leg and webbed foot -->
  <path d="m353 319-21 76 22 92" fill="none"
        stroke="#efa742" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m346 481 16 5 30 15h-54Z"
        fill="#ffbc53" stroke="#283d46" stroke-width="4" stroke-linejoin="round"/>

  <!-- Wing reaching to the handlebars -->
  <path d="M324 209c32-10 58 13 91 31l101 20
           -7 17-108-10c-36-4-67-11-82-30"
        fill="#e4ebeb" stroke="#283d46" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m346 230 55 23 80 14" fill="none" stroke="#bdcccf" stroke-width="4" stroke-linecap="round"/>

  <!-- Head, long bill, and throat pouch -->
  <path d="M368 126c-20-17-22-45-7-64 16-21 49-22 68-6
           17 15 18 43 3 61l-17 19"
        fill="#fff" stroke="#283d46" stroke-width="5" stroke-linecap="round"/>
  <path d="M421 94 618 111c-43 20-91 63-137 58-32-3-51-33-60-75Z"
        fill="#f7bc68" stroke="#283d46" stroke-width="5" stroke-linejoin="round"/>
  <path d="m421 88 202 20q11 2-2 9L423 111Z"
        fill="#ef983e" stroke="#283d46" stroke-width="5" stroke-linejoin="round"/>
  <path d="M438 125q22 30 47 30" fill="none" stroke="#dc984a" stroke-width="4" stroke-linecap="round"/>
  <circle cx="412" cy="77" r="7" fill="#283d46"/>
  <circle cx="414" cy="75" r="2" fill="#fff"/>
  <path d="m365 55-8-13m17 10-1-16" stroke="#283d46" stroke-width="4" stroke-linecap="round"/>

  <!-- A little forward motion -->
  <g stroke="#bdcccf" stroke-width="5" stroke-linecap="round">
    <path d="M116 313h67M89 333h77M119 353h36"/>
  </g>
</svg>