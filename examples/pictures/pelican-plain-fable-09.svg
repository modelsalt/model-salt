<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Sky and ground -->
  <rect width="400" height="300" fill="#cfe9f7"/>
  <rect y="230" width="400" height="70" fill="#9bc27a"/>
  <line x1="0" y1="245" x2="400" y2="245" stroke="#6f8f54" stroke-width="2"/>

  <!-- Sun -->
  <circle cx="340" cy="55" r="25" fill="#ffd95a"/>

  <!-- Bicycle -->
  <g stroke="#333" stroke-width="4" fill="none">
    <!-- Wheels -->
    <circle cx="110" cy="220" r="38"/>
    <circle cx="290" cy="220" r="38"/>
    <!-- Spokes -->
    <g stroke-width="1.5" stroke="#777">
      <line x1="110" y1="182" x2="110" y2="258"/>
      <line x1="72" y1="220" x2="148" y2="220"/>
      <line x1="83" y1="193" x2="137" y2="247"/>
      <line x1="83" y1="247" x2="137" y2="193"/>
      <line x1="290" y1="182" x2="290" y2="258"/>
      <line x1="252" y1="220" x2="328" y2="220"/>
      <line x1="263" y1="193" x2="317" y2="247"/>
      <line x1="263" y1="247" x2="317" y2="193"/>
    </g>
    <!-- Frame -->
    <path d="M110 220 L165 150 L240 150 L290 220 M165 150 L200 220 L240 150 M200 220 L110 220" stroke="#d6453d"/>
    <!-- Handlebars -->
    <path d="M240 150 L250 125 M235 125 L265 125"/>
    <!-- Seat -->
    <line x1="165" y1="150" x2="160" y2="128"/>
    <path d="M145 128 L178 128" stroke-width="7" stroke-linecap="round"/>
    <!-- Pedals / crank -->
    <circle cx="200" cy="220" r="8" fill="#333"/>
    <line x1="200" y1="220" x2="215" y2="238"/>
    <line x1="200" y1="220" x2="185" y2="202"/>
    <line x1="208" y1="238" x2="222" y2="238" stroke-width="5"/>
    <line x1="178" y1="202" x2="192" y2="202" stroke-width="5"/>
  </g>

  <!-- Pelican -->
  <g>
    <!-- Legs -->
    <path d="M165 165 Q175 190 215 235" stroke="#f0a030" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M170 165 Q165 185 188 204" stroke="#f0a030" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- Tail -->
    <path d="M135 118 L105 100 L125 130 Z" fill="#f4f4f4" stroke="#bbb" stroke-width="2"/>
    <!-- Body -->
    <ellipse cx="170" cy="118" rx="45" ry="30" fill="#f8f8f8" stroke="#bbb" stroke-width="2"/>
    <!-- Wing -->
    <path d="M150 112 Q175 95 215 112 Q190 130 150 118 Z" fill="#e4e4e4" stroke="#bbb" stroke-width="2"/>
    <!-- Arm/wing reaching to handlebar -->
    <path d="M205 118 Q235 130 250 128" stroke="#e4e4e4" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Neck -->
    <path d="M195 100 Q225 80 230 60" stroke="#f8f8f8" stroke-width="16" fill="none" stroke-linecap="round"/>
    <!-- Head -->
    <circle cx="232" cy="55" r="17" fill="#f8f8f8" stroke="#bbb" stroke-width="2"/>
    <!-- Eye -->
    <circle cx="239" cy="50" r="3.5" fill="#222"/>
    <circle cx="240.5" cy="48.5" r="1.2" fill="#fff"/>
    <!-- Beak (upper) -->
    <path d="M246 54 L310 62 L246 66 Z" fill="#f5a623" stroke="#c77d12" stroke-width="2" stroke-linejoin="round"/>
    <!-- Pouch (lower beak) -->
    <path d="M246 66 L305 63 Q280 90 248 72 Z" fill="#f7c26b" stroke="#c77d12" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- Motion lines -->
  <g stroke="#88aabb" stroke-width="2" stroke-linecap="round">
    <line x1="40" y1="200" x2="60" y2="200"/>
    <line x1="30" y1="215" x2="55" y2="215"/>
    <line x1="45" y1="230" x2="62" y2="230"/>
  </g>
</svg>