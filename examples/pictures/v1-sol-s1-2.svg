<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <title>Pelican riding a bicycle</title>
  <desc>A front-facing white pelican rides hands-free with both wings folded, turning its long golden bill to the right.</desc>

  <rect width="640" height="640" rx="36" fill="#e9f3ef"/>
  <ellipse cx="320" cy="594" rx="107" ry="13" fill="#d0dfd8"/>

  <!-- Rear wheel, seen behind the frame -->
  <ellipse cx="312" cy="423" rx="19" ry="99" fill="#293739"/>
  <ellipse cx="312" cy="423" rx="10" ry="84" fill="#a9bab8"/>
  <ellipse cx="312" cy="423" rx="5" ry="77" fill="#e9f3ef"/>

  <!-- Narrow frontal projection of the diamond frame -->
  <path d="M303 348 316 345 341 412 322 499 287 416Z" fill="#208b88"/>
  <path d="m309 371-13 43 20 58 15-59Z" fill="#e9f3ef"/>
  <path d="m301 357 8-3 14 133-9 2Z" fill="#14716e"/>
  <path d="M299 337h14v30h-14z" fill="#738582"/>
  <rect x="277" y="329" width="63" height="14" rx="7" fill="#354140"/>

  <!-- Crank and pedals -->
  <circle cx="315" cy="451" r="15" fill="#cad4ce"/>
  <circle cx="315" cy="451" r="7" fill="#778b85"/>
  <path d="m310 448 7-5 29 39-7 5Z" fill="#81938d"/>
  <path d="m310 448 7 5-33 29-6-7Z" fill="#81938d"/>
  <rect x="330" y="480" width="35" height="9" rx="3" fill="#344342"/>
  <rect x="263" y="474" width="33" height="9" rx="3" fill="#344342"/>

  <!-- Legs and webbed feet -->
  <path d="M286 313c-12 45-24 74-13 105l8 51 13-2-5-54c-5-23 16-53 21-90Z" fill="#e6ac56"/>
  <path d="M331 313c29 43 34 73 15 112l-4 53 14 3 9-58c17-42 4-83-12-108Z" fill="#efbb69"/>
  <path d="m281 461-20 15 15 1 8 6 7-5 17-1-17-17Z" fill="#d69543"/>
  <path d="m344 471-16 15 15-1 9 7 8-5 16 1-21-19Z" fill="#dca04c"/>

  <!-- Tail and rounded back -->
  <path d="m276 280 8 65 21-13 15 20 16-22 23 15 7-66Z" fill="#404c4b"/>
  <path d="M319 170c-53 0-83 45-78 101 3 43 32 70 78 70s76-27 79-70c5-56-26-101-79-101Z" fill="#fffdf3"/>

  <!-- Both wings folded against the body -->
  <path d="M263 202c-25 28-29 78-8 109 12 17 29 20 44 14-25-29-20-80-36-123Z" fill="#d7ddd6"/>
  <path d="M263 226c-8 28-7 59 10 79l17 12c-17-29-16-59-27-91Z" fill="#586561"/>
  <path d="M376 202c25 28 29 78 8 109-12 17-29 20-44 14 25-29 20-80 36-123Z" fill="#e0e4dc"/>
  <path d="M376 226c8 28 7 59-10 79l-17 12c17-29 16-59 27-91Z" fill="#67726c"/>

  <!-- Upright neck and head turned to reveal the pouch -->
  <path d="M290 219c9-34-8-52-5-88 2-32 18-54 42-54 27 0 43 20 41 45-2 24-20 38-24 61-3 16 5 28 9 38-19 17-43 18-63-2Z" fill="#fffdf3"/>
  <path d="M296 121c-5 36 15 59 9 88 9 5 17 6 25 4-17-29-13-48-8-69Z" fill="#e6e8dd"/>
  <path d="M294 91c6-20 23-29 40-23l-8 7 16 2-12 8Z" fill="#fffdf3"/>

  <!-- Long bill and hanging throat pouch -->
  <path d="M346 116 493 133c-15 17-30 28-52 39-35 18-67 13-83-10l-15-27Z" fill="#e4ad56"/>
  <path d="M359 135c18 14 28 24 49 26 24 2 49-9 70-20l-120-16Z" fill="#f4cd82"/>
  <path d="M342 108c46 0 104 10 160 25-40 4-101 2-153-6Z" fill="#efb94c"/>
  <path d="m487 130 15 3-12 6Z" fill="#c48b30"/>
  <ellipse cx="340" cy="103" rx="10" ry="11" fill="#e9cd8b"/>
  <circle cx="342" cy="103" r="5" fill="#273c3b"/>
  <circle cx="344" cy="101" r="1.6" fill="#fff"/>

  <!-- Empty handlebars -->
  <path d="M314 384h13v47h-13z" fill="#8a9b95"/>
  <path d="M243 374h154v10H243z" fill="#96a7a0"/>
  <rect x="228" y="370" width="40" height="17" rx="8" fill="#354542"/>
  <rect x="372" y="370" width="40" height="17" rx="8" fill="#354542"/>

  <!-- Front fork and wheel -->
