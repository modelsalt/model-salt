<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>A happy pelican riding a red bicycle</title>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BDE3FF"/>
      <stop offset="100%" stop-color="#EAF7FF"/>
    </linearGradient>
  </defs>

  <!-- Sky and scenery -->
  <rect width="800" height="600" fill="url(#sky)"/>

  <!-- Sun -->
  <g stroke="#FFC93C" stroke-width="5" stroke-linecap="round">
    <line x1="182" y1="95" x2="198" y2="95"/>
    <line x1="167" y1="132" x2="178" y2="143"/>
    <line x1="130" y1="147" x2="130" y2="163"/>
    <line x1="93" y1="132" x2="82" y2="143"/>
    <line x1="78" y1="95" x2="62" y2="95"/>
    <line x1="93" y1="58" x2="82" y2="47"/>
    <line x1="130" y1="43" x2="130" y2="27"/>
    <line x1="167" y1="58" x2="178" y2="47"/>
  </g>
  <circle cx="130" cy="95" r="42" fill="#FFD75E" stroke="#FFC93C" stroke-width="4"/>

  <!-- Clouds -->
  <g fill="#FFFFFF" opacity="0.9">
    <ellipse cx="310" cy="80" rx="45" ry="18"/>
    <ellipse cx="345" cy="70" rx="35" ry="16"/>
    <ellipse cx="620" cy="160" rx="50" ry="18"/>
    <ellipse cx="660" cy="150" rx="32" ry="14"/>
  </g>

  <!-- Distant birds -->
  <g stroke="#8FB0C9" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M 615 60 Q 623 52 631 60 Q 639 52 647 60"/>
    <path d="M 665 90 Q 671 84 677 90 Q 683 84 689 90"/>
  </g>

  <!-- Ground -->
  <rect x="0" y="540" width="800" height="60" fill="#8ED081"/>
  <rect x="0" y="536" width="800" height="6" fill="#6FBF63"/>
  <g stroke="#5BA84F" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M 60 540 Q 63 528 66 540 Q 69 526 72 540 Q 75 530 78 540"/>
    <path d="M 730 540 Q 733 528 736 540 Q 739 526 742 540 Q 745 530 748 540"/>
  </g>
  <g>
    <line x1="150" y1="540" x2="150" y2="524" stroke="#5BA84F" stroke-width="3"/>
    <circle cx="150" cy="517" r="4" fill="#F7CAD9"/>
    <circle cx="143" cy="521" r="4" fill="#F7CAD9"/>
    <circle cx="157" cy="521" r="4" fill="#F7CAD9"/>
    <circle cx="150" cy="521" r="3" fill="#FFD75E"/>
    <line x1="648" y1="540" x2="648" y2="524" stroke="#5BA84F" stroke-width="3"/>
    <circle cx="648" cy="517" r="4" fill="#C3B2E8"/>
    <circle cx="641" cy="521" r="4" fill="#C3B2E8"/>
    <circle cx="655" cy="521" r="4" fill="#C3B2E8"/>
    <circle cx="648" cy="521" r="3" fill="#FFD75E"/>
  </g>

  <!-- Soft shadow under bike -->
  <ellipse cx="400" cy="548" rx="250" ry="10" fill="#000000" opacity="0.08"/>

  <!-- Speed lines -->
  <g stroke="#A8D8F0" stroke-width="6" stroke-linecap="round">
    <line x1="60" y1="380" x2="125" y2="380"/>
    <line x1="38" y1="420" x2="112" y2="420"/>
    <line x1="70" y1="470" x2="132" y2="470"/>
  </g>

  <!-- ======== BICYCLE ======== -->
  <!-- Wheels -->
  <g>
    <!-- Rear wheel -->
    <circle cx="240" cy="450" r="90" fill="none" stroke="#2B2B2B" stroke-width="12"/>
    <circle cx="240" cy="450" r="76" fill="none" stroke="#B8B8B8" stroke-width="4"/>
    <g stroke="#C8C8C8" stroke-width="2.5">
      <line x1="240" y1="450" x2="240" y2="376"/>
      <line x1="240" y1="450" x2="240" y2="524"/>
      <line x1="240" y1="450" x2="166" y2="450"/>
      <line x1="240" y1="450" x2="314" y2="450"/>
      <line x1="240" y1="450" x2="188" y2="398"/>
      <line x1="240" y1="450" x2="292" y2="502"/>
      <line x1="240" y1="450" x2="292" y2="398"/>
      <line x1="240" y1="450" x2="188" y2="502"/>
    </g>
    <circle cx="240" cy="450" r="8" fill="#444444"/>
    <!-- Front wheel -->
    <circle cx="560" cy="450" r="90" fill="none" stroke="#2B2B2B" stroke-width="12"/>
    <circle cx="560" cy="450" r="76" fill="none" stroke="#B8B8B8" stroke-width="4"/>
    <g stroke="#C8C8C8" stroke-width="2.5">
      <line x1="560" y1="450" x2="560" y2="376"/>
      <line x1="560" y1="450" x2="560" y2="524"/>
      <line x1="560" y1="450" x2="486" y2="450"/>
      <line x1="560" y1="450" x2="634" y2="450"/>
      <line x1="560" y1="450" x2="508" y2="398"/>
      <line x1="560" y1="450" x2="612" y2="502"/>
      <line x1="560" y1="450" x2="612" y2="398"/>
      <line x1="560" y1="450" x2="508" y2="502"/>
    </g>
    <circle cx="560" cy="450" r="8" fill="#444444"/>
  </g>

  <!-- Chain -->
  <g stroke="#777777" stroke-width="3">
    <line x1="240" y1="442" x2="368" y2="427"/>
    <line x1="240" y1="458" x2="368" y2="463"/>
  </g>

  <!-- Frame -->
  <g stroke="#D62828" stroke-width="9" stroke-linecap="round" fill="none">
    <line x1="240" y1="450" x2="370" y2="445"/>
    <line x1="240" y1="450" x2="305" y2="305"/>
    <line x1="310" y1="300" x2="505" y2="282"/>
    <line x1="370" y1="445" x2="528" y2="332"/>
    <line x1="505" y1="282" x2="528" y2="332"/>
    <line x1="305" y1="305" x2="370" y2="445"/>
    <line x1="524" y1="322" x2="560" y2="450"/>
  </g>
  <circle cx="370" cy="445" r="6" fill="#333333"/>

  <!-- Seat post and saddle -->
  <line x1="304" y1="306" x2="300" y2="288" stroke="#777777" stroke-width="7" stroke-linecap="round"/>
  <ellipse cx="302" cy="286" rx="28" ry="8" fill="#2F2F2F" transform="rotate(-5 302 286)"/>

  <!-- Handlebar -->
  <line x1="505" y1="282" x2="494" y2="248" stroke="#999999" stroke-width="8" stroke-linecap="round"/>
  <path d="M 494 248 C 482 238, 466 236, 452 242" stroke="#3A3A3A" stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- Crankset and pedals -->
  <circle cx="370" cy="445" r="20" fill="none" stroke="#555555" stroke-width="5"/>
  <g stroke="#444444" stroke-width="7" stroke-linecap="round">
    <line x1="370" y1="445" x2="398" y2="418"/>
    <line x1="370" y1="445" x2="342" y2="472"/>
  </g>
  <rect x="384" y="412" width="28" height="10" rx="3" fill="#222222" transform="rotate(-6 398 417)"/>
  <rect x="328" y="467" width="28" height="10" rx="3" fill="#222222" transform="rotate(-6 342 472)"/>

  <!-- Basket with a fish -->
  <path d="M 530 254 C 528 240, 534 232, 542 230 C 540 240, 544 246, 548 252 Z" fill="#8FC1E0" stroke="#6A9EBF" stroke-width="2"/>
  <path d="M 508 254 L 562 260 L 553 302 L 516 297 Z" fill="#D19A5B" stroke="#A9743A" stroke-width="2.5"/>
  <g stroke="#A9743A" stroke-width="2">
    <line x1="510" y1="269" x2="559" y2="274"/>
    <line x1="513" y1="285" x2="556" y2="289"/>
  </g>

  <!-- ======== PELICAN ======== -->
  <!-- Far leg and foot -->
  <path d="M 290 278 C 300 330, 315 400, 338 466" fill="none" stroke="#5A5A5A" stroke-width="10" stroke-linecap="round"/>
  <path d="M 326 465 Q 342 459 356 463 L 350 470 L 362 471 L 352 477 L 356 484 L 338 481 Q 327 475 326 465 Z" fill="#565656"/>

  <!-- Tail feathers -->
  <path d="M 240 240 C 210 238, 188 250, 176 272 C 200 268, 220 266, 238 262 Z" fill="#F2F2F2" stroke="#D5D5D5" stroke-width="2"/>
  <path d="M 244 254 C 222 258, 204 268, 196 284 C 214 280, 230 276, 244 270 Z" fill="#E7E7E7" stroke="#CFCFCF" stroke-width="2"/>

  <!-- Body -->
  <ellipse cx="295" cy="228" rx="72" ry="56" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="3" transform="rotate(-12 295 228)"/>

  <!-- Wing -->
  <path d="M 252 198 C 275 178, 315 178, 342 202 C 352 222, 348 246, 330 260 C 305 274, 272 270, 256 250 C 244 232, 242 214, 252 198 Z" fill="#E9E9E9" stroke="#CFCFCF" stroke-width="2.5"/>
  <g stroke="#C6C6C6" stroke-width="2" fill="none">
    <path d="M 262 214 C 285 205, 312 206, 332 220"/>
    <path d="M 260 232 C 285 226, 312 228, 334 240"/>
    <path d="M 266 248 C 285 244, 305 246, 322 254"/>
  </g>

  <!-- Wing "arm" reaching the handlebar -->
  <path d="M 345 232 C 388 248, 418 252, 450 244" fill="none" stroke="#D9D9D9" stroke-width="22" stroke-linecap="round"/>
  <path d="M 345 232 C 388 248, 418 252, 450 244" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round"/>

  <!-- Neck -->
  <path d="M 340 240 C 385 235, 405 205, 408 165 C 410 140, 418 125, 435 120" fill="none" stroke="#D9D9D9" stroke-width="36" stroke-linecap="round"/>
  <path d="M 340 240 C 385 235, 405 205, 408 165 C 410 140, 418 125, 435 120" fill="none" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round"/>

  <!-- Red scarf -->
  <path d="M 394 184 C 368 168, 340 172, 314 194 C 330 190, 344 198, 358 210 C 370 198, 382 194, 396 196 Z" fill="#E63946" stroke="#C1272D" stroke-width="2"/>
  <ellipse cx="406" cy="180" rx="17" ry="9" fill="#E63946" stroke="#C1272D" stroke-width="2" transform="rotate(-80 406 180)"/>

  <!-- Head -->
  <circle cx="438" cy="116" r="24" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="3"/>
  <path d="M 424 94 Q 414 84 410 74 Q 422 80 430 90 Z" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="2"/>

  <!-- Pouch and beak -->
  <path d="M 462 124 C 468 162, 505 180, 542 169 C 564 162, 581 152, 589 146 C 556 137, 500 128, 462 124 Z" fill="#FFC15E" stroke="#E8920C" stroke-width="2"/>
  <path d="M 455 102 C 510 110, 560 126, 594 141 C 598 144, 595 148, 590 147 C 545 134, 495 124, 458 120 Z" fill="#FF9F1C" stroke="#DD7E00" stroke-width="2"/>

  <!-- Eye -->
  <circle cx="448" cy="107" r="4.5" fill="#222222"/>
  <circle cx="449.5" cy="105.5" r="1.5" fill="#FFFFFF"/>

  <!-- Near leg and foot on pedal -->
  <path d="M 315 275 C 335 320, 365 375, 392 408" fill="none" stroke="#6E6E6E" stroke-width="12" stroke-linecap="round"/>
  <path d="M 385 407 Q 402 400 418 403 L 412 411 L 426 412 L 414 419 L 420 427 L 398 424 Q 386 418 385 407 Z" fill="#6B6B6B"/>
</svg>