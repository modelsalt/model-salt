<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Sky background: deep indigo to bright sky blue -->
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#1E1B6B"/>
      <stop offset="55%"  stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Sun body -->
    <radialGradient id="sun" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0%"   stop-color="#FFF7AE"/>
      <stop offset="45%"  stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </radialGradient>

    <!-- Soft halo around the sun -->
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#FDE047" stop-opacity="0.55"/>
      <stop offset="60%"  stop-color="#FBBF24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>

    <!-- Cloud fill -->
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DCEEFE"/>
    </linearGradient>

    <!-- Cloud shadow for depth -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#0B1450" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Square background, no rounded corners -->
  <rect width="1024" height="1024" fill="url(#sky)"/>

  <g transform="translate(-20 70)">
    <!-- Sun halo -->
    <circle cx="650" cy="360" r="330" fill="url(#glow)"/>

    <!-- Sun rays -->
    <g stroke="#FDE047" stroke-width="34" stroke-linecap="round">
      <line x1="650" y1="140" x2="650" y2="85"/>
      <line x1="806" y1="204" x2="844" y2="166"/>
      <line x1="870" y1="360" x2="925" y2="360"/>
      <line x1="806" y1="516" x2="844" y2="554"/>
      <line x1="494" y1="204" x2="456" y2="166"/>
      <line x1="430" y1="360" x2="375" y2="360"/>
    </g>

    <!-- Sun -->
    <circle cx="650" cy="360" r="170" fill="url(#sun)"/>

    <!-- Cloud -->
    <g fill="url(#cloud)" filter="url(#shadow)">
      <rect x="200" y="600" width="640" height="170" rx="85"/>
      <circle cx="330" cy="620" r="130"/>
      <circle cx="520" cy="530" r="190"/>
      <circle cx="700" cy="600" r="140"/>
    </g>

    <!-- Subtle highlight on the cloud's top edge -->
    <path d="M395 470 A190 190 0 0 1 600 360" fill="none"
          stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" opacity="0.9"/>
  </g>
</svg>