<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- Sunset sky -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1846"/>
      <stop offset="0.35" stop-color="#7b2f68"/>
      <stop offset="0.6" stop-color="#d9534a"/>
      <stop offset="0.8" stop-color="#f7a254"/>
      <stop offset="1" stop-color="#ffd98a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6c8"/>
      <stop offset="0.6" stop-color="#ffd36b"/>
      <stop offset="1" stop-color="#ff9a3c"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a2443"/>
      <stop offset="1" stop-color="#1e1022"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b4a5c"/>
      <stop offset="1" stop-color="#2c2230"/>
    </linearGradient>

    <!-- Pelican -->
    <radialGradient id="body" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#ece6ea"/>
      <stop offset="1" stop-color="#b9a9b8"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcf8a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff9a5a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wingL" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f3f5"/>
      <stop offset="1" stop-color="#bfb2bf"/>
    </linearGradient>
    <linearGradient id="wingR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f3f5"/>
      <stop offset="1" stop-color="#bfb2bf"/>
    </linearGradient>
    <radialGradient id="head" cx="0.45" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#fffbe8"/>
      <stop offset="0.5" stop-color="#f6efd9"/>
      <stop offset="1" stop-color="#c9b9b8"/>
    </radialGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc061"/>
      <stop offset="0.5" stop-color="#f08a34"/>
      <stop offset="1" stop-color="#b9521e"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9a046"/>
      <stop offset="0.5" stop-color="#fbe08a"/>
      <stop offset="1" stop-color="#c98a38"/>
    </linearGradient>
    <linearGradient id="leg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8642e"/>
      <stop offset="0.5" stop-color="#f0a060"/>
      <stop offset="1" stop-color="#a8572a"/>
    </linearGradient>

    <!-- Bicycle -->
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6e0a10"/>
      <stop offset="0.45" stop-color="#e8303a"/>
      <stop offset="0.6" stop-color="#ff7a7a"/>
      <stop offset="1" stop-color="#7a0c13"/>
    </linearGradient>
    <linearGradient id="tire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0c0c0e"/>
      <stop offset="0.5" stop-color="#4a4650"/>
      <stop offset="1" stop-color="#0c0c0e"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f0f2"/>
      <stop offset="0.5" stop-color="#8e8a96"/>
      <stop offset="1" stop-color="#3c3a44"/>
    </linearGradient>
  </defs>

  <!-- Sky & sun -->
  <rect width="600" height="400" fill="url(#sky)"/>
  <circle cx="300" cy="290" r="230" fill="url(#glow)"/>
  <circle cx="300" cy="298" r="68" fill="url(#sun)"/>

  <!-- Distant birds -->
  <g fill="none" stroke="#3a1d3e" stroke-width="2" stroke-linecap="round">
    <path d="M90 90 q8 -7 16 0 q8 -7 16 0"/>
    <path d="M130 120 q5 -5 10 0 q5 -5 10 0"/>
    <path d="M470 70 q7 -6 14 0 q7 -6 14 0"/>
  </g>

  <!-- Hills and ground -->
  <path d="M0 300 Q80 278 160 292 T320 290 T470 286 T600 296 V300 H0 Z" fill="#5a2a4d"/>
  <rect y="300" width="600" height="100" fill="url(#ground)"/>
  <polygon points="288,300 312,300 570,400 30,400" fill="url(#road)"/>
  <g fill="#ffd98a" opacity="0.8">
    <polygon points="299,304 301,304 302,314 298,314"/>
    <polygon points="298,322 302,322 303,338 297,338"/>
  </g>

  <!-- Shadow -->
  <ellipse cx="300" cy="386" rx="78" ry="8" fill="#000" opacity="0.4"/>

  <!-- Crank arms & pedals (left up, right down) -->
  <rect x="279" y="316" width="6" height="26" rx="3" fill="url(#chrome)"/>
  <rect x="315" y="338" width="6" height="26" rx="3" fill="url(#chrome)"/>
  <rect x="248" y="312" width="34" height="8" rx="2" fill="#1b1a20"/>
  <rect x="318" y="358" width="34" height="8" rx="2" fill="#1b1a20"/>
  <!-- Chainring seen edge-on -->
  <ellipse cx="317" cy="340" rx="4" ry="24" fill="url(#chrome)"/>

  <!-- Legs (standing on pedals) -->
  <path d="M283 248 L274 282 L267 312" fill="none" stroke="url(#leg)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M317 248 L326 300 L334 357" fill="none" stroke="url(#leg)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Webbed feet -->
  <path d="M267 311 L252 316 L258 312 L262 316 L267 312 L272 316 L276 311 Z" fill="#e8823a" stroke="#9c4a1e" stroke-width="1"/>
  <path d="M334 356 L319 361 L325 357 L329 361 L334 357 L339 361 L345 356 Z" fill="#e8823a" stroke="#9c4a1e" stroke-width="1"/>

  <!-- Body -->
  <ellipse cx="300" cy="196" rx="56" ry="62" fill="url(#body)"/>
  <path d="M248 175 Q258 136 300 134 Q342 136 352 175" fill="none" stroke="url(#rim)" stroke-width="4"/>
  <!-- Belly feather texture -->
  <g fill="none" stroke="#cfc3cc" stroke-width="1.2" opacity="0.8">
    <path d="M278 210 q6 5 12 0"/><path d="M296 222 q6 5 12 0"/>
    <path d="M312 206 q6 5 12 0"/><path d="M286 236 q6 5 12 0"/>
    <path d="M306 240 q6 5 12 0"/>
  </g>

  <!-- Front tire (edge-on) -->
  <rect x="291" y="276" width="18" height="108" rx="9" fill="url(#tire)"/>
  <rect x="297" y="282" width="6" height="96" rx="3" fill="#8f8a96" opacity="0.5"/>
  <!-- Hub -->
  <rect x="284" y="327" width="32" height="7" rx="3" fill="url(#chrome)"/>

  <!-- Fork -->
  <path d="M286 272 L287 331" stroke="url(#red)" stroke-width="7" stroke-linecap="round"/>
  <path d="M314 272 L313 331" stroke="url(#red)" stroke-width="7" stroke-linecap="round"/>
  <rect x="282" y="264" width="36" height="12" rx="5" fill="url(#red)"/>
  <!-- Head tube -->
  <rect x="292" y="236" width="16" height="32" rx="4" fill="url(#red)"/>
  <!-- Headlight / reflector -->
  <circle cx="300" cy="252" r="5" fill="#fff4c2" stroke="#7a0c13" stroke-width="1.5"/>
  <!-- Stem -->
  <rect x="295" y="228" width="10" height="12" rx="2" fill="url(#chrome)"/>

  <!-- Handlebars -->
  <path d="M232 238 Q262 228 300 230 Q338 228 368 238" fill="none" stroke="url(#chrome)" stroke-width="7" stroke-linecap="round"/>
  <rect x="220" y="232" width="22" height="11" rx="5" fill="#1d1b22"/>
  <rect x="358" y="232" width="22" height="11" rx="5" fill="#1d1b22"/>

  <!-- Wings gripping the bars -->
  <path d="M262 158 Q226 172 218 214 Q216 232 224 240 Q236 246 242 236 Q248 214 270 196 Z" fill="url(#wingL)"/>
  <path d="M220 222 Q218 238 226 242 Q236 246 242 236 L238 222 Q230 230 220 222 Z" fill="#2a2430"/>
  <path d="M226 210 q6 6 12 2 M232 196 q6 5 12 1" fill="none" stroke="#a798a8" stroke-width="1.2"/>
  <path d="M338 158 Q374 172 382 214 Q384 232 376 240 Q364 246 358 236 Q352 214 330 196 Z" fill="url(#wingR)"/>
  <path d="M380 222 Q382 238 374 242 Q364 246 358 236 L362 222 Q370 230 380 222 Z" fill="#2a2430"/>
  <path d="M374 210 q-6 6 -12 2 M368 196 q-6 5 -12 1" fill="none" stroke="#a798a8" stroke-width="1.2"/>

  <!-- Neck -->
  <path d="M284 146 Q282 116 288 100 L312 100 Q318 116 316 146 Z" fill="url(#body)"/>

  <!-- Head -->
  <ellipse cx="300" cy="90" rx="25" ry="22" fill="url(#head)"/>
  <path d="M282 78 Q300 64 318 78" fill="none" stroke="#f3dc8c" stroke-width="4" opacity="0.7"/>
  <path d="M278 82 Q300 66 322 82" fill="none" stroke="url(#rim)" stroke-width="2"/>

  <!-- Pouch -->
  <path d="M289 100 Q266 136 283 170 Q300 190 317 170 Q334 136 311 100 Z" fill="url(#pouch)"/>
  <path d="M286 130 Q300 150 314 130" fill="none" stroke="#c4612a" stroke-width="1" opacity="0.6"/>

  <!-- Upper mandible, foreshortened toward viewer -->
  <path d="M291 95 L309 95 Q307 138 303 166 Q300 177 297 166 Q293 138 291 95 Z" fill="url(#beak)"/>
  <path d="M300 98 L300 164" stroke="#c98a38" stroke-width="1"/>
  <path d="M297 164 Q300 180 303 164 Q300 170 297 164 Z" fill="#d9472a"/>

  <!-- Eyes -->
  <g>
    <ellipse cx="287" cy="86" rx="6" ry="5" fill="#f2b8b0"/>
    <circle cx="287" cy="86" r="3.6" fill="#f3e48a"/>
    <circle cx="287.6" cy="86" r="1.8" fill="#111"/>
    <circle cx="286.4" cy="85" r="0.7" fill="#fff"/>
    <ellipse cx="313" cy="86" rx="6" ry="5" fill="#f2b8b0"/>
    <circle cx="313" cy="86" r="3.6" fill="#f3e48a"/>
    <circle cx="312.4" cy="86" r="1.8" fill="#111"/>
    <circle cx="311.6" cy="85" r="0.7" fill="#fff"/>
  </g>
</svg>