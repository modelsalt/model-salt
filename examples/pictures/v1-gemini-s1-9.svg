<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <style>
      .outline {
        stroke: #1A2F3B;
        stroke-width: 10px;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .tire {
        stroke: #1A2F3B;
        stroke-width: 24px;
        fill: none;
      }
      .rim {
        stroke: #A3B8C2;
        stroke-width: 10px;
        fill: none;
      }
      .spoke {
        stroke: #A3B8C2;
        stroke-width: 4px;
        stroke-linecap: round;
      }
      .frame {
        stroke: #2B7A9B;
        stroke-width: 16px;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .frame-outline {
        stroke: #1A2F3B;
        stroke-width: 26px;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .white-fill { fill: #F9F8F6; }
      .grey-fill { fill: #A3B8C2; }
      .dark-grey-fill { fill: #5C7684; }
      .yellow-fill { fill: #E6B85C; }
      .gold-fill { fill: #D4953B; }
      .blue-fill { fill: #2B7A9B; }
      .sky-fill { fill: #E6EEF2; }
      .dark-fill { fill: #1A2F3B; }
    </style>
  </defs>

  <!-- Background Backdrop -->
  <circle cx="400" cy="300" r="250" class="sky-fill" />
  
  <!-- Ground Line -->
  <line x1="80" y1="532" x2="720" y2="532" class="outline" />
  <line x1="40" y1="532" x2="55" y2="532" class="outline" />
  <line x1="745" y1="532" x2="760" y2="532" class="outline" />

  <!-- ==================== FAR WING & FAR LEG ==================== -->
  <g id="far-limbs">
    <!-- Far Wing (Spread forward for balance) -->
    <path d="M 380 230 C 440 160, 560 150, 620 190 C 590 220, 560 225, 530 220 C 510 245, 480 250, 450 240 C 430 260, 400 265, 370 250 Z" class="grey-fill outline" />
    
    <!-- Far Leg & Foot (Upstroke) -->
    <!-- Far Pedal & Crank -->
    <line x1="360" y1="430" x2="380" y2="375" class="outline" stroke-width="12" />
    <!-- Far Leg -->
    <line x1="335" y1="280" x2="330" y2="335" class="gold-fill outline" />
    <line x1="330" y1="335" x2="380" y2="375" class="gold-fill outline" />
    <!-- Far Webbed Foot -->
    <path d="M 380 375 L 415 370 L 405 385 L 370 385 Z" class="gold-fill outline" />
    <!-- Far Pedal Platform -->
    <line x1="365" y1="378" x2="400" y2="378" class="outline" />
  </g>

  <!-- ==================== BICYCLE ==================== -->
  <g id="bicycle">
    <!-- Rear Wheel -->
    <g id="rear-wheel">
      <line x1="210" y1="340" x2="210" y2="520" class="spoke" />
      <line x1="120" y1="430" x2="300" y2="430" class="spoke" />
      <line x1="146" y1="366" x2="274" y2="494" class="spoke" />
      <line x1="146" y1="494" x2="274" y2="366" class="spoke" />
      <circle cx="210" cy="430" r="82" class="rim" />
      <circle cx="210" cy="430" r="90" class="tire" />
      <circle cx="210" cy="430" r="14" class="dark-fill" />
    </g>

    <!-- Front Wheel -->
    <g id="front-wheel">
      <line x1="590" y1="340" x2="590" y2="520" class="spoke" />
      <line x1="500" y1="430" x2="680" y2="430" class="spoke" />
      <line x1="526" y1="366" x2="654" y2="494" class="spoke" />
      <line x1="526" y1="494" x2="654" y2="366" class="spoke" />
      <circle cx="590" cy="430" r="82" class="rim" />
      <circle cx="590" cy="430" r="90" class="tire" />
      <circle cx="590" cy="430" r="14" class="dark-fill" />
    </g>

    <!-- Seatpost & Stem -->
    <line x1="310" y1="305" x2="300" y2="270" class="outline" stroke-width="12" />
    <path d="M 525 285 L 520 265 L 555 265" fill="none" class="outline" stroke-width="12" />

    <!-- Road Frame (Layered for thick outline effect) -->
    <!-- Rear Triangle & Main Triangle & Fork -->
    <path d="M 210 430 L 310 305 L 525 285 L 360 430 Z M 310 305 L 360 430 M 590 430 L 520 265" class="frame-outline" />
    <path d="M 210 430 L 310 305 L 525 285 L 360 430 Z M 310 305 L 360 430 M 590 430 L 520 265" class="frame" />

    <!-- Drop Handlebars -->
    <path d="M 540 265 L 580 265 C 615 265, 615 320, 575 320 L 555 320" fill="none" class="outline" stroke-width="14" />
    <!-- Brake Hoods -->
    <path d="M 595 270 L 610 255" class="outline" stroke-width="10" />

    <!-- Racing Saddle -->
    <path d="M 265 270 C 265 258, 320 262, 340 270 C 315 278, 280 278, 265 270 Z" class="dark-fill outline" />

    <!-- Crankset / Chainring -->
    <circle cx="360" cy="430" r="28" class="grey-fill outline" />
    <circle cx="360" cy="430" r="12" class="dark-fill" />
  </g>

  <!-- ==================== PELICAN BODY & HEAD ==================== -->
  <g id="pelican-body">
    <!-- Tail Feathers -->
    <path d="M 265 250 L 210 235 L 225 255 L 205 270 L 260 270 Z" class="white-fill outline" />

    <!-- Main Torso, Neck, and Head -->
    <path d="M 260 255 
             C 245 215, 290 175, 345 195 
             C 365 205, 360 140, 355 110 
             C 350 75, 385 55, 415 65 
             C 435 72, 440 88, 440 100
             L 415 170
             C 415 225, 385 285, 330 285 
             C 290 285, 270 275, 260 255 Z" class="white-fill outline" />

    <!-- Tuft of feathers on back of head -->
    <path d="M 362 72 L 340 65 L 355 82 L 338 85 L 356 95" fill="none" class="outline" />

    <!-- Pelican Beak & Gular Pouch -->
    <!-- Huge Throat Pouch -->
    <path d="M 415 165 
             C 445 245, 575 235, 610 112 
             L 435 100 Z" class="yellow-fill outline" />
    
    <!-- Upper Mandible (Top Beak) -->
    <path d="M 438 85 
             L 610 95 
             C 622 95, 625 112, 612 118 
             L 605 112 
             L 432 105 Z" class="gold-fill outline" />

    <!-- Eye -->
    <circle cx="410" cy="88" r="12" class="yellow-fill outline" stroke-width="6" />
    <circle cx="412" cy="88" r="5" class="dark-fill" />
  </g>

  <!-- ==================== NEAR LEG & NEAR WING ==================== -->
  <g id="near-limbs">
    <!-- Near Leg & Foot (Downstroke) -->
    <!-- Fluffy Thigh Base -->
    <path d="M 305 265 C 305 295, 345 295, 345 265 Z" class="white-fill outline" />
    <!-- Lower Leg (Tibia & Tarsus) -->
    <line x1="325" y1="285" x2="295" y2="375" class="outline" />
    <line x1="295" y1="375" x2="340" y2="485" class="outline" />
    <!-- Near Crank Arm (Connected to center of chainring) -->
    <line x1="360" y1="430" x2="340" y2="485" class="outline" stroke-width="12" />
    <!-- Near Webbed Foot (Stepping on pedal) -->
    <path d="M 340 485 L 380 480 L 370 495 L 330 495 Z" class="yellow-fill outline" />
    <!-- Near Pedal Platform -->
    <line x1="325" y1="490" x2="365" y2="490" class="outline" />

    <!-- Near Wing (Spread wide backward for balance - no-handed!) -->
    <g id="near-wing">
      <!-- Dark Flight Tips (Primaries) -->
      <path d="M 355 215 
               C 260 120, 110 130, 50 185 
               C 85 215, 115 210, 140 200 
               C 155 230, 190 230, 215 215 
               C 235 240, 265 240, 290 225 
               C 310 245, 340 245, 360 225 Z" class="dark-grey-fill outline" />
      <!-- Upper Wing Coverts -->
      <path d="M 355 215 
               C 275 140, 150 145, 95 180 
               C 130 195, 165 185, 185 180 
               C 205 205, 240 200, 260 190 
               C 280 215, 325 225, 355 215 Z" class="white-fill outline" />
    </g>
  </g>

  <!-- Speed / Wind Lines for dynamic balance feel -->
  <line x1="40" y1="120" x2="90" y2="120" class="outline" />
  <line x1="20" y1="260" x2="60" y2="260" class="outline" />
  <line x1="50" y1="430" x2="80" y2="430" class="outline" />
</svg>