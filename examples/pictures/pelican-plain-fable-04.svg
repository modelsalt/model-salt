<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Sky and ground -->
  <rect width="400" height="300" fill="#cfe9ff"/>
  <rect y="230" width="400" height="70" fill="#8fbf6a"/>
  <line x1="0" y1="232" x2="400" y2="232" stroke="#6a9a4a" stroke-width="2"/>

  <!-- Bicycle -->
  <g stroke="#333" stroke-width="4" fill="none" stroke-linecap="round">
    <!-- Wheels -->
    <circle cx="110" cy="215" r="38"/>
    <circle cx="290" cy="215" r="38"/>
    <!-- Spokes -->
    <g stroke-width="1.5" stroke="#777">
      <line x1="110" y1="177" x2="110" y2="253"/>
      <line x1="72" y1="215" x2="148" y2="215"/>
      <line x1="83" y1="188" x2="137" y2="242"/>
      <line x1="137" y1="188" x2="83" y2="242"/>
      <line x1="290" y1="177" x2="290" y2="253"/>
      <line x1="252" y1="215" x2="328" y2="215"/>
      <line x1="263" y1="188" x2="317" y2="242"/>
      <line x1="317" y1="188" x2="263" y2="242"/>
    </g>
    <!-- Frame -->
    <path d="M110 215 L170 150 L250 150 L290 215"/>
    <path d="M170 150 L200 215 L250 150"/>
    <line x1="110" y1="215" x2="200" y2="215"/>
    <!-- Seat post and seat -->
    <line x1="170" y1="150" x2="165" y2="125"/>
    <path d="M148 124 L185 124" stroke-width="7"/>
    <!-- Handlebars -->
    <line x1="250" y1="150" x2="262" y2="118"/>
    <path d="M250 118 L278 118"/>
    <!-- Crank and pedals -->
    <circle cx="200" cy="215" r="7" fill="#333"/>
    <line x1="200" y1="215" x2="215" y2="235"/>
    <line x1="200" y1="215" x2="185" y2="195"/>
    <line x1="208" y1="235" x2="222" y2="235" stroke-width="6"/>
    <line x1="178" y1="195" x2="192" y2="195" stroke-width="6"/>
  </g>

  <!-- Pelican -->
  <g>
    <!-- Legs -->
    <g stroke="#e59a2e" stroke-width="5" fill="none" stroke-linecap="round">
      <path d="M175 128 L195 175 L215 232"/>
      <path d="M170 128 L180 170 L185 195"/>
    </g>
    <!-- Tail -->
    <path d="M130 110 L105 95 L112 120 Z" fill="#f4f4f4" stroke="#555" stroke-width="2"/>
    <!-- Body -->
    <ellipse cx="165" cy="105" rx="42" ry="30" fill="#f8f8f8" stroke="#555" stroke-width="2"/>
    <!-- Wing -->
    <path d="M150 95 Q180 80 205 100 Q185 118 150 110 Z" fill="#e3e3e3" stroke="#555" stroke-width="2"/>
    <!-- Neck -->
    <path d="M195 90 Q215 70 220 50" stroke="#f8f8f8" stroke-width="18" fill="none" stroke-linecap="round"/>
    <path d="M195 90 Q215 70 220 50" stroke="#555" stroke-width="1.5" fill="none" opacity="0.4"/>
    <!-- Head -->
    <circle cx="222" cy="45" r="17" fill="#f8f8f8" stroke="#555" stroke-width="2"/>
    <!-- Beak (upper) -->
    <path d="M236 42 L300 52 L238 56 Z" fill="#f2a53b" stroke="#b36f1a" stroke-width="2"/>
    <!-- Pouch (lower beak) -->
    <path d="M238 56 L300 52 Q275 80 240 68 Z" fill="#f6c377" stroke="#b36f1a" stroke-width="2"/>
    <!-- Eye -->
    <circle cx="225" cy="40" r="3.5" fill="#222"/>
    <circle cx="226.5" cy="38.5" r="1" fill="#fff"/>
    <!-- Wing tip on handlebars -->
    <path d="M205 100 Q240 105 262 118" stroke="#e3e3e3" stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Motion lines -->
  <g stroke="#9bb" stroke-width="2" stroke-linecap="round">
    <line x1="30" y1="200" x2="55" y2="200"/>
    <line x1="20" y1="215" x2="50" y2="215"/>
    <line x1="35" y1="230" x2="58" y2="230"/>
  </g>
</svg>