<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- Sky -->
  <rect x="0" y="0" width="800" height="500" fill="#cfe8f3"/>

  <!-- City building outlines (simple rectangles) -->
  <g fill="#b8c9d4" stroke="#8fa3b0" stroke-width="3">
    <rect x="20" y="180" width="90" height="200"/>
    <rect x="130" y="120" width="70" height="260"/>
    <rect x="220" y="210" width="110" height="170"/>
    <rect x="350" y="150" width="80" height="230"/>
    <rect x="450" y="200" width="120" height="180"/>
    <rect x="590" y="110" width="70" height="270"/>
    <rect x="680" y="170" width="100" height="210"/>
  </g>
  <!-- Windows -->
  <g fill="#e9f3f8">
    <rect x="35" y="200" width="18" height="18"/><rect x="77" y="200" width="18" height="18"/>
    <rect x="35" y="240" width="18" height="18"/><rect x="77" y="240" width="18" height="18"/>
    <rect x="145" y="140" width="16" height="16"/><rect x="175" y="140" width="16" height="16"/>
    <rect x="145" y="180" width="16" height="16"/><rect x="175" y="180" width="16" height="16"/>
    <rect x="240" y="230" width="18" height="18"/><rect x="280" y="230" width="18" height="18"/>
    <rect x="365" y="170" width="18" height="18"/><rect x="397" y="170" width="18" height="18"/>
    <rect x="365" y="210" width="18" height="18"/><rect x="397" y="210" width="18" height="18"/>
    <rect x="470" y="220" width="18" height="18"/><rect x="510" y="220" width="18" height="18"/><rect x="550" y="220" width="12" height="18"/>
    <rect x="605" y="130" width="16" height="16"/><rect x="635" y="130" width="16" height="16"/>
    <rect x="605" y="170" width="16" height="16"/><rect x="635" y="170" width="16" height="16"/>
    <rect x="700" y="190" width="18" height="18"/><rect x="740" y="190" width="18" height="18"/>
  </g>

  <!-- Sidewalk -->
  <rect x="0" y="380" width="800" height="20" fill="#d9d9d9"/>
  <!-- Road surface -->
  <rect x="0" y="400" width="800" height="100" fill="#4a4a4a"/>
  <!-- Lane dashes -->
  <g fill="#f2d16b">
    <rect x="30" y="448" width="60" height="6"/>
    <rect x="150" y="448" width="60" height="6"/>
    <rect x="270" y="448" width="60" height="6"/>
    <rect x="390" y="448" width="60" height="6"/>
    <rect x="510" y="448" width="60" height="6"/>
    <rect x="630" y="448" width="60" height="6"/>
    <rect x="750" y="448" width="50" height="6"/>
  </g>

  <!-- ===== Chopper bicycle, side profile ===== -->
  <!-- Rear wheel (full circle, larger) -->
  <circle cx="230" cy="380" r="70" fill="none" stroke="#222" stroke-width="10"/>
  <circle cx="230" cy="380" r="8" fill="#222"/>
  <g stroke="#222" stroke-width="3">
    <line x1="230" y1="310" x2="230" y2="450"/>
    <line x1="160" y1="380" x2="300" y2="380"/>
    <line x1="181" y1="331" x2="279" y2="429"/>
    <line x1="279" y1="331" x2="181" y2="429"/>
  </g>

  <!-- Front wheel (full circle, smaller, far forward) -->
  <circle cx="620" cy="395" r="55" fill="none" stroke="#222" stroke-width="10"/>
  <circle cx="620" cy="395" r="8" fill="#222"/>
  <g stroke="#222" stroke-width="3">
    <line x1="620" y1="340" x2="620" y2="450"/>
    <line x1="565" y1="395" x2="675" y2="395"/>
    <line x1="581" y1="356" x2="659" y2="434"/>
    <line x1="659" y1="356" x2="581" y2="434"/>
  </g>

  <!-- Frame (polygons/lines) -->
  <g stroke="#c0392b" stroke-width="10" stroke-linecap="round" fill="none">
    <!-- Down tube from head to crank -->
    <line x1="430" y1="260" x2="330" y2="380"/>
    <!-- Top tube -->
    <line x1="430" y1="260" x2="290" y2="290"/>
    <!-- Seat tube -->
    <line x1="290" y1="290" x2="330" y2="380"/>
    <!-- Chain stay -->
    <line x1="330" y1="380" x2="230" y2="380"/>
    <!-- Seat stay -->
    <line x1="290" y1="290" x2="230" y2="380"/>
    <!-- Extended front fork (long, raked out) -->
    <line x1="430" y1="260" x2="620" y2="395"/>
  </g>

  <!-- Crank and pedals -->
  <circle cx="330" cy="380" r="14" fill="#222"/>
  <line x1="330" y1="380" x2="355" y2="410" stroke="#222" stroke-width="6"/>
  <line x1="330" y1="380" x2="305" y2="350" stroke="#222" stroke-width="6"/>
  <rect x="348" y="406" width="22" height="8" fill="#222"/>
  <rect x="290" y="344" width="22" height="8" fill="#222"/>

  <!-- Long banana seat -->
  <rect x="210" y="262" width="130" height="22" rx="11" fill="#f5b041" stroke="#222" stroke-width="4"/>
  <!-- Sissy bar behind seat -->
  <line x1="215" y1="262" x2="200" y2="200" stroke="#888" stroke-width="6" stroke-linecap="round"/>
  <line x1="235" y1="262" x2="220" y2="200" stroke="#888" stroke-width="6" stroke-linecap="round"/>
  <line x1="200" y1="200" x2="220" y2="200" stroke="#888" stroke-width="6" stroke-linecap="round"/>

  <!-- Tall ape-hanger handlebars -->
  <line x1="430" y1="260" x2="430" y2="200" stroke="#888" stroke-width="8" stroke-linecap="round"/>
  <line x1="430" y1="200" x2="470" y2="200" stroke="#888" stroke-width="8" stroke-linecap="round"/>
  <rect x="462" y="193" width="26" height="14" rx="7" fill="#222"/>

  <!-- ===== Pelican perched on handlebars, facing forward (right) ===== -->
  <!-- Feet gripping the bar -->
  <g fill="#f39c12" stroke="#222" stroke-width="3">
    <polygon points="436,196 452,196 444,210"/>
    <polygon points="452,196 468,196 460,210"/>
  </g>
  <!-- Legs -->
  <line x1="444" y1="196" x2="448" y2="170" stroke="#f39c12" stroke-width="6" stroke-linecap="round"/>
  <line x1="460" y1="196" x2="458" y2="170" stroke="#f39c12" stroke-width="6" stroke-linecap="round"/>

  <!-- Body -->
  <ellipse cx="445" cy="150" rx="42" ry="30" fill="#ffffff" stroke="#222" stroke-width="4"/>
  <!-- Wing (polygon) -->
  <polygon points="430,140 400,160 445,165" fill="#e0e0e0" stroke="#222" stroke-width="3"/>
  <!-- Tail -->
  <polygon points="405,145 385,138 400,158" fill="#ffffff" stroke="#222" stroke-width="3"/>

  <!-- Neck -->
  <rect x="468" y="100" width="18" height="50" rx="9" fill="#ffffff" stroke="#222" stroke-width="4"/>
  <!-- Head -->
  <circle cx="480" cy="95" r="20" fill="#ffffff" stroke="#222" stroke-width="4"/>
  <!-- Eye -->
  <circle cx="488" cy="90" r="4" fill="#222"/>

  <!-- Big beak (long upper bill + pouch) -->
  <polygon points="495,92 570,98 495,104" fill="#f5b041" stroke="#222" stroke-width="3"/>
  <polygon points="495,104 565,100 520,125" fill="#e67e22" stroke="#222" stroke-width="3"/>
</svg>